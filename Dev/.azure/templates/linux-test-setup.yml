# Shared setup for every ubuntu-latest Test job in Dev/.azure/pipeline.yml (7580 Linux rollout).
#
# A step template rather than inline steps because Azure Pipelines caps a single YAML file at
# 524,288 bytes: repeating these steps inline in ~78 jobs pushed pipeline.yml past it, and an
# over-size file is rejected outright ("informational run" - no job starts at all).
#
# Usage (paths are relative to the including file):
#   - template: templates/linux-test-setup.yml
#     parameters:
#       installFuncCli: true   # jobs that start the Lightweight engine (-ServerType LightweightExecution);
#                              # also installs Azurite for the engine's AzureWebJobsStorage

parameters:
- name: installFuncCli
  type: boolean
  default: false

steps:
- task: DownloadPipelineArtifact@2
  inputs:
    buildType: 'current'
    ArtifactName: 'TestBinaries'
    targetPath: '$(Agent.BuildDirectory)/linux-artifact'

# The binaries were compiled on Windows (Compile job, -Runtime linux-x64), so the tarball carries
# no execute bits: restore them on every ELF file (apphosts such as testhost, createdump). FTPS
# listens on 1010; ports < 1024 are privileged on Linux and the agent user is not root (FTP 21 /
# SFTP 2222 are bound by the Docker daemon).
- bash: |
    set -euo pipefail
    mkdir -p "$(Agent.BuildDirectory)/LinuxTests"
    tar -xzf "$(Agent.BuildDirectory)/linux-artifact/ServerTests-linux-x64.tar.gz" -C "$(Agent.BuildDirectory)/LinuxTests"
    find "$(Agent.BuildDirectory)/LinuxTests" -type f -size +4c -print0 |
      while IFS= read -r -d '' f; do
        if [ "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ]; then chmod +x "$f"; fi
      done
    sudo sysctl -w net.ipv4.ip_unprivileged_port_start=1000
  displayName: 'Unpack test binaries, restore execute bits, allow FTPS port 1010'

- ${{ if eq(parameters.installFuncCli, true) }}:
  # Standalone linux-x64 CLI zip straight from the GitHub release, SHA-256 verified -
  # bypassing npm's CDN (cdn.functions.azure.com, which has 404'd on deprecated versions)
  # and the Chocolatey community feed (WOLF-8512).
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $ProgressPreference = 'SilentlyContinue'
      $funcCliVersion = '4.14.0'
      $funcCliZip = "Azure.Functions.Cli.linux-x64.$funcCliVersion.zip"
      $funcCliBaseUrl = "https://github.com/Azure/azure-functions-core-tools/releases/download/$funcCliVersion"
      $funcCliDir = "$(Agent.BuildDirectory)/func-cli"
      New-Item -ItemType Directory -Path $funcCliDir -Force | Out-Null
      $zipPath = Join-Path $funcCliDir $funcCliZip
      Invoke-WebRequest -Uri "$funcCliBaseUrl/$funcCliZip" -OutFile $zipPath
      $hashPath = "$zipPath.sha2"
      Invoke-WebRequest -Uri "$funcCliBaseUrl/$funcCliZip.sha2" -OutFile $hashPath
      $expectedHash = (Get-Content -Path $hashPath -Raw).Trim()
      $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
      if ($actualHash -ne $expectedHash) {
        throw "func CLI zip checksum mismatch: expected $expectedHash, got $actualHash"
      }
      Expand-Archive -Path $zipPath -DestinationPath $funcCliDir -Force
      chmod +x "$funcCliDir/func"
    displayName: 'Install func CLI'

  # Azurite gives the engine a working AzureWebJobsStorage. Without one, the host's
  # "azure.functions.webjobs.storage" health check reports Unhealthy every 30s, and on Linux
  # (unlike Windows) the host answers the second report with "Restarting host." ~30s after
  # startup - which hits the worker-indexing "A function with the id ... already exists" bug
  # (Azure/azure-functions-dotnet-worker#2124) and 500/503s every route for the rest of the job
  # (CI build 30791: every Security Specs job; restarts logged even in passing jobs).
  # TestRun.ps1's Start-Azurite finds it on PATH (prepended below) and starts it per engine.
  # npm's deprecation warnings go to stderr; 2>&1 keeps them from being promoted into a
  # terminating error under pwsh's $ErrorActionPreference='Stop' (build 30237), while
  # $LASTEXITCODE still catches a genuine install failure.
  - pwsh: |
      npm install --prefix "$(Agent.BuildDirectory)/azurite-cli" azurite 2>&1 | Write-Host
      if ($LASTEXITCODE -ne 0) { throw "npm install azurite failed with exit code $LASTEXITCODE" }
    displayName: 'Install Azurite'

  # ~/.dotnet/tools is not on the hosted ubuntu agent's PATH, so dotnet-coverage (a global
  # tool) would not resolve for TestRun.ps1 without it.
  - pwsh: |
      Write-Host "##vso[task.prependpath]$(Agent.BuildDirectory)/func-cli"
      Write-Host "##vso[task.prependpath]$(Agent.BuildDirectory)/azurite-cli/node_modules/.bin"
      Write-Host "##vso[task.prependpath]$HOME/.dotnet/tools"
      dotnet tool install --global dotnet-coverage --ignore-failed-sources 2>&1 | Write-Host
    displayName: 'Add func CLI and Azurite to PATH, install dotnet-coverage'
