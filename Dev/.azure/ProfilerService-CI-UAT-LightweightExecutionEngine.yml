# Profiler UAT CI - builds the Warewolf Lightweight Execution Engine package for 'wwprofileruatlw' (DEV2).
#
# SIBLING OF Dev/.azure/ProfilerService-CI-Dev-LightweightExecutionEngine.yml. Everything from
# 'jobs:' down is BYTE-IDENTICAL between the two files (a Pester test pins it); they differ only
# in this header and the variables block. READ THE DEV FILE'S HEADER for what the package holds,
# the Key Vault secrets it needs before the first run and the app settings the engine needs when
# the artifact is deployed - all of it applies here with the UAT names below.
#
# Port of the engine-package half of Unlimited.ProfilerServices' ProfilerService-CI-UAT.yml
# (AD-2497). It only BUILDS: the 'ProfilerEngine' artifact (profiler-engine.zip) for UAT's own
# engine 'wwprofileruatlw', whose trigger listens on 'profiler.profile.request.UAT'. It shares the
# Dev file's Key Vault, WFAES key and token values (both DEV2 engines publish to CloudAMQP
# 'bmkzdabu').
#
# AGENT: Microsoft-hosted 'windows-2022' (PowerShell 7 ships on it).

trigger: none

pool:
  vmImage: 'windows-2022'

variables:
  # ── ENVIRONMENT (the only block that differs from the Dev file) ───────────────────────────
  ProfilerEnvironment: 'UAT'

  # The engine this package is built for: UAT's OWN Flex Consumption (Linux) app in DEV2, so a UAT
  # package never lands on the Dev engine's trigger queue.
  ProfilerEngineAppName: 'wwprofileruatlw'

  # The queue the engine's own Service Bus trigger listens on - #{ProfilerServiceBusTriggerQueueName}
  # in profiler-engine/servicebustrigger.bite.txt. The engine app needs the same name as its
  # WAREWOLF_SERVICEBUS_TRIGGER_QUEUE app setting.
  ProfilerServiceBusTriggerQueueName: 'profiler.profile.request.UAT'

  # ── SHARED (identical in the Dev file) ────────────────────────────────────────────────────
  # The vault the release tokens and the WFAES key come from, and the key's secret name. The engine
  # reads the same two names from Settings/executionengine.settings.json to decrypt at runtime.
  # The key secret is also named literally in 'Encrypt the sources and apply the trigger
  # concurrency' (a secret has to be mapped by name), so change both together.
  ProfilerEngineKeyVaultName: 'WWExecutionEngine'
  ProfilerEngineKeyVaultSecretName: 'WWExecutionEngineTestSecret'

  # Where the published engine comes from (warewolf.online/release-notes.php). Leave
  # WarewolfEngineZipUrl EMPTY to build on the latest release; set it (queue time, a full https URL
  # on the storage account) to pin one. It must be the linux-x64 zip: the engines are Flex
  # Consumption, which is Linux-only.
  WarewolfReleasesStorageAccount: 'stwwreleases'
  WarewolfEngineZipUrl: ''

  # The trigger concurrency, applied to host.json and Settings/executionengine.settings.json: the
  # values the old deploy passed as -ServiceBusMaxConcurrentCalls / -ServiceBusTriggerMaxConcurrentExecutions
  # / -DisableDynamicConcurrency. The ceiling is the shared Azure SQL database, not the engine. The
  # fourth throughput setting, the Flex instance cap (16), is app configuration and goes with the deploy.
  ProfilerServiceBusMaxConcurrentCalls: '2'
  ProfilerServiceBusTriggerMaxConcurrentExecutions: '2'

  # Service connection names are authorised at pipeline COMPILE time, so it is referenced as
  # ${{ variables.AzureServiceConnection }}.
  AzureServiceConnection: 'AzureStorage-WarewolfReleases'

jobs:
- job: ProfilerEngine
  displayName: Profiler engine package (DEV2 ${{ variables.ProfilerEnvironment }})
  steps:
  - checkout: self
    clean: true

  # The release-token values and the WFAES key, as secret variables named after the secrets. Only
  # the listed secrets are loaded: the vault also holds unrelated keys. A listed secret that does
  # not exist fails this step, so a missing value stops the build here.
  - task: AzureKeyVault@2
    displayName: 'Azure Key Vault: release tokens and the WFAES key'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      KeyVaultName: '$(ProfilerEngineKeyVaultName)'
      SecretsFilter: 'WWExecutionEngineTestSecret,WarewolfGenericRabbitMQSourceHost,WarewolfGenericRabbitMQUserName,WarewolfGenericRabbitMQPassword,WarewolfGenericRabbitMQSourceVirtualHost,WarewolfGenericRabbitMQAPISourceHost,WarewolfGenericRabbitMQAuthToken,WarewolfGenericCollectionAPISourceHost,WarewolfGenericCollectionServicesAPIKey,WarewolfGenericHelperAPISourceHost,WarewolfGenericHelperServicesAPIKey,WarewolfGenericCommsEngineApiKey,WarewolfCollectionsNewJourneyEmailSourceHost,WarewolfProfilerAlertToEmail,WarewolfProfilerMissingGrantDatesCommsTag,WarewolfGenericESLoggingSourceHost,WarewolfGenericESLoggingSourcePortNo,WarewolfProfilerServicesESLoggingSourceIndex'
      RunAsPreJob: false

  # release-notes.php is PUBLIC content, so its markup is untrusted input for a URL this agent will
  # fetch and expand. The resolved URL - and a pinned WarewolfEngineZipUrl, held to the same rule -
  # must be https on the expected storage account host before anything is downloaded.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $expectedHost = '$(WarewolfReleasesStorageAccount).blob.core.windows.net'

      $engineUrl = '$(WarewolfEngineZipUrl)'
      if ([string]::IsNullOrWhiteSpace($engineUrl)) {
          $notes = Invoke-WebRequest -Uri 'https://warewolf.online/release-notes.php' -UseBasicParsing -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
          # The LINUX engine zip specifically (Flex is Linux-only). No fallback to the legacy
          # data-role="engine-zip-link", whose runtime depends on the release that published it.
          $m = [regex]::Match($notes.Content, 'data-role="engine-linux-zip-link"[^>]*href="([^"]+)"')
          if (-not $m.Success) { throw 'Could not find data-role="engine-linux-zip-link" on warewolf.online/release-notes.php. Pin WarewolfEngineZipUrl (a linux-x64 AzureFunctionsPackage zip) as a queue-time variable to unblock this build.' }
          $engineUrl = $m.Groups[1].Value
      }

      $parsed = $null
      if (-not [uri]::TryCreate($engineUrl, [UriKind]::Absolute, [ref]$parsed) -or
          $parsed.Scheme -ne 'https' -or $parsed.Host -ne $expectedHost) {
          throw "Refusing to fetch the engine package from untrusted URL '$engineUrl' (expected https://$expectedHost/...)."
      }
      # A win-x64 package builds "successfully" and then fails every invocation on the Linux Flex app.
      if ($engineUrl -match 'win-x64') { throw "WarewolfEngineZipUrl '$engineUrl' is a win-x64 package; $(ProfilerEngineAppName) is Linux (Flex) and needs the linux-x64 AzureFunctionsPackage zip." }

      Write-Host "##vso[task.setvariable variable=ResolvedEngineZipUrl]$engineUrl"
      Write-Host "Engine package: $engineUrl"
    displayName: 'Resolve the published Lightweight Engine package'

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $zip   = '$(Agent.TempDirectory)\AzureFunctionsPackage.zip'
      $stage = '$(Agent.TempDirectory)\ProfilerEngineStage'
      Invoke-WebRequest -Uri '$(ResolvedEngineZipUrl)' -OutFile $zip -UseBasicParsing -TimeoutSec 600 -MaximumRetryCount 3 -RetryIntervalSec 10
      if ((Get-Item $zip).Length -le 0) { throw "Downloaded engine package is empty: $zip" }
      if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
      Expand-Archive -LiteralPath $zip -DestinationPath $stage -Force
      # The concurrency step edits host.json at the package root, so a package without it is not
      # what it should be.
      if (-not (Test-Path -LiteralPath (Join-Path $stage 'host.json'))) { throw "host.json not found at the root of $(ResolvedEngineZipUrl) - the engine package layout has changed." }
      Write-Host "Extracted the engine package ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB) to $stage"
    displayName: 'Download and extract the Lightweight Engine package'

  - task: DownloadSecureFile@1
    name: warewolfLicense
    displayName: 'Download Warewolf License.secureconfig'
    inputs:
      secureFile: 'Warewolf License.secureconfig'

  # The engine's secure.config is never committed (.gitignore), so it comes from the Library too.
  - task: DownloadSecureFile@1
    name: profilerSecureConfig
    displayName: 'Download Profiler secure.config'
    inputs:
      secureFile: 'Profiler secure.config'

  # Staged copies only: the tokens are replaced and the sources encrypted in the stage, never in the
  # checkout. The workflows keep their relative paths under Resources\ and the sources go flat beside
  # them, as the Unlimited's CI stages Warewolf.ProfilerServices/Profiler/* and Sources/*.bite.
  # Resources/rabbit holds NewSqlServerSource and RabbitProcess, which RequestForProfilingConsume's
  # nested calls depend on (the Local Backup copy shares the real source's id, so it stays out).
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $resources = '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Resources'
      $scripts   = '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts'
      $templates = '$(Build.SourcesDirectory)\Dev\.azure\profiler-engine'
      $stage     = '$(Agent.TempDirectory)\ProfilerEngineStage'
      $profiler  = Join-Path $resources 'ProfilerServices'
      New-Item -ItemType Directory -Force -Path "$stage\Resources\rabbit", "$stage\Settings" | Out-Null

      $sources = Join-Path $profiler 'Sources'
      foreach ($f in Get-ChildItem -LiteralPath $profiler -Recurse -File -Filter '*.bite') {
          if ($f.DirectoryName -eq $sources) { continue }
          $dest = Join-Path "$stage\Resources" $f.FullName.Substring($profiler.Length + 1)
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Copy-Item -LiteralPath $f.FullName -Destination $dest
      }
      Copy-Item -Path "$sources\*.bite" -Destination "$stage\Resources"
      Get-ChildItem -LiteralPath (Join-Path $resources 'rabbit') -File -Filter '*.bite' |
          Where-Object Name -ne 'NewSqlServerSource (Local Backup).bite' |
          Copy-Item -Destination "$stage\Resources\rabbit"

      Copy-Item -LiteralPath "$templates\executionengine.settings.json.txt" -Destination "$stage\Settings\executionengine.settings.json"
      Copy-Item -LiteralPath "$templates\servicebustrigger.bite.txt" -Destination "$stage\Settings\servicebustrigger.bite"
      # Persistence is on: without the shared Hangfire store, the trigger's replay store de-duplicates
      # per instance only, and a recycled or scaled-out Flex app re-runs redelivered messages. The
      # names are the exact leaf names the engine reads.
      Copy-Item -LiteralPath "$scripts\persistencesettings.uat.json" -Destination "$stage\Settings\persistencesettings.json"
      Copy-Item -LiteralPath "$scripts\persistencesettingsdbsource.uat.bite" -Destination "$stage\Settings\persistencesettingsdbsource.bite"

      Copy-Item -LiteralPath '$(profilerSecureConfig.secureFilePath)' -Destination "$stage\secure.config"
      Copy-Item -LiteralPath '$(warewolfLicense.secureFilePath)' -Destination "$stage\Warewolf License.secureconfig"

      $count = (Get-ChildItem -LiteralPath "$stage\Resources" -Recurse -File -Filter '*.bite').Count
      Write-Host "Staged $count resource(s), the settings, secure.config and the license into $stage"
    displayName: 'Add the profiler workflows, sources and settings'

  # Key Vault secrets reach a script only through env, so every secret token is mapped here by name;
  # the plain ones come from this file's variables. Set-ProfilerTokens.ps1 fails, before writing a
  # file, on any token without a value - the list in its error is what the vault is missing.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $script = '$(Build.SourcesDirectory)\Dev\.azure\profiler-engine\Set-ProfilerTokens.ps1'
      $stage  = '$(Agent.TempDirectory)\ProfilerEngineStage'
      foreach ($dir in 'Resources', 'Settings') {
          $r = & $script -Path "$stage\$dir" -Include '*.bite', '*.json'
          Write-Host "$($dir): $($r.Replaced) token(s) replaced in $($r.Files) file(s)."
      }
    displayName: 'Replace tokens in the staged resources and settings'
    env:
      ProfilerEngineKeyVaultName: $(ProfilerEngineKeyVaultName)
      ProfilerEngineKeyVaultSecretName: $(ProfilerEngineKeyVaultSecretName)
      ProfilerServiceBusTriggerQueueName: $(ProfilerServiceBusTriggerQueueName)
      WarewolfGenericRabbitMQSourceHost: $(WarewolfGenericRabbitMQSourceHost)
      WarewolfGenericRabbitMQUserName: $(WarewolfGenericRabbitMQUserName)
      WarewolfGenericRabbitMQPassword: $(WarewolfGenericRabbitMQPassword)
      WarewolfGenericRabbitMQSourceVirtualHost: $(WarewolfGenericRabbitMQSourceVirtualHost)
      WarewolfGenericRabbitMQAPISourceHost: $(WarewolfGenericRabbitMQAPISourceHost)
      WarewolfGenericRabbitMQAuthToken: $(WarewolfGenericRabbitMQAuthToken)
      WarewolfGenericCollectionAPISourceHost: $(WarewolfGenericCollectionAPISourceHost)
      WarewolfGenericCollectionServicesAPIKey: $(WarewolfGenericCollectionServicesAPIKey)
      WarewolfGenericHelperAPISourceHost: $(WarewolfGenericHelperAPISourceHost)
      WarewolfGenericHelperServicesAPIKey: $(WarewolfGenericHelperServicesAPIKey)
      WarewolfGenericCommsEngineApiKey: $(WarewolfGenericCommsEngineApiKey)
      WarewolfCollectionsNewJourneyEmailSourceHost: $(WarewolfCollectionsNewJourneyEmailSourceHost)
      WarewolfProfilerAlertToEmail: $(WarewolfProfilerAlertToEmail)
      WarewolfProfilerMissingGrantDatesCommsTag: $(WarewolfProfilerMissingGrantDatesCommsTag)
      WarewolfGenericESLoggingSourceHost: $(WarewolfGenericESLoggingSourceHost)
      WarewolfGenericESLoggingSourcePortNo: $(WarewolfGenericESLoggingSourcePortNo)
      WarewolfProfilerServicesESLoggingSourceIndex: $(WarewolfProfilerServicesESLoggingSourceIndex)

  # The WFAES key material is written to a temporary file for Protect-ProfilerSources.ps1 and
  # deleted again in the same step. Values already WFAES-encrypted in the repo (the DEV2 SQL and
  # Hangfire sources) are left as they are, so they must be under a key the vault's ring holds.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $tools   = '$(Build.SourcesDirectory)\Dev\.azure\profiler-engine'
      $stage   = '$(Agent.TempDirectory)\ProfilerEngineStage'
      $keyFile = Join-Path '$(Agent.TempDirectory)' "wfaes-$([guid]::NewGuid().ToString('N')).json"
      if ([string]::IsNullOrWhiteSpace($env:WfaesKeyMaterial) -or $env:WfaesKeyMaterial -match '^\$\(') {
          throw "The WFAES key secret '$(ProfilerEngineKeyVaultSecretName)' was not loaded from $(ProfilerEngineKeyVaultName)."
      }
      try {
          [System.IO.File]::WriteAllText($keyFile, $env:WfaesKeyMaterial)
          $encrypted = 0
          foreach ($dir in 'Resources', 'Settings') {
              $encrypted += (& "$tools\Protect-ProfilerSources.ps1" -Path "$stage\$dir" -KeyMaterialPath $keyFile).Encrypted
          }
          if ($encrypted -lt 1) { throw 'No source ConnectionString was encrypted.' }
      } finally {
          Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
      }
      & "$tools\Set-ProfilerEngineConcurrency.ps1" -PackageRoot $stage `
          -MaxConcurrentCalls $(ProfilerServiceBusMaxConcurrentCalls) `
          -MaxConcurrentExecutions $(ProfilerServiceBusTriggerMaxConcurrentExecutions) `
          -DisableDynamicConcurrency
    displayName: 'Encrypt the sources and apply the trigger concurrency'
    env:
      WfaesKeyMaterial: $(WWExecutionEngineTestSecret)

  # Checks the package as the engine will read it, so a broken build fails here rather than at the
  # engine's cold start.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $stage = '$(Agent.TempDirectory)\ProfilerEngineStage'
      $problems = [System.Collections.Generic.List[string]]::new()

      foreach ($rel in 'host.json', 'secure.config', 'Warewolf License.secureconfig',
                       'Settings\executionengine.settings.json', 'Settings\servicebustrigger.bite',
                       'Settings\persistencesettings.json', 'Settings\persistencesettingsdbsource.bite',
                       'Resources\ProfilerWrapper\Queue\RequestForProfilingConsume.bite',
                       'Resources\Profiler\V2\Functions\ProfilerAlerts\GrantDates.bite') {
          if (-not (Test-Path -LiteralPath (Join-Path $stage $rel))) { $problems.Add("Missing: $rel") }
      }

      $files = @(Get-ChildItem -LiteralPath "$stage\Resources", "$stage\Settings" -Recurse -File -Include '*.bite', '*.json')
      foreach ($hit in @($files | Select-String -Pattern '#\{[A-Za-z0-9_.-]+\}' -List)) {
          $problems.Add("Unreplaced token in $($hit.Path.Substring($stage.Length + 1)): $($hit.Matches[0].Value)")
      }
      foreach ($f in $files | Where-Object Extension -eq '.bite') {
          $text = Get-Content -LiteralPath $f.FullName -Raw
          if ($text -notmatch '<Source\b') { continue }
          foreach ($m in [regex]::Matches($text, '\bConnectionString="([^"]*)"')) {
              if ($m.Groups[1].Value -and -not $m.Groups[1].Value.StartsWith('WFAES::')) {
                  $problems.Add("Plain-text ConnectionString in $($f.FullName.Substring($stage.Length + 1))")
              }
          }
      }

      $trigger = Get-Content -LiteralPath "$stage\Settings\servicebustrigger.bite" -Raw | ConvertFrom-Json
      if ($trigger.QueueName -ne '$(ProfilerServiceBusTriggerQueueName)') { $problems.Add("servicebustrigger.bite QueueName is '$($trigger.QueueName)', expected '$(ProfilerServiceBusTriggerQueueName)'.") }
      $settings = Get-Content -LiteralPath "$stage\Settings\executionengine.settings.json" -Raw | ConvertFrom-Json
      if ($settings.keyVaultName -ne '$(ProfilerEngineKeyVaultName)' -or $settings.keyVaultSecretName -ne '$(ProfilerEngineKeyVaultSecretName)') {
          $problems.Add('executionengine.settings.json does not name the Key Vault and secret this build encrypted with.')
      }

      if ($problems.Count) {
          foreach ($p in $problems) { Write-Host "##[error]$p" }
          throw "$($problems.Count) problem(s) in the staged package."
      }
      Write-Host "Package verified: $($files.Count) resource and settings file(s), no tokens left, every source encrypted."
    displayName: 'Verify the staged package'

  - task: ArchiveFiles@2
    displayName: 'Zip the profiler engine package'
    inputs:
      rootFolderOrFile: '$(Agent.TempDirectory)\ProfilerEngineStage'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(Agent.TempDirectory)\ProfilerEngine\profiler-engine.zip'
      replaceExistingArchive: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Artifact: ProfilerEngine'
    inputs:
      targetPath: '$(Agent.TempDirectory)\ProfilerEngine'
      artifact: ProfilerEngine
