# Profiler UAT CI - Warewolf Lightweight Execution Engine, either queue architecture (DEV2 dry run).
#
# SIBLING OF Dev/.azure/ProfilerService-CI-Dev-LightweightExecutionEngine.yml. Everything from
# 'jobs:' down is BYTE-IDENTICAL between the two files (a Pester test pins it); they differ only
# in this header and the variables block. READ THE DEV FILE'S HEADER for the two architectures,
# why they run on different brokers, how each tears the other down, and the prerequisites - all of
# it applies here with the UAT names below. Port of Unlimited.ProfilerServices'
# ProfilerService-CI-UAT.yml (AD-2383, commits daa5f5f..c7a1d21).
#
# This is NOT the file that goes to The Unlimited. It proves the same deploy + queue mechanics in
# Warewolf's own DEV2 resource group, with its OWN engine so the UAT and Dev runs never re-point
# each other's app:
#
#   ShovelBridge (default)
#     self-hosted RabbitMQ 'rabbitmq.warewolf.online' queue 'profiler.profile.request.UAT'
#     -> Shovel 'wwprofileruatlw-shovel' -> Service Bus 'wwprofileruatlwsb' queue
#        'profiler.profile.request.UAT' (dead-letters forwarded to 'profiler.profile.error.request.UAT')
#     -> the ServiceBusTrigger of engine 'wwprofileruatlw'
#
#   QueueProcessor
#     CloudAMQP 'bmkzdabu' queue 'profiler.profile.request.UAT'
#     -> worker 'wwqp-profileruat-*' on ACA 'aca-warewolf' -> HTTPS POST /Secure/{workflow} on
#        'wwprofileruatlw' (dead-letters to 'profiler.profile.error.request.UAT')
#
# ── DIFFERENCES FROM THE UNLIMITED'S UAT FILE ────────────────────────────────────────────────
# - No PR container tests, no replacetokens/Octopus steps, no Unlimited Key Vault, VNet or SQL
#   build: this repo carries its own Profiler workflow tree (Dev/Warewolf.Execution.Lightweight/
#   Resources/ProfilerServices) and stages it instead.
# - No opt-in 20,000-message LoadTest stage and no 'profiler.loadtest.*' queues: every run sends
#   a small burst through the chosen architecture; pipeline-LOADTEST.yml is this repo's load rig.
# - The queue trigger is Dev/.azure/ProfilerUat.trigger.bite (flat body -> RequestForProfiling),
#   not the production ProfilerProfileRequest trigger.
#
# ── FIRST RUN ────────────────────────────────────────────────────────────────────────────────
# 'wwprofileruatlw' and 'wwprofileruatlwsa' are created by the engine deploy on the first run
# (Flex Consumption, 4 GB); 'Preflight: Warewolf infrastructure' reports them as 'will be created'.
# A ShovelBridge run needs nothing else. A QueueProcessor run first needs an Entra app for the new
# engine, which an Application Administrator registers once:
#     ./Scripts/Configure-WwExecutionAuth.ps1 -SubscriptionId <id> -TenantId <id> `
#         -ResourceGroupName DEV2 -FunctionAppName wwprofileruatlw
# Until then the QueueProcessor run stops at 'Resolve engine Entra app id (WAREWOLF_ENTRA_CONFIG)'
# with the repair command, before any container is built. The pipeline definition needs the same
# secret variables as the Dev one (CLOUDAMQP_SHOVEL_PASSWORD, ExternalRabbitMqPassword, and for
# QueueProcessor AzureClientId/AzureClientSecret/AzureTenantId).
#
# Both engines publish results to CloudAMQP 'bmkzdabu' (40 connections in all): never run the Dev
# and UAT pipelines at the same time.

parameters:
- name: queueArchitecture
  displayName: 'Queue architecture to deploy'
  type: string
  default: 'ShovelBridge'
  values:
  - 'ShovelBridge'
  - 'QueueProcessor'

trigger: none

pool:
  vmImage: 'windows-2022'

variables:
  # ── ENVIRONMENT (the only block that differs from the Dev file) ───────────────────────────
  ProfilerEnvironment: 'UAT'

  # The engine: UAT's OWN app, so a UAT run never re-points the Dev engine's trigger queue. Created
  # by the first run's deploy (Flex Consumption, Linux) in the same DEV2 resource group.
  ProfilerEngineAppName: 'wwprofileruatlw'
  ProfilerEngineStorageAccount: 'wwprofileruatlwsa'

  # This environment's queues. The SAME names are used on whichever broker the architecture runs
  # on (see the Dev file's header). They MUST match ProfilerQueueTriggerFile's QueueName /
  # DeadLetterQueue; 'Verify trigger file matches pipeline variables' fails the build if they drift.
  ProfilerQueueTriggerFile: '$(Build.SourcesDirectory)\Dev\.azure\ProfilerUat.trigger.bite'
  ProfilerQueueName: 'profiler.profile.request.UAT'
  ProfilerDeadLetterQueueName: 'profiler.profile.error.request.UAT'

  # ShovelBridge: UAT's own Service Bus namespace (created by the first ShovelBridge run), trigger
  # queue, error queue and shovel. The trigger queue takes the RabbitMQ queue's name; its
  # dead-letters are auto-forwarded to the error queue, where they sit until someone reads them.
  ProfilerServiceBusNamespace: 'wwprofileruatlwsb'
  ProfilerServiceBusTriggerQueueName: 'profiler.profile.request.UAT'
  ProfilerServiceBusErrorQueueName: 'profiler.profile.error.request.UAT'
  ProfilerShovelName: 'wwprofileruatlw-shovel'

  # QueueProcessor: the fixed prefix of this environment's worker Container Apps. The ShovelBridge
  # path stops every app with it, so it must never match another environment's or rig's apps.
  ProfilerWorkerAppNamePrefix: 'wwqp-profileruat-'

  # ── SHARED (identical in the Dev file) ────────────────────────────────────────────────────
  ProfilerEngineResourceGroup: 'DEV2'
  ProfilerEngineLocation: 'southafricanorth'

  # Read at connection time by Dev/Dev2.Services.Sql/SqlConnectionWrapper.cs (line ~45): when true,
  # the SqlClient connection is opened with TrustServerCertificate. Microsoft.Data.SqlClient defaults
  # to Encrypt=true, so a SQL Server whose certificate this app does not trust otherwise fails with
  # 'certificate chain ... not trusted' - see docs/KB-Deploying-Encrypted-Sources.md. Declared here
  # because the deploy orchestrator has no parameter for arbitrary App Settings; it was lost once
  # when wwprofilerlw was recreated (2026-09-18). Set to 'false' at queue time to turn it off.
  ProfilerEngineSqlTrustServerCert: 'true'

  # The same Key Vault + AES-key secret pipeline-LOADTEST.yml's Deploy_UAT stage uses for
  # -EncryptResources on this subscription.
  ProfilerEngineKeyVaultName: 'WWExecutionEngine'
  ProfilerEngineKeyVaultSecretName: 'WWExecutionEngineTestSecret'

  # Service connection names are authorised at pipeline COMPILE time, so every reference below uses
  # ${{ variables.AzureServiceConnection }}. It holds Contributor on DEV2 plus a condition-
  # constrained RBAC-administrator grant for the Service Bus Data Receiver role only.
  AzureServiceConnection: 'AzureStorage-WarewolfReleases'

  # Where the published Lightweight engine + deployment scripts come from (warewolf.online/
  # release-notes.php). Leave the *ZipUrl variables EMPTY to track the latest release; set them
  # (queue time, full https URLs on the storage account) only to pin a build (WOLF-8512). The engine
  # zip is the linux-x64 one: the engines are Flex Consumption, which is Linux-only.
  WarewolfReleasesStorageAccount: 'stwwreleases'
  WarewolfEngineZipUrl: ''
  WarewolfScriptsZipUrl: ''
  WarewolfQueueWorkerZipUrl: ''

  # The workflow the HTTP smoke test executes, the ServiceBusTrigger runs and the trigger file
  # names - ProfilerWrapper/RequestForProfiling, folder-qualified because WorkflowIndex.Resolve()
  # keys entries by their full relative path under Resources/. Two variables so the HTTP smoke test
  # can be pointed elsewhere without silently re-pointing the trigger.
  ProfilerSmokeWorkflowRoute: 'ProfilerServices/ProfilerWrapper/RequestForProfiling'
  ProfilerServiceBusTriggerWorkflowName: 'ProfilerServices/ProfilerWrapper/RequestForProfiling'

  # THE SINK. RequestForProfiling's trailing 'RabbitMQ Publish' activity publishes
  # [[ProfilerInstruction]] to this queue via RabbitMQSource 0b142714-8f6d-41b7-9832-2aefa8c731ec.
  # The name is baked into RequestForProfiling.bite. PublishRabbitMQActivity declares it if absent.
  ProfilerSinkQueueName: 'collectionv2.profilerrecommendation.request'

  # ── CloudAMQP 'bmkzdabu': the RESULT sink for both architectures, and the QueueProcessor's
  # trigger broker. Username and vhost are both the instance name; secret CLOUDAMQP_SHOVEL_PASSWORD.
  # AMQP on plaintext 5672 because RabbitMQSource has no TLS option. The instance runs LavinMQ.
  ProfilerSinkRabbitMqHost: 'ostrich-01.lmq.cloudamqp.com'
  ProfilerSinkRabbitMqPort: '5672'
  ProfilerSinkRabbitMqUsername: 'bmkzdabu'
  ProfilerSinkRabbitMqVirtualHost: 'bmkzdabu'
  # The management API (HTTPS, 443) - for declaring and inspecting queues, not for publishing.
  ProfilerSinkRabbitMqManagementUri: 'https://ostrich-01.lmq.cloudamqp.com'

  # ── Self-hosted RabbitMQ 'rabbitmq.warewolf.online': the ShovelBridge's source broker ─────
  # The same broker pipeline-LOADTEST.yml's ShovelBridgeLoadTest_ExternalServiceBus job targets
  # (user 'testuser', vhost '/', secret ExternalRabbitMqPassword). Management only over https.
  ProfilerRabbitMqManagementUri: 'https://rabbitmq.warewolf.online'
  ProfilerRabbitMqUsername: 'testuser'
  ProfilerRabbitMqVirtualHost: '/'
  # THE SHOVEL'S src-uri IS DIALLED BY THE BROKER NODE ITSELF, so it must be how the broker reaches
  # itself - 'localhost'. The public name left the shovel in 'starting' forever (2026-09-18): only
  # 443 is published there. Working shovels show as peer 127.0.0.1 in /api/connections.
  ProfilerShovelSourceHost: 'localhost'
  # Hands the CA bundle to Configure-RabbitMqShovel.ps1's -DestUriCaCertFile, working around the
  # Erlang/OTP 26+ '{cacerts, undefined}' crash-loop. A missing cacert shows up as a DESTINATION
  # failure; a shovel stuck in 'starting' with no 127.0.0.1 connection is the SOURCE leg.
  ProfilerShovelDestUriCaCertFile: '/etc/ssl/certs/ca-certificates.crt'
  # Least-privilege Send-only SAS rule, matching Configure-RabbitMqShovel.ps1's default.
  ProfilerShovelSendRuleName: 'shovel-send'
  # PT5M, not az's PT1M default, matching the engine's 5-minute ServiceBusTrigger ExecutionTimeout:
  # at PT1M the lock expires mid-execution and the redelivery runs the workflow twice.
  # Enable-ServiceBusSecureTrigger.ps1 also requires MaxDeliveryCount (10) x LockDuration to exceed
  # the engine's functionTimeout + 1 minute.
  ProfilerServiceBusTriggerQueueLockDuration: 'PT5M'

  # ── QueueProcessor (shared ACA environment + registry) ────────────────────────────────────
  # Same ACA environment + registry pipeline-CLOUD.yml and pipeline-LOADTEST.yml deploy to; the
  # per-environment ProfilerWorkerAppNamePrefix above keeps the apps apart.
  ProfilerAcaEnvironment: 'aca-warewolf'
  ProfilerAcrName: 'acrwarewolf'
  # Not a secret, so it lives HERE: a YAML-declared variable shadows a UI/queue-time value of the
  # same name, so an empty '' here could never be fixed from the definition (build 30835).
  # ProfilerEngineEntraAppId is deliberately NOT declared: 'Resolve engine Entra app id' reads it
  # from the engine itself, so the worker always mints tokens for the audience the engine validates.
  ProfilerWorkerRabbitMqSecretUri: 'https://wwexecutionengine.vault.azure.net/secrets/rabbitmq-uri'

  # ── The burst every run publishes through the chosen architecture ────────────────────────
  # The sink is capped at 20000 by CloudAMQP policy and the worker's concurrency is 20, so 200
  # exercises scale-out without filling it. Every message is checked, so cost grows with it.
  ProfilerBurstMessageCount: '200'
  ProfilerDrainQuietSeconds: '120'
  ProfilerDrainTimeoutSeconds: '2400'

  # The ENGINE's Application Insights component, so the QueueProcessor run report can join
  # engine-side log lines to each delivery. Empty = worker-side reconciliation only.
  ProfilerEngineAppInsightsName: ''

jobs:
- job: ProfilerMS
  displayName: ProfilerMS Lightweight Engine + ${{ parameters.queueArchitecture }} (DEV2 $(ProfilerEnvironment))
  steps:
  - checkout: self
    clean: true

  # ── Fail-fast pre-flight (no Azure access needed) ────────────────────────────────────────
  # Everything here is a static check on values the pipeline already holds. It runs FIRST so a
  # missing prerequisite costs seconds, not the 10+ minutes of an engine deploy that a later step
  # would have failed after. Each message names the exact remediation. What is required depends on
  # the architecture: ShovelBridge never touches the QueueProcessor's SP login or Key Vault secret.
  #
  # Pipeline variables that are not defined are NOT expanded by Azure DevOps: '$(Name)' arrives
  # verbatim. Every "is it set" test below therefore also rejects a value that still looks like a
  # macro - an unset secret must never be mistaken for a real one.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $architecture = '${{ parameters.queueArchitecture }}'
      $problems = New-Object System.Collections.Generic.List[string]

      function Test-Unset([string] $Value) {
        return [string]::IsNullOrWhiteSpace($Value) -or $Value -match '^\$\('
      }

      # Secret pipeline variables. The names are checked, never the values echoed.
      #   CLOUDAMQP_SHOVEL_PASSWORD  the result sink (both), and the worker's broker (QueueProcessor)
      #   ExternalRabbitMqPassword   the self-hosted broker: the shovel's source (ShovelBridge), and
      #                              deleting that shovel (QueueProcessor)
      $secrets = [ordered]@{
        CLOUDAMQP_SHOVEL_PASSWORD = $env:CloudAmqpPasswordValue
        ExternalRabbitMqPassword  = $env:ExternalRabbitMqPasswordValue
      }
      if ($architecture -eq 'QueueProcessor') {
        $secrets['AzureClientId']     = $env:AzureClientIdValue
        $secrets['AzureClientSecret'] = $env:AzureClientSecretValue
        $secrets['AzureTenantId']     = $env:AzureTenantIdValue

        # The engine's Entra app id is not checked here: it is read from the engine itself later
        # ('Resolve engine Entra app id (WAREWOLF_ENTRA_CONFIG)'), which needs Azure access.

        # ProfilerWorkerRabbitMqSecretUri: the Key Vault secret KEDA authenticates to the broker with.
        $secretUri = '$(ProfilerWorkerRabbitMqSecretUri)'
        if ((Test-Unset $secretUri) -or $secretUri -notmatch '^https://[^/]+\.vault\.azure\.net/secrets/[^/]+') {
          $problems.Add("ProfilerWorkerRabbitMqSecretUri is not a Key Vault secret URI ('$secretUri'). Store the CloudAMQP AMQP URI as a Key Vault secret and set this variable to its URI (see this file's header). Without it the KEDA rule has no broker auth and the worker never scales out of zero.")
        }
      }
      foreach ($name in $secrets.Keys) {
        if (Test-Unset ([string]$secrets[$name])) {
          $problems.Add("Secret pipeline variable '$name' is not set on this pipeline definition ($architecture needs it).")
        }
      }

      if ($problems.Count -gt 0) {
        foreach ($p in $problems) { Write-Host "##[error]$p" }
        throw "$($problems.Count) prerequisite(s) missing for $architecture - nothing has been deployed."
      }
      Write-Host "Prerequisites present for $($architecture): $($secrets.Keys -join ', ')."
    displayName: 'Validate pipeline prerequisites'
    env:
      CloudAmqpPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)
      ExternalRabbitMqPasswordValue: $(ExternalRabbitMqPassword)
      # The QueueProcessor deploy (Container Apps, ACR, role assignments) is run under a raw service
      # principal login, exactly as pipeline-LOADTEST.yml and pipeline-CLOUD.yml run it, rather than
      # under the AzureCLI@2 service connection the engine steps use: Deploy-WwQueueProcessor.ps1
      # grants AcrPull and 'Key Vault Secrets User' to each new app identity, which needs
      # Microsoft.Authorization/roleAssignments/write - and that connection holds only a
      # condition-constrained grant for the Service Bus Data Receiver role.
      AzureClientIdValue: $(AzureClientId)
      AzureClientSecretValue: $(AzureClientSecret)
      AzureTenantIdValue: $(AzureTenantId)

  # The trigger file is what Deploy-WwQueueProcessor.ps1 bakes into the worker image, so it - not
  # this file's variables - decides which queue the worker consumes and how far it scales. The
  # variables are what every other step declares, publishes to and reads back, so a mismatch does
  # not fail loudly: the worker would consume an empty queue while the burst fills another. Checked
  # for BOTH architectures, so one file names this environment's queues whichever way it runs.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $path = '$(ProfilerQueueTriggerFile)'
      $trigger = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
      $problems = New-Object System.Collections.Generic.List[string]

      if ($trigger.QueueName       -ne '$(ProfilerQueueName)')           { $problems.Add("QueueName is '$($trigger.QueueName)', pipeline variable ProfilerQueueName is '$(ProfilerQueueName)'.") }
      if ($trigger.DeadLetterQueue -ne '$(ProfilerDeadLetterQueueName)') { $problems.Add("DeadLetterQueue is '$($trigger.DeadLetterQueue)', pipeline variable ProfilerDeadLetterQueueName is '$(ProfilerDeadLetterQueueName)'.") }
      if ($trigger.QueueName -notlike '*.$(ProfilerEnvironment)')         { $problems.Add("QueueName '$($trigger.QueueName)' does not end in '.$(ProfilerEnvironment)' - this environment would share another's queue.") }
      # The Service Bus trigger queue takes the RabbitMQ queue's name, and its error queue the dead-letter queue's.
      if ('$(ProfilerServiceBusTriggerQueueName)' -ne $trigger.QueueName)     { $problems.Add("ProfilerServiceBusTriggerQueueName '$(ProfilerServiceBusTriggerQueueName)' differs from the trigger's QueueName '$($trigger.QueueName)'.") }
      if ('$(ProfilerServiceBusErrorQueueName)' -ne $trigger.DeadLetterQueue) { $problems.Add("ProfilerServiceBusErrorQueueName '$(ProfilerServiceBusErrorQueueName)' differs from the trigger's DeadLetterQueue '$($trigger.DeadLetterQueue)'.") }
      # The generated CloudAMQP source ('Generate RequestForProfiling CloudAMQP publish source').
      if ($trigger.QueueSourceId   -ne '0b142714-8f6d-41b7-9832-2aefa8c731ec') { $problems.Add("QueueSourceId is '$($trigger.QueueSourceId)', expected the generated CloudAMQP source 0b142714-8f6d-41b7-9832-2aefa8c731ec.") }
      if ($trigger.QueueSinkId     -ne $trigger.QueueSourceId)                 { $problems.Add("QueueSinkId '$($trigger.QueueSinkId)' differs from QueueSourceId - the dead-letter queue must live on the same broker.") }
      if ([int]$trigger.Concurrency -lt 1)                                     { $problems.Add("Concurrency is $($trigger.Concurrency); 0 disables the worker (min = max = 0 replicas).") }
      if ($trigger.WorkflowName.Replace('\', '/') -ne '$(ProfilerSmokeWorkflowRoute)') { $problems.Add("WorkflowName is '$($trigger.WorkflowName)', the smoke workflow is '$(ProfilerSmokeWorkflowRoute)'.") }
      if ((Get-Content -LiteralPath $path -Raw) -match '#\{') { $problems.Add('The trigger still contains an unsubstituted #{...} release token.') }

      if ($problems.Count -gt 0) {
        foreach ($p in $problems) { Write-Host "##[error]$p" }
        throw "$(Split-Path $path -Leaf) does not match this pipeline ($($problems.Count) problem(s))."
      }
      Write-Host "Trigger '$($trigger.Name)': queue '$($trigger.QueueName)', dead-letter '$($trigger.DeadLetterQueue)', concurrency $($trigger.Concurrency), workflow '$($trigger.WorkflowName)'."
    displayName: 'Verify trigger file matches pipeline variables'

  # Read-only inventory of the Azure resources the chosen architecture depends on, so a run that is
  # about to create infrastructure (or cannot, because a prerequisite is missing) says so up front.
  # What the pipeline creates itself (the engine and its storage on a first run, the Service Bus
  # namespace and queues) is only reported; what it cannot create (the Key Vault, the shared ACA
  # environment and registry) fails the run here instead of 20 minutes in. 'az resource list' is
  # used for existence so no CLI extension is needed.
  - task: AzureCLI@2
    displayName: 'Preflight: Warewolf infrastructure'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        $rg = '$(ProfilerEngineResourceGroup)'
        $shovel = '${{ parameters.queueArchitecture }}' -eq 'ShovelBridge'
        $report = [System.Collections.Generic.List[object]]::new()

        function Find-Resource([string] $Type, [string] $Name) {
          $id = az resource list --resource-group $rg --resource-type $Type --name $Name --query '[0].id' -o tsv
          if ($LASTEXITCODE -ne 0) { throw "Looking up $Type '$Name' in '$rg' failed (exit $LASTEXITCODE)." }
          return [bool]$id
        }
        # $Required: the pipeline cannot create it, so absence is fatal.
        function Add-Check([string] $Component, [string] $Name, [bool] $Exists, [bool] $Required = $false) {
          $state = if ($Exists) { 'exists' } elseif ($Required) { 'MISSING (required)' } else { 'missing (will be created)' }
          $report.Add([pscustomobject]@{ Component = $Component; Name = $Name; State = $state; Fatal = (-not $Exists -and $Required) })
        }

        Add-Check 'Engine Function App'    '$(ProfilerEngineAppName)'        (Find-Resource 'Microsoft.Web/sites' '$(ProfilerEngineAppName)')
        Add-Check 'Engine storage account' '$(ProfilerEngineStorageAccount)' (Find-Resource 'Microsoft.Storage/storageAccounts' '$(ProfilerEngineStorageAccount)')
        Add-Check 'Key Vault'              '$(ProfilerEngineKeyVaultName)'   (Find-Resource 'Microsoft.KeyVault/vaults' '$(ProfilerEngineKeyVaultName)') $true

        if ($shovel) {
          $nsOk = Find-Resource 'Microsoft.ServiceBus/namespaces' '$(ProfilerServiceBusNamespace)'
          Add-Check 'Service Bus namespace' '$(ProfilerServiceBusNamespace)' $nsOk
          foreach ($q in @(@{ Component = 'Service Bus trigger queue'; Name = '$(ProfilerServiceBusTriggerQueueName)' },
                           @{ Component = 'Service Bus error queue';   Name = '$(ProfilerServiceBusErrorQueueName)' })) {
            # Invoke-WwAz never throws on a non-zero exit, so a missing queue is just an empty answer.
            $queueOk = $nsOk -and [bool](az servicebus queue show --name $q.Name --namespace-name '$(ProfilerServiceBusNamespace)' --resource-group $rg --query name -o tsv)
            Add-Check $q.Component $q.Name $queueOk
          }
        } else {
          Add-Check 'Container Apps environment' '$(ProfilerAcaEnvironment)' (Find-Resource 'Microsoft.App/managedEnvironments' '$(ProfilerAcaEnvironment)') $true
          Add-Check 'Container registry'         '$(ProfilerAcrName)'        (Find-Resource 'Microsoft.ContainerRegistry/registries' '$(ProfilerAcrName)') $true
        }

        $report | Format-Table Component, Name, State -AutoSize -Wrap | Out-String -Width 200 | Write-Host
        foreach ($row in @($report | Where-Object { -not $_.Fatal -and $_.State -ne 'exists' })) {
          Write-Host "##[warning]$($row.Component) '$($row.Name)' is $($row.State)."
        }
        $fatal = @($report | Where-Object Fatal)
        if ($fatal.Count) {
          throw "Required infrastructure is missing: $(($fatal | ForEach-Object { "$($_.Component) '$($_.Name)'" }) -join '; ')."
        }

  # Resolves the currently published engine + deployment-scripts zip URLs from
  # warewolf.online/release-notes.php, which carries data-role="engine-linux-zip-link" and
  # data-role="scripts-zip-link" anchors maintained by the Warewolf release pipeline
  # (Dev/.azure/Update-ReleaseNotes.ps1). Same step as the source file, DEV2 variable names
  # swapped in.
  #
  # release-notes.php is PUBLIC content, so its markup is untrusted input for a URL this agent
  # will fetch and expand on disk. Both resolved URLs are therefore checked to be https and to
  # point at the expected storage account host before anything is downloaded - the same guard
  # the source file applies when it reads the scripts link off that page. A pinned
  # $(Warewolf*ZipUrl) override is held to the identical check: a pipeline variable is a softer
  # target than it looks, and there is no reason to trust one more than the page.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $expectedHost = '$(WarewolfReleasesStorageAccount).blob.core.windows.net'

      function Assert-TrustedReleaseUrl {
          param([string] $Url, [string] $What)
          $parsed = $null
          if (-not [uri]::TryCreate($Url, [UriKind]::Absolute, [ref]$parsed) -or
              $parsed.Scheme -ne 'https' -or $parsed.Host -ne $expectedHost) {
              throw "Refusing to fetch the $What from untrusted URL '$Url' (expected https://$expectedHost/...)."
          }
          return $Url
      }

      $engineUrl  = '$(WarewolfEngineZipUrl)'
      $scriptsUrl = '$(WarewolfScriptsZipUrl)'

      if ([string]::IsNullOrWhiteSpace($engineUrl) -or [string]::IsNullOrWhiteSpace($scriptsUrl)) {
          $notes = Invoke-WebRequest -Uri 'https://warewolf.online/release-notes.php' -UseBasicParsing -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
          if ([string]::IsNullOrWhiteSpace($engineUrl)) {
              # The LINUX engine zip specifically: the engine is a Flex Consumption app
              # (-HostingPlan 'Flex' below), and Flex is Linux-only. The release page carries a
              # linux-x64 and a win-x64 engine zip (7580); deliberately no fallback to the legacy
              # pre-split data-role="engine-zip-link", whose runtime depends on the release that
              # published it - pin WarewolfEngineZipUrl instead until a split release is live.
              $m = [regex]::Match($notes.Content, 'data-role="engine-linux-zip-link"[^>]*href="([^"]+)"')
              if (-not $m.Success) { throw 'Could not find data-role="engine-linux-zip-link" on warewolf.online/release-notes.php. Pin WarewolfEngineZipUrl (a linux-x64 AzureFunctionsPackage zip) as a queue-time variable to unblock this build.' }
              $engineUrl = $m.Groups[1].Value
          }
          if ([string]::IsNullOrWhiteSpace($scriptsUrl)) {
              $m = [regex]::Match($notes.Content, 'data-role="scripts-zip-link"[^>]*href="([^"]+)"')
              if (-not $m.Success) { throw 'Could not find data-role="scripts-zip-link" on warewolf.online/release-notes.php. Pin WarewolfScriptsZipUrl as a queue-time variable to unblock this build.' }
              $scriptsUrl = $m.Groups[1].Value
          }
      }

      $engineUrl  = Assert-TrustedReleaseUrl -Url $engineUrl  -What 'engine package'
      # A pinned override is held to the same runtime rule as the page: a win-x64 package
      # deploys "successfully" to a Linux Flex app and then fails every invocation.
      if ($engineUrl -match 'win-x64') { throw "WarewolfEngineZipUrl '$engineUrl' is a win-x64 package; $(ProfilerEngineAppName) is Linux (Flex) and needs the linux-x64 AzureFunctionsPackage zip." }
      $scriptsUrl = Assert-TrustedReleaseUrl -Url $scriptsUrl -What 'deployment scripts package'

      Write-Host "##vso[task.setvariable variable=ResolvedEngineZipUrl]$engineUrl"
      Write-Host "##vso[task.setvariable variable=ResolvedScriptsZipUrl]$scriptsUrl"
      Write-Host "Engine package : $engineUrl"
      Write-Host "Scripts package: $scriptsUrl"
    displayName: 'Resolve Published Lightweight Engine Release URLs'

  # -PublishPath accepts a .zip directly (the script extracts it and stages secure.config, the
  # license and the workflow tree into the extracted folder before publishing), so the release
  # package is downloaded as-is rather than unpacked here.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $dest = "$(Agent.BuildDirectory)\LightweightEngine"
      New-Item -ItemType Directory -Force -Path $dest | Out-Null
      $zip = Join-Path $dest 'AzureFunctionsPackage.zip'
      Invoke-WebRequest -Uri '$(ResolvedEngineZipUrl)' -OutFile $zip -UseBasicParsing -TimeoutSec 300 -MaximumRetryCount 3 -RetryIntervalSec 10
      $size = (Get-Item $zip).Length
      if ($size -le 0) { throw "Downloaded engine package is empty: $zip" }
      Write-Host "##vso[task.setvariable variable=EngineZipPath]$zip"
      Write-Host "Downloaded engine package ($([math]::Round($size / 1MB, 1)) MB) to $zip"
    displayName: 'Download Lightweight Engine Package'

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $zip = "$(Agent.BuildDirectory)\DeploymentScripts.zip"
      $dir = "$(Agent.BuildDirectory)\DeploymentScripts"
      Invoke-WebRequest -Uri '$(ResolvedScriptsZipUrl)' -OutFile $zip -UseBasicParsing -TimeoutSec 120 -MaximumRetryCount 3 -RetryIntervalSec 10
      if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
      Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force

      # Published zips have shipped both flat and wrapped in a single top-level folder over time
      # (the source file's own release pipeline normalises for the same reason when it diffs the
      # previous release), so locate the orchestrator rather than assuming either layout.
      $deployScript = Get-ChildItem -LiteralPath $dir -Recurse -Filter 'Deploy-WwExecutionEngine.ps1' | Select-Object -First 1
      if (-not $deployScript) { throw "Deploy-WwExecutionEngine.ps1 not found anywhere under $dir - the published scripts package layout has changed." }
      Write-Host "##vso[task.setvariable variable=DeployScriptPath]$($deployScript.FullName)"
      Write-Host "Deployment orchestrator: $($deployScript.FullName)"

      # The chosen architecture's own orchestrators, out of the same package with the same
      # discovery style - they ship alongside Deploy-WwExecutionEngine.ps1 in the repo's Scripts/
      # folder, which the release pipeline zips whole. Only DEPLOY scripts come from the release, as
      # for the engine; the burst publisher, run report and sink checks are pipeline-side
      # verification and run from this checkout, so they always reflect the commit under test.
      #   ShovelBridge    Configure-RabbitMqShovel.ps1, Enable-ServiceBusSecureTrigger.ps1
      #   QueueProcessor  Deploy-WwQueueProcessor.ps1
      $wanted = if ('${{ parameters.queueArchitecture }}' -eq 'ShovelBridge') {
        [ordered]@{ ShovelScriptPath = 'Configure-RabbitMqShovel.ps1'; SecureTriggerScriptPath = 'Enable-ServiceBusSecureTrigger.ps1' }
      } else {
        [ordered]@{ QueueProcessorDeployScriptPath = 'Deploy-WwQueueProcessor.ps1' }
      }
      foreach ($var in $wanted.Keys) {
        $found = Get-ChildItem -LiteralPath $dir -Recurse -Filter $wanted[$var] | Select-Object -First 1
        if (-not $found) { throw "$($wanted[$var]) not found anywhere under $dir - the published scripts package layout has changed, or the release predates it. Pin WarewolfScriptsZipUrl to a build that carries it." }
        Write-Host "##vso[task.setvariable variable=$var]$($found.FullName)"
        Write-Host "$($wanted[$var]): $($found.FullName)"
      }
    displayName: 'Download Warewolf Deployment Scripts'

  # Replaces the source file's "Stage Profiler Workflow Resources" step (which copied from the
  # Unlimited.ProfilerServices repo's own Warewolf.ProfilerServices/Profiler + Sources/*.bite).
  # This repo already carries an equivalent, committed tree at
  # Dev/Warewolf.Execution.Lightweight/Resources/ProfilerServices (+ Resources/rabbit for
  # NewSqlServerSource/RabbitProcess, which RequestForProfiling's nested calls depend on) - the
  # exact tree pipeline-LOADTEST.yml already proves out for its own Profiler load test. Staged
  # as two subfolders under one root, mirroring pipeline-LOADTEST.yml's own two staging steps.
  - powershell: |
      $ErrorActionPreference = 'Stop'
      $destRoot = "$(Agent.BuildDirectory)\ProfilerWorkflowResources"

      $rabbitDest = Join-Path $destRoot 'rabbit'
      New-Item -ItemType Directory -Force -Path $rabbitDest | Out-Null
      Get-ChildItem '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Resources\rabbit' -File |
          Where-Object { $_.Name -ne 'NewSqlServerSource (Local Backup).bite' } |
          Copy-Item -Destination $rabbitDest -Force

      $profilerDest = Join-Path $destRoot 'ProfilerServices'
      New-Item -ItemType Directory -Force -Path $profilerDest | Out-Null
      Copy-Item '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Resources\ProfilerServices\*' `
          -Destination $profilerDest -Recurse -Force
      Remove-Item -LiteralPath (Join-Path $profilerDest 'Provision-ProfilerSchema.sql') -Force -ErrorAction SilentlyContinue

      # WOLF-8512 (build 30705): Sources\ProfilerRabbitMQSource.bite is the release-token
      # TEMPLATE - its ConnectionString carries the literal, never-substituted
      # '#{WarewolfGenericRabbitMQSourceHost}' etc, because this file drops the source file's
      # replacetokens@5 steps. It shares ResourceID 0b142714-8f6d-41b7-9832-2aefa8c731ec with the
      # REAL, CloudAMQP-credentialed copy the 'Generate RequestForProfiling CloudAMQP publish
      # source' step below writes to ProfilerWrapper\ProfilerRabbitMQSource.bite, and
      # LightweightSourceLoader.BuildFileIndex (Directory.EnumerateFiles, unordered) lets whichever
      # is enumerated LAST silently win. Remove it from THIS staged copy so only the generated,
      # real source ever ships. Do NOT remove it from the source Resources tree - it belongs to
      # the 1:1 mirror of the authoritative Unlimited.ProfilerServices layout.
      Remove-Item -LiteralPath (Join-Path $profilerDest 'Sources\ProfilerRabbitMQSource.bite') -Force -ErrorAction SilentlyContinue

      $count = (Get-ChildItem -LiteralPath $destRoot -Recurse -File -Filter '*.bite').Count
      Write-Host "Staged $count .bite resource(s) into $destRoot"
    displayName: 'Stage Profiler Workflow Resources (from this repo''s own Resources tree)'

  # Closes the same dependency-closure gap pipeline-LOADTEST.yml's own
  # "Generate RequestForProfiling CloudAMQP publish source" step closes, and for the same reason:
  # RequestForProfiling's PublishRabbitMQActivity needs RabbitMQSource
  # 0b142714-8f6d-41b7-9832-2aefa8c731ec, and the only copy this repo commits
  # (Resources/ProfilerServices/Sources/ProfilerRabbitMQSource.bite) is a RELEASE-TOKEN TEMPLATE -
  # its ConnectionString carries the literal, never-substituted '#{WarewolfGenericRabbitMQSourceHost}'
  # etc. The source file substitutes those via replacetokens@5 over Octopus variables; this DEV2
  # copy drops those steps (see the header), so without this step the publish resolves
  # '#{WarewolfGenericRabbitMQSourceHost}' as a hostname and fails with
  # BrokerUnreachableException / 'No such host is known' - observed live on wwprofilerlw on
  # 2026-09-18, and the same failure WOLF-8512 / build 30705 hit at load.
  #
  # The staging step above removes the template so only this generated file carries ResourceID
  # 0b142714-...: LightweightSourceLoader.BuildFileIndex enumerates with Directory.EnumerateFiles
  # (unordered), so with both present whichever is read LAST silently wins the ID collision.
  #
  # GENERATED, never committed - the broker password is a secret, and writing it into a
  # source-controlled .bite would put a live credential in git. Emitted as PLAIN TEXT because the
  # deploy below runs with -EncryptResources:$true and encrypts the staged tree itself.
  - powershell: |
      $ErrorActionPreference = 'Stop'

      $amqpHost  = '$(ProfilerSinkRabbitMqHost)'
      $amqpPort  = '$(ProfilerSinkRabbitMqPort)'
      $amqpUser  = '$(ProfilerSinkRabbitMqUsername)'
      $amqpVHost = '$(ProfilerSinkRabbitMqVirtualHost)'
      $amqpPass  = $env:CloudAmqpPasswordValue

      # Deliberately NOT a PowerShell here-string: its closing '"@' must sit at column 0, which
      # dedents out of this YAML block scalar and makes the whole file unparseable.
      if ([string]::IsNullOrWhiteSpace($amqpHost)) {
        throw ("ProfilerSinkRabbitMqHost is not set, so RequestForProfiling's RabbitMQ publish source " +
               "cannot be generated. It must be the CLOUDAMQP AMQP endpoint (the result broker the smoke " +
               "test inspects), not the self-hosted broker the ShovelBridge's shovel lives on.")
      }
      # The CloudAMQP instance credential ('bmkzdabu') - NOT the self-hosted broker's password,
      # which only the ShovelBridge source uses.
      if ([string]::IsNullOrWhiteSpace($amqpPass)) {
        throw ("Secret pipeline variable 'CLOUDAMQP_SHOVEL_PASSWORD' is empty - it is required to build " +
               "RequestForProfiling's CloudAMQP publish source, and to verify the published message. Set it " +
               "(as a secret) on this pipeline definition in Azure DevOps to the 'bmkzdabu' instance password.")
      }

      # SecurityElement::Escape covers & < > " ' so a password containing XML metacharacters
      # cannot corrupt the attribute (or inject markup into the resource).
      $connectionString = "HostName=$amqpHost;Port=$amqpPort;UserName=$amqpUser;Password=$amqpPass;VirtualHost=$amqpVHost"
      $escaped = [System.Security.SecurityElement]::Escape($connectionString)

      $destDir = "$(Agent.BuildDirectory)\ProfilerWorkflowResources\ProfilerServices\ProfilerWrapper"
      New-Item -ItemType Directory -Force -Path $destDir | Out-Null
      $destFile = Join-Path $destDir 'ProfilerRabbitMQSource.bite'

      $xml = @(
        '<Source ID="0b142714-8f6d-41b7-9832-2aefa8c731ec" Name="ProfilerRabbitMQSource" ResourceType="RabbitMQSource" IsValid="false" ConnectionString="' + $escaped + '" Type="RabbitMQSource" ServerVersion="0.0.0.0" ServerID="51a58300-7e9d-4927-a57b-e5d700b11b55">'
        '  <DisplayName>ProfilerRabbitMQSource</DisplayName>'
        '  <TypeOf>RabbitMQSource</TypeOf>'
        '</Source>'
      ) -join [Environment]::NewLine

      [System.IO.File]::WriteAllText($destFile, $xml, (New-Object System.Text.UTF8Encoding($false)))

      # Never echo $connectionString - it carries the password. Host/port/user only.
      Write-Host "Generated RabbitMQ publish source 0b142714-8f6d-41b7-9832-2aefa8c731ec -> amqp://$amqpUser@${amqpHost}:$amqpPort/$($amqpVHost.TrimStart('/'))"
    displayName: 'Generate RequestForProfiling CloudAMQP publish source'
    env:
      CloudAmqpPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)


  - ${{ if eq(parameters.queueArchitecture, 'QueueProcessor') }}:
    # The QueueProcessor package, and the broker source it bakes into its image.
    #
    # PACKAGE: the published Warewolf-QueueProcessor-<ver>.zip is the raw `dotnet publish` output
    # (pipeline-CLOUD.yml zips 'QueueProcessorRelease', which is that folder). Resolved and trust-
    # checked exactly like the engine zip: release-notes.php is public content, so the host is
    # verified before anything is fetched.
    #
    # SOURCE: Deploy-WwQueueProcessor.ps1 bakes the RabbitMQ source into the image and looks it up by
    # QueueSourceId, scanning only the TOP LEVEL of -QueueSourcePath - the generated CloudAMQP source
    # sits three folders down inside the engine's workflow tree, so it is copied to a folder of its own.
    # Copied HERE, before the engine deploy, and not read back from the workflow tree later: that
    # tree is handed to -EncryptResources:$true, and a plaintext copy must not depend on it surviving.
    # The copy is plain text on the agent only; the worker deploy encrypts its own staged copy
    # (-EncryptStagedSettings) so the image never carries the broker password in clear.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $expectedHost = '$(WarewolfReleasesStorageAccount).blob.core.windows.net'

        $workerUrl = '$(WarewolfQueueWorkerZipUrl)'
        if ([string]::IsNullOrWhiteSpace($workerUrl)) {
          $notes = Invoke-WebRequest -Uri 'https://warewolf.online/release-notes.php' -UseBasicParsing -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
          $m = [regex]::Match($notes.Content, 'data-role="queueworker-zip-link"[^>]*href="([^"]+)"')
          if (-not $m.Success) { throw 'Could not find data-role="queueworker-zip-link" on warewolf.online/release-notes.php. Pin WarewolfQueueWorkerZipUrl (a Warewolf-QueueProcessor-<ver>.zip) as a queue-time variable to unblock this build.' }
          $workerUrl = $m.Groups[1].Value
        }
        $parsed = $null
        if (-not [uri]::TryCreate($workerUrl, [UriKind]::Absolute, [ref]$parsed) -or $parsed.Scheme -ne 'https' -or $parsed.Host -ne $expectedHost) {
          throw "Refusing to fetch the QueueProcessor package from untrusted URL '$workerUrl' (expected https://$expectedHost/...)."
        }

        $zip = "$(Agent.BuildDirectory)\QueueProcessor.zip"
        $dir = "$(Agent.BuildDirectory)\QueueProcessorPublish"
        Invoke-WebRequest -Uri $workerUrl -OutFile $zip -UseBasicParsing -TimeoutSec 300 -MaximumRetryCount 3 -RetryIntervalSec 10
        if ((Get-Item $zip).Length -le 0) { throw "Downloaded QueueProcessor package is empty: $zip" }
        if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
        Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force

        # Flat today; tolerate a single wrapping folder the way the scripts-zip discovery does.
        $dll = Get-ChildItem -LiteralPath $dir -Recurse -Filter 'Warewolf.Execution.QueueProcessor.dll' | Select-Object -First 1
        if (-not $dll) { throw "Warewolf.Execution.QueueProcessor.dll not found under $dir - this is not a QueueProcessor publish package." }
        $publishRoot = $dll.DirectoryName
        Write-Host "##vso[task.setvariable variable=QueueWorkerPublishPath]$publishRoot"
        Write-Host "QueueProcessor package : $workerUrl"
        Write-Host "Publish root           : $publishRoot"

        $sourceId   = '0b142714-8f6d-41b7-9832-2aefa8c731ec'
        $generated  = "$(Agent.BuildDirectory)\ProfilerWorkflowResources\ProfilerServices\ProfilerWrapper\ProfilerRabbitMQSource.bite"
        if (-not (Test-Path -LiteralPath $generated)) { throw "The generated CloudAMQP source is missing at $generated - 'Generate RequestForProfiling CloudAMQP publish source' must run first." }
        $sourcesDir = "$(Agent.BuildDirectory)\ProfilerQueueSources"
        New-Item -ItemType Directory -Force -Path $sourcesDir | Out-Null
        Copy-Item -LiteralPath $generated -Destination (Join-Path $sourcesDir "$sourceId.bite") -Force
        Write-Host "##vso[task.setvariable variable=QueueWorkerSourcePath]$sourcesDir"
        Write-Host "Staged worker broker source $sourceId.bite into $sourcesDir"
      displayName: 'Download QueueProcessor Package + stage broker source'

  # Pulls the licensed subscription config from the Azure DevOps Library ('Warewolf
  # License.secureconfig' under Pipelines > Library > Secure files) - the same org-wide secure
  # file pipeline-LOADTEST.yml's own Deploy_UAT job already downloads, not a Profiler/Unlimited
  # secret.
  - task: DownloadSecureFile@1
    name: warewolfLicense
    displayName: 'Download Warewolf License.secureconfig'
    inputs:
      secureFile: 'Warewolf License.secureconfig'

  # Backed up BEFORE anything is touched, same rationale as the source file's own step:
  # WAREWOLF_ENTRA_CONFIG-style app settings on an existing engine app cannot be reconstructed
  # from this repo. continueOnError because a failed backup must be visible but must not block the
  # deploy - on the very first run of a brand-new app this step is expected to fail.
  - task: AzureCLI@2
    displayName: 'Back Up Engine App Settings'
    continueOnError: true
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        $dir = "$(Agent.BuildDirectory)\EngineSettingsBackup"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' -o json |
            Out-File -LiteralPath (Join-Path $dir 'appsettings-backup.json') -Encoding utf8
        az functionapp show --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' -o json |
            Out-File -LiteralPath (Join-Path $dir 'site-backup.json') -Encoding utf8
        Write-Host "Backed up app settings + site config to $dir"

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Engine Settings Backup'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      targetPath: '$(Agent.BuildDirectory)\EngineSettingsBackup'
      artifact: EngineSettingsBackup
      publishLocation: pipeline

  # The deploy itself - same parameter set as the source file's own 'Deploy via Deployment
  # Scripts' step, minus -SecureConfigPath (no Profiler secure.config exists in this repo; the
  # 'Bypass secure.config workflow authorization' step below opens the app up the same way
  # pipeline-LOADTEST.yml's own Deploy_UAT job does instead) and -EnablePerformanceCounters,
  # -EnableElasticsearch/-ElasticsearchSourcePath (no Elasticsearch endpoint provisioned for this
  # dry-run app; add back once one exists for wwprofilerlw specifically). -PublishPath and
  # scriptPath point at the DOWNLOADED release zip/orchestrator, so this pipeline proves the
  # released scripts, not in-flight edits on this commit (pin WarewolfScriptsZipUrl to a build you
  # published to prove those).
  #
  # -SkipEntraConfigDriftRepair (build 30815, 2026-09-24): Phase 2's WAREWOLF_ENTRA_CONFIG drift
  # auto-repair under -SkipAuthProvisioning runs `az ad app list --display-name <app>-auth`
  # (Microsoft Graph) every deploy, which the pipeline SP has no permission for ("Insufficient
  # privileges to complete the operation"), and that hard-failed Phase 2. The engine's Entra app
  # (registered by an admin with Configure-WwExecutionAuth.ps1, see the header) is left exactly as
  # it is; 'Resolve engine Entra app id' reads it back on QueueProcessor runs and fails with the
  # repair command if an app recreate dropped it.
  #
  # -EnablePersistence:$true (a [nullable[bool]], NOT a switch - it must be passed with the colon
  # syntax or it binds the next argument) plus the two staged paths above: see the staging step's
  # own comment for why a queue-triggered engine without persistence de-duplicates blind.
  #
  # THE FOUR THROUGHPUT FLAGS BELOW ARE ONE SETTING, and they are the same set pipeline-LOADTEST.yml
  # applies to WarewolfServer-UAT. -ServiceBusMaxConcurrentCalls 2 (host.json's
  # extensions.serviceBus.maxConcurrentCalls) and -ServiceBusTriggerMaxConcurrentExecutions 2 (the
  # trigger's own semaphore) cap what one instance will run at once; -DisableDynamicConcurrency is
  # MANDATORY alongside them, because the dynamic-concurrency manager overrides a static
  # maxConcurrentCalls and the caps become decorative; -FlexMaximumInstanceCount 16 caps the
  # instance count, so peak concurrency is a number you can actually compute (16 x 2). This is the
  # FLEX equivalent of the classic plan's -FunctionAppScaleLimit - Flex Consumption has no
  # siteConfig.functionAppScaleLimit, so Deploy-WwExecutionEngine.ps1 rejects that flag outright
  # when -HostingPlan Flex is set (fails at plan time, before anything is touched).
  #
  # These exist because the ceiling is the DATABASE, not the engine: the Profiler schema and
  # dbo.jobs1 share one Azure SQL database, and scaling left to grow freely simply converts that
  # into SQL command timeouts - which the trigger dead-letters on the FIRST delivery
  # (IsTransientFailure is set only for memory pressure), so an over-scaled run loses messages
  # rather than merely slowing down.
  #
  # -HostingPlan 'Flex' (2026-09-22, AD-2383): wwprofilerlw was deleted (it was a Windows classic
  # Consumption/Y1 app; Flex Consumption is Linux-only and 'functionapp create' fixes the SKU, so
  # an existing app is never converted - see Deploy-RunGuide.md's own -HostingPlan row) and is
  # recreated on THIS run as Flex Consumption, sku FlexConsumption - a different resource shape,
  # not a tier of the classic plan. -FlexInstanceMemoryMB 4096 pins a 4GB instance size at create
  # time; later runs against the now-existing app ignore it, since only 'functionapp create'
  # honours it. Recreating the app mints a NEW system-assigned managed identity, which drops every
  # RBAC grant the OLD identity held. The 'Key Vault Secrets User' grant is re-applied by the
  # deploy script itself on every run; the 'Azure Service Bus Data Receiver' grant only by the
  # ShovelBridge's 'Enable Service Bus Secure Trigger' step, so after a recreate a QueueProcessor
  # run leaves the idle ServiceBusTrigger unable to listen (log noise on that one function only -
  # the HTTP routes the worker uses are unaffected) until the next ShovelBridge run.
  #
  # 2026-09-25, build 30857 - 16, NOT 30, on Flex. Flex brings its whole instance cap up at once
  # (classic Y1 ramped over ~14 min), and until the single-flight fix in
  # LightweightRabbitMqConnectionCache.AcquireCore ships in a release, each cold instance can open
  # one result-publish connection PER CONCURRENT EXECUTION (2) before settling on one. 30 x 2 plus
  # the ~4 long-lived Container Apps connections already on the vhost broke CloudAMQP 'bmkzdabu''s
  # 40-connection limit on the first wave. Budget: (40 - 4) / 2 = 18, less headroom = 16. Raise it
  # back toward 30 only once the released engine carries the fix (then it is 1 per instance). Every
  # app publishing to that vhost draws on the SAME 40 - never run two of these rigs at once.
  #
  # ALL FOUR REVERT SILENTLY IF A LATER EDIT DROPS THEM from this argument list - the engine keeps
  # whatever the last deploy set. Re-verify after any deploy with
  # 'az functionapp scale config show ... --query maximumInstanceCount' (Flex) and the host.json in
  # the deployed package, rather than trusting this file.
  # ── Persistence (Hangfire) ─────────────────────────────────────────────────────────────
  # Both files are git-tracked here and are staged under the EXACT leaf names
  # Deploy-WwExecutionEngine.ps1 validates ('persistencesettings.json' /
  # 'persistencesettingsdbsource.bite'), exactly as pipeline-LOADTEST.yml's Deploy_UAT stage
  # stages them for WarewolfServer-UAT.
  #
  # WHY PERSISTENCE IS NOT OPTIONAL ON A QUEUE-TRIGGERED ENGINE. With it off,
  # ServiceBusReplayAndResultStore falls back to a process-local ConcurrentDictionary, so its
  # de-duplication is blind across instances - and a Dynamic-plan Function App scales to many
  # instances and recycles them under load. That is the documented cause of the 5,000-message
  # re-execution storm (7,648 executions for 5,000 messages) chased on 2026-09-15: every
  # redelivery after a host recycle looked brand new to the store.
  #
  # The Hangfire store is the shared 'wwexecution-uat-hangfire' database (WFAES-encrypted in the
  # .bite). Hangfire is designed for multiple servers against one storage and correlation ids are
  # GUIDs, so sharing it with wwuat3 is safe; give this app its own database only if the two rigs
  # ever need to be load-tested at the same time.
  - powershell: |
      $ErrorActionPreference = 'Stop'
      New-Item -ItemType Directory -Force -Path "$(Agent.BuildDirectory)\ProfilerPersistence" | Out-Null
      Copy-Item -LiteralPath "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\persistencesettings.uat.json" `
          -Destination "$(Agent.BuildDirectory)\ProfilerPersistence\persistencesettings.json" -Force
      Copy-Item -LiteralPath "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\persistencesettingsdbsource.uat.bite" `
          -Destination "$(Agent.BuildDirectory)\ProfilerPersistence\persistencesettingsdbsource.bite" -Force
      Get-ChildItem "$(Agent.BuildDirectory)\ProfilerPersistence" | ForEach-Object { Write-Host "Staged $($_.Name) ($($_.Length) bytes)" }
    displayName: 'Stage persistence settings (Enable: true)'

  - task: AzureCLI@2
    displayName: 'Deploy via Deployment Scripts'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: '$(DeployScriptPath)'
      arguments: >-
        -ResourceGroup '$(ProfilerEngineResourceGroup)'
        -Location '$(ProfilerEngineLocation)'
        -StorageAccount '$(ProfilerEngineStorageAccount)'
        -AppName '$(ProfilerEngineAppName)'
        -PublishPath '$(EngineZipPath)'
        -WorkflowsSourcePath '$(Agent.BuildDirectory)\ProfilerWorkflowResources'
        -LicenseConfigPath '$(warewolfLicense.secureFilePath)'
        -LicenseCheckEnabled:$true
        -KeyVaultName '$(ProfilerEngineKeyVaultName)'
        -KeyVaultSecretName '$(ProfilerEngineKeyVaultSecretName)'
        -EncryptResources:$true
        -SkipAuthProvisioning
        -SkipEntraConfigDriftRepair
        -ServiceBusTriggerQueueName '$(ProfilerServiceBusTriggerQueueName)'
        -ServiceBusTriggerWorkflowName '$(ProfilerServiceBusTriggerWorkflowName)'
        -EnablePersistence:$true
        -PersistenceSettingsPath '$(Agent.BuildDirectory)\ProfilerPersistence\persistencesettings.json'
        -PersistenceDbSourcePath '$(Agent.BuildDirectory)\ProfilerPersistence\persistencesettingsdbsource.bite'
        -ServiceBusMaxConcurrentCalls 2
        -DisableDynamicConcurrency
        -ServiceBusTriggerMaxConcurrentExecutions 2
        -HostingPlan 'Flex'
        -FlexInstanceMemoryMB 4096
        -FlexMaximumInstanceCount 16
        -NonInteractive

  # EASY AUTH STAYS OFF on the engine. Authentication of the worker is done INSIDE the engine
  # (WAREWOLF_ENTRA_CONFIG, validated by the /Secure/* middleware), not by the App Service auth
  # gateway. -SkipAuthProvisioning above stops the deploy from turning Easy Auth ON, but it never
  # turns it OFF - a hand-run Configure-WwExecutionAuth.ps1 (or a full, non-skipped deploy) leaves
  # it enabled, and the gateway then answers 302/401 in front of /public/* and the smoke test.
  # So it is enforced here on every run: read authsettingsV2 and, only if platform.enabled is true,
  # PUT the same document back with enabled=false (identity provider config is kept, so turning
  # it back on is a one-flag change). Plain ARM via 'az rest' - the 'az webapp auth' commands need
  # the authV2 CLI extension, which the hosted agent does not carry. The body goes through a file
  # for the same az.cmd-quoting reason as the bypass step below (WOLF-8512 / build 30636).
  - task: AzureCLI@2
    displayName: 'Ensure Easy Auth is disabled on the engine'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script

        $subId = az account show --query id -o tsv
        if ($LASTEXITCODE -ne 0 -or -not $subId) { throw "Could not read the current subscription id (exit $LASTEXITCODE)." }
        $uri = "https://management.azure.com/subscriptions/$subId/resourceGroups/$(ProfilerEngineResourceGroup)/providers/Microsoft.Web/sites/$(ProfilerEngineAppName)/config/authsettingsV2?api-version=2023-12-01"

        $auth = az rest --method get --uri $uri | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0 -or -not $auth) { throw "Failed to read Easy Auth (authsettingsV2) on '$(ProfilerEngineAppName)' (exit $LASTEXITCODE)." }

        if ($auth.properties.platform.enabled -ne $true) {
          Write-Host "Easy Auth is already disabled on $(ProfilerEngineAppName)."
          return
        }

        Write-Host "Easy Auth is ENABLED on $(ProfilerEngineAppName) - disabling it."
        $auth.properties.platform.enabled = $false
        $body = Join-Path $env:AGENT_TEMPDIRECTORY 'ww-authsettingsv2.json'
        @{ properties = $auth.properties } | ConvertTo-Json -Depth 32 | Set-Content -LiteralPath $body -Encoding utf8
        az rest --method put --uri $uri --body "@$body" --headers 'Content-Type=application/json' -o none
        $putExit = $LASTEXITCODE
        Remove-Item -LiteralPath $body -Force -ErrorAction SilentlyContinue
        if ($putExit -ne 0) { throw "Failed to disable Easy Auth on '$(ProfilerEngineAppName)' (exit $putExit)." }

        # Verify after write, as the bypass step below does - a PUT that 'succeeded' but did not land
        # would otherwise surface only as a confusing 401 in the smoke test.
        $after = az rest --method get --uri $uri | ConvertFrom-Json
        if ($after.properties.platform.enabled -eq $true) { throw "Easy Auth is still enabled on '$(ProfilerEngineAppName)' after the update." }
        Write-Host "Verified: Easy Auth is disabled on $(ProfilerEngineAppName)."

  # Same bypass pipeline-LOADTEST.yml's own Deploy_UAT job applies to WarewolfServer-UAT, and for
  # the identical reason: this repo has no source-controlled secure.config for
  # ProfilerWrapper/RequestForProfiling's ResourceID, so bypassing WorkflowAuthPolicyLoader here
  # (rather than trying to reconstruct one) keeps this dry run self-contained. See that job's own
  # step comment for the full az.cmd-quoting root cause this verify-after-write guards against
  # (WOLF-8512 / build 30636).
  #
  # MUST be AzureCLI@2, not a bare 'powershell:' step (build 30741). That task sets
  # AZURE_CONFIG_DIR to a per-task temp dir (D:\a\_temp\.azclitask-*) holding the service
  # connection's login, so an `az` call from any OTHER step has no account at all and dies with
  # 'ERROR: Please run az login to setup account.' This step had never actually executed - every
  # earlier run failed in the deploy step above and skipped it - so the missing login only
  # surfaced on the first build to get this far.
  - task: AzureCLI@2
    displayName: 'Bypass secure.config workflow authorization'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script

        $settingsFile = Join-Path $env:AGENT_TEMPDIRECTORY 'ww-security-flags.json'
        $payload = '[{"name":"WAREWOLF_SECURITY_FLAGS","value":"{\"bypassSecureConfig\":true}"}]'
        Set-Content -LiteralPath $settingsFile -Value $payload -Encoding utf8

        az functionapp config appsettings set --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --settings "@$settingsFile" | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "az failed to set WAREWOLF_SECURITY_FLAGS (exit $LASTEXITCODE)." }

        $stored = az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --query "[?name=='WAREWOLF_SECURITY_FLAGS'].value | [0]" -o tsv
        if ($LASTEXITCODE -ne 0) { throw "az failed to read back WAREWOLF_SECURITY_FLAGS (exit $LASTEXITCODE)." }

        try {
          $parsed = $stored | ConvertFrom-Json
        } catch {
          throw "WAREWOLF_SECURITY_FLAGS was stored as INVALID JSON: '$stored'."
        }
        if ($parsed.bypassSecureConfig -ne $true) {
          throw "WAREWOLF_SECURITY_FLAGS parsed as valid JSON but bypassSecureConfig is not true (stored: '$stored')."
        }

        Remove-Item -LiteralPath $settingsFile -Force -ErrorAction SilentlyContinue
        Write-Host "Verified WAREWOLF_SECURITY_FLAGS on $(ProfilerEngineAppName) is valid JSON with bypassSecureConfig=true: $stored"

  # Applied AFTER the deploy and BEFORE the stop/start below, so the cold start that follows is the
  # first one that sees it. AzureCLI@2 rather than a bare 'powershell:' step: the CLI task scopes its
  # own AZURE_CONFIG_DIR to the service connection, which is the only shape guaranteed to be logged
  # in. Verified by read-back for the same reason the bypass step above is (WOLF-8512 / build 30636):
  # 'az ... appsettings set' exits 0 whether or not the value landed as intended.
  - task: AzureCLI@2
    displayName: 'Apply WAREWOLF_SQL_TRUST_SERVER_CERT'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        $expected = '$(ProfilerEngineSqlTrustServerCert)'

        az functionapp config appsettings set --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --settings "WAREWOLF_SQL_TRUST_SERVER_CERT=$expected" -o none
        if ($LASTEXITCODE -ne 0) { throw "az failed to set WAREWOLF_SQL_TRUST_SERVER_CERT (exit $LASTEXITCODE)." }

        $stored = az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --query "[?name=='WAREWOLF_SQL_TRUST_SERVER_CERT'].value | [0]" -o tsv
        if ($LASTEXITCODE -ne 0) { throw "az failed to read back WAREWOLF_SQL_TRUST_SERVER_CERT (exit $LASTEXITCODE)." }
        if ($stored -ne $expected) {
          throw "WAREWOLF_SQL_TRUST_SERVER_CERT stored as '$stored', expected '$expected'."
        }
        Write-Host "Verified WAREWOLF_SQL_TRUST_SERVER_CERT on $(ProfilerEngineAppName) is '$stored'."

  # WEBSITE_RUN_FROM_PACKAGE=1 means a zip deploy uploads a new package but the running worker
  # keeps serving the old one until recycled - see the source file's own comment on this step for
  # why 'az functionapp restart' is not sufficient (a warm Consumption-plan worker can keep
  # previously-decrypted WFAES sources in memory). A full stop-then-start forces every instance to
  # cold start and re-decrypt.
  - task: AzureCLI@2
    displayName: 'Stop/Start Engine App (apply package + resources)'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        az functionapp stop --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)'
        if ($LASTEXITCODE -ne 0) { throw "az functionapp stop failed (exit $LASTEXITCODE)." }
        az functionapp start --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)'
        if ($LASTEXITCODE -ne 0) { throw "az functionapp start failed (exit $LASTEXITCODE)." }
        Write-Host "Stopped and started $(ProfilerEngineAppName) (full cold start)."

  # Same retry-with-backoff pattern as the source file: a Consumption-plan cold start after the
  # restart above routinely outlasts a single fixed timeout. Windows PowerShell (not pwsh) to keep
  # the $_.Exception.Response 5.1 error shape the catch block below expects.
  - powershell: |
      $ErrorActionPreference = 'Continue'
      $uri         = 'https://$(ProfilerEngineAppName).azurewebsites.net/apis.json'
      $maxAttempts = 5
      $baseDelay   = 15
      Write-Host "Waiting 30 seconds for the Function App to start..."
      Start-Sleep -Seconds 30

      for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
        try {
          $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 60
          Write-Host "STATUS: $($r.StatusCode)"
          Write-Host "apis.json length: $($r.Content.Length)"
          break
        } catch {
          $resp = $_.Exception.Response
          if ($resp) {
            Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $([int]$resp.StatusCode) $($resp.StatusDescription)"
          } else {
            Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)"
          }
          if ($attempt -ge $maxAttempts) {
            Write-Host "##[error]Engine discovery route did not respond after $maxAttempts attempts."
            throw
          }
          $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
          Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
          Start-Sleep -Seconds $delaySeconds
        }
      }
    displayName: 'Smoke Test: Engine Discovery Route'

  # -- Sink depth BEFORE the run --------------------------------------------------------
  # The first half of the delta assertion. Captured before the workflow is executed so the
  # verification step below can prove THIS run added a message, on a queue whose absolute depth
  # is meaningless (it is a load-test sink with no consumer attached - 19,100 messages when this
  # check was written).
  #
  # Sourced from the CHECKOUT, not from the downloaded deployment-scripts zip: this is
  # pipeline-side verification, not part of the deploy contract the release package defines, so
  # it must reflect the commit under test rather than the last published release (see this file's
  # header on what the downloaded scripts do and do not prove).
  #
  # - pwsh:, NOT - powershell: - see the verification step below for the TLS renegotiation this
  # cannot survive under 5.1.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
      # Depth AND the cumulative publish counter: the sink is capped (max-length 20000 by
      # CloudAMQP policy), and once full its depth never moves - builds 30775/30778/30797 all read
      # "depth 20000 before the run, 20000 now" over a healthy engine. The counter still counts.
      $baseline = & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
                   -ReportBaselineOnly `
                   -ManagementUri '$(ProfilerSinkRabbitMqManagementUri)' `
                   -QueueName     '$(ProfilerSinkQueueName)' `
                   -VHost         '$(ProfilerSinkRabbitMqVirtualHost)' `
                   -Username      '$(ProfilerSinkRabbitMqUsername)' `
                   -Password      $pw
      Write-Host "##vso[task.setvariable variable=SinkDepthBefore]$($baseline.Depth)"
      Write-Host "##vso[task.setvariable variable=SinkPublishedBefore]$($baseline.Published)"
    displayName: 'Smoke Test: Capture Sink Depth (before run)'
    env:
      SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

  # Executes ProfilerWrapper/RequestForProfiling - the SAME workflow pipeline-LOADTEST.yml's own
  # Load_Test job drives (the 16 input fields below are that job's VerifyWorkflowInputsJson
  # verbatim, with MandateId run-scoped) - and then proves the run reached the SINK.
  #
  # THE SINK IS THE QUEUE, NOT A DATABASE. RequestForProfiling's trailing 'RabbitMQ Publish'
  # activity publishes [[ProfilerInstruction]] to '$(ProfilerSinkQueueName)' via RabbitMQSource
  # 0b142714-8f6d-41b7-9832-2aefa8c731ec. The 'Verify Sink Queue' step below asserts that THIS
  # run added a message there, by comparing the queue's depth against the value the capture step
  # above recorded. Where the queue is shallow enough for a payload peek to be meaningful it also
  # looks for this run's own MandateId, which upgrades the result to run-attributable. Nothing is
  # consumed either way: the peek uses ackmode 'reject_requeue_true', which is the only mode that
  # actually puts messages back on this broker - 'ack_requeue_true', which this step used to send,
  # CONSUMES on LavinMQ (measured: depth 3 -> 0 on one peek). See Test-WwSinkDelivery.ps1's
  # Get-QueueHeadMessages for the measurement and what it means for the builds that ran before it.
  #
  # Why the sink, and not the HTTP status, is the assertion: the publish is the LAST thing the
  # workflow does, so a status code cannot distinguish "published" from "everything up to the
  # publish worked". A non-2xx is still reported as a warning here, and a sink depth that never
  # rises is what fails the verification step below.
  #
  # NOTE THIS STEP WRITES. Unlike the read-only usp_GetSpecialHolidays DAL probe it replaces,
  # each run publishes one real message and (via the nested ProfilerMain call) leaves database
  # rows behind. MandateId is a fresh GUID per run, so runs never collide and every artefact a
  # run leaves is attributable to it.
  #
  # Windows PowerShell (- powershell:, not - pwsh:) deliberately, exactly as the discovery test
  # above: the catch block reads $_.Exception.Response as an HttpWebResponse (.StatusDescription,
  # .GetResponseStream()), which is the 5.1 error shape. pwsh surfaces an HttpResponseMessage
  # instead, which has no GetResponseStream(), and the handler would fail while reporting the
  # real failure.
  #
  # The sink's depth is captured BEFORE this step runs (see the step immediately above) because
  # the assertion after it is a depth DELTA - see that step's own comment for why a payload peek
  # alone cannot work here.
  #
  # That shell choice is why sink verification is a SEPARATE - pwsh: step rather than the tail of
  # this one: it cannot run under 5.1 at all (see that step's own comment for why).
  - powershell: |
      $ErrorActionPreference = 'Continue'
      $mandateId   = [guid]::NewGuid().ToString()
      $maxAttempts = 4
      $baseDelay   = 15

      # The 16 fields RequestForProfiling's own DataList declares, taken verbatim from
      # pipeline-LOADTEST.yml's VerifyWorkflowInputsJson, with MandateId run-scoped.
      $inputs = [ordered]@{
        ForPaymentCycle       = '202402'
        MandateCanTrack       = 'false'
        MandateDRI            = '22'
        MandateId             = $mandateId
        RelatedMandates       = '5B9800B6-2183-EB11-A812-000D3ABE1AD1'
        ResultDate            = '2024-01-27'
        ResultDebitRunId      = '22'
        ResultMethod          = 'DebiCheck'
        ResultPaymentCycle    = '202401'
        ResultPresentedOnDate = '2024-01-22'
        ResultType            = 'Success'
        ScoreThisResult       = 'true'
        IsFixedExtract        = 'false'
        SourcePaymentId       = '1234'
        RequestType           = ''
        FASGroup              = ''
      }
      $qs  = ($inputs.GetEnumerator() | ForEach-Object { "$($_.Key)=$([uri]::EscapeDataString([string]$_.Value))" }) -join '&'
      $uri = 'https://$(ProfilerEngineAppName).azurewebsites.net/public/$(ProfilerSmokeWorkflowRoute).json?' + $qs

      Write-Host "Run-scoped MandateId: $mandateId"

      # Published BEFORE the call below, not after: the verification step must be able to name
      # this run's MandateId even if everything from here on fails.
      Write-Host "##vso[task.setvariable variable=SmokeMandateId]$mandateId"

      for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
        try {
          $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 180
          Write-Host "STATUS: $($r.StatusCode)"
          Write-Host "RequestForProfiling response: $($r.Content)"
          break
        } catch {
          $resp = $_.Exception.Response
          if ($resp) {
            $code = [int]$resp.StatusCode
            $body = '(empty)'
            try { $sr = New-Object IO.StreamReader($resp.GetResponseStream()); $body = $sr.ReadToEnd() } catch { }
            Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $code $($resp.StatusDescription)"
            Write-Host "BODY: $body"
            # A hasErrors envelope means the ENGINE ran and answered - retrying cannot change the
            # outcome, so stop and let the sink check below decide. Anything else (a platform
            # 5xx, a gateway timeout) is still a candidate cold start and is retried.
            if ($body -match '"hasErrors"') {
              Write-Host "Engine returned its own error envelope - not a cold start; proceeding to sink verification."
              break
            }
          } else {
            Write-Host "##[warning]Attempt $attempt/$maxAttempts failed with no response: $($_.Exception.Message)"
          }
          if ($attempt -ge $maxAttempts) {
            Write-Host "##[warning]RequestForProfiling did not return a usable response after $maxAttempts attempts - the sink check below is now the only signal."
            break
          }
          $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
          Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
          Start-Sleep -Seconds $delaySeconds
        }
      }

    displayName: 'Smoke Test: Execute Profiler Workflow'
    continueOnError: true

  # -- Sink verification: the queue RequestForProfiling publishes to ----------------------
  # Asserts that THIS run added a message to the sink, by comparing the queue's depth against the
  # value captured before the run. Delegated to Scripts/Test-WwSinkDelivery.ps1, which carries the
  # full rationale and the trade-offs, and has its own Pester suite
  # (Scripts/Tests/Test-WwSinkDelivery.Tests.ps1).
  #
  # WHY NOT A PAYLOAD PEEK, which is what this step used to do: the management API's
  # POST .../get serves from the HEAD of the queue, and a message published moments ago is at the
  # TAIL. Build 30750 peeked 50 messages 18 times against a queue holding 19,100, could only ever
  # see the oldest ~900, and failed a deploy whose publish had in fact succeeded. Purging that
  # queue and re-running the identical assertion made it pass on the first poll. The sink has no
  # consumer attached, so a deep backlog is its NORMAL state, not an anomaly to be cleaned up once.
  #
  # The peek is still made, as an opportunistic upgrade, whenever the queue is shallow enough for
  # it to mean anything (-PeekThreshold); a hit then makes the result run-attributable. The cost
  # of a delta when it is not: a concurrent publisher could satisfy it while this run's own publish
  # failed. Nothing else publishes here today - the load test uses its own '-loadtest' queues.
  #
  # - pwsh:, NOT - powershell:, and not by preference - Windows PowerShell CANNOT make this call.
  # CloudAMQP's nginx front end asks for a TLS renegotiation mid-request (visible on the wire as
  # 'remote party requests renegotiation', after the request has been sent). .NET Framework's
  # HttpWebRequest - which is what Invoke-RestMethod is under 5.1 - refuses server-initiated
  # renegotiation and reports it as the generic 'The request was aborted: Could not create
  # SSL/TLS secure channel' (build 30747). .NET 8, which pwsh runs on, handles it and returns the
  # response normally. It is NOT a protocol-version problem: forcing SecurityProtocol to Tls12
  # changes nothing, and the engine call in the step above reaches HTTPS from 5.1 quite happily.
  #
  # succeededOrFailed() because the step above is continueOnError and may only have warned - the
  # sink is then the ONLY signal, so it must still run.
  - pwsh: |
      $ErrorActionPreference = 'Stop'

      # Set by 'Smoke Test: Execute Profiler Workflow' before it made any call. A literal '$(...)'
      # back means that step died before it could publish the variable, so there is nothing to
      # attribute a delivery to - the delta is still asserted, it just cannot be attributed.
      $mandateId = '$(SmokeMandateId)'
      if ([string]::IsNullOrWhiteSpace($mandateId) -or $mandateId -match '^\$\(') {
        Write-Host "##[warning]No MandateId was published by 'Smoke Test: Execute Profiler Workflow' - verifying the depth delta only."
        $mandateId = ''
      }

      # Same sentinel handling for the pre-run depth: a literal '$(...)' back means the capture
      # step never ran. Passed on as -1, which the script REJECTS rather than reading as an empty
      # queue - a broken capture step must not be able to produce a silent pass.
      $depthBefore = '$(SinkDepthBefore)'
      if ([string]::IsNullOrWhiteSpace($depthBefore) -or $depthBefore -match '^\$\(') { $depthBefore = '-1' }
      # -1 here only drops the publish-counter signal; the depth delta is still asserted.
      $publishedBefore = '$(SinkPublishedBefore)'
      if ([string]::IsNullOrWhiteSpace($publishedBefore) -or $publishedBefore -match '^\$\(') { $publishedBefore = '-1' }

      $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
      try {
        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
              -ManagementUri    '$(ProfilerSinkRabbitMqManagementUri)' `
              -QueueName        '$(ProfilerSinkQueueName)' `
              -VHost            '$(ProfilerSinkRabbitMqVirtualHost)' `
              -Username         '$(ProfilerSinkRabbitMqUsername)' `
              -Password         $pw `
              -DepthBefore      ([int]$depthBefore) `
              -PublishedBefore  ([long]$publishedBefore) `
              -CorrelationToken $mandateId
      } catch {
        Write-Host "##[error]$($_.Exception.Message)"
        Write-Host "##vso[task.setvariable variable=WorkflowSmokeTestFailed]true"
        throw
      }
    displayName: 'Smoke Test: Verify Sink Queue'
    condition: succeededOrFailed()
    continueOnError: true
    env:
      # The CloudAMQP instance ('bmkzdabu') password - the SAME secret the generation step above
      # uses to build the publish source, so the smoke test always reads the broker the workflow
      # was just pointed at. Deliberately NOT ExternalRabbitMqPassword, which belongs to the
      # self-hosted rabbitmq.warewolf.online broker that only the ShovelBridge source uses.
      SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

  - ${{ if eq(parameters.queueArchitecture, 'ShovelBridge') }}:
    # ── ShovelBridge: RabbitMQ -> Azure Service Bus -> engine's own ServiceBusTrigger ───────
    # Same provisioning shape as the Unlimited's own steps (namespace/queue/error queue/Send-only SAS
    # rule/Shovel), retargeted at this file's DEV2 variables.
    #
    # Unlike pipeline-CLOUD.yml / pipeline-LOADTEST.yml, which still treat it as a manual operator
    # step against THEIR apps, this pipeline RUNS
    # Enable-ServiceBusSecureTrigger.ps1 itself - see the "Enable Service Bus Secure Trigger" step
    # below. Build 30756 is why: every leg of the bridge passed, the shovel moved the message to
    # Service Bus in under a second, and then the delivery smoke test polled for 301s watching
    # activeMessageCount sit at 1, because wwprofilerlw had NEITHER the
    # ServiceBusConnection__fullyQualifiedNamespace app setting NOR the 'Azure Service Bus Data
    # Receiver' grant on its managed identity. Nothing in this file had ever created them, and
    # nothing in the failure pointed at the shovel - which is exactly the trap automating it closes.
    - task: AzureCLI@2
      displayName: 'Ensure Service Bus Namespace Exists'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          $ns = '$(ProfilerServiceBusNamespace)'
          $rg = '$(ProfilerEngineResourceGroup)'

          $exists = az servicebus namespace show --name $ns --resource-group $rg -o json 2>$null
          if ($LASTEXITCODE -eq 0 -and $exists) {
            Write-Host "Service Bus namespace '$ns' already exists in resource group '$rg'."
          } else {
            Write-Host "Creating Service Bus namespace '$ns' in '$rg' ($(ProfilerEngineLocation), Standard SKU - Standard is required for queue-scoped authorization rules)..."
            az servicebus namespace create --name $ns --resource-group $rg --location '$(ProfilerEngineLocation)' --sku Standard | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to create Service Bus namespace '$ns' (exit $LASTEXITCODE)." }
            Write-Host "Created Service Bus namespace '$ns'."
          }

    - task: AzureCLI@2
      displayName: 'Ensure Service Bus namespace allows local (SAS) auth for the Shovel'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          $ns = '$(ProfilerServiceBusNamespace)'
          $rg = '$(ProfilerEngineResourceGroup)'

          $disableLocalAuth = az servicebus namespace show --name $ns --resource-group $rg --query disableLocalAuth -o tsv
          if ($LASTEXITCODE -ne 0) { throw "Failed to read 'disableLocalAuth' for Service Bus namespace '$ns' (exit $LASTEXITCODE)." }

          if ($disableLocalAuth -eq 'true') {
            Write-Host "##[warning]Service Bus namespace '$ns' has local (SAS) authentication disabled - restoring disableLocalAuth=false ..."
            az servicebus namespace update --name $ns --resource-group $rg --disable-local-auth false | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to restore 'disableLocalAuth=false' on Service Bus namespace '$ns' (exit $LASTEXITCODE)." }
            Write-Host "Restored: local (SAS) authentication is now enabled on '$ns'."
          } else {
            Write-Host "Service Bus namespace '$ns' already has local (SAS) authentication enabled (disableLocalAuth=$disableLocalAuth) - no action needed."
          }

    - task: AzureCLI@2
      displayName: 'Ensure ShovelBridge trigger queue, error queue + Send-only SAS rule exist'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          $ns       = '$(ProfilerServiceBusNamespace)'
          $rg       = '$(ProfilerEngineResourceGroup)'
          $queue    = '$(ProfilerServiceBusTriggerQueueName)'
          $sendRule = '$(ProfilerShovelSendRuleName)'

          function Test-AzExists([string[]] $CliArgs) {
            $ErrorActionPreference = 'Continue'
            $null = & az @CliArgs -o json 2>&1
            return $LASTEXITCODE -eq 0
          }

          $lockDuration = '$(ProfilerServiceBusTriggerQueueLockDuration)'
          $errorQueue   = '$(ProfilerServiceBusErrorQueueName)'

          # The ERROR QUEUE first: a forward target must exist before a queue can name it. Nothing
          # consumes it - failed deliveries sit there, with their DeadLetterReason, until read.
          if (-not (Test-AzExists @('servicebus', 'queue', 'show', '--name', $errorQueue, '--namespace-name', $ns, '--resource-group', $rg))) {
            Write-Host "Creating error queue '$errorQueue' on '$ns'..."
            az servicebus queue create --name $errorQueue --namespace-name $ns --resource-group $rg | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to create error queue '$errorQueue' (exit $LASTEXITCODE)." }
          } else {
            Write-Host "Error queue '$errorQueue' already exists."
          }

          if (-not (Test-AzExists @('servicebus', 'queue', 'show', '--name', $queue,'--namespace-name', $ns, '--resource-group', $rg))) {
            Write-Host "Creating queue '$queue' on '$ns' (lockDuration $lockDuration)..."
            az servicebus queue create --name $queue --namespace-name $ns --resource-group $rg --lock-duration $lockDuration | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to create queue '$queue' (exit $LASTEXITCODE)." }
          } else {
            Write-Host "Queue '$queue' already exists."
          }

          # APPLIED EVERY RUN, NOT ONLY AT CREATE TIME. This queue was created before the setting
          # existed here and kept az's PT1M default; a create-time-only fix would leave every
          # already-provisioned environment (including this one) on the wrong value silently.
          #
          # Compared as a TimeSpan, never as text: 'PT5M' and 'PT5M0S' are the same lock, and az has
          # returned this field in both the ISO-8601 and the hh:mm:ss spellings over time - a string
          # compare would rewrite the queue on every single run.
          function ConvertTo-Duration([string] $Value) {
            try { return [Xml.XmlConvert]::ToTimeSpan($Value) } catch { return [TimeSpan]::Parse($Value) }
          }

          $current = az servicebus queue show --name $queue --namespace-name $ns --resource-group $rg --query lockDuration -o tsv
          if ($LASTEXITCODE -ne 0) { throw "Failed to read lockDuration for '$queue' (exit $LASTEXITCODE)." }
          if ((ConvertTo-Duration $current) -ne (ConvertTo-Duration $lockDuration)) {
            Write-Host "lockDuration on '$queue' is $current; setting it to $lockDuration..."
            az servicebus queue update --name $queue --namespace-name $ns --resource-group $rg --lock-duration $lockDuration | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to set lockDuration on '$queue' (exit $LASTEXITCODE)." }

            $stored = az servicebus queue show --name $queue --namespace-name $ns --resource-group $rg --query lockDuration -o tsv
            if ($LASTEXITCODE -ne 0) { throw "Failed to read back lockDuration for '$queue' (exit $LASTEXITCODE)." }
            if ((ConvertTo-Duration $stored) -ne (ConvertTo-Duration $lockDuration)) {
              throw "lockDuration on '$queue' is '$stored' after the update, expected '$lockDuration'."
            }
            Write-Host "lockDuration on '$queue' is now $stored."
          } else {
            Write-Host "lockDuration on '$queue' is already $current."
          }

          # The trigger queue forwards its dead-letters to the error queue, so this environment's
          # failures land in one named place - the Service Bus counterpart of the QueueProcessor's
          # RabbitMQ dead-letter queue of the same name. Read back: a forward that did not land
          # leaves failures on the trigger queue's own $DeadLetterQueue subqueue, where the burst
          # check still counts them but nobody looks.
          $forward = az servicebus queue show --name $queue --namespace-name $ns --resource-group $rg --query forwardDeadLetteredMessagesTo -o tsv
          if ($LASTEXITCODE -ne 0) { throw "Failed to read forwardDeadLetteredMessagesTo for '$queue' (exit $LASTEXITCODE)." }
          if ($forward -ne $errorQueue) {
            Write-Host "Forwarding '$queue' dead-letters to '$errorQueue' (was '$forward')..."
            az servicebus queue update --name $queue --namespace-name $ns --resource-group $rg --forward-dead-lettered-messages-to $errorQueue | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to set dead-letter forwarding on '$queue' (exit $LASTEXITCODE)." }
            $forward = az servicebus queue show --name $queue --namespace-name $ns --resource-group $rg --query forwardDeadLetteredMessagesTo -o tsv
            if ($forward -ne $errorQueue) { throw "'$queue' forwards its dead-letters to '$forward' after the update, expected '$errorQueue'." }
          }
          Write-Host "'$queue' forwards its dead-letters to '$errorQueue'."

          if (-not (Test-AzExists @('servicebus', 'queue', 'authorization-rule', 'show', '--name', $sendRule, '--namespace-name', $ns, '--resource-group', $rg, '--queue-name', $queue))) {
            Write-Host "Creating Send-only SAS rule '$sendRule'..."
            az servicebus queue authorization-rule create --name $sendRule --namespace-name $ns --resource-group $rg --queue-name $queue --rights Send | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to create Send-only SAS rule '$sendRule' (exit $LASTEXITCODE)." }
          } else {
            Write-Host "Send rule '$sendRule' already exists."
          }

    # WHY THIS STAGING STEP EXISTS AT ALL. Enable-ServiceBusSecureTrigger.ps1's
    # Get-EstimatedClaimStaleAfter reads host.json at "$PSScriptRoot\..\host.json" to compute the
    # WOLF-8512 delivery-budget invariant (MaxDeliveryCount x LockDuration MUST exceed
    # functionTimeout + 1min, or a redelivery can never take over a stale claim before the queue
    # dead-letters the message). The PUBLISHED deployment-scripts zip does not ship host.json - it
    # holds 34 .ps1 files and 11 data files, none of them host.json - and it extracts FLAT, so
    # "$PSScriptRoot\.." is $(Agent.BuildDirectory) and the script throws in Phase 0 before doing
    # anything at all. Copying the script one level under a staged host.json is what makes it
    # runnable from the release package.
    #
    # The host.json is taken from the ENGINE PACKAGE being deployed, not from this checkout: it is
    # the functionTimeout the deployed app will actually run with, so the invariant is checked
    # against reality rather than against whatever this branch happens to say. Both read 00:10:00
    # today (=> ClaimStaleAfter ~11min, vs a 10 x PT5M = 50min budget), but the package is the one
    # that governs at runtime.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $stage      = "$(Agent.BuildDirectory)\SecureTrigger"
        $scriptsDir = Join-Path $stage 'Scripts'
        if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
        New-Item -ItemType Directory -Force -Path $scriptsDir | Out-Null

        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead('$(EngineZipPath)')
        try {
          # Root-level host.json is the real one; the fallback tolerates a future wrapped layout
          # the same way the scripts-zip discovery above does, rather than assuming either shape.
          $entry = $zip.Entries | Where-Object { $_.FullName -eq 'host.json' } | Select-Object -First 1
          if (-not $entry) { $entry = $zip.Entries | Where-Object { $_.Name -eq 'host.json' } | Select-Object -First 1 }
          if (-not $entry) { throw "host.json not found in the engine package '$(EngineZipPath)' - Enable-ServiceBusSecureTrigger.ps1 cannot verify the WOLF-8512 delivery-budget invariant without it." }
          [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $stage 'host.json'), $true)
          Write-Host "Staged host.json from the engine package (zip entry '$($entry.FullName)')."
        } finally {
          $zip.Dispose()
        }

        $functionTimeout = (Get-Content -LiteralPath (Join-Path $stage 'host.json') -Raw | ConvertFrom-Json).functionTimeout
        if ([string]::IsNullOrWhiteSpace($functionTimeout)) { throw "The engine package's host.json has no functionTimeout - Enable-ServiceBusSecureTrigger.ps1 would throw on it." }
        Write-Host "Engine package functionTimeout: $functionTimeout"

        Copy-Item -LiteralPath '$(SecureTriggerScriptPath)' -Destination $scriptsDir -Force
        $staged = Join-Path $scriptsDir 'Enable-ServiceBusSecureTrigger.ps1'
        if (-not (Test-Path -LiteralPath $staged)) { throw "Failed to stage Enable-ServiceBusSecureTrigger.ps1 to '$staged'." }
        Write-Host "##vso[task.setvariable variable=StagedSecureTriggerScriptPath]$staged"
        Write-Host "Staged secure-trigger enabler: $staged"
      displayName: 'Stage secure-trigger enabler + engine host.json'

    # Creates/converges the trigger queue, grants the engine's system-assigned managed identity
    # 'Azure Service Bus Data Receiver' on the namespace, and sets the one app setting the
    # [ServiceBusTrigger] binding needs (ServiceBusConnection__fullyQualifiedNamespace). Without
    # BOTH of the latter two the trigger never fires and every bridged message sits on the queue
    # untouched - build 30756's exact failure.
    #
    # THE RBAC GRANT NEEDS A PRIVILEGE THE DEPLOY'S OWN RIGHTS DO NOT INCLUDE. Contributor (what
    # '$(AzureServiceConnection)' held on DEV2, and all it held) explicitly excludes
    # Microsoft.Authorization/roleAssignments/write, so this step would die with AuthorizationFailed.
    # The service principal was therefore granted 'Role Based Access Control Administrator' on the
    # DEV2 resource group, CONDITION-CONSTRAINED (ABAC v2.0) to assignments of the
    # 'Azure Service Bus Data Receiver' role definition (4f6d3b9b-027b-4f4c-9142-0e5a2a2247e0) and
    # nothing else - it cannot hand itself or anything else any other role. If this step ever starts
    # failing on the grant, check THAT assignment still exists before touching this file.
    #
    # -TriggerQueueName and -LockDuration are driven off the SAME variables the queue-provisioning
    # step and the shovel destination use, deliberately: the script's own output warns that a
    # mismatch means "the trigger listens on a queue this run's RBAC grant doesn't cover", which
    # fails exactly as silently as the bug this step exists to prevent. -MaxDeliveryCount is left at
    # the script's default of 10 (what the queue already carries).
    - task: AzureCLI@2
      displayName: 'Enable Service Bus Secure Trigger (queue + MI RBAC + listen connection)'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          & '$(StagedSecureTriggerScriptPath)' `
              -FunctionAppName '$(ProfilerEngineAppName)' `
              -ResourceGroup '$(ProfilerEngineResourceGroup)' `
              -ServiceBusNamespace '$(ProfilerServiceBusNamespace)' `
              -TriggerQueueName '$(ProfilerServiceBusTriggerQueueName)' `
              -LockDuration '$(ProfilerServiceBusTriggerQueueLockDuration)' `
              -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Enable-ServiceBusSecureTrigger.ps1 failed (exit $LASTEXITCODE)." }

          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script

          # Verify-after-write, in the same spirit as the 'Bypass secure.config workflow
          # authorization' step above: the script reports its own success, but these two values ARE
          # the fix, and a silent no-op here costs a 301s smoke-test timeout to discover.
          $fqns = az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' `
              --query "[?name=='ServiceBusConnection__fullyQualifiedNamespace'].value | [0]" -o tsv
          if ($LASTEXITCODE -ne 0) { throw "Failed to read back the app settings of '$(ProfilerEngineAppName)' (exit $LASTEXITCODE)." }
          $expected = '$(ProfilerServiceBusNamespace).servicebus.windows.net'
          if ($fqns -ne $expected) { throw "ServiceBusConnection__fullyQualifiedNamespace is '$fqns' on '$(ProfilerEngineAppName)', expected '$expected'." }
          Write-Host "Verified ServiceBusConnection__fullyQualifiedNamespace = $fqns"

          $principalId = az functionapp identity show --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --query principalId -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($principalId)) { throw "Could not read the system-assigned managed identity of '$(ProfilerEngineAppName)'." }
          $scope = az servicebus namespace show --name '$(ProfilerServiceBusNamespace)' --resource-group '$(ProfilerEngineResourceGroup)' --query id -o tsv
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the resource id of Service Bus namespace '$(ProfilerServiceBusNamespace)'." }
          $roles = az role assignment list --assignee $principalId --scope $scope --query "[].roleDefinitionName" -o tsv
          if ($LASTEXITCODE -ne 0) { throw "Failed to list role assignments for '$principalId' on '$scope' (exit $LASTEXITCODE)." }
          if ($roles -notcontains 'Azure Service Bus Data Receiver') {
            throw "Managed identity '$principalId' does NOT hold 'Azure Service Bus Data Receiver' on '$(ProfilerServiceBusNamespace)' after the enable step (found: $($roles -join ', ')). The trigger cannot consume without it."
          }
          Write-Host "Verified 'Azure Service Bus Data Receiver' on '$(ProfilerServiceBusNamespace)' for $principalId"

          # The enabler converges the trigger queue itself; it must not have dropped the dead-letter
          # forward set above, or every failure would go quietly to the trigger queue's subqueue.
          $forward = az servicebus queue show --name '$(ProfilerServiceBusTriggerQueueName)' --namespace-name '$(ProfilerServiceBusNamespace)' --resource-group '$(ProfilerEngineResourceGroup)' --query forwardDeadLetteredMessagesTo -o tsv
          if ($LASTEXITCODE -ne 0) { throw "Failed to read forwardDeadLetteredMessagesTo for '$(ProfilerServiceBusTriggerQueueName)' (exit $LASTEXITCODE)." }
          if ($forward -ne '$(ProfilerServiceBusErrorQueueName)') {
            throw "'$(ProfilerServiceBusTriggerQueueName)' forwards its dead-letters to '$forward' after Enable-ServiceBusSecureTrigger.ps1, expected '$(ProfilerServiceBusErrorQueueName)'."
          }
          Write-Host "Verified: '$(ProfilerServiceBusTriggerQueueName)' still forwards its dead-letters to '$(ProfilerServiceBusErrorQueueName)'."

    # Configure-RabbitMqShovel.ps1 verifies the source queue exists (Phase 1) but does not create
    # it, so it is declared here first - same as the source file's own step, just against the
    # shared external broker this file's variables point at instead of Unlimited's
    # Octopus-tokenised one.
    #
    # A QUEUE ALONE IS NOT A USABLE TOPOLOGY, which is what this step used to leave behind. Warewolf's
    # own producer - PublishRabbitMQActivity, Dev2.Activities/Activities/RabbitMQ/Publish/
    # PublishRabbitMQActivity.cs:312 - publishes BasicPublish(exchange: <queueName>, routingKey: ""),
    # and so do the load-test publishers that stand in for it (Publish-WwProfilerExact.ps1,
    # Publish-WwQueueBurst.ps1). A queue created by PUT /api/queues/... has only the implicit default-
    # exchange binding, so every one of those publishes targets an exchange that does not exist:
    # RabbitMQ answers 404 on the channel, and with mandatory=false and no publisher confirms NOTHING
    # surfaces it. On 2026-09-19 a 20,000-message load run reported "published 20000" against
    # wwprofilerlw.servicebus.trigger.request while the broker's own publish counter stayed at 2.
    #
    # So all three objects are declared here - exchange, queue, and the binding between them with an
    # EMPTY routing key - and the step then RE-READS the bindings and fails if either is missing. A
    # half-built topology must not reach the shovel step, because from there it is indistinguishable
    # from a broker that accepts messages and loses them.
    #
    # DURABLE, deliberately diverging from Initialize-E2EQueueTopology's non-durable default (which
    # matches PublishRabbitMQActivity's own IsDurable=False): this is a bridge queue a broker restart
    # must not take out from under an in-flight load run.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $mgmtUri = '$(ProfilerRabbitMqManagementUri)'
        $vhost   = '$(ProfilerRabbitMqVirtualHost)'
        $queue   = '$(ProfilerQueueName)'
        $pair    = "$(ProfilerRabbitMqUsername):$env:RabbitMqPasswordValue"
        $authHeader = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
        $vhostEnc = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }
        $queueEnc = [Uri]::EscapeDataString($queue)

        function Get-RabbitObject([string] $Path) {
          try {
            # Assign first: Invoke-RestMethod emits a JSON array as ONE object, and 'return <cmd>'
            # passes it through un-enumerated, so @(...) at the call site would see Count 1 and every
            # Where-Object binding check below would evaluate False. 'return $var' enumerates it.
            $result = Invoke-RestMethod -Method Get -Uri "$mgmtUri/$Path" -Headers $authHeader -TimeoutSec 30
            return $result
          } catch {
            if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) { return $null }
            throw
          }
        }

        # -- 1. queue ---------------------------------------------------------------------------
        if (Get-RabbitObject "api/queues/$vhostEnc/$queueEnc") {
          Write-Host "RabbitMQ queue '$queue' already exists on vhost '$vhost'."
        } else {
          Write-Host "Declaring RabbitMQ queue '$queue' on vhost '$vhost' (durable)..."
          Invoke-RestMethod -Method Put -Uri "$mgmtUri/api/queues/$vhostEnc/$queueEnc" -Headers $authHeader -ContentType 'application/json' -Body '{"durable":true}' -TimeoutSec 30 | Out-Null
          Write-Host "Declared RabbitMQ queue '$queue'."
        }

        # -- 2. exchange named after the queue --------------------------------------------------
        if (Get-RabbitObject "api/exchanges/$vhostEnc/$queueEnc") {
          Write-Host "RabbitMQ exchange '$queue' already exists on vhost '$vhost'."
        } else {
          Write-Host "Declaring RabbitMQ exchange '$queue' (direct, durable)..."
          $exchangeBody = '{"type":"direct","durable":true,"auto_delete":false,"internal":false,"arguments":{}}'
          Invoke-RestMethod -Method Put -Uri "$mgmtUri/api/exchanges/$vhostEnc/$queueEnc" -Headers $authHeader -ContentType 'application/json' -Body $exchangeBody -TimeoutSec 30 | Out-Null
          Write-Host "Declared RabbitMQ exchange '$queue'."
        }

        # -- 3. binding, routing key '' ---------------------------------------------------------
        $bindings = @(Get-RabbitObject "api/queues/$vhostEnc/$queueEnc/bindings")
        $hasExchangeBinding = @($bindings | Where-Object { $_.source -eq $queue -and $_.routing_key -eq '' }).Count -gt 0
        if ($hasExchangeBinding) {
          Write-Host "Binding '$queue' -> '$queue' (routing key '') already exists."
        } else {
          Write-Host "Binding exchange '$queue' to queue '$queue' with an EMPTY routing key..."
          Invoke-RestMethod -Method Post -Uri "$mgmtUri/api/bindings/$vhostEnc/e/$queueEnc/q/$queueEnc" -Headers $authHeader -ContentType 'application/json' -Body '{"routing_key":"","arguments":{}}' -TimeoutSec 30 | Out-Null
          Write-Host "Bound exchange '$queue' to queue '$queue'."
        }

        # -- 4. verify, and FAIL the build if the topology is still incomplete -------------------
        $final = @(Get-RabbitObject "api/queues/$vhostEnc/$queueEnc/bindings")
        $viaDefault  = @($final | Where-Object { $_.source -eq '' -and $_.routing_key -eq $queue }).Count -gt 0
        $viaExchange = @($final | Where-Object { $_.source -eq $queue -and $_.routing_key -eq '' }).Count -gt 0
        Write-Host "Bindings on '$queue': $($final.Count) (default-exchange: $viaDefault, named-exchange: $viaExchange)"
        if (-not $viaExchange) {
          throw ("Topology INCOMPLETE for '$queue': no binding from exchange '$queue' with an empty routing key. " +
                 'Every publish from PublishRabbitMQActivity and the load-test publishers would be accepted and ' +
                 'silently discarded. Refusing to continue to the shovel steps.')
        }
        if (-not $viaDefault) {
          Write-Host "##[warning]Queue '$queue' has no default-exchange binding - management-API publishes (the bridge smoke test) will not route."
        }
      displayName: 'Ensure RabbitMQ source queue topology exists (exchange + queue + binding)'
      env:
        # Reuses the SAME secret pipeline variable pipeline-LOADTEST.yml's own
        # ShovelBridgeLoadTest_ExternalServiceBus job already relies on for this broker.
        RabbitMqPasswordValue: $(ExternalRabbitMqPassword)

    # THE OTHER ARCHITECTURE STANDS DOWN. A QueueProcessor worker left by an earlier run keeps
    # consuming this environment's CloudAMQP queue and calling the SAME engine, alongside the bridge.
    # Stopped, not deleted: a QueueProcessor run redeploys and starts it again. Only apps with this
    # environment's prefix are touched, so other rigs in the shared ACA environment are left alone.
    # Contributor on DEV2 (the service connection) covers containerApps/stop; no role write needed.
    - task: AzureCLI@2
      displayName: 'Stop QueueProcessor workers (ShovelBridge owns the engine)'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          $rg     = '$(ProfilerEngineResourceGroup)'
          $prefix = '$(ProfilerWorkerAppNamePrefix)'
          if ([string]::IsNullOrWhiteSpace($prefix) -or $prefix.Length -lt 8) { throw "ProfilerWorkerAppNamePrefix '$prefix' is too broad to stop apps by." }

          az extension add --name containerapp --only-show-errors
          if ($LASTEXITCODE -ne 0) { throw "Could not add the containerapp az extension (exit $LASTEXITCODE)." }

          $apps = @(az containerapp list --resource-group $rg --query "[?starts_with(name, '$prefix')].{name: name, status: properties.runningStatus}" -o json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "Failed to list Container Apps in '$rg' (exit $LASTEXITCODE)." }
          if (-not $apps.Count) { Write-Host "No QueueProcessor workers ('$prefix*') in '$rg'." }
          foreach ($a in $apps) {
            if ($a.status -eq 'Stopped') { Write-Host "'$($a.name)' is already stopped."; continue }
            Write-Host "Stopping '$($a.name)' ($($a.status))..."
            az containerapp stop --name $a.name --resource-group $rg -o none
            if ($LASTEXITCODE -ne 0) { throw "Failed to stop '$($a.name)' (exit $LASTEXITCODE)." }
            $after = az containerapp show --name $a.name --resource-group $rg --query properties.runningStatus -o tsv
            if ($after -ne 'Stopped') { throw "'$($a.name)' reports '$after' after the stop, not 'Stopped'." }
            Write-Host "Stopped '$($a.name)'."
          }

    # AzureCLI@2, NOT - pwsh:, and not by preference - a bare pwsh step CANNOT run this script.
    # Because -ServiceBusResourceGroup is passed (rather than -ServiceBusSasKey), the script resolves
    # the '$(ProfilerShovelSendRuleName)' primary key live, in its Phase 0.5, via
    # 'az servicebus queue authorization-rule keys list' - which needs a logged-in az. AzureCLI@2
    # scopes its login to a per-task AZURE_CONFIG_DIR, so the az-authenticated steps above leave
    # NOTHING behind for a plain pwsh step to reuse: build 30747 failed right here with
    # "Failed to fetch the SAS key via az: ERROR: Please run 'az login' to setup account", after
    # Phase 0 had already confirmed the broker and the rabbitmq_shovel plugin were fine.
    #
    # inlineScript, not scriptPath + arguments (the shape the 'Deploy via Deployment Scripts' step
    # uses): -RabbitMqPassword takes a SecureString, which cannot survive a flat arguments string,
    # and flattening it to plaintext on a command line is exactly what pipeline-CLOUD.yml's own
    # ShovelBridge steps refuse to do. scriptType pscore satisfies the script's #Requires -Version 7.0.
    - task: AzureCLI@2
      displayName: 'Configure RabbitMQ Shovel (bridge to Azure Service Bus)'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          $rabbitPasswordSecure = ConvertTo-SecureString $env:RabbitMqPasswordValue -AsPlainText -Force

          & '$(ShovelScriptPath)' `
              -RabbitMqManagementUri '$(ProfilerRabbitMqManagementUri)' `
              -RabbitMqUsername '$(ProfilerRabbitMqUsername)' `
              -RabbitMqPassword $rabbitPasswordSecure `
              -VHost '$(ProfilerRabbitMqVirtualHost)' `
              -ShovelName '$(ProfilerShovelName)' `
              -SourceQueue '$(ProfilerQueueName)' `
              -SourceHost '$(ProfilerShovelSourceHost)' `
              -ServiceBusNamespace '$(ProfilerServiceBusNamespace)' `
              -ServiceBusQueueName '$(ProfilerServiceBusTriggerQueueName)' `
              -ServiceBusSasKeyName '$(ProfilerShovelSendRuleName)' `
              -ServiceBusResourceGroup '$(ProfilerEngineResourceGroup)' `
              -DestUriCaCertFile '$(ProfilerShovelDestUriCaCertFile)' `
              -NonInteractive
      env:
        RabbitMqPasswordValue: $(ExternalRabbitMqPassword)

    # -- ShovelBridge verification ----------------------------------------------------------
    # THE BUILD MUST FAIL HERE IF THE BRIDGE CANNOT CARRY A MESSAGE. Everything above this point
    # can pass over a completely dead bridge: the smoke tests call the engine over HTTP, and
    # Configure-RabbitMqShovel.ps1's own Phase 3 only WARNS when the shovel never reaches 'running'
    # (and it is the RELEASE ZIP's copy that runs here, so a fix to the checked-out script would not
    # even be executed). That combination is exactly how the 2026-09-18 deploy reported success with
    # a shovel stuck in 'starting' and consumers = 0 on its source queue.
    #
    # Two steps, deliberately separate. The first asks the broker what state the shovel is in - a
    # cheap, unambiguous answer that names the right leg when the bridge was never even established.
    # The second publishes a real message and follows it across, which is the only thing that proves
    # the bridge WORKS rather than merely exists.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $mgmtUri  = '$(ProfilerRabbitMqManagementUri)'
        $vhost    = '$(ProfilerRabbitMqVirtualHost)'
        $shovel   = '$(ProfilerShovelName)'
        $pair     = "$(ProfilerRabbitMqUsername):$env:RabbitMqPasswordValue"
        $headers  = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
        $vhostEnc = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }

        # 'flow' is a healthy running substate (connected on both ends, throttled by RabbitMQ's own
        # flow control), so it counts as running - see docs/ShovelBridge-Architecture.md.
        $deadline = (Get-Date).AddSeconds(60)
        $state    = '(not reported)'
        do {
          $shovels = Invoke-RestMethod -Uri "$mgmtUri/api/shovels/$vhostEnc" -Headers $headers -TimeoutSec 30
          $mine    = @($shovels) | Where-Object { $_.name -eq $shovel }
          if ($mine) { $state = $mine[0].state }
          if ($state -in @('running', 'flow')) { break }
          Start-Sleep -Seconds 5
        } while ((Get-Date) -lt $deadline)

        if ($state -notin @('running', 'flow')) {
          throw ("Shovel '$shovel' is in state '$state' after 60s, not 'running'. The bridge cannot " +
                 "carry a message. A shovel that never leaves 'starting' has failed to connect one of " +
                 "its two legs: check /api/connections for a 127.0.0.1 connection named " +
                 "'Shovel $shovel' - no connection at all means the SOURCE leg, i.e. src-uri is not an " +
                 "address the broker itself can reach (see the ProfilerShovelSourceHost variable).")
        }
        Write-Host "Shovel '$shovel' is $state."
      displayName: 'Verify ShovelBridge shovel is running'
      env:
        RabbitMqPasswordValue: $(ExternalRabbitMqPassword)

    # The sink depth BEFORE the bridge message, captured exactly as the HTTP smoke test captures its
    # own: the assertion two steps down is a depth DELTA, and -1 is passed when this step could not
    # run, so a broken capture cannot produce a silent pass. Also this environment's Service Bus
    # failure count (see Get-BridgeFailures), because the trigger queue FORWARDS its dead-letters to
    # the error queue: Test-WwShovelBridgeDelivery.ps1 watches only the trigger queue's own
    # deadLetterMessageCount, which a forwarded dead-letter never raises.
    #
    # AzureCLI@2 for the az read. The sink script runs FIRST, before WwAzCli.psm1 is imported, so the
    # az alias never reaches a child script.
    - task: AzureCLI@2
      displayName: 'Smoke Test: Capture Sink Depth (bridge)'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
          $baseline = & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
                       -ReportBaselineOnly `
                       -ManagementUri '$(ProfilerSinkRabbitMqManagementUri)' `
                       -QueueName     '$(ProfilerSinkQueueName)' `
                       -VHost         '$(ProfilerSinkRabbitMqVirtualHost)' `
                       -Username      '$(ProfilerSinkRabbitMqUsername)' `
                       -Password      $pw
          Write-Host "##vso[task.setvariable variable=BridgeSinkDepthBefore]$($baseline.Depth)"
          Write-Host "##vso[task.setvariable variable=BridgeSinkPublishedBefore]$($baseline.Published)"
          Write-Host "Sink before the bridge message: depth $($baseline.Depth), published counter $($baseline.Published)"

          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          # Failed deliveries of this environment: everything on the error queue (active + its own
          # dead-letters) plus anything left on the trigger queue's dead-letter subqueue (a forward
          # that failed). Only a RISE matters, so a backlog from earlier runs is harmless.
          function Get-BridgeFailures {
            $total = 0L
            # The error queue counts whole (nothing consumes it); the trigger queue only its dead-letter subqueue.
            foreach ($name in @('$(ProfilerServiceBusErrorQueueName)', '$(ProfilerServiceBusTriggerQueueName)')) {
              $c = az servicebus queue show --name $name --namespace-name '$(ProfilerServiceBusNamespace)' --resource-group '$(ProfilerEngineResourceGroup)' --query countDetails -o json | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or -not $c) { throw "Could not read the message counts of '$(ProfilerServiceBusNamespace)/$name' (exit $LASTEXITCODE)." }
              $total += [long]$c.deadLetterMessageCount
              if ($name -eq '$(ProfilerServiceBusErrorQueueName)') { $total += [long]$c.activeMessageCount }
            }
            return $total
          }
          $failures = Get-BridgeFailures
          Write-Host "##vso[task.setvariable variable=BridgeFailuresBefore]$failures"
          Write-Host "Service Bus failures before the bridge message: $failures"
      env:
        SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

    # AzureCLI@2, not a bare pwsh step: Test-WwShovelBridgeDelivery.ps1 reads the Service Bus queue's
    # active/dead-letter counts with 'az servicebus queue show', and that task's per-task
    # AZURE_CONFIG_DIR holds the only az login in this job (the same reason the shovel configuration
    # step above is an AzureCLI@2 task).
    #
    # The MandateId is fresh per run and is published BEFORE the call, so the sink assertion below can
    # name this run's message even if this step fails. After the script, the error queue is checked:
    # a dead-letter forwarded there is invisible to the script (see the capture step above).
    - task: AzureCLI@2
      displayName: 'Smoke Test: ShovelBridge Delivery (RabbitMQ -> Service Bus -> engine)'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          $mandateId = [guid]::NewGuid().ToString()
          Write-Host "##vso[task.setvariable variable=BridgeMandateId]$mandateId"
          Write-Host "Bridge-scoped MandateId: $mandateId"

          # The 16 fields RequestForProfiling's DataList declares - the same set the HTTP smoke test
          # above sends, so the two smoke tests differ only in the TRANSPORT they exercise.
          $fields = @{
            ForPaymentCycle       = '202402'
            MandateCanTrack       = 'false'
            MandateDRI            = '22'
            MandateId             = $mandateId
            RelatedMandates       = '5B9800B6-2183-EB11-A812-000D3ABE1AD1'
            ResultDate            = '2024-01-27'
            ResultDebitRunId      = '22'
            ResultMethod          = 'DebiCheck'
            ResultPaymentCycle    = '202401'
            ResultPresentedOnDate = '2024-01-22'
            ResultType            = 'Success'
            ScoreThisResult       = 'true'
            IsFixedExtract        = 'false'
            SourcePaymentId       = '1234'
            RequestType           = ''
            FASGroup              = ''
          }

          $pw = ConvertTo-SecureString $env:RabbitMqPasswordValue -AsPlainText -Force
          & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwShovelBridgeDelivery.ps1' `
              -ManagementUri       '$(ProfilerRabbitMqManagementUri)' `
              -SourceQueue         '$(ProfilerQueueName)' `
              -VHost               '$(ProfilerRabbitMqVirtualHost)' `
              -Username            '$(ProfilerRabbitMqUsername)' `
              -Password            $pw `
              -InputFields         $fields `
              -CorrelationToken    $mandateId `
              -ServiceBusNamespace '$(ProfilerServiceBusNamespace)' `
              -ServiceBusQueueName '$(ProfilerServiceBusTriggerQueueName)' `
              -ResourceGroup       '$(ProfilerEngineResourceGroup)'

          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          $before = '$(BridgeFailuresBefore)'
          if ($before -notmatch '^\d+$') { throw "BridgeFailuresBefore was not captured ('$before') - 'Smoke Test: Capture Sink Depth (bridge)' must run first." }
          $after = 0L
          # The error queue counts whole (nothing consumes it); the trigger queue only its dead-letter subqueue.
          foreach ($name in @('$(ProfilerServiceBusErrorQueueName)', '$(ProfilerServiceBusTriggerQueueName)')) {
            $c = az servicebus queue show --name $name --namespace-name '$(ProfilerServiceBusNamespace)' --resource-group '$(ProfilerEngineResourceGroup)' --query countDetails -o json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $c) { throw "Could not read the message counts of '$(ProfilerServiceBusNamespace)/$name' (exit $LASTEXITCODE)." }
            $after += [long]$c.deadLetterMessageCount
            if ($name -eq '$(ProfilerServiceBusErrorQueueName)') { $after += [long]$c.activeMessageCount }
          }
          if ($after -gt [long]$before) {
            throw "The bridge message was dead-lettered: Service Bus failures rose $before -> $after. Peek '$(ProfilerServiceBusErrorQueueName)' for its DeadLetterReason."
          }
          Write-Host "No new Service Bus failures ($before -> $after)."
      env:
        RabbitMqPasswordValue: $(ExternalRabbitMqPassword)

    # The last leg: the workflow the queue triggered actually RAN and published its result. Without
    # this, a message that crossed the bridge and was then swallowed by a failing workflow still looks
    # like a pass - the trigger settles the delivery either way.
    #
    # condition: succeeded(), NOT succeededOrFailed(): if the bridge step above failed there is
    # nothing to attribute a sink delivery to, and a second failure here would only obscure which leg
    # actually broke.
    #
    # -TimeoutSeconds 300 rather than the script's 90: this is the first QUEUE-triggered execution
    # after a deploy, so it pays a Dynamic-plan cold start on top of the workflow's own runtime.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $depthBefore = '$(BridgeSinkDepthBefore)'
        if ([string]::IsNullOrWhiteSpace($depthBefore) -or $depthBefore -match '^\$\(') { $depthBefore = '-1' }
        $publishedBefore = '$(BridgeSinkPublishedBefore)'
        if ([string]::IsNullOrWhiteSpace($publishedBefore) -or $publishedBefore -match '^\$\(') { $publishedBefore = '-1' }

        # Same sentinel handling the HTTP smoke test's own verification uses: a literal '$(...)' back
        # means the step that publishes it never got that far, so the delta is still asserted but
        # nothing is attributed to a token that was never minted.
        $mandateId = '$(BridgeMandateId)'
        if ([string]::IsNullOrWhiteSpace($mandateId) -or $mandateId -match '^\$\(') {
          Write-Host "##[warning]No MandateId was published by the ShovelBridge delivery step - verifying the depth delta only."
          $mandateId = ''
        }

        $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
              -ManagementUri    '$(ProfilerSinkRabbitMqManagementUri)' `
              -QueueName        '$(ProfilerSinkQueueName)' `
              -VHost            '$(ProfilerSinkRabbitMqVirtualHost)' `
              -Username         '$(ProfilerSinkRabbitMqUsername)' `
              -Password         $pw `
              -DepthBefore      ([int]$depthBefore) `
              -PublishedBefore  ([long]$publishedBefore) `
              -CorrelationToken $mandateId `
              -TimeoutSeconds   300
      displayName: 'Smoke Test: Verify Sink Queue (bridge)'
      condition: succeeded()
      env:
        SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

    # ── ShovelBridge burst: $(ProfilerBurstMessageCount) messages through the whole bridge ──────
    # The single message above proves the bridge works; the burst proves it under concurrency, the
    # same size as the QueueProcessor's burst so the two architectures are measured alike. There is
    # no worker, so there are no per-message logs to reconcile against - instead:
    #   1. every publish must be ROUTED by the self-hosted broker (the manifest keeps only those);
    #   2. the source queue AND the Service Bus trigger queue must drain (locked deliveries still
    #      count as active on Service Bus, so 'drained' means the trigger finished them);
    #   3. Service Bus failures (error queue + trigger dead-letter subqueue) must not rise - the
    #      trigger completes a message on success and dead-letters it on failure;
    #   4. the sink's publish counter must rise by at least the burst, proving each execution ran to
    #      RequestForProfiling's final publish.

    # Baselines for checks 3 and 4. The sink script runs before WwAzCli.psm1 is imported (see
    # 'Smoke Test: Capture Sink Depth (bridge)').
    - task: AzureCLI@2
      displayName: 'Capture Service Bus + sink baseline (before bridge burst)'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
          $baseline = & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
                       -ReportBaselineOnly `
                       -ManagementUri '$(ProfilerSinkRabbitMqManagementUri)' `
                       -QueueName     '$(ProfilerSinkQueueName)' `
                       -VHost         '$(ProfilerSinkRabbitMqVirtualHost)' `
                       -Username      '$(ProfilerSinkRabbitMqUsername)' `
                       -Password      $pw
          Write-Host "##vso[task.setvariable variable=BridgeBurstSinkPublishedBefore]$($baseline.Published)"
          Write-Host "Sink before the bridge burst: depth $($baseline.Depth), published counter $($baseline.Published)"

          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          $failures = 0L
          # The error queue counts whole (nothing consumes it); the trigger queue only its dead-letter subqueue.
          foreach ($name in @('$(ProfilerServiceBusErrorQueueName)', '$(ProfilerServiceBusTriggerQueueName)')) {
            $c = az servicebus queue show --name $name --namespace-name '$(ProfilerServiceBusNamespace)' --resource-group '$(ProfilerEngineResourceGroup)' --query countDetails -o json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $c) { throw "Could not read the message counts of '$(ProfilerServiceBusNamespace)/$name' (exit $LASTEXITCODE)." }
            $failures += [long]$c.deadLetterMessageCount
            if ($name -eq '$(ProfilerServiceBusErrorQueueName)') { $failures += [long]$c.activeMessageCount }
          }
          Write-Host "##vso[task.setvariable variable=BridgeBurstFailuresBefore]$failures"
          Write-Host "Service Bus failures before the bridge burst: $failures"
      env:
        SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

    # Bodies and per-message ids come from Publish-WwQueueBurst.ps1's manifest builder (the FLAT
    # 16-field shape RequestForProfiling declares, as the QueueProcessor burst sends); each message's
    # txn is its AMQP correlation_id.
    #
    # Published over the self-hosted broker's management API rather than AMQP: that broker publishes
    # only 443, and the management API answers every publish with 'routed', so a message the broker
    # silently discarded cannot be counted as sent. Sent to the exchange named after the queue with
    # an empty routing key - the same route PublishRabbitMQActivity uses, which 'Ensure RabbitMQ
    # source queue topology' declared. Not retried: a publish whose response was lost may already be
    # on the queue, and a retry would duplicate it.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        . '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Publish-WwQueueBurst.ps1' -LoadFunctionsOnly
        $queue    = '$(ProfilerQueueName)'
        $count    = [int]'$(ProfilerBurstMessageCount)'
        $manifest = New-WwBurstManifest -QueueName $queue -Label 'bridge$(ProfilerEnvironment)$(Build.BuildId)' -SuccessCount $count -BodyShape 'Profiler'

        $vhost      = '$(ProfilerRabbitMqVirtualHost)'
        $vhostEnc   = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }
        $publishUri = "$(ProfilerRabbitMqManagementUri)/api/exchanges/$vhostEnc/$([Uri]::EscapeDataString($queue))/publish"
        $pair       = "$(ProfilerRabbitMqUsername):$env:RabbitMqPasswordValue"
        $headers    = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }

        $sw = [Diagnostics.Stopwatch]::StartNew()
        $results = $manifest | ForEach-Object -ThrottleLimit 8 -Parallel {
          $m = $_
          $body = [ordered]@{
            properties       = [ordered]@{ correlation_id = $m.txn; delivery_mode = 2 }
            routing_key      = ''
            payload          = $m.body
            payload_encoding = 'string'
          } | ConvertTo-Json -Compress -Depth 5
          try {
            $r = Invoke-RestMethod -Method Post -Uri $using:publishUri -Headers $using:headers -ContentType 'application/json' -Body $body -TimeoutSec 60
            [pscustomobject]@{ Txn = $m.txn; Routed = [bool]$r.routed; Error = $null }
          } catch {
            [pscustomobject]@{ Txn = $m.txn; Routed = $false; Error = $_.Exception.Message }
          }
        }

        $routed = @($results | Where-Object Routed)
        $dir = "$(Agent.BuildDirectory)\ProfilerBridgeReport"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $routedTxns = @{}; foreach ($r in $routed) { $routedTxns[$r.Txn] = $true }
        @($manifest | Where-Object { $routedTxns.ContainsKey($_.txn) }) | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $dir 'manifest.json') -Encoding utf8
        Write-Host "##vso[task.setvariable variable=BridgeBurstPublishedCount]$($routed.Count)"
        Write-Host ("Published {0} of {1} message(s) to '{2}' in {3:n0}s." -f $routed.Count, $count, $queue, $sw.Elapsed.TotalSeconds)

        $failed = @($results | Where-Object { -not $_.Routed })
        if ($failed.Count) {
          $failed | Select-Object -First 10 | ForEach-Object { Write-Host "##[error]$($_.Txn): $(if ($_.Error) { $_.Error } else { 'accepted but NOT ROUTED' })" }
          throw "$($failed.Count) of $count message(s) were not routed to '$queue'. 'Ensure RabbitMQ source queue topology' should have bound its exchange."
        }
      displayName: 'Publish the bridge burst ($(ProfilerBurstMessageCount) messages, RequestForProfiling shape)'
      env:
        RabbitMqPasswordValue: $(ExternalRabbitMqPassword)

    # Polls until nothing from the burst is left anywhere on the bridge for the quiet window: the
    # self-hosted source queue (ready + unacked, i.e. not yet shovelled) plus the Service Bus trigger
    # queue's active count (queued + locked by an execution in flight). The shovel is always a
    # consumer of the source queue, so only a FALLING total counts as progress; a stall ends the wait
    # early and the verify steps below then record the shortfall. Samples go to drain.log too.
    - task: AzureCLI@2
      displayName: 'Wait for the bridge burst to drain'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          $vhost    = '$(ProfilerRabbitMqVirtualHost)'
          $vhostEnc = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }
          $pair     = "$(ProfilerRabbitMqUsername):$env:RabbitMqPasswordValue"
          $headers  = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
          $sourceUri = "$(ProfilerRabbitMqManagementUri)/api/queues/$vhostEnc/$([Uri]::EscapeDataString('$(ProfilerQueueName)'))"
          $logPath  = "$(Agent.BuildDirectory)\ProfilerBridgeReport\drain.log"

          $quiet    = [int]'$(ProfilerDrainQuietSeconds)'
          $stall    = 600
          $deadline = (Get-Date).AddSeconds([int]'$(ProfilerDrainTimeoutSeconds)')
          $emptySince = $null; $lastProgress = Get-Date; $lowest = [long]::MaxValue
          while ((Get-Date) -lt $deadline) {
            $source = Invoke-RestMethod -Uri $sourceUri -Headers $headers -TimeoutSec 30
            $active = az servicebus queue show --name '$(ProfilerServiceBusTriggerQueueName)' --namespace-name '$(ProfilerServiceBusNamespace)' --resource-group '$(ProfilerEngineResourceGroup)' --query countDetails.activeMessageCount -o tsv
            if ($LASTEXITCODE -ne 0 -or $active -notmatch '^\d+$') { throw "Could not read '$(ProfilerServiceBusNamespace)/$(ProfilerServiceBusTriggerQueueName)' (exit $LASTEXITCODE)." }
            $pending = [long]$source.messages + [long]$active
            $line = "{0}  source={1,-6} shovel={2,-2} servicebus={3,-6}" -f (Get-Date).ToUniversalTime().ToString('HH:mm:ss'), $source.messages, $source.consumers, $active
            Write-Host $line
            Add-Content -LiteralPath $logPath -Value $line

            if ($pending -gt 0) { $emptySince = $null } elseif (-not $emptySince) { $emptySince = Get-Date }
            if ($emptySince -and ((Get-Date) - $emptySince).TotalSeconds -ge $quiet) { Write-Host "Drained: nothing pending for ${quiet}s."; break }
            if ($pending -lt $lowest) { $lowest = $pending; $lastProgress = Get-Date }
            if (((Get-Date) - $lastProgress).TotalSeconds -ge $stall) {
              Write-Host "##[warning]No progress for ${stall}s with $pending message(s) pending - the shovel (consumers=$($source.consumers)) or the engine trigger is not consuming. Stopping the wait."
              break
            }
            Start-Sleep -Seconds 15
          }
          if (-not ($emptySince -and ((Get-Date) - $emptySince).TotalSeconds -ge $quiet)) {
            Write-Host "##[warning]The bridge burst did not drain - continuing to the verify steps so the shortfall is recorded."
          }
      env:
        RabbitMqPasswordValue: $(ExternalRabbitMqPassword)

    # Checks 2 and 3. Nothing left on Service Bus and no new failures means every delivery the shovel
    # carried was completed by the trigger, i.e. RequestForProfiling answered without error.
    - task: AzureCLI@2
      displayName: 'Verify the bridge burst was processed (Service Bus)'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          $before = '$(BridgeBurstFailuresBefore)'
          if ($before -notmatch '^\d+$') { throw "BridgeBurstFailuresBefore was not captured ('$before')." }

          $active = az servicebus queue show --name '$(ProfilerServiceBusTriggerQueueName)' --namespace-name '$(ProfilerServiceBusNamespace)' --resource-group '$(ProfilerEngineResourceGroup)' --query countDetails.activeMessageCount -o tsv
          if ($LASTEXITCODE -ne 0 -or $active -notmatch '^\d+$') { throw "Could not read '$(ProfilerServiceBusNamespace)/$(ProfilerServiceBusTriggerQueueName)' (exit $LASTEXITCODE)." }
          $after = 0L
          # The error queue counts whole (nothing consumes it); the trigger queue only its dead-letter subqueue.
          foreach ($name in @('$(ProfilerServiceBusErrorQueueName)', '$(ProfilerServiceBusTriggerQueueName)')) {
            $c = az servicebus queue show --name $name --namespace-name '$(ProfilerServiceBusNamespace)' --resource-group '$(ProfilerEngineResourceGroup)' --query countDetails -o json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $c) { throw "Could not read the message counts of '$(ProfilerServiceBusNamespace)/$name' (exit $LASTEXITCODE)." }
            $after += [long]$c.deadLetterMessageCount
            if ($name -eq '$(ProfilerServiceBusErrorQueueName)') { $after += [long]$c.activeMessageCount }
          }
          $deadLettered = $after - [long]$before

          # Written before any throw, so a failed check still leaves its numbers in the artifact.
          [ordered]@{
            triggerQueue = '$(ProfilerServiceBusNamespace)/$(ProfilerServiceBusTriggerQueueName)'
            errorQueue   = '$(ProfilerServiceBusNamespace)/$(ProfilerServiceBusErrorQueueName)'
            published    = '$(BridgeBurstPublishedCount)'
            activeAfter  = [long]$active
            failuresBefore = [long]$before
            failuresAfter  = $after
            deadLettered   = $deadLettered
          } | ConvertTo-Json | Set-Content -LiteralPath "$(Agent.BuildDirectory)\ProfilerBridgeReport\servicebus-counts.json" -Encoding utf8

          Write-Host "Service Bus after the bridge burst: active $active, +$deadLettered dead-lettered."
          if ($deadLettered -gt 0) { throw "$deadLettered bridge burst message(s) were dead-lettered. Peek '$(ProfilerServiceBusErrorQueueName)' for their DeadLetterReason." }
          if ([long]$active -gt 0) { throw "$active message(s) are still on '$(ProfilerServiceBusTriggerQueueName)' - the engine trigger did not finish the burst." }
          Write-Host 'Service Bus drained with no dead-letters.'

    # Check 4: the last leg, RequestForProfiling's own publish to the CloudAMQP sink, on the broker's
    # cumulative publish COUNTER (the sink is capped at 20000, so its depth stops rising once full).
    # 'At least' because other publishers may share the sink; a shortfall is what fails. If the
    # counter is unavailable this degrades to a warning: the Service Bus check above has already
    # proven every delivery completed.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $expected = '$(BridgeBurstPublishedCount)'
        if ($expected -notmatch '^\d+$') { throw "BridgeBurstPublishedCount was not set ('$expected') - the publish step did not finish." }
        $before = '$(BridgeBurstSinkPublishedBefore)'
        if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^\$\(') { $before = '-1' }

        $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
        $after = & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
                  -ReportBaselineOnly `
                  -ManagementUri '$(ProfilerSinkRabbitMqManagementUri)' `
                  -QueueName     '$(ProfilerSinkQueueName)' `
                  -VHost         '$(ProfilerSinkRabbitMqVirtualHost)' `
                  -Username      '$(ProfilerSinkRabbitMqUsername)' `
                  -Password      $pw

        if ([long]$before -lt 0 -or $after.Published -lt 0) {
          Write-Host "##[warning]The sink's publish counter is unavailable (before=$before, after=$($after.Published)) - cannot count the bridge burst's results at the sink. The Service Bus check stands."
          return
        }
        $delta = $after.Published - [long]$before
        Write-Host "Sink publish counter: $before -> $($after.Published) (+$delta); expected at least +$expected."
        if ($delta -lt [long]$expected) {
          throw "Only $delta of $expected results reached the sink '$(ProfilerSinkQueueName)'. The trigger completed the deliveries but RequestForProfiling's RabbitMQ publish did not complete for $([long]$expected - $delta) message(s)."
        }
      displayName: 'Verify results reached the sink (bridge burst)'
      env:
        SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

    - task: PublishPipelineArtifact@1
      displayName: 'Publish ShovelBridge burst report'
      condition: succeededOrFailed()
      continueOnError: true
      inputs:
        targetPath: '$(Agent.BuildDirectory)\ProfilerBridgeReport'
        artifact: ProfilerBridgeReport
        publishLocation: pipeline

  - ${{ if eq(parameters.queueArchitecture, 'QueueProcessor') }}:
    # ── QueueProcessor: RabbitMQ (CloudAMQP) -> ACA worker (KEDA) -> engine /Secure/{workflow} ─────
    # Order matters: the engine must be able to authenticate the worker BEFORE the worker exists, and
    # the queue must exist BEFORE KEDA first polls it.

    # The worker's only route in is /Secure/{workflow}, which needs the engine to validate a bearer
    # token. That is configured by the app setting WAREWOLF_ENTRA_CONFIG, which the engine deploy
    # above does NOT manage under -SkipAuthProvisioning, and which an app recreate silently drops -
    # after which every /secure/* call answers 401 and the worker dead-letters every message it
    # receives (the queue drains, the app scales to zero, the run looks clean). Checked here, before
    # any container is built, so that failure mode costs one step instead of a whole burst.
    #
    # This step is also the ONLY source of ProfilerEngineEntraAppId: the appId is read from the
    # setting's clientId (the Entra app the engine validates tokens for) and published as a pipeline
    # variable for the worker deploy below, instead of being hardcoded in this file. The audience is
    # cross-checked against it: the config stores it as a bare GUID or as api://<guid>, and a mismatch
    # is the documented cause of a 401 storm (the worker minted a token for a different app than the
    # engine validates against).
    #
    # The setting can carry a client secret, so it is only ever parsed, never printed - only the
    # appId (not a secret) is written out.
    - task: AzureCLI@2
      displayName: 'Resolve engine Entra app id (WAREWOLF_ENTRA_CONFIG)'
      inputs:
        azureSubscription: ${{ variables.AzureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
          Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          $cfg = az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' `
              --query "[?name=='WAREWOLF_ENTRA_CONFIG'].value | [0]" -o tsv
          if ($LASTEXITCODE -ne 0) { throw "Failed to read the app settings of '$(ProfilerEngineAppName)' (exit $LASTEXITCODE)." }

          $repair = "Repair it (needs Graph permission the pipeline SP lacks): ./Scripts/Configure-WwExecutionAuth.ps1 -RepairEntraConfigOnly -NonInteractive " +
                    "-SubscriptionId <id> -TenantId <id> -ResourceGroupName '$(ProfilerEngineResourceGroup)' -FunctionAppName '$(ProfilerEngineAppName)' -KnownClientId <appId of $(ProfilerEngineAppName)-auth>"
          if ([string]::IsNullOrWhiteSpace($cfg)) {
            throw ("WAREWOLF_ENTRA_CONFIG is not set on '$(ProfilerEngineAppName)', so /secure/* cannot validate the worker's token and every message would be dead-lettered on a 401. " + $repair)
          }

          try { $entra = $cfg | ConvertFrom-Json } catch { $entra = $null }
          if (-not $entra) {
            throw ("WAREWOLF_ENTRA_CONFIG on '$(ProfilerEngineAppName)' is not valid JSON; the engine treats it as unset and every /secure/* call would answer 401. " + $repair)
          }

          $guid  = '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'
          $appId = [string]$entra.clientId
          if ($appId -notmatch $guid) {
            throw ("WAREWOLF_ENTRA_CONFIG on '$(ProfilerEngineAppName)' has no clientId GUID to give the worker as its token audience. " + $repair)
          }
          $audience = [string]$entra.audience
          if ($audience -and $audience -notmatch [regex]::Escape($appId)) {
            throw ("WAREWOLF_ENTRA_CONFIG on '$(ProfilerEngineAppName)': audience does not reference clientId $appId, so a token minted for that app would be rejected. " + $repair)
          }

          Write-Host "##vso[task.setvariable variable=ProfilerEngineEntraAppId]$appId"
          Write-Host "Resolved engine Entra app id from WAREWOLF_ENTRA_CONFIG on $(ProfilerEngineAppName): $appId"

    # A raw service-principal login for the QueueProcessor steps - see 'Validate pipeline
    # prerequisites' for why these are not AzureCLI@2 steps. The session lives in this job's default
    # AZURE_CONFIG_DIR, which AzureCLI@2 steps never read or write (each uses a per-task dir), so it
    # cannot leak into the engine steps above.
    #
    # AzureClientId/AzureClientSecret on the definition MUST be the 'Warewolf DevOps' SP (appId
    # a15fdb40-..., the same one Load Tests/Cloud use): it holds User Access Administrator on
    # acrwarewolf and on the WWExecutionEngine vault, which Deploy-WwQueueProcessor.ps1's
    # Assert-RoleAssigned needs for the AcrPull / Key Vault Secrets User grants. The definition
    # originally carried 'shovel bridge staging load test' (e510a863-...), which holds NO Azure role
    # at all - so the check below reads the caller's effective permissions on both scopes (ARM
    # permissions API: no Graph needed) and fails here, not after the image build.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        az login --service-principal -u $env:AzureClientIdValue -p $env:AzureClientSecretValue --tenant $env:AzureTenantIdValue --allow-no-subscriptions | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "az login as the pipeline service principal failed (exit $LASTEXITCODE)." }
        $account = az account show | ConvertFrom-Json
        Write-Host "Logged in: $($account.name) ($($account.id)) as SP $env:AzureClientIdValue"

        $vaultName = ([Uri]'$(ProfilerWorkerRabbitMqSecretUri)').Host.Split('.')[0]
        $scopes = [ordered]@{
          "registry $(ProfilerAcrName)" = "/subscriptions/$($account.id)/resourceGroups/$(ProfilerEngineResourceGroup)/providers/Microsoft.ContainerRegistry/registries/$(ProfilerAcrName)"
          "vault $vaultName"            = "/subscriptions/$($account.id)/resourceGroups/$(ProfilerEngineResourceGroup)/providers/Microsoft.KeyVault/vaults/$vaultName"
        }
        $missing = @()
        foreach ($label in $scopes.Keys) {
          $perms = az rest --method get --url "https://management.azure.com$($scopes[$label])/providers/Microsoft.Authorization/permissions?api-version=2022-04-01" 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $perms) { $missing += "$label (cannot even read it)"; continue }
          $can = $false
          foreach ($p in @($perms.value)) {
            $granted = @($p.actions) | Where-Object { $_ -in '*', 'Microsoft.Authorization/*', 'Microsoft.Authorization/roleAssignments/*', 'Microsoft.Authorization/roleAssignments/write' }
            $denied  = @($p.notActions) | Where-Object { $_ -in 'Microsoft.Authorization/*', 'Microsoft.Authorization/roleAssignments/*', 'Microsoft.Authorization/roleAssignments/write', 'Microsoft.Authorization/*/Write' }
            if ($granted -and -not $denied) { $can = $true }
          }
          if (-not $can) { $missing += $label }
        }
        if ($missing) {
          throw ("Service principal $env:AzureClientIdValue cannot create role assignments on: $($missing -join ', '). " +
                 "Deploy-WwQueueProcessor.ps1 must grant the worker identity AcrPull and 'Key Vault Secrets User' there. " +
                 "Set AzureClientId/AzureClientSecret on this pipeline definition to the 'Warewolf DevOps' SP (a15fdb40-...), as the Load Tests pipeline does.")
        }
        Write-Host "Verified: SP can create role assignments on $($scopes.Keys -join ' and ')."
      displayName: 'Log in to Azure CLI (QueueProcessor steps)'
      env:
        AzureClientIdValue: $(AzureClientId)
        AzureClientSecretValue: $(AzureClientSecret)
        AzureTenantIdValue: $(AzureTenantId)

    # Declares the worker's queue AND its dead-letter queue on CloudAMQP: exchange + queue + binding
    # with an EMPTY routing key, for the reasons documented on the ShovelBridge's 'Ensure RabbitMQ source queue topology' step
    # (PublishRabbitMQActivity and Publish-WwQueueBurst publish to an exchange NAMED AFTER THE QUEUE;
    # a queue alone routes nothing and the broker discards every publish without an error).
    #
    # DURABLE, and checked. The trigger file declares Durable=true for both queues, and RabbitMQ
    # answers PRECONDITION_FAILED to a redeclare with different arguments - which the worker would
    # hit at startup, crash-looping in a way ACA reports only as CrashLoopBackOff. A queue that
    # already exists NON-durable (an earlier hand-made test queue, say) is therefore a hard failure
    # with the fix spelled out, rather than something to "tolerate".
    #
    # Talks to CloudAMQP's management API, which is LavinMQ's. LavinMQ implements the queue, exchange
    # and binding endpoints used here, but this exact sequence had not been run against it when this
    # was written - if it fails, the response body is printed.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $mgmtUri  = '$(ProfilerSinkRabbitMqManagementUri)'
        $vhost    = '$(ProfilerSinkRabbitMqVirtualHost)'
        $pair     = "$(ProfilerSinkRabbitMqUsername):$env:CloudAmqpPasswordValue"
        $headers  = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
        $vhostEnc = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }

        function Get-BrokerObject([string] $Path) {
          try {
            # Assign first: see Get-RabbitObject in 'Ensure RabbitMQ source queue topology' for why 'return <cmd>' mangles arrays.
            $result = Invoke-RestMethod -Method Get -Uri "$mgmtUri/$Path" -Headers $headers -TimeoutSec 30
            return $result
          } catch {
            if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) { return $null }
            throw
          }
        }

        function Send-Broker([string] $Method, [string] $Path, [string] $Body) {
          try {
            Invoke-RestMethod -Method $Method -Uri "$mgmtUri/$Path" -Headers $headers -ContentType 'application/json' -Body $Body -TimeoutSec 30 | Out-Null
          } catch {
            $detail = if ($_.ErrorDetails.Message) { $_.ErrorDetails.Message } else { $_.Exception.Message }
            throw "$Method $Path failed: $detail"
          }
        }

        function Confirm-QueueTopology([string] $Name) {
          $enc = [Uri]::EscapeDataString($Name)

          $queue = Get-BrokerObject "api/queues/$vhostEnc/$enc"
          if ($queue) {
            if ($queue.durable -ne $true) {
              throw "Queue '$Name' already exists on vhost '$vhost' but is NOT durable. The trigger declares it durable, so the worker would fail with PRECONDITION_FAILED at startup. Delete the queue (DELETE $mgmtUri/api/queues/$vhostEnc/$enc) and re-run."
            }
            Write-Host "Queue '$Name' already exists (durable)."
          } else {
            Write-Host "Declaring queue '$Name' (durable)..."
            Send-Broker 'Put' "api/queues/$vhostEnc/$enc" '{"durable":true,"auto_delete":false,"arguments":{}}'
          }

          if (Get-BrokerObject "api/exchanges/$vhostEnc/$enc") {
            Write-Host "Exchange '$Name' already exists."
          } else {
            Write-Host "Declaring exchange '$Name' (direct, durable)..."
            Send-Broker 'Put' "api/exchanges/$vhostEnc/$enc" '{"type":"direct","durable":true,"auto_delete":false,"internal":false,"arguments":{}}'
          }

          $bound = @((Get-BrokerObject "api/queues/$vhostEnc/$enc/bindings") | Where-Object { $_.source -eq $Name -and $_.routing_key -eq '' }).Count -gt 0
          if (-not $bound) {
            Write-Host "Binding exchange '$Name' -> queue '$Name' (empty routing key)..."
            Send-Broker 'Post' "api/bindings/$vhostEnc/e/$enc/q/$enc" '{"routing_key":"","arguments":{}}'
          }

          # Re-read: a half-built topology must not reach the burst, where it is indistinguishable
          # from a broker that accepts messages and loses them.
          $final = @((Get-BrokerObject "api/queues/$vhostEnc/$enc/bindings") | Where-Object { $_.source -eq $Name -and $_.routing_key -eq '' }).Count -gt 0
          if (-not $final) {
            throw "Topology INCOMPLETE for '$Name': no binding from exchange '$Name' with an empty routing key. Every publish would be accepted and silently discarded."
          }
          Write-Host "Topology OK for '$Name' (queue + exchange + empty-key binding)."
        }

        Confirm-QueueTopology '$(ProfilerQueueName)'
        Confirm-QueueTopology '$(ProfilerDeadLetterQueueName)'
      displayName: 'Ensure worker queue + dead-letter topology exists (CloudAMQP)'
      env:
        CloudAmqpPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

    # THE OTHER ARCHITECTURE STANDS DOWN. A shovel left by an earlier ShovelBridge run keeps moving
    # this environment's self-hosted queue into Service Bus and on into the SAME engine, alongside the
    # worker - so a stray publish there would be processed outside this run's accounting. Deleted
    # outright, not paused: a ShovelBridge run writes it again from scratch.
    #
    # DELETE /api/parameters/shovel/<vhost>/<name> - the shovel's definition. NOT /api/shovels/...,
    # which is the read-only status listing. A 404 means there was nothing to remove. Then re-listed,
    # because a dynamic shovel's worker can outlive its definition for a moment.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $mgmtUri  = '$(ProfilerRabbitMqManagementUri)'
        $vhost    = '$(ProfilerRabbitMqVirtualHost)'
        $name     = '$(ProfilerShovelName)'
        $pair     = "$(ProfilerRabbitMqUsername):$env:RabbitMqPasswordValue"
        $headers  = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
        $vhostEnc = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }

        try {
          Invoke-RestMethod -Method Delete -Uri "$mgmtUri/api/parameters/shovel/$vhostEnc/$([Uri]::EscapeDataString($name))" -Headers $headers -TimeoutSec 30 | Out-Null
          Write-Host "Deleted shovel '$name' from $mgmtUri."
        } catch {
          if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) {
            Write-Host "No shovel '$name' on $mgmtUri - nothing to remove."
          } else {
            $detail = if ($_.ErrorDetails.Message) { $_.ErrorDetails.Message } else { $_.Exception.Message }
            throw "Could not delete shovel '$name' on $mgmtUri ($detail). A 401 means ExternalRabbitMqPassword on this pipeline definition is not the 'testuser' password; a 403 means 'testuser' lacks the policymaker tag."
          }
        }

        $deadline = (Get-Date).AddSeconds(60)
        do {
          $live = @(Invoke-RestMethod -Uri "$mgmtUri/api/shovels/$vhostEnc" -Headers $headers -TimeoutSec 30) | Where-Object { $_.name -eq $name }
          if (-not $live) { break }
          Start-Sleep -Seconds 5
        } while ((Get-Date) -lt $deadline)
        if ($live) { throw "Shovel '$name' is still running on $mgmtUri 60s after its definition was deleted." }
        Write-Host "Verified: no shovel '$name' feeds the engine."
      displayName: 'Remove RabbitMQ Shovel (QueueProcessor owns the engine)'
      env:
        RabbitMqPasswordValue: $(ExternalRabbitMqPassword)

    # Sink baseline for THIS burst, taken after the HTTP smoke test above has already added its own
    # message, so the burst's delta is measured against the true starting point. Depth AND the publish
    # counter - the sink is capped at 20000 and depth stops moving once it is full (see 'Smoke Test: Capture Sink Depth (before run)').
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
        $baseline = & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
                     -ReportBaselineOnly `
                     -ManagementUri '$(ProfilerSinkRabbitMqManagementUri)' `
                     -QueueName     '$(ProfilerSinkQueueName)' `
                     -VHost         '$(ProfilerSinkRabbitMqVirtualHost)' `
                     -Username      '$(ProfilerSinkRabbitMqUsername)' `
                     -Password      $pw
        Write-Host "##vso[task.setvariable variable=WorkerSinkDepthBefore]$($baseline.Depth)"
        Write-Host "##vso[task.setvariable variable=WorkerSinkPublishedBefore]$($baseline.Published)"
        Write-Host "Sink before the worker burst: depth $($baseline.Depth), published counter $($baseline.Published)"
      displayName: 'Capture sink baseline (before worker burst)'
      env:
        SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

    # Deploys ONE Container App for the trigger (0..20 replicas on the KEDA rabbitmq scaler), redeployed
    # in place every run. Deploy-WwQueueProcessor.ps1 comes from the downloaded scripts zip, like the
    # engine orchestrator - see 'Deploy via Deployment Scripts' on what that does and does not prove.
    #
    # -EngineResourceAppId is the audience of the Entra app registered for the engine, as resolved
    # from the engine's WAREWOLF_ENTRA_CONFIG by 'Resolve engine Entra app id' above; the worker's
    # managed identity mints its own token against it, so no client secret is involved. The
    # Warewolf_QueueProcessor app-role grant the script attempts needs AppRoleAssignment.ReadWrite.All
    # and is NON-FATAL: check the printed engineAppRole status rather than assuming it landed.
    #
    # The deploy is judged by its own summary JSON, not by its exit code: a per-trigger failure is
    # recorded there and the run can otherwise finish looking clean.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        # Set at runtime by 'Resolve engine Entra app id' - an unexpanded '$(...)' means that step
        # did not run, and the worker must not be deployed with no audience to mint tokens for.
        $engineAppId = '$(ProfilerEngineEntraAppId)'
        if ($engineAppId -notmatch '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$') {
          throw "ProfilerEngineEntraAppId was not resolved ('$engineAppId') - the 'Resolve engine Entra app id (WAREWOLF_ENTRA_CONFIG)' step must run first."
        }
        & '$(QueueProcessorDeployScriptPath)' `
            -ResourceGroup       '$(ProfilerEngineResourceGroup)' `
            -Location            '$(ProfilerEngineLocation)' `
            -AcaEnvironment      '$(ProfilerAcaEnvironment)' `
            -AcrName             '$(ProfilerAcrName)' `
            -AppNamePrefix       '$(ProfilerWorkerAppNamePrefix)' `
            -PublishPath         '$(QueueWorkerPublishPath)' `
            -DockerfilePath      '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.QueueProcessor\Dockerfile' `
            -TriggerFilePath     '$(ProfilerQueueTriggerFile)' `
            -QueueSourcePath     '$(QueueWorkerSourcePath)' `
            -EngineBaseUrl       'https://$(ProfilerEngineAppName).azurewebsites.net' `
            -EngineResourceAppId $engineAppId `
            -KeyVaultName        '$(ProfilerEngineKeyVaultName)' `
            -KeyVaultSecretName  '$(ProfilerEngineKeyVaultSecretName)' `
            -RabbitMqSecretUri   $env:WorkerRabbitMqSecretUriValue `
            -EncryptStagedSettings `
            -LogDir              "$(Agent.BuildDirectory)\ProfilerWorkerDeploy" `
            -NonInteractive

        $summary = Get-ChildItem "$(Agent.BuildDirectory)\ProfilerWorkerDeploy\deploy-WwQueueProcessor-*.summary.json" -ErrorAction Stop |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
        $deployed = (Get-Content -LiteralPath $summary.FullName -Raw | ConvertFrom-Json).queueProcessorApps | Select-Object -First 1
        if (-not $deployed -or $deployed.status -ne 'deployed') {
          throw "QueueProcessor deploy did not succeed for trigger '$($deployed.trigger)': $($deployed.error)"
        }
        if ($deployed.PSObject.Properties.Name -contains 'engineAppRole') {
          Write-Host "Engine app role grant for $($deployed.app): $($deployed.engineAppRole | ConvertTo-Json -Compress)"
        }
        Write-Host "##vso[task.setvariable variable=ProfilerWorkerAppName]$($deployed.app)"
        Write-Host "Deployed QueueProcessor Container App: $($deployed.app)"

        # A ShovelBridge run STOPS the workers ('Stop QueueProcessor workers'), and a redeploy in
        # place does not start a stopped app again - the burst would then sit on the queue until the
        # drain timed out. Imported only now, after the deploy script: the alias must never reach a
        # child script, which has its own az wrapper.
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        az extension add --name containerapp --only-show-errors
        if ($LASTEXITCODE -ne 0) { throw "Could not add the containerapp az extension (exit $LASTEXITCODE)." }
        $status = az containerapp show --name $deployed.app --resource-group '$(ProfilerEngineResourceGroup)' --query properties.runningStatus -o tsv
        if ($LASTEXITCODE -ne 0) { throw "Could not read the running status of '$($deployed.app)' (exit $LASTEXITCODE)." }
        if ($status -eq 'Stopped') {
          Write-Host "'$($deployed.app)' was stopped by an earlier ShovelBridge run - starting it."
          az containerapp start --name $deployed.app --resource-group '$(ProfilerEngineResourceGroup)' -o none
          if ($LASTEXITCODE -ne 0) { throw "Failed to start '$($deployed.app)' (exit $LASTEXITCODE)." }
        }
        Write-Host "'$($deployed.app)' running status: $(if ($status -eq 'Stopped') { 'started' } else { $status })."
      displayName: 'Deploy QueueProcessor Container App (az acr build, DEV2/aca-warewolf)'
      env:
        WorkerRabbitMqSecretUriValue: $(ProfilerWorkerRabbitMqSecretUri)

    # Publishes the burst in the FLAT 16-field shape RequestForProfiling declares - required by the
    # trigger's MapEntireMessage:false binding (see Publish-WwQueueBurst.ps1's '-BodyShape Profiler').
    # Publish-WwQueueBurst.ps1 re-checks the topology itself and proves the publish against the
    # broker's own counter, so a burst the broker never received cannot be reported as sent.
    # -PublishPath supplies RabbitMQ.Client from the worker package.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Write-Host "##vso[task.setvariable variable=WorkerBurstStartedUtc]$([DateTime]::UtcNow.ToString('o'))"
        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Publish-WwQueueBurst.ps1' `
            -QueueName      '$(ProfilerQueueName)' `
            -SuccessCount   $(ProfilerBurstMessageCount) `
            -BodyShape      'Profiler' `
            -Label          'profiler$(ProfilerEnvironment)' `
            -SourceBitePath '$(QueueWorkerSourcePath)\0b142714-8f6d-41b7-9832-2aefa8c731ec.bite' `
            -PublishPath    '$(QueueWorkerPublishPath)' `
            -ManifestPath   "$(Agent.BuildDirectory)\ProfilerWorkerManifest.json"
      displayName: 'Publish the burst ($(ProfilerBurstMessageCount) messages, RequestForProfiling shape)'

    # Polls the worker queue's depth over the management API until it has been EMPTY for the quiet
    # window. An empty reading alone is not the signal: the depth counts ready and unacked messages,
    # but a replica that has just been scaled to zero mid-drain, or one still holding a delivery,
    # can make the queue look finished for a poll or two - the quiet window covers that.
    # A drain that never completes is reported and the run continues to the reconciliation, which
    # then names exactly which messages were never processed.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $mgmtUri  = '$(ProfilerSinkRabbitMqManagementUri)'
        $vhost    = '$(ProfilerSinkRabbitMqVirtualHost)'
        $pair     = "$(ProfilerSinkRabbitMqUsername):$env:CloudAmqpPasswordValue"
        $headers  = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
        $vhostEnc = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }

        function Get-Depth([string] $Name) {
          Invoke-RestMethod -Uri "$mgmtUri/api/queues/$vhostEnc/$([Uri]::EscapeDataString($Name))" -Headers $headers -TimeoutSec 30
        }

        $quiet      = [int]'$(ProfilerDrainQuietSeconds)'
        $deadline   = (Get-Date).AddSeconds([int]'$(ProfilerDrainTimeoutSeconds)')
        $emptySince = $null
        while ((Get-Date) -lt $deadline) {
          $q = Get-Depth '$(ProfilerQueueName)'
          $d = Get-Depth '$(ProfilerDeadLetterQueueName)'
          Write-Host ("{0}  queue={1,-6} consumers={2,-3} dlq={3,-6}" -f (Get-Date).ToUniversalTime().ToString('HH:mm:ss'), $q.messages, $q.consumers, $d.messages)

          if ($q.messages -gt 0) { $emptySince = $null } elseif (-not $emptySince) { $emptySince = Get-Date }
          if ($emptySince -and ((Get-Date) - $emptySince).TotalSeconds -ge $quiet) {
            Write-Host "Drained: queue empty for ${quiet}s (dlq depth $($d.messages))."
            break
          }
          Start-Sleep -Seconds 15
        }
        if (-not $emptySince -or ((Get-Date) - $emptySince).TotalSeconds -lt $quiet) {
          Write-Host "##[warning]Drain wait exceeded $(ProfilerDrainTimeoutSeconds)s without a ${quiet}s quiet window - proceeding to the report so the last observed state is captured. If consumers stayed at 0 the KEDA rule never scaled the worker out of zero (check the broker secret and the LavinMQ note in this file's header)."
        }
      displayName: 'Wait for the worker queue to drain'
      env:
        CloudAmqpPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

    # Log Analytics ingestion lags 2-5 minutes behind a live delivery; a report run straight after
    # the drain reads as "nothing happened" even on a healthy run (see Get-WwQueueRunReport.ps1).
    - powershell: |
        Write-Host 'Waiting 4 minutes for Log Analytics ingestion...'
        Start-Sleep -Seconds 240
      displayName: 'Wait for Log Analytics ingestion'

    # Reconstructs every delivery from the worker's (and, when ProfilerEngineAppInsightsName is set,
    # the engine's) logs and reconciles it against the published manifest. A drained queue proves
    # nothing on its own: success AND dead-lettering both empty it and both scale the app to zero.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:WorkerAppNameValue) -or $env:WorkerAppNameValue -match '^\$\(') {
          throw "ProfilerWorkerAppName was not set - the 'Deploy QueueProcessor Container App' step must have failed before recording the app name."
        }

        $reportArgs = @{
          ResourceGroup    = '$(ProfilerEngineResourceGroup)'
          AcaEnvironment   = '$(ProfilerAcaEnvironment)'
          AppName          = $env:WorkerAppNameValue
          LastMinutes      = 120
          ExpectedManifest = "$(Agent.BuildDirectory)\ProfilerWorkerManifest.json"
          OutputDir        = "$(Agent.BuildDirectory)\ProfilerWorkerReport"
        }
        $engineAi = '$(ProfilerEngineAppInsightsName)'
        if (-not [string]::IsNullOrWhiteSpace($engineAi) -and $engineAi -notmatch '^\$\(') {
          $reportArgs.IncludeEngine          = $true
          $reportArgs.EngineAppInsightsName  = $engineAi
        } else {
          Write-Host '##[warning]ProfilerEngineAppInsightsName is not set - reconciling worker-side only (each message acked or dead-lettered), without the engine response per message.'
        }
        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Get-WwQueueRunReport.ps1' @reportArgs

        $reportFile = Get-ChildItem "$(Agent.BuildDirectory)\ProfilerWorkerReport\queue-run-report-*.json" -ErrorAction Stop |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
        $result = Get-Content -LiteralPath $reportFile.FullName -Raw | ConvertFrom-Json

        if ($result.totals.deliveries -eq 0) {
          throw "No deliveries observed for '$($env:WorkerAppNameValue)' - the worker did not process the burst (never scaled out of zero, or its logs have not been ingested yet)."
        }
        if ($result.reconciliation.missing.Count -gt 0 -or $result.reconciliation.mismatched.Count -gt 0) {
          foreach ($mm in $result.reconciliation.mismatched) {
            foreach ($msg in @($result.messages | Where-Object { $_.Txn -eq $mm.Txn })) {
              $engine = if ($msg.EngineStatus) { "HTTP $($msg.EngineStatus) ($($msg.EngineClass))" }
                        elseif ($msg.EngineTransport) { "transport: $($msg.EngineTransport)" }
                        else { 'NOT RECORDED' }
              Write-Host "##[warning]Txn '$($mm.Txn)' -> Outcome=$($msg.Outcome) Engine=$engine Url='$($msg.EngineUrl)' ExecutionId=$($msg.ExecutionId)"
              if ($msg.EngineBody) { Write-Host "##[warning]  Engine body: $($msg.EngineBody)" }
            }
          }
          $codes = @($result.totals.engineStatusCounts.PSObject.Properties | ForEach-Object { "$($_.Name) x$($_.Value)" }) -join ', '
          $why = if ($codes) { " Engine responses: $codes." }
                 elseif ($result.totals.engineTransportFailures -gt 0) { " Engine was unreachable ($($result.totals.engineTransportFailures) transport failure(s))." }
                 else { ' No engine response was recorded - check the published report artefact.' }
          # 401 x N here is the signature of an engine Entra/audience problem, not of a bad message.
          throw "QueueProcessor burst was not reconciled: $($result.reconciliation.missing.Count) missing, $($result.reconciliation.mismatched.Count) mismatched.$why"
        }
        Write-Host "QueueProcessor burst passed: $($result.totals.succeeded) succeeded, $($result.totals.deadLettered) dead-lettered."
      displayName: 'Verify the QueueProcessor burst was processed'
      env:
        WorkerAppNameValue: $(ProfilerWorkerAppName)

    - task: PublishPipelineArtifact@1
      displayName: 'Publish QueueProcessor run report'
      condition: succeededOrFailed()
      continueOnError: true
      inputs:
        targetPath: '$(Agent.BuildDirectory)\ProfilerWorkerReport'
        artifact: ProfilerQueueRunReport
        publishLocation: pipeline

    # The last leg, and the one the worker-side report cannot see: RequestForProfiling's own publish
    # to the sink. The engine returns 2xx before the sink is proven, so a delivery that "succeeded"
    # can still have lost its result. Compared on the broker's cumulative publish COUNTER - the sink is
    # capped at 20000, so its depth stops rising once full. If the counter is unavailable the check
    # degrades to a warning, because the per-message reconciliation above has already established that
    # every message reached the engine and was answered.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $expected = [int]'$(ProfilerBurstMessageCount)'
        $before = '$(WorkerSinkPublishedBefore)'
        if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^\$\(') { $before = '-1' }

        $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
        $after = & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
                  -ReportBaselineOnly `
                  -ManagementUri '$(ProfilerSinkRabbitMqManagementUri)' `
                  -QueueName     '$(ProfilerSinkQueueName)' `
                  -VHost         '$(ProfilerSinkRabbitMqVirtualHost)' `
                  -Username      '$(ProfilerSinkRabbitMqUsername)' `
                  -Password      $pw

        if ([long]$before -lt 0 -or $after.Published -lt 0) {
          Write-Host "##[warning]The sink's publish counter is unavailable (before=$before, after=$($after.Published)) - cannot count the burst's results at the sink. Worker-side reconciliation stands."
          return
        }
        $delta = $after.Published - [long]$before
        Write-Host "Sink publish counter: $before -> $($after.Published) (+$delta); expected at least +$expected."
        if ($delta -lt $expected) {
          throw "Only $delta of $expected results reached the sink '$(ProfilerSinkQueueName)'. The engine answered the worker but RequestForProfiling's RabbitMQ publish did not complete for $($expected - $delta) message(s)."
        }
      displayName: 'Verify results reached the sink (worker burst)'
      condition: succeeded()
      env:
        SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)
