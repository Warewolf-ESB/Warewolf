# Profiler UAT CI - Warewolf Lightweight Execution Engine variant, PORTED FOR A DEV2 DRY RUN.
#
# SOURCE: C:\Users\ultra\Unlimited.ProfilerServices\ProfilerService-CI-UAT-LightweightExecutionEngine.yml
# (a variant of Unlimited.ProfilerServices' own ProfilerService-CI-UAT.yml with the Docker/full-
# Warewolf-Server half replaced by a Lightweight Execution Engine deploy - see that file's own
# header for the Docker->Lightweight rationale, kept unchanged here).
#
# WHY THIS COPY EXISTS AND HOW IT DIFFERS FROM THE SOURCE
#
#   This is NOT the file that goes to The Unlimited. It is a dry run of the SAME deploy +
#   ShovelBridge + smoke-test MECHANICS the source file automates, retargeted at Warewolf's own
#   DEV2 resource group so those mechanics can be proven here first. Resource names below
#   therefore intentionally do NOT match the source file - see the table in each variable's own
#   comment. Once this pipeline is proven green in DEV2, the ORIGINAL, untouched source file
#   (pointed at The Unlimited's own UAT subscription/resource group) is what actually ships to
#   them - do not "promote" this DEV2 copy by just re-pointing its resource group.
#
#   The source file checks out ONLY Unlimited.ProfilerServices (as `self`) and builds
#   Database/Warewolf.ProfilerDB.sln, Warewolf.ProfilerServices/Sources/**, and
#   AzureFunctions.ProfilerServices/*.csproj - none of which exist in this (Warewolf) repo, and it
#   relies on Unlimited-org-only pipeline extensions/secrets (replacetokens@5 over Octopus tokens,
#   an AzureKeyVault@2 pull against their 'UATAzureDevopsKeyVault', the rvo.SendEmailTask
#   extension). None of that is available or meaningful here, so every step that needs the
#   Profiler source repo or an Unlimited-only extension is DROPPED rather than faked:
#     - MSBuild "Build SQL" (Database/Warewolf.ProfilerDB.sln)
#     - all three "Replace tokens in **/*.json|*.bite|*.txt" steps (replacetokens@5 / Octopus)
#     - the AzureKeyVault@2 "Azure Key Vault: UATAzureDevopsKeyVault" RunAsPreJob pull
#     - "Encrypt Queue Triggers" (needs Warewolf.ProfilerServices/Triggers + its
#       EncryptDecryptPlugin/WarewolfStorageActions.exe, both Unlimited-repo-only)
#     - the AzureFunctions.ProfilerServices build/archive/copy steps (a separate .NET Function
#       App that lives only in the Unlimited repo)
#     - both rvo.SendEmailTask.send-email-build-task.SendEmail@1 alert steps
#
#   What replaces the dropped workflow-resource staging: this repo already carries its own local
#   mirror of the same Profiler workflow tree, committed under
#   Dev/Warewolf.Execution.Lightweight/Resources/ProfilerServices (+ Resources/rabbit for
#   NewSqlServerSource/RabbitProcess) - the exact tree pipeline-LOADTEST.yml's own
#   Build_And_Publish_UAT job already stages for its Profiler load test (see that job's "Stage
#   ProfilerServices/* Load-Test Workflows (full unpruned set)" step). Reusing it here means this
#   pipeline is fully self-contained inside a single `checkout: self` of the Warewolf repo - no
#   second repository resource needed - and still exercises a real, non-trivial workflow
#   (ProfilerWrapper/RequestForProfiling) end to end.
#
#   The engine package itself is built directly from this repo's own source
#   (Warewolf.Execution.Lightweight.csproj via `dotnet publish`, same as pipeline-LOADTEST.yml's
#   Build_And_Publish_UAT job) rather than downloaded as a published release zip from
#   warewolf.io/release-notes.php - there is no reason to round-trip through a public release when
#   the commit under test is checked out right here.
#
#   AUTH: the source file uses an AzureCLI@2 task bound to a DevOps SERVICE CONNECTION
#   (${{ variables.AzureServiceConnection }} = 'uat-sp-devops'). This repo's own pipelines
#   (pipeline-CLOUD.yml, pipeline-LOADTEST.yml) never use a service connection for this kind of
#   Contributor-level az work - they log in with a raw `az login --service-principal` using the
#   AzureClientId/AzureClientSecret/AzureTenantId pipeline secrets instead. This copy keeps the
#   AzureCLI@2 + service-connection SHAPE (so it stays a minimal, structural diff against the
#   source file), but points AzureServiceConnection at 'AzureStorage-WarewolfReleases' - the one
#   service connection that already exists in this Azure DevOps project (see
#   pipeline-CLOUD.yml's AzureStorageServiceConnection variable and its one call site,
#   'Upload zips to Azure Storage').
#
#   *** VERIFY BEFORE THE FIRST RUN: that connection's only observed use in this repo is a blob
#   upload to storage account 'stwwreleases' - it may be scoped ONLY to that storage account and
#   may NOT carry Contributor rights on resource group DEV2. Every AzureCLI@2 step below needs
#   `az functionapp`, `az servicebus` and `az keyvault`-adjacent access on DEV2. If those calls
#   fail with an authorization error, either grant 'AzureStorage-WarewolfReleases' Contributor on
#   DEV2, or switch this file to the raw az-login pattern (see pipeline-LOADTEST.yml's own
#   'Log in to Azure CLI' step for the exact shape) using the same AzureClientId/AzureClientSecret/
#   AzureTenantId secrets pipeline-LOADTEST.yml already relies on. ***
#
# AGENT: Microsoft-hosted 'windows-2022' (this repo has no established self-hosted 'Default' pool
# for DEV2 work - unlike the source file's 'Default' self-hosted pool assumption). PowerShell 7+
# and Azure CLI both ship on this image, matching Deploy-WwExecutionEngine.ps1's own requirements.

trigger: none

pool:
  vmImage: 'windows-2022'

variables:
  # ── DEV2 TARGET (differs from the source file - see header) ────────────────────────────
  # The source file's own header comment (its lines 62-70) notes an already hand-deployed spike
  # app 'wwprofilerlw' living in "the Warewolf DEV2 subscription" from prior manual testing - this
  # reuses that exact app/storage-account pair rather than provisioning new ones.
  ProfilerEngineAppName: 'wwprofilerlw'
  ProfilerEngineStorageAccount: 'wwprofilerlwsa'
  ProfilerEngineResourceGroup: 'DEV2'
  ProfilerEngineLocation: 'southafricanorth'

  # Reuses the SAME Key Vault + AES-key secret pipeline-LOADTEST.yml's own Deploy_UAT stage
  # already uses for -EncryptResources on this subscription (see that file's 'Deploy via
  # Deployment Scripts' step) - not the source file's 'UATAzureDevopsKeyVault' /
  # 'ProfilerEngineEncryptionKey', which belong to The Unlimited's own Key Vault.
  ProfilerEngineKeyVaultName: 'WWExecutionEngine'
  ProfilerEngineKeyVaultSecretName: 'WWExecutionEngineTestSecret'

  # Service connection names are authorised at pipeline COMPILE time, before runtime $(...)
  # macros are substituted, so every reference below uses the compile-time template expression
  # ${{ variables.AzureServiceConnection }} - see this variable's own header-comment entry for
  # why this connection was chosen and what to verify before the first run.
  AzureServiceConnection: 'AzureStorage-WarewolfReleases'

  # ── ShovelBridge (RabbitMQ -> Azure Service Bus -> engine's own ServiceBusTrigger) ──────
  # Dedicated namespace under THIS pipeline's own ProfilerEngineResourceGroup (DEV2) - matching
  # the source file's own design intent of NOT reusing DEV2's shared WarewolfShovelBridgeTesting
  # namespace (that one belongs to pipeline-LOADTEST.yml/pipeline-CLOUD.yml's own E2E/load tests).
  ProfilerServiceBusNamespace: 'wwprofilerlwsb'
  ProfilerServiceBusTriggerQueueName: 'wwprofilerlw-trigger-queue'
  # Folder-qualified to match how Resources/ProfilerServices is laid out in THIS repo (same path
  # pipeline-LOADTEST.yml's own WwExecutionServiceBusTriggerWorkflowName variable uses) -
  # WorkflowIndex.Resolve() keys entries by their full relative path under Resources/, so a bare
  # 'RequestForProfiling' would not resolve.
  ProfilerServiceBusTriggerWorkflowName: 'ProfilerServices/ProfilerWrapper/RequestForProfiling'
  ProfilerShovelName: 'wwprofilerlw-shovel'
  # Least-privilege Send-only SAS rule name, matching Configure-RabbitMqShovel.ps1's own
  # -ServiceBusSasKeyName default ('shovel-send').
  ProfilerShovelSendRuleName: 'shovel-send'
  # A NEW, dedicated RabbitMQ queue on the shared external broker below - not the real production
  # trigger queue, and not pipeline-LOADTEST.yml's own '-loadtest'-suffixed queue names, so this
  # dry run never collides with either.
  ProfilerShovelSourceQueueName: 'wwprofilerlw.servicebus.trigger.request'

  # Broker connection: the source file resolves this from Unlimited's own Octopus-tokenised
  # WarewolfGenericRabbitMQ* variables, which don't exist in this project. Reuses instead the SAME
  # shared, already-provisioned RabbitMQ broker pipeline-LOADTEST.yml's own
  # ShovelBridgeLoadTest_ExternalServiceBus job targets ('rabbitmq.warewolf.online', user
  # 'testuser', default '/' vhost, password in the existing secret pipeline variable
  # 'ExternalRabbitMqPassword') - see that job's own header comment for why this broker was chosen
  # over CloudAMQP (LavinMQ migration broke amqp10 Shovel destinations there).
  ProfilerRabbitMqManagementUri: 'https://rabbitmq.warewolf.online'
  ProfilerRabbitMqUsername: 'testuser'
  ProfilerRabbitMqVirtualHost: '/'
  # Only needed if this broker hits the Erlang/OTP 26+ '{cacerts, undefined}' crash-loop
  # pipeline-LOADTEST.yml's own ShovelBridge job already works around via
  # '&cacertfile=/etc/ssl/certs/ca-certificates.crt' on its manually-built dest URI. This pipeline
  # instead hands the cert path straight to Configure-RabbitMqShovel.ps1's own
  # -DestUriCaCertFile, so leave this set to that same path unless the shovel is observed stuck at
  # 'starting'.
  ProfilerShovelDestUriCaCertFile: '/etc/ssl/certs/ca-certificates.crt'

jobs:
- job: ProfilerMS
  displayName: ProfilerMS Lightweight Engine Pipeline (DEV2 dry run)
  steps:
  - checkout: self
    clean: true

  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.x'

  # Replaces the source file's "Resolve/Download Published Lightweight Engine Release" steps:
  # the engine is built directly from this checked-out commit instead of a public release zip,
  # same as pipeline-LOADTEST.yml's own 'Publish Lightweight Azure Functions Project (Release)'
  # step.
  - task: DotNetCoreCLI@2
    displayName: 'Publish Lightweight Engine (Release)'
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: '$(Build.SourcesDirectory)/Dev/Warewolf.Execution.Lightweight/Warewolf.Execution.Lightweight.csproj'
      arguments: '--configuration Release --runtime win-x64 --self-contained false --output $(Agent.BuildDirectory)\ProfilerLwEnginePublish'
      zipAfterPublish: false
      modifyOutputPath: false

  # Replaces the source file's "Stage Profiler Workflow Resources" step (which copied from the
  # Unlimited.ProfilerServices repo's own Warewolf.ProfilerServices/Profiler + Sources/*.bite).
  # This repo already carries an equivalent, committed tree at
  # Dev/Warewolf.Execution.Lightweight/Resources/ProfilerServices (+ Resources/rabbit for
  # NewSqlServerSource/RabbitProcess, which RequestForProfiling's nested calls depend on) - the
  # exact tree pipeline-LOADTEST.yml already proves out for its own Profiler load test. Staged
  # as two subfolders under one root, mirroring pipeline-LOADTEST.yml's own two staging steps.
  - powershell: |
      $ErrorActionPreference = 'Stop'
      $destRoot = "$(Agent.BuildDirectory)\ProfilerWorkflowResources"

      $rabbitDest = Join-Path $destRoot 'rabbit'
      New-Item -ItemType Directory -Force -Path $rabbitDest | Out-Null
      Get-ChildItem '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Resources\rabbit' -File |
          Where-Object { $_.Name -ne 'NewSqlServerSource (Local Backup).bite' } |
          Copy-Item -Destination $rabbitDest -Force

      $profilerDest = Join-Path $destRoot 'ProfilerServices'
      New-Item -ItemType Directory -Force -Path $profilerDest | Out-Null
      Copy-Item '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Resources\ProfilerServices\*' `
          -Destination $profilerDest -Recurse -Force
      Remove-Item -LiteralPath (Join-Path $profilerDest 'Provision-ProfilerSchema.sql') -Force -ErrorAction SilentlyContinue

      $count = (Get-ChildItem -LiteralPath $destRoot -Recurse -File -Filter '*.bite').Count
      Write-Host "Staged $count .bite resource(s) into $destRoot"
    displayName: 'Stage Profiler Workflow Resources (from this repo''s own Resources tree)'

  # Pulls the licensed subscription config from the Azure DevOps Library ('Warewolf
  # License.secureconfig' under Pipelines > Library > Secure files) - the same org-wide secure
  # file pipeline-LOADTEST.yml's own Deploy_UAT job already downloads, not a Profiler/Unlimited
  # secret.
  - task: DownloadSecureFile@1
    name: warewolfLicense
    displayName: 'Download Warewolf License.secureconfig'
    inputs:
      secureFile: 'Warewolf License.secureconfig'

  # Backed up BEFORE anything is touched, same rationale as the source file's own step:
  # WAREWOLF_ENTRA_CONFIG-style app settings on an existing engine app cannot be reconstructed
  # from this repo. continueOnError because a failed backup must be visible but must not block the
  # deploy - on the very first run of a brand-new app this step is expected to fail.
  - task: AzureCLI@2
    displayName: 'Back Up Engine App Settings'
    continueOnError: true
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        $dir = "$(Agent.BuildDirectory)\EngineSettingsBackup"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' -o json |
            Out-File -LiteralPath (Join-Path $dir 'appsettings-backup.json') -Encoding utf8
        az functionapp show --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' -o json |
            Out-File -LiteralPath (Join-Path $dir 'site-backup.json') -Encoding utf8
        Write-Host "Backed up app settings + site config to $dir"

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Engine Settings Backup'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      targetPath: '$(Agent.BuildDirectory)\EngineSettingsBackup'
      artifact: EngineSettingsBackup
      publishLocation: pipeline

  # The deploy itself - same parameter set as the source file's own 'Deploy via Deployment
  # Scripts' step, minus -SecureConfigPath (no Profiler secure.config exists in this repo; the
  # 'Bypass secure.config workflow authorization' step below opens the app up the same way
  # pipeline-LOADTEST.yml's own Deploy_UAT job does instead) and -EnablePerformanceCounters,
  # -EnableElasticsearch/-ElasticsearchSourcePath (no Elasticsearch endpoint provisioned for this
  # dry-run app; add back once one exists for wwprofilerlw specifically).
  - task: AzureCLI@2
    displayName: 'Deploy via Deployment Scripts'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Deploy-WwExecutionEngine.ps1'
      arguments: >-
        -ResourceGroup '$(ProfilerEngineResourceGroup)'
        -Location '$(ProfilerEngineLocation)'
        -StorageAccount '$(ProfilerEngineStorageAccount)'
        -AppName '$(ProfilerEngineAppName)'
        -PublishPath '$(Agent.BuildDirectory)\ProfilerLwEnginePublish'
        -WorkflowsSourcePath '$(Agent.BuildDirectory)\ProfilerWorkflowResources'
        -LicenseConfigPath '$(warewolfLicense.secureFilePath)'
        -LicenseCheckEnabled:$true
        -KeyVaultName '$(ProfilerEngineKeyVaultName)'
        -KeyVaultSecretName '$(ProfilerEngineKeyVaultSecretName)'
        -EncryptResources:$true
        -SkipAuthProvisioning
        -ServiceBusTriggerQueueName '$(ProfilerServiceBusTriggerQueueName)'
        -ServiceBusTriggerWorkflowName '$(ProfilerServiceBusTriggerWorkflowName)'
        -NonInteractive

  # Same bypass pipeline-LOADTEST.yml's own Deploy_UAT job applies to WarewolfServer-UAT, and for
  # the identical reason: this repo has no source-controlled secure.config for
  # ProfilerWrapper/RequestForProfiling's ResourceID, so bypassing WorkflowAuthPolicyLoader here
  # (rather than trying to reconstruct one) keeps this dry run self-contained. See that job's own
  # step comment for the full az.cmd-quoting root cause this verify-after-write guards against
  # (WOLF-8512 / build 30636).
  - powershell: |
      $ErrorActionPreference = 'Stop'

      $settingsFile = Join-Path $env:AGENT_TEMPDIRECTORY 'ww-security-flags.json'
      $payload = '[{"name":"WAREWOLF_SECURITY_FLAGS","value":"{\"bypassSecureConfig\":true}"}]'
      Set-Content -LiteralPath $settingsFile -Value $payload -Encoding utf8

      az functionapp config appsettings set --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --settings "@$settingsFile" | Out-Null
      if ($LASTEXITCODE -ne 0) { throw "az failed to set WAREWOLF_SECURITY_FLAGS (exit $LASTEXITCODE)." }

      $stored = az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --query "[?name=='WAREWOLF_SECURITY_FLAGS'].value | [0]" -o tsv
      if ($LASTEXITCODE -ne 0) { throw "az failed to read back WAREWOLF_SECURITY_FLAGS (exit $LASTEXITCODE)." }

      try {
        $parsed = $stored | ConvertFrom-Json
      } catch {
        throw "WAREWOLF_SECURITY_FLAGS was stored as INVALID JSON: '$stored'."
      }
      if ($parsed.bypassSecureConfig -ne $true) {
        throw "WAREWOLF_SECURITY_FLAGS parsed as valid JSON but bypassSecureConfig is not true (stored: '$stored')."
      }

      Remove-Item -LiteralPath $settingsFile -Force -ErrorAction SilentlyContinue
      Write-Host "Verified WAREWOLF_SECURITY_FLAGS on $(ProfilerEngineAppName) is valid JSON with bypassSecureConfig=true: $stored"
    displayName: 'Bypass secure.config workflow authorization'

  # WEBSITE_RUN_FROM_PACKAGE=1 means a zip deploy uploads a new package but the running worker
  # keeps serving the old one until recycled - see the source file's own comment on this step for
  # why 'az functionapp restart' is not sufficient (a warm Consumption-plan worker can keep
  # previously-decrypted WFAES sources in memory). A full stop-then-start forces every instance to
  # cold start and re-decrypt.
  - task: AzureCLI@2
    displayName: 'Stop/Start Engine App (apply package + resources)'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        az functionapp stop --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)'
        if ($LASTEXITCODE -ne 0) { throw "az functionapp stop failed (exit $LASTEXITCODE)." }
        az functionapp start --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)'
        if ($LASTEXITCODE -ne 0) { throw "az functionapp start failed (exit $LASTEXITCODE)." }
        Write-Host "Stopped and started $(ProfilerEngineAppName) (full cold start)."

  # Same retry-with-backoff pattern as the source file: a Consumption-plan cold start after the
  # restart above routinely outlasts a single fixed timeout. Windows PowerShell (not pwsh) to keep
  # the $_.Exception.Response 5.1 error shape the catch block below expects.
  - powershell: |
      $ErrorActionPreference = 'Continue'
      $uri         = 'https://$(ProfilerEngineAppName).azurewebsites.net/apis.json'
      $maxAttempts = 5
      $baseDelay   = 15
      Write-Host "Waiting 30 seconds for the Function App to start..."
      Start-Sleep -Seconds 30

      for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
        try {
          $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 60
          Write-Host "STATUS: $($r.StatusCode)"
          Write-Host "apis.json length: $($r.Content.Length)"
          break
        } catch {
          $resp = $_.Exception.Response
          if ($resp) {
            Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $([int]$resp.StatusCode) $($resp.StatusDescription)"
          } else {
            Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)"
          }
          if ($attempt -ge $maxAttempts) {
            Write-Host "##[error]Engine discovery route did not respond after $maxAttempts attempts."
            throw
          }
          $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
          Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
          Start-Sleep -Seconds $delaySeconds
        }
      }
    displayName: 'Smoke Test: Engine Discovery Route'

  # Executes usp_GetSpecialHolidays, the same deliberately read-only, side-effect-free Profiler
  # workflow the source file's own smoke test uses - see that step's comment for why (plain
  # SELECT, no writes, no queue publish; proves the resource tree resolved, the DB source
  # decrypted, and the database is reachable, without mutating anything). continueOnError because
  # the failure this is most likely to catch is a shared-database outage independent of this
  # commit.
  - powershell: |
      $ErrorActionPreference = 'Continue'
      $uri         = 'https://$(ProfilerEngineAppName).azurewebsites.net/public/ProfilerServices/Profiler/V2/Private/DAL/usp_GetSpecialHolidays.json?FromDate=2026-01-01&ToDate=2026-12-31'
      $maxAttempts = 4
      $baseDelay   = 15

      for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
        try {
          $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 120
          Write-Host "STATUS: $($r.StatusCode)"
          Write-Host "usp_GetSpecialHolidays response: $($r.Content)"
          if ($r.Content -match '(?i)"Error"\s*:\s*"[^"]+"') {
            Write-Host "##[error]Workflow executed but returned an error payload."
            throw "usp_GetSpecialHolidays returned an error payload."
          }
          break
        } catch {
          $resp = $_.Exception.Response
          if ($resp) {
            Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $([int]$resp.StatusCode) $($resp.StatusDescription)"
            try { $sr = New-Object IO.StreamReader($resp.GetResponseStream()); Write-Host "BODY: $($sr.ReadToEnd())" } catch { Write-Host "BODY: (empty)" }
          } else {
            Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)"
          }
          if ($attempt -ge $maxAttempts) {
            Write-Host "##[error]Profiler workflow smoke test failed after $maxAttempts attempts."
            throw
          }
          $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
          Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
          Start-Sleep -Seconds $delaySeconds
        }
      }
    displayName: 'Smoke Test: Execute Profiler Workflow'
    continueOnError: true

  # ── ShovelBridge: RabbitMQ -> Azure Service Bus -> engine's own ServiceBusTrigger ───────
  # Same provisioning shape as the source file's own steps (namespace/queue/Send-only SAS
  # rule/Shovel), retargeted at this file's DEV2 variables. As in the source file, none of this
  # grants RBAC or touches the Function App's own managed identity/app settings -
  # Enable-ServiceBusSecureTrigger.ps1 remains a separate, manual, one-time operator step (see
  # that script's own header comment for why it is never run automatically), required once,
  # before the trigger will actually consume anything:
  #   Enable-ServiceBusSecureTrigger.ps1 -FunctionAppName $(ProfilerEngineAppName) `
  #       -ResourceGroup $(ProfilerEngineResourceGroup) -ServiceBusNamespace $(ProfilerServiceBusNamespace) `
  #       -TriggerQueueName $(ProfilerServiceBusTriggerQueueName)
  - task: AzureCLI@2
    displayName: 'Ensure Service Bus Namespace Exists'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        $ns = '$(ProfilerServiceBusNamespace)'
        $rg = '$(ProfilerEngineResourceGroup)'

        $exists = az servicebus namespace show --name $ns --resource-group $rg -o json 2>$null
        if ($LASTEXITCODE -eq 0 -and $exists) {
          Write-Host "Service Bus namespace '$ns' already exists in resource group '$rg'."
        } else {
          Write-Host "Creating Service Bus namespace '$ns' in '$rg' ($(ProfilerEngineLocation), Standard SKU - Standard is required for queue-scoped authorization rules)..."
          az servicebus namespace create --name $ns --resource-group $rg --location '$(ProfilerEngineLocation)' --sku Standard | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to create Service Bus namespace '$ns' (exit $LASTEXITCODE)." }
          Write-Host "Created Service Bus namespace '$ns'."
        }

  - task: AzureCLI@2
    displayName: 'Ensure Service Bus namespace allows local (SAS) auth for the Shovel'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        $ns = '$(ProfilerServiceBusNamespace)'
        $rg = '$(ProfilerEngineResourceGroup)'

        $disableLocalAuth = az servicebus namespace show --name $ns --resource-group $rg --query disableLocalAuth -o tsv
        if ($LASTEXITCODE -ne 0) { throw "Failed to read 'disableLocalAuth' for Service Bus namespace '$ns' (exit $LASTEXITCODE)." }

        if ($disableLocalAuth -eq 'true') {
          Write-Host "##[warning]Service Bus namespace '$ns' has local (SAS) authentication disabled - restoring disableLocalAuth=false ..."
          az servicebus namespace update --name $ns --resource-group $rg --disable-local-auth false | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to restore 'disableLocalAuth=false' on Service Bus namespace '$ns' (exit $LASTEXITCODE)." }
          Write-Host "Restored: local (SAS) authentication is now enabled on '$ns'."
        } else {
          Write-Host "Service Bus namespace '$ns' already has local (SAS) authentication enabled (disableLocalAuth=$disableLocalAuth) - no action needed."
        }

  - task: AzureCLI@2
    displayName: 'Ensure ShovelBridge trigger queue + Send-only SAS rule exist'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        $ns       = '$(ProfilerServiceBusNamespace)'
        $rg       = '$(ProfilerEngineResourceGroup)'
        $queue    = '$(ProfilerServiceBusTriggerQueueName)'
        $sendRule = '$(ProfilerShovelSendRuleName)'

        function Test-AzExists([string[]] $CliArgs) {
          $ErrorActionPreference = 'Continue'
          $null = & az @CliArgs -o json 2>&1
          return $LASTEXITCODE -eq 0
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'show', '--name', $queue, '--namespace-name', $ns, '--resource-group', $rg))) {
          Write-Host "Creating queue '$queue' on '$ns'..."
          az servicebus queue create --name $queue --namespace-name $ns --resource-group $rg | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to create queue '$queue' (exit $LASTEXITCODE)." }
        } else {
          Write-Host "Queue '$queue' already exists."
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'authorization-rule', 'show', '--name', $sendRule, '--namespace-name', $ns, '--resource-group', $rg, '--queue-name', $queue))) {
          Write-Host "Creating Send-only SAS rule '$sendRule'..."
          az servicebus queue authorization-rule create --name $sendRule --namespace-name $ns --resource-group $rg --queue-name $queue --rights Send | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to create Send-only SAS rule '$sendRule' (exit $LASTEXITCODE)." }
        } else {
          Write-Host "Send rule '$sendRule' already exists."
        }

  # Configure-RabbitMqShovel.ps1 verifies the source queue exists (Phase 1) but does not create
  # it, so it is declared here first - same as the source file's own step, just against the
  # shared external broker this file's variables point at instead of Unlimited's
  # Octopus-tokenised one.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $mgmtUri = '$(ProfilerRabbitMqManagementUri)'
      $vhost   = '$(ProfilerRabbitMqVirtualHost)'
      $queue   = '$(ProfilerShovelSourceQueueName)'
      $pair    = "$(ProfilerRabbitMqUsername):$env:RabbitMqPasswordValue"
      $authHeader = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
      $vhostEnc = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }

      $existing = $null
      try {
        $existing = Invoke-RestMethod -Method Get -Uri "$mgmtUri/api/queues/$vhostEnc/$([Uri]::EscapeDataString($queue))" -Headers $authHeader -TimeoutSec 30
      } catch {
        if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -ne 404) { throw }
      }

      if ($existing) {
        Write-Host "RabbitMQ queue '$queue' already exists on vhost '$vhost'."
      } else {
        Write-Host "Declaring RabbitMQ queue '$queue' on vhost '$vhost' (durable)..."
        Invoke-RestMethod -Method Put -Uri "$mgmtUri/api/queues/$vhostEnc/$([Uri]::EscapeDataString($queue))" -Headers $authHeader -ContentType 'application/json' -Body '{"durable":true}' -TimeoutSec 30 | Out-Null
        Write-Host "Declared RabbitMQ queue '$queue'."
      }
    displayName: 'Ensure RabbitMQ source queue exists'
    env:
      # Reuses the SAME secret pipeline variable pipeline-LOADTEST.yml's own
      # ShovelBridgeLoadTest_ExternalServiceBus job already relies on for this broker.
      RabbitMqPasswordValue: $(ExternalRabbitMqPassword)

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $rabbitPasswordSecure = ConvertTo-SecureString $env:RabbitMqPasswordValue -AsPlainText -Force

      & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Configure-RabbitMqShovel.ps1' `
          -RabbitMqManagementUri '$(ProfilerRabbitMqManagementUri)' `
          -RabbitMqUsername '$(ProfilerRabbitMqUsername)' `
          -RabbitMqPassword $rabbitPasswordSecure `
          -VHost '$(ProfilerRabbitMqVirtualHost)' `
          -ShovelName '$(ProfilerShovelName)' `
          -SourceQueue '$(ProfilerShovelSourceQueueName)' `
          -SourceHost 'rabbitmq.warewolf.online' `
          -ServiceBusNamespace '$(ProfilerServiceBusNamespace)' `
          -ServiceBusQueueName '$(ProfilerServiceBusTriggerQueueName)' `
          -ServiceBusSasKeyName '$(ProfilerShovelSendRuleName)' `
          -ServiceBusResourceGroup '$(ProfilerEngineResourceGroup)' `
          -DestUriCaCertFile '$(ProfilerShovelDestUriCaCertFile)' `
          -NonInteractive
    displayName: 'Configure RabbitMQ Shovel (bridge to Azure Service Bus)'
    env:
      RabbitMqPasswordValue: $(ExternalRabbitMqPassword)
