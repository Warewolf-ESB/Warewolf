# Reusable step template: provisions a native SQL Server on the windows-2022 agent
# with the Dev2TestingDB fixture, matching what Depends(MSSQL) -> localhost:1433 and
# the SQL-dependent tests expect (GetDatabaseColumnsForTable_*, GetDatabaseTables_*,
# SqlDatabaseBroker_*, SqlBulkInsert ImportDataIntoTable*).
#
# This restores the native-Windows provisioning that worked before the WOLF-8413
# "run-tests-in-Linux-container / consolidate into TestRun.ps1" refactor removed it.
# Native SQL is used (not a Docker service container) because these test projects are
# Windows/WPF/net48 and cannot run on a Linux agent.
#
# Prerequisites (pipeline variables):
#   - VSTestContainerPassword : SECRET. gitlab token/password used to clone the
#                               mssql-connector-testing repo that holds dev2testingdb.bak.
#   - GitlabUser              : gitlab username (or deploy-token username) that pairs
#                               with the secret above.
steps:
- powershell: |
    $ErrorActionPreference = 'Stop'

    Write-Host "1/5 Installing SQL Server 2022 (native, no Docker)..."
    choco install sql-server-2022 -y --no-progress

    Write-Host "2/5 Enabling TCP + Mixed-mode auth..."
    [System.Reflection.Assembly]::LoadWithPartialName("Microsoft.SqlServer.SqlWmiManagement") | Out-Null
    $wmi  = New-Object Microsoft.SqlServer.Management.Smo.Wmi.ManagedComputer
    $comp = $env:COMPUTERNAME
    $tcp  = $wmi.GetSmoObject("ManagedComputer[@Name='$comp']/ServerInstance[@Name='MSSQLSERVER']/ServerProtocol[@Name='Tcp']")
    $tcp.IsEnabled = $true; $tcp.Alter()
    $srv = [Microsoft.SqlServer.Management.Smo.Server]::new($comp)
    $srv.Settings.LoginMode = 'Mixed'; $srv.Alter()
    Restart-Service 'MSSQLSERVER' -Force

    Write-Host "3/5 Cloning Dev2TestingDB backup from gitlab..."
    if (-not (Test-Path 'C:\Builds')) { New-Item -ItemType Directory 'C:\Builds' | Out-Null }
    $bakRepo = "$(Agent.BuildDirectory)\mssql-connector-testing"
    if (Test-Path $bakRepo) { Remove-Item $bakRepo -Recurse -Force }
    git clone "https://$(GitlabUser):$env:TestDependencyPassword@gitlab.com/warewolf/mssql-connector-testing.git" $bakRepo

    Write-Host "4/5 Creating login + restoring database..."
    sqlcmd -S localhost -E -Q "IF SUSER_ID('testuser') IS NULL CREATE LOGIN [testuser] WITH PASSWORD = 'Ex@mple!23Secure#PWD', CHECK_POLICY = OFF"
    sqlcmd -S localhost -E -Q "EXEC sp_addsrvrolemember 'testuser','sysadmin'"
    sqlcmd -S localhost -E -Q "RESTORE DATABASE [Dev2TestingDB] FROM DISK='$bakRepo\dev2testingdb.bak' WITH MOVE 'Dev2TestingDB' TO 'C:\Builds\Dev2TestingDB.mdf', MOVE 'Dev2TestingDB_log' TO 'C:\Builds\Dev2TestingDB.ldf', REPLACE"
    sqlcmd -S localhost -E -Q "USE Dev2TestingDB; EXEC sp_change_users_login 'AUTO_FIX', 'testuser'"

    Write-Host "5/5 Verifying testuser can connect to Dev2TestingDB..."
    sqlcmd -S localhost,1433 -U testuser -P 'Ex@mple!23Secure#PWD' -d Dev2TestingDB -Q "SET NOCOUNT ON; SELECT TABLE_SCHEMA + '.' + TABLE_NAME FROM INFORMATION_SCHEMA.TABLES"
  displayName: 'Setup SQL Server Dependency'
  env:
    TestDependencyPassword: $(VSTestContainerPassword)
