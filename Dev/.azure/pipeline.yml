        dotnet tool install --global dotnet-coverage
      displayName: 'Add func CLI to PATH and install dotnet-coverage'

    - script: |
        docker run -d --name sambaserver \
          -p 445:445 \
          -e USER="smbuser%smbpass" \
          -e SHARE="share;/share;yes;no;no;smbuser" \
          dperson/samba -u "smbuser;smbpass" -s "share;/share;yes;no;no;smbuser"
        sleep 3
      displayName: 'Start Samba server'

    - script: |
        mkdir -p $(Agent.BuildDirectory)/coverage
        binDir="$(Agent.BuildDirectory)/LinuxTests"
        export AZURE_KEYVAULT_NAME=""
        export SkipFailureToRetrieveSecret="true"
        export FUNCTIONS_WORKER_RUNTIME="dotnet-isolated"
        FUNC_BIN="$(Agent.BuildDirectory)/func-cli/node_modules/azure-functions-core-tools/bin/func"
        chmod -R +x "$(Agent.BuildDirectory)/func-cli/node_modules/azure-functions-core-tools/bin/" 2>/dev/null || true
        chmod +x "$(Agent.BuildDirectory)/LinuxTests/Warewolf.Execution.Lightweight" 2>/dev/null || true
        cd "$binDir"
        $HOME/.dotnet/tools/dotnet-coverage collect \
          --output "$(Agent.BuildDirectory)/coverage/rename_tool_specs_from_unc.engine.cobertura.xml" \
          --output-format cobertura \
          --include-files "$binDir/Warewolf.Execution.Lightweight.dll" \
          --session-id rename_tool_specs_from_unc-session \
          --nologo \
          -- "$FUNC_BIN" start --port 7071 &
        echo $! > $(Agent.BuildDirectory)/engine-coverage.pid
      displayName: 'Start engine under dotnet-coverage'

    - script: |
        for i in $(seq 1 60); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:7071/ 2>/dev/null)
          if [ -n "$STATUS" ] && [ "$STATUS" -ge 100 ] && [ "$STATUS" -ne 503 ] 2>/dev/null; then
            echo "Engine ready (HTTP $STATUS)"; exit 0
          fi
          echo "Attempt $i/60: not ready (${STATUS:-none}), waiting 2s..."; sleep 2
        done
        echo "ERROR: engine did not become ready within 120s"; exit 1
      displayName: 'Wait for engine to be ready'

