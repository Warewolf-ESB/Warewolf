  - job: Other_Specs
    displayName: 'Other Specs'
    pool:
      vmImage: 'windows-2022'
    timeoutInMinutes: 45

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)\WindowsTests'

    # 8501: fail fast with a clear message if the TestBinaries artifact download is
    # incomplete, instead of silently proceeding to a 45-minute connection-refused
    # timeout against port 7071 (see EasyAuthMiddleware.feature failures caused by
    # Microsoft.Win32.SystemEvents.dll going missing from a partial artifact transfer).
    - powershell: |
        $requiredFiles = @(
          'Warewolf.Execution.Lightweight.dll',
          'Microsoft.Win32.SystemEvents.dll',
          'host.json'
        )
        $missing = $requiredFiles | Where-Object {
          -not (Test-Path -LiteralPath (Join-Path '$(Agent.BuildDirectory)\WindowsTests' $_))
        }
        if ($missing) {
          Write-Host "##vso[task.logissue type=error]TestBinaries artifact download is incomplete. Missing required file(s): $($missing -join ', ')"
          Write-Host "This usually means the Compile stage's TestBinaries artifact upload/download was incomplete, not a code regression."
          exit 1
        }
        Write-Host "TestBinaries artifact verified: all required files present."
      displayName: 'Verify TestBinaries artifact completeness'

    - powershell: |
        # Pin to an exact known-good release instead of the floating "@4"
        # semver range. npm resolves "@4" to the highest published 4.x
        # version regardless of deprecation, and Microsoft periodically
        # publishes/deprecates versions (e.g. 4.13.2) whose install-time
        # CDN zip (cdn.functions.azure.com) 404s, breaking this step.
        # 4.13.0 is the current "latest" dist-tag and has a working
        # GitHub release with all platform zips uploaded.
        npm install --prefix $(Agent.BuildDirectory)\func-cli azure-functions-core-tools@4.13.0 2>&1 | Select-Object -Last 5
      displayName: 'Install func CLI'
      errorActionPreference: 'continue'

    - powershell: |
        # 8501: root cause #4 -- without a storage account, the WebJobs Script
        # Host falls back to an in-memory distributed lock manager for its
        # "primary host" lease, which triggers a "Host lock lease acquired" ->
        # "Restarting host." dance. Combined with worker indexing, that hits a
        # known azure-functions-host worker-channel-teardown bug (functions
        # "already exists" 500s -- see Azure/azure-functions-dotnet-worker#2124).
        # Install Azurite so TestRun.ps1 can point AzureWebJobsStorage at a
        # real (emulated) storage account instead, taking the same well-tested
        # blob-lease coordinator path the project's own local.settings.json
        # template already assumes (AzureWebJobsStorage=UseDevelopmentStorage=true).
        # Route through cmd.exe so npm's deprecation warnings (written to
        # stderr) don't get promoted into a terminating PowerShell
        # NativeCommandError under the default $ErrorActionPreference='Stop'
        # -- the same "npm warn deprecated ..." failure mode this dodges was
        # observed directly in build 30237's "Install Azurite" step.
        # Even with Azurite, a single otherwise-normal restart can still land
        # in the collision window and permanently break the run (build
        # ~30237's "Other Specs" failure). host.json's "Host.General": "Debug"
        # now surfaces the actual restart reason (EnteringRestart, logged by
        # WebJobsScriptHostService at Debug under category "Host.General",
        # which our host.json previously left unset and thus filtered by
        # "default": "Information") so future occurrences show *why* the
        # restart fired instead of a bare "Restarting host." with no cause.
        cmd /c "npm install --prefix $(Agent.BuildDirectory)\azurite-cli azurite 2>&1"
        if ($LASTEXITCODE -ne 0) { throw "npm install azurite failed with exit code $LASTEXITCODE" }
      displayName: 'Install Azurite'

    - powershell: |
        Write-Host "##vso[task.prependpath]$(Agent.BuildDirectory)\func-cli\node_modules\azure-functions-core-tools\bin"
        dotnet tool install --global dotnet-coverage --ignore-failed-sources 2>&1 | Write-Host
      displayName: 'Add func CLI to PATH and install dotnet-coverage'
    # 8501: this job was missing -SharedConfigDir, so WAREWOLF_SECURE_CONFIG stayed
    # unset and Warewolf.Security.Specs (SettingsPermissionsSteps.cs) fell back to
    # writing/restoring secure.config directly under $(Agent.BuildDirectory)\WindowsTests
    # -- the Lightweight engine's own watched function-app content root. That write
    # trips the WebJobs Script host's file watcher into a mid-run "Restarting host."
    # (host.json's "Host.General": "Debug" logs "Restarting host." but the isolated
    # worker process is never restarted alongside it), which then hits the same
    # worker-channel "already exists" bug as root cause #4 above (see
    # Azure/azure-functions-dotnet-worker#2124): every function fails to re-load and
    # every request -- including the EasyAuthMiddleware probe of /public/apis.json --
    # returns 500 for the rest of the run. -SharedConfigDir keeps secure.config in a
    # sibling directory outside the watched root, matching the (currently disabled)
    # Other_Security_Specs job template further down this file.
    - task: PowerShell@2
      displayName: 'Run Other Specs'
      inputs:
        filePath: '$(Agent.BuildDirectory)\WindowsTests\TestRun.ps1'
        arguments: >-
          -RetryCount 6
          -Projects "Dev2.Instrumentation.Specs","Warewolf.Security.Specs"
          -TestResultsDir "$(Agent.BuildDirectory)\TestResults"
          -Filter 'TestCategory!=NoConflictingPermissionsSecurity&TestCategory!=ResourcePermissionsSecurity&TestCategory!=ConflictingViewExecutePermissionsSecurity&TestCategory!=ConflictingExecutePermissionsSecurity&TestCategory!=ConflictingViewPermissionsSecurity&TestCategory!=OverlappingUserGroupsPermissionsSecurity&TestCategory!=ServerPermissionsSecurity&TestCategory!=ConflictingContributeViewExecutePermissionsSecurity&TestCategory!=COMIPCSaxonCSandStudioTests'
          -ServerType LightweightExecution
          -FuncExePath "$(Agent.BuildDirectory)\func-cli\node_modules\azure-functions-core-tools\bin\func.exe"
          -AzuriteExePath "$(Agent.BuildDirectory)\azurite-cli\node_modules\.bin\azurite.cmd"
          -LightweightExecutionDir "$(Agent.BuildDirectory)\WindowsTests"
          -CoverageDir "$(Agent.BuildDirectory)\coverage"
          -EngineCoverageFile "$(Agent.BuildDirectory)\coverage\other_specs.engine.cobertura.xml"
          -CoverageIncludeFiles "$(Agent.BuildDirectory)\WindowsTests\Warewolf.Execution.Lightweight.dll"
          -EngineSessionId "other_specs-session"
          -SharedConfigDir "$(Agent.BuildDirectory)\security-config"
        workingDirectory: '$(Agent.BuildDirectory)\WindowsTests'
      env:
        AZURE_KEYVAULT_NAME: ''
        SkipFailureToRetrieveSecret: 'true'
        FUNCTIONS_WORKER_RUNTIME: 'dotnet-isolated'
    - powershell: |
        Get-Process -Name "func" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        Get-Process -Name "Warewolf.Execution.Lightweight" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        Get-Process -Name "azurite" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        Get-Process -Name "node" -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*azurite*" } | Stop-Process -Force -ErrorAction SilentlyContinue
      displayName: 'Stop engine (cleanup)'
      condition: always()
    - task: PublishBuildArtifacts@1
      continueOnError: true
      displayName: 'Upload test results (trx + logs)'
      condition: always()
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\TestResults'
        ArtifactName: '$(System.JobDisplayName)_ServerLogs'
        publishLocation: 'Container'
    - powershell: Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      displayName: 'List TRX files (diagnostic)'
      condition: always()
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        publishRunAttachments: false
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Other Specs'

    - powershell: |
        $trx = Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
        if (-not $trx) { Write-Host "ERROR: no .trx files found"; exit 1 }
      displayName: 'Verify test results exist'
      condition: always()
    - task: PublishPipelineArtifact@1
      continueOnError: true
      displayName: 'Upload engine coverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/other_specs.engine.cobertura.xml'
        artifactName: 'OtherSpecsEngineCoverage'

