trigger:
  batch: true

pool:
  vmImage: 'windows-2022'

stages:
- stage: Compile
  jobs:
  
  - job: build
    displayName: 'Compile'
  
    steps:
    - task: PowerShell@2
      inputs:
        filePath: '$(Agent.BuildDirectory)/s/Compile.ps1'
        arguments: '-ServerTests -StudioProject -MSBuildPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"'
        displayName: 'Compile'

    - powershell: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <subscriptionSettings>
          <add key="CustomerId" value="$env:ChargeBeeCustomerIdValue" />
          <add key="SubscriptionId" value="$env:ChargeBeeSubscriptionIdValue" />
          <add key="Status" value="Active" />
          <add key="PlanId" value="developer" />
          <add key="SubscriptionKey" value="$env:ChargeBeeSubscriptionKeyValue" />
          <add key="SubscriptionSiteName" value="warewolf-test" />
          <add key="StopExecutions" value="false" />
        </subscriptionSettings>
        "@ | Out-File -LiteralPath "$(Agent.BuildDirectory)\s\bin\ServerTests\Warewolf License.secureconfig" -Encoding utf8 -Force
      displayName: 'Programmatically License The Server Under Test'
      env:
        ChargeBeeCustomerIdValue: $(ChargeBeeCustomerId)
        ChargeBeeSubscriptionIdValue: $(ChargeBeeSubscriptionId)
        ChargeBeeSubscriptionKeyValue: $(ChargeBeeSubscriptionKey)
  
    - task: DeleteFiles@1
      inputs:
        SourceFolder: '$(Agent.BuildDirectory)\s\bin\ServerTests'
        Contents: 'TestResults'
  
    - script: |
        docker login --username ashley.lewis@theunlimited.co.za --password %PushVSTestContainer% registry.gitlab.com/warewolf/vstest
        docker rmi registry.gitlab.com/warewolf/vstest:$(Build.SourceVersion)
        docker create --name=$(Build.SourceVersion) registry.gitlab.com/warewolf/vstest:core2022
        docker cp "$(Agent.BuildDirectory)\s\bin\ServerTests" $(Build.SourceVersion):C:\BuildUnderTest
        docker commit $(Build.SourceVersion) registry.gitlab.com/warewolf/vstest:$(Build.SourceVersion)
        docker push registry.gitlab.com/warewolf/vstest:$(Build.SourceVersion)
      displayName: 'Publish Build Image'
      env:
        PushVSTestContainer: $(VSTestContainerPassword)

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\s\bin\ServerTests'
        ArtifactName: 'ServerBinaries'
        publishLocation: 'Container'
        StoreAsTar: false

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\s\bin\StudioProject'
        ArtifactName: 'StudioBinaries'
        publishLocation: 'Container'
        StoreAsTar: false
        
- stage: Test
  jobs:

  - job: Integration_Tests
    displayName: 'Integration Tests'
  
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        artifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)'
  
    - script: |
        cd /d "$(Agent.BuildDirectory)"
        powershell -NoProfile -NoLogo -ExecutionPolicy Bypass -NoExit -File "$(Agent.BuildDirectory)\Job Shortcuts\TestRun.ps1" -RetryCount 6 -Projects Dev2.Integration.Tests -TestsToRun "SearchTestNameName" -PreTestRunScript "StartAsService.ps1 -Cleanup -ResourcesPath ServerTests" -PostTestRunScript ReverseDeployLog.ps1
      displayName: 'Run Tests'
  
    - task: PublishTestResults@2
      inputs:
        testRunner: VSTest
        testResultsFiles: '$(Agent.BuildDirectory)\TestResults\*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Integration Tests'
        
    - script: 'if not exist "$(Agent.BuildDirectory)\TestResults\*.trx" exit 1'
  