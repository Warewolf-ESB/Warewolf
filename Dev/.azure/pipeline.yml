    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)/LinuxTests'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download func CLI'
      inputs:
        buildType: 'current'
        ArtifactName: 'FuncCLI'
        targetPath: '$(Agent.BuildDirectory)/func-cli'

    - script: |
        echo "##vso[task.prependpath]$(Agent.BuildDirectory)/func-cli/node_modules/azure-functions-core-tools/bin"
        dotnet tool install --global dotnet-coverage
      displayName: 'Add func CLI to PATH and install dotnet-coverage'

    - script: |
        mkdir -p $(Agent.BuildDirectory)/coverage
        binDir="$(Agent.BuildDirectory)/LinuxTests"
        export AZURE_KEYVAULT_NAME=""
        export SkipFailureToRetrieveSecret="true"
        export FUNCTIONS_WORKER_RUNTIME="dotnet-isolated"
        FUNC_BIN="$(Agent.BuildDirectory)/func-cli/node_modules/azure-functions-core-tools/bin/func"
        chmod -R +x "$(Agent.BuildDirectory)/func-cli/node_modules/azure-functions-core-tools/bin/" 2>/dev/null || true
        chmod +x "$(Agent.BuildDirectory)/LinuxTests/Warewolf.Execution.Lightweight" 2>/dev/null || true
        cd "$binDir"
        $HOME/.dotnet/tools/dotnet-coverage collect \
          --output "$(Agent.BuildDirectory)/coverage/zip_tool_specs.engine.cobertura.xml" \
          --output-format cobertura \
          --include-files "$binDir/Warewolf.Execution.Lightweight.dll" \
          --session-id zip_tool_specs-session \
          --nologo \
          -- "$FUNC_BIN" start --port 7071 &
        echo $! > $(Agent.BuildDirectory)/engine-coverage.pid
      displayName: 'Start engine under dotnet-coverage'

    - script: |
        for i in $(seq 1 60); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:7071/ 2>/dev/null)
          if [ -n "$STATUS" ] && [ "$STATUS" -ge 100 ] && [ "$STATUS" -ne 503 ] 2>/dev/null; then
            echo "Engine ready (HTTP $STATUS)"; exit 0
          fi
          echo "Attempt $i/60: not ready (${STATUS:-none}), waiting 2s..."; sleep 2
        done
        echo "ERROR: engine did not become ready within 120s"; exit 1
      displayName: 'Wait for engine to be ready'

    - task: PowerShell@2
      displayName: 'Run Zip Tool Specs'
      inputs:
        filePath: '$(Build.SourcesDirectory)/Dev/run-tests-in-container.ps1'
        arguments: >-
          -Assemblies "Warewolf.Tools.Specs"
          -BinDir "$(Agent.BuildDirectory)/LinuxTests"
          -TestResultsDir "$(Agent.BuildDirectory)/TestResults"
          -Filter 'TestCategory=Zip'
          -UseHostNetwork

    - script: |
        covFile="$(Agent.BuildDirectory)/coverage/zip_tool_specs.engine.cobertura.xml"
        if $HOME/.dotnet/tools/dotnet-coverage shutdown zip_tool_specs-session 2>/dev/null; then
          echo "dotnet-coverage shutdown acknowledged"
        else
          echo "WARNING: shutdown returned non-zero"
        fi
        pkill -TERM -f "azure-functions-core-tools" 2>/dev/null || pkill -TERM -f "func start" 2>/dev/null || true
        pkill -TERM -f "Warewolf.Execution.Lightweight" 2>/dev/null || true
        for i in $(seq 1 60); do
          if [ -f "$covFile" ]; then echo "Coverage file appeared after ${i}s"; break; fi
          sleep 1
        done
        if [ -f "$covFile" ]; then
          kb=$(du -k "$covFile" | cut -f1); echo "Coverage written: ${kb}KB"
        else
          echo "##[warning]Coverage file not produced: $covFile"
          echo '<?xml version="1.0" encoding="utf-8"?><coverage line-rate="0" branch-rate="0" version="1.9" timestamp="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0"><sources/><packages/></coverage>' > "$covFile"
        fi
      displayName: 'Stop engine and flush coverage'
      condition: always()

    - script: 'find $(Agent.BuildDirectory)/TestResults -name "*.trx" 2>/dev/null || true'
      displayName: 'List TRX files (diagnostic)'
      condition: always()

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Zip Tool Specs'

    - script: 'find $(Agent.BuildDirectory)/TestResults -name "*.trx" | grep . || (echo "ERROR: no .trx files found"; exit 1)'
      displayName: 'Verify test results exist'
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: 'Upload engine coverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/zip_tool_specs.engine.cobertura.xml'
        artifactName: 'ZipToolSpecsEngineCoverage'

