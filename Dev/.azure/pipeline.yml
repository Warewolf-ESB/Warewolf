      env:
        AZURE_KEYVAULT_NAME: ''
        SkipFailureToRetrieveSecret: 'true'
        FUNCTIONS_WORKER_RUNTIME: 'dotnet-isolated'
        ENABLECONSOLELOGGING: 'false'
        ENABLEELASTICSEARCHLOGGING: 'false'
        ASPNETCORE_ENVIRONMENT: 'Development'
    - powershell: |
        Get-Process -Name "func" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        Get-Process -Name "Warewolf.Execution.Lightweight" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      displayName: 'Stop engine (cleanup)'
      condition: always()
    - task: PublishBuildArtifacts@1
      continueOnError: true
      displayName: 'Upload engine log'
      condition: always()
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\TestResults'
        ArtifactName: '$(System.JobName)_ServerLogs'
        publishLocation: 'Container'
    - powershell: Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      displayName: 'List TRX files (diagnostic)'
      condition: always()
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        publishRunAttachments: false
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Azure Functions Tests'

    - powershell: |
        $trx = Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
        if (-not $trx) { Write-Host "ERROR: no .trx files found"; exit 1 }
      displayName: 'Verify test results exist'
      condition: always()
    - task: PublishPipelineArtifact@1
      continueOnError: true
      displayName: 'Upload engine coverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/engine.cobertura.xml'
        artifactName: 'EngineCoverage'

