trigger:
  batch: true
  # 8402: bumped to retrigger CI after batchedCI got stuck post-cancellation

pool:
  vmImage: 'windows-2022'

# 8452: Selectively run expensive, release-only work on main/integration
# branches only. Developer work-item branches skip the entire Compile Release
# stage, to speed up CI and consume fewer resources.
# Main branches: develop, 7580 (and its sub-lines), 7232 (and its sub-lines).
#
# The Packages Vulnerability Test (the NuGet security gate in Compile.ps1 /
# Run-SecurityGates.ps1) has been moved to pipeline-CLOUD.yml, so this pipeline
# always bypasses it via -SkipVulnerabilityCheck below.
variables:
  ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/7580'), startsWith(variables['Build.SourceBranch'], 'refs/heads/7232')) }}:
    IsMainBranch: 'true'
  ${{ else }}:
    IsMainBranch: 'false'

stages:
- stage: Compile
  jobs:

  - job: build
    displayName: 'Compile'

    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK for Publish'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - task: PowerShell@2
      inputs:
        filePath: '$(Agent.BuildDirectory)/s/Compile.ps1'
        arguments: '-ServerTests -MSBuildPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" -Runtime win-x64 -SkipVulnerabilityCheck'
        displayName: 'Compile'

    # 8501: source-side check, run immediately after Compile.ps1 and before the
    # artifact is published. This isolates whether Microsoft.Win32.SystemEvents.dll
    # (and other required files) go missing during the CI *build/publish* itself
    # (a build-side regression, reproducible only on the hosted agent) versus during
    # the artifact upload/download round-trip to the Test stage (a transfer issue).
    # If this step fails, the bug is in the Compile step on this exact agent. If it
    # passes but the Test stage's "Verify TestBinaries artifact completeness" step
    # still fails, the bug is in the artifact transfer, not the build.
    - powershell: |
        $requiredFiles = @(
          'Warewolf.Execution.Lightweight.dll',
          'Microsoft.Win32.SystemEvents.dll',
          'host.json'
        )
        $ServerTestsDir = "$(Agent.BuildDirectory)\s\bin\ServerTests"
        $missing = $requiredFiles | Where-Object {
          -not (Test-Path -LiteralPath (Join-Path $ServerTestsDir $_))
        }
        if ($missing) {
          Write-Host "##vso[task.logissue type=error]Compile stage output is missing required file(s) BEFORE publish: $($missing -join ', ')"
          Write-Host "This means the build itself dropped the file(s), not the artifact transfer."
          exit 1
        }
        Write-Host "Compile stage output verified: all required files present before publish."
      displayName: 'Verify Compile output completeness (pre-publish)'

    - powershell: |
        $ServerTestsDir = "$(Agent.BuildDirectory)\s\bin\ServerTests"
        if (!(Test-Path -LiteralPath $ServerTestsDir)) {
          New-Item -ItemType Directory -Path $ServerTestsDir -Force | Out-Null
        }
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <subscriptionSettings>
          <add key="CustomerId" value="$env:ChargeBeeCustomerIdValue" />
          <add key="SubscriptionId" value="$env:ChargeBeeSubscriptionIdValue" />
          <add key="Status" value="Active" />
          <add key="PlanId" value="developer" />
          <add key="SubscriptionKey" value="$env:ChargeBeeSubscriptionKeyValue" />
          <add key="SubscriptionSiteName" value="warewolf-test" />
          <add key="StopExecutions" value="false" />
        </subscriptionSettings>
        "@ | Out-File -LiteralPath "$ServerTestsDir\Warewolf License.secureconfig" -Encoding utf8 -Force
      displayName: 'Programmatically License The Server Under Test'
      env:
        ChargeBeeCustomerIdValue: $(ChargeBeeCustomerId)
        ChargeBeeSubscriptionIdValue: $(ChargeBeeSubscriptionId)
        ChargeBeeSubscriptionKeyValue: $(ChargeBeeSubscriptionKey)

    - task: DeleteFiles@1
      inputs:
        SourceFolder: '$(Agent.BuildDirectory)\s\bin\ServerTests'
        Contents: 'TestResults'

    - powershell: |
        Copy-Item '$(Agent.BuildDirectory)\s\Dev\.azure\coverage.runsettings' '$(Agent.BuildDirectory)\s\bin\ServerTests\coverage.runsettings' -Force
      displayName: 'Stage coverage.runsettings into TestBinaries'

    # 8501: was PublishBuildArtifacts@1 (legacy "Container" artifact) downloaded by
    # DownloadPipelineArtifact@2 in the Test stage. That legacy-publish/modern-download
    # bridge was a suspected source of files (observed missing: Microsoft.Win32.SystemEvents.dll)
    # silently dropping out of this large (~2,900 file / ~620MB) artifact, and
    # continueOnError:true masked any upload failure, so the Test stage could download
    # an incomplete TestBinaries artifact and the Lightweight engine's isolated worker
    # would crash at startup with a FileNotFoundException, leaving port 7071 unreachable.
    # Publishing natively as a Pipeline Artifact (matching the download side) removes
    # that cross-system bridge, but did NOT fully resolve the failure on its own in a
    # follow-up CI run, so the pre-publish verification step above plus the Test
    # stage's post-download verification step were added to pinpoint whether the file
    # goes missing during THIS build/publish (compare pre-publish check) or during the
    # artifact transfer itself (compare post-download check).
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Binaries'
      inputs:
        targetPath: '$(Agent.BuildDirectory)\s\bin\ServerTests'
        artifactName: 'TestBinaries'

- stage: Test
  jobs:

  - job: Duplicate_Test_Check
    displayName: 'Duplicate Test Check'
    pool:
      vmImage: 'windows-2022'
    timeoutInMinutes: 30

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)\WindowsTests'

    - task: PowerShell@2
      displayName: 'Fail if any test is selected by more than one job'
      inputs:
        filePath: '$(Agent.BuildDirectory)\s\Dev\.azure\Find-DuplicateTests.ps1'
        arguments: >-
          -BinariesDir "$(Agent.BuildDirectory)\WindowsTests"
          -PipelineYml "$(Agent.BuildDirectory)\s\Dev\.azure\pipeline.yml"
          -OutputDir "$(Agent.BuildDirectory)\DuplicateTestReport"
          -FailOnDuplicates
        workingDirectory: '$(Agent.BuildDirectory)\s'

    - task: PublishBuildArtifacts@1
      condition: always()
      continueOnError: true
      displayName: 'Publish duplicate-test report'
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\DuplicateTestReport'
        ArtifactName: 'DuplicateTestReport'
        publishLocation: 'Container'

  - job: Unit_Tests
    displayName: 'Unit Tests'
    pool:
      vmImage: 'windows-2022'
    timeoutInMinutes: 150

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)\WindowsTests'

    - task: PowerShell@2
      displayName: 'Run Unit Tests'
      inputs:
        filePath: '$(Agent.BuildDirectory)\WindowsTests\TestRun.ps1'
        arguments: >-
          -RetryCount 6
          -Projects "Dev2.*.Tests","Warewolf.*.Tests"
          -ExcludeProjects "Warewolf.Execution.Lightweight.Tests","Warewolf.Execution.Lightweight.Integration.Tests","Warewolf.Execution.EngineJobProcessor.Tests","Warewolf.Execution.ServiceBusWorker.Tests","Warewolf.Execution.QueueProcessor.Tests","Dev2.Integration.Tests","Dev2.Activities.Tests","Dev2.Studio.Tests","Dev2.Studio.Core.Tests","Dev2.CustomControls.Tests","Warewolf.Studio.Models.Tests","Warewolf.Studio.ViewModels.Tests","Warewolf.Studio.CustomControls.Tests","Warewolf.UI.Tests","Warewolf.Web.UI.Tests","Dev2.Infrastructure.Tests","Warewolf.Storage.Tests","Warewolf.Auditing.Tests"
          -TestResultsDir "$(Agent.BuildDirectory)\TestResults"
          -Filter "TestCategory!=CannotParallelize&TestCategory!=ResourceCatalog_LoadTests&TestCategory!=PluginRuntimeHandler&TestCategory!=GatherSystemInformation&TestCategory!=LocalSchedulerAdmin&TestCategory!=Multithread&TestCategory!=AnonymousRedis&TestCategory!=COMIPCSaxonCSandStudioTests&TestCategory!=WFWithRabbitMqConsumeTimeout5&TestCategory!=WarewolfCOMIPCClient_Deprecated&TestCategory!=WebPostTool_Integration&TestCategory!=WebGetTool_Integration"
          -StartElasticsearchServer
          -StartRabbitMQServer
          -Coverage
          -CoverageSettings "$(Agent.BuildDirectory)\WindowsTests\coverage.runsettings"
        workingDirectory: '$(Agent.BuildDirectory)\WindowsTests'
    - powershell: Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      displayName: 'List TRX files (diagnostic)'
      condition: always()

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        publishRunAttachments: false
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Unit Tests'

    - task: PublishBuildArtifacts@1
      continueOnError: true
      displayName: 'Upload test results (trx + logs)'
      condition: always()
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\TestResults'
        ArtifactName: '$(System.JobDisplayName)_ServerLogs'
        publishLocation: 'Container'

    - powershell: |
        $trx = Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
        if (-not $trx) { Write-Host "ERROR: no .trx files found"; exit 1 }
      displayName: 'Verify test results exist'
      condition: always()

    - powershell: |
        $srcFile = "$(Agent.BuildDirectory)\TestResults\Cobertura.xml"
        $destFile = "$(Agent.BuildDirectory)\coverage\unit_tests.cobertura.xml"
        New-Item -ItemType Directory -Force -Path (Split-Path $destFile) | Out-Null
        if (Test-Path $srcFile) {
          Move-Item $srcFile $destFile -Force
          $kb = [Math]::Round((Get-Item $destFile).Length / 1024)
          Write-Host "Unit tests coverage: ${kb}KB"
        } else {
          Write-Host "WARNING: no unit test coverage files produced"
          '<?xml version="1.0" encoding="utf-8"?><coverage line-rate="0" branch-rate="0" version="1.9" timestamp="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0"><sources/><packages/></coverage>' | Out-File $destFile -Encoding UTF8
        }
      displayName: 'Collect unit tests coverage'
      condition: always()

    - task: PublishPipelineArtifact@1
      continueOnError: true
      displayName: 'Upload unit tests coverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/unit_tests.cobertura.xml'
        artifactName: 'UnitTestsCoverage'

