trigger:
  batch: true
  # 8402: bumped to retrigger CI after batchedCI got stuck post-cancellation

pool:
  vmImage: 'windows-2022'

stages:
- stage: Compile
  jobs:

  - job: build
    displayName: 'Compile'

    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK for Publish'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - task: PowerShell@2
      inputs:
        filePath: '$(Agent.BuildDirectory)/s/Compile.ps1'
        arguments: '-ServerTests -MSBuildPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" -Runtime win-x64'
        displayName: 'Compile'

    - powershell: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <subscriptionSettings>
          <add key="CustomerId" value="$env:ChargeBeeCustomerIdValue" />
          <add key="SubscriptionId" value="$env:ChargeBeeSubscriptionIdValue" />
          <add key="Status" value="Active" />
          <add key="PlanId" value="developer" />
          <add key="SubscriptionKey" value="$env:ChargeBeeSubscriptionKeyValue" />
          <add key="SubscriptionSiteName" value="warewolf-test" />
          <add key="StopExecutions" value="false" />
        </subscriptionSettings>
        "@ | Out-File -LiteralPath "$(Agent.BuildDirectory)\s\bin\ServerTests\Warewolf License.secureconfig" -Encoding utf8 -Force
      displayName: 'Programmatically License The Server Under Test'
      env:
        ChargeBeeCustomerIdValue: $(ChargeBeeCustomerId)
        ChargeBeeSubscriptionIdValue: $(ChargeBeeSubscriptionId)
        ChargeBeeSubscriptionKeyValue: $(ChargeBeeSubscriptionKey)

    - task: DeleteFiles@1
      inputs:
        SourceFolder: '$(Agent.BuildDirectory)\s\bin\ServerTests'
        Contents: 'TestResults'

    - powershell: |
        Copy-Item '$(Agent.BuildDirectory)\s\Dev\.azure\coverage.runsettings' '$(Agent.BuildDirectory)\s\bin\ServerTests\coverage.runsettings' -Force
      displayName: 'Stage coverage.runsettings into TestBinaries'

    - task: PublishBuildArtifacts@1
      continueOnError: true
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\s\bin\ServerTests'
        ArtifactName: 'TestBinaries'
        publishLocation: 'Container'
        StoreAsTar: false
        displayName: 'Publish Binaries'

- stage: Test
  jobs:

  - job: File_And_Folder_Rename_Tool_Specs
    displayName: 'File And Folder Rename Tool Specs'
    pool:
      vmImage: 'windows-2022'
    timeoutInMinutes: 45

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)\WindowsTests'

    - powershell: |
        npm install --prefix $(Agent.BuildDirectory)\func-cli azure-functions-core-tools@4 2>&1 | Select-Object -Last 5
      displayName: 'Install func CLI'

    - powershell: |
        Write-Host "##vso[task.prependpath]$(Agent.BuildDirectory)\func-cli\node_modules\azure-functions-core-tools\bin"
        dotnet tool install --global dotnet-coverage --ignore-failed-sources 2>&1 | Write-Host
      displayName: 'Add func CLI to PATH and install dotnet-coverage'
    - task: PowerShell@2
      displayName: 'Run File And Folder Rename Tool Specs'
      inputs:
        filePath: '$(Agent.BuildDirectory)\WindowsTests\TestRun.ps1'
        arguments: >-
          -RetryCount 6
          -Projects "Warewolf.Tools.Specs"
          -TestResultsDir "$(Agent.BuildDirectory)\TestResults"
          -Filter 'TestCategory=FileAndFolderRename'
          -ServerType LightweightExecution
          -FuncExePath "$(Agent.BuildDirectory)\func-cli\node_modules\azure-functions-core-tools\bin\func.exe"
          -LightweightExecutionDir "$(Agent.BuildDirectory)\WindowsTests"
          -CoverageDir "$(Agent.BuildDirectory)\coverage"
          -EngineCoverageFile "$(Agent.BuildDirectory)\coverage\file_and_folder_rename_tool_specs.engine.cobertura.xml"
          -CoverageIncludeFiles "$(Agent.BuildDirectory)\WindowsTests\Warewolf.Execution.Lightweight.dll"
          -EngineSessionId "file_and_folder_rename_tool_specs-session"
          -StartFTPServer
          -StartFTPSServer
        workingDirectory: '$(Agent.BuildDirectory)\WindowsTests'
      env:
        AZURE_KEYVAULT_NAME: ''
        SkipFailureToRetrieveSecret: 'true'
        FUNCTIONS_WORKER_RUNTIME: 'dotnet-isolated'
    - powershell: |
        Get-Process -Name "func" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        Get-Process -Name "Warewolf.Execution.Lightweight" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      displayName: 'Stop engine (cleanup)'
      condition: always()
    - task: PublishBuildArtifacts@1
      continueOnError: true
      displayName: 'Upload engine log'
      condition: always()
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\TestResults'
        ArtifactName: '$(System.JobName)_ServerLogs'
        publishLocation: 'Container'
    - powershell: Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      displayName: 'List TRX files (diagnostic)'
      condition: always()
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        publishRunAttachments: false
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'File And Folder Rename Tool Specs'

    - powershell: |
        $trx = Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
        if (-not $trx) { Write-Host "ERROR: no .trx files found"; exit 1 }
      displayName: 'Verify test results exist'
      condition: always()
    - task: PublishPipelineArtifact@1
      continueOnError: true
      displayName: 'Upload engine coverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/file_and_folder_rename_tool_specs.engine.cobertura.xml'
        artifactName: 'FileFolderRenameEngineCoverage'
