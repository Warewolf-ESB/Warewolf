  - job: ShovelBridgeE2ETest
    displayName: 'RabbitMQ Shovel -> Service Bus E2E Test'
    # This job's own containers (rabbitmq:3-management, azure-sql-edge, and the Azure
    # Service Bus emulator - see the step below) are ALL Linux-only images. Unlike the
    # other RabbitMQ-dependent jobs in this pipeline (e.g. RabbitMQ_Workflow_Execution_Specs,
    # WFWithRabbitMqConsumeTimeout5), which use TestRun.ps1's -Runtime Windows /
    # -LegacyWindowsDeps 'choco install rabbitmq' native-Windows-service path instead of
    # docker, this job also needs the local Azure SQL Edge + Service Bus emulator
    # containers for -DestinationMode Emulator - both Linux-only, with no Windows-native
    # (choco or otherwise) substitute available. A Microsoft-hosted windows-2022 agent's
    # Docker daemon only supports Windows containers (no Hyper-V/WSL2 Linux-container
    # backend, no in-place daemon switch), so it fails to pull ANY of these three images
    # ("no matching manifest for windows/amd64", "could not find plugin bridge") -
    # switching only RabbitMQ to the choco/-RabbitMqMode External technique used by
    # ShovelBridgeE2ETest_ExternalServiceBus in pipeline-CLOUD.yml would still leave the
    # SQL Edge/Service Bus emulator containers broken the same way. Using a Linux pool
    # here instead lets Docker run all three containers natively, exactly as
    # Test-ShovelBridgeE2E.ps1's default Container/Emulator modes already expect - no
    # script changes needed. #Requires -Version 7.0 in Test-ShovelBridgeE2E.ps1 is
    # satisfied by pwsh, which ships on ubuntu-latest hosted images.
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 30

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    # Self-contained: this script owns its own RabbitMQ + Azure SQL Edge + Service
    # Bus emulator containers (plain `docker run`/`docker exec`, same style as
    # TestRun.ps1's Start-HostRabbitMQServer and friends — no docker-compose, no
    # Testcontainers) and builds/runs the E2EHarness itself via `dotnet run`, so
    # no TestBinaries artifact or func CLI is required here. Runs in the default
    # -DestinationMode Emulator (no live Azure dependency, local containers only).
    # The script also supports -DestinationMode ExternalServiceBus against a real
    # Service Bus namespace/queue - wired into CI separately as the
    # ShovelBridgeE2ETest_ExternalServiceBus job in the "Test on Azure" stage of
    # pipeline-CLOUD.yml, against the dedicated WarewolfShovelBridgeTesting namespace.
    - task: PowerShell@2
      displayName: 'Run ShovelBridge E2E test (Emulator mode)'
      inputs:
        filePath: '$(Build.SourcesDirectory)/Dev/Warewolf.Execution.Lightweight/Scripts/Tests/Integration/Test-ShovelBridgeE2E.ps1'
        arguments: '-DestinationMode Emulator'
        pwsh: true
        errorActionPreference: 'stop'
        failOnStderr: false

    - pwsh: |
        $names = docker ps -a --filter "name=shovel-e2e-" --format '{{.Names}}' 2>$null
        if ($names) { $names -split "`n" | Where-Object { $_ } | ForEach-Object { docker rm -f $_ 2>$null | Out-Null } }
        $nets = docker network ls --filter "name=shovel-e2e-" --format '{{.Name}}' 2>$null
        if ($nets) { $nets -split "`n" | Where-Object { $_ } | ForEach-Object { docker network rm $_ 2>$null | Out-Null } }
      displayName: 'Clean up any leftover containers/networks'
      condition: always()

