- stage: Test
  jobs:
  
  - job: Database_Workflow_Execution_Specs
    displayName: 'Database Workflow Execution Specs'
  
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        artifactName: 'ServerBinaries(net6.0-windows)'
        targetPath: '$(Agent.BuildDirectory)'
        
    - powershell: |
        # Define MySQL version and installer URL
        $MySQLVersion = "5.6.51.0"
        $InstallerUrl = "https://dev.mysql.com/get/Downloads/MySQLInstaller/mysql-installer-community-$MySQLVersion.msi"
        $InstallerPath = "$env:TEMP\mysql-installer.msi"
        
        # Define MySQL root password (modify as needed)
        $MYSQL_ROOT_PASSWORD = "admin"
        
        # Define SQL dump file path (ensure this file exists in the script directory)
        $SQLDumpFile = ".\mysqldump.sql"
        
        # Download MySQL installer
        Write-Host "Downloading MySQL Installer..."
        Invoke-WebRequest -Uri $InstallerUrl -OutFile $InstallerPath
        
        # Install MySQL silently
        Write-Host "Installing MySQL..."
        Start-Process -FilePath "msiexec.exe" -ArgumentList "/i "$InstallerPath" /qn" -NoNewWindow -Wait
        
        Start-Sleep -Seconds 10
        
        # Check MySQL service status
        $MySQLService = Get-Service -Name "MySQL*" -ErrorAction SilentlyContinue
        if ($MySQLService -ne $null) {
            Write-Host "MySQL Installation Successful. Service Status: $($MySQLService.Status)"
        } else {
            Write-Host "MySQL Installation Failed!"
            Exit 1
        }
        
        # Clean up installer
        Remove-Item -Path $InstallerPath -Force
        
        # Verify MySQL CLI
        $MySQLVersionCheck = & "mysql" --version
        Write-Host "MySQL Version: $MySQLVersionCheck"
        
        git clone https://ashley.lewis%40theunlimited.co.za:%TestDependencyPassword%@gitlab.com/warewolf/mysql-connector-testing.git
        
        # Execute MySQL dump file
        if (Test-Path $SQLDumpFile) {
            Write-Host "Importing SQL dump file..."
            & "$MySQLBinPath\mysql.exe" -uroot -p"$MYSQL_ROOT_PASSWORD" < ".\mysql-connector-testing\mysqldump.sql"
            Write-Host "SQL import completed successfully."
        } else {
            Write-Host "SQL dump file not found: $SQLDumpFile"
        }
      displayName: 'Start MySQL Server'
      env:
        TestDependencyPassword: $(VSTestContainerPassword)

  
    - script: |
        IF NOT EXIST C:\Builds\PGDATA mkdir C:\Builds\PGDATA
        git clone https://ashley.lewis%40theunlimited.co.za:%TestDependencyPassword%@gitlab.com/warewolf/postgres-connector-testing.git
        copy /Y "postgres-connector-testing\pg_hba.conf" "%PGDATA%\pg_hba.conf"
        copy /Y "postgres-connector-testing\postgres.conf" "%PGDATA%\postgresql.conf"
        sc config postgresql-x64-14 start= auto
        sc start postgresql-x64-14
        ping -n 10 127.0.0.1 > nul        
        type postgres-connector-testing\postgres.backup | "%PGBIN%\psql" --username postgres postgres
        "%PGBIN%\createdb" TestDB
        type postgres-connector-testing\testdb.backup | "%PGBIN%\psql" --username postgres TestDB
        cd /d "$(Agent.BuildDirectory)"
        powershell -NoProfile -NoLogo -ExecutionPolicy Bypass -NoExit -File "$(Agent.BuildDirectory)\TestRun.ps1" -RetryCount 6 -Projects Dev2.Activities.Specs -Category DatabaseWorkflowExecution -PreTestRunScript "StartAsService.ps1 -Cleanup -DoExit -ResourcesPath ServerTests" -PostTestRunScript ReverseDeployLog.ps1
      displayName: 'Run Tests'
      env:
        TestDependencyPassword: $(VSTestContainerPassword)

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\TestResults\warewolf-server.log'
        ArtifactName: 'Database_Workflow_Execution_Specs_Server_Log_File'
        publishLocation: 'Container'
        StoreAsTar: false
        
    - task: PublishTestResults@2
      inputs:
        testRunner: VSTest
        testResultsFiles: '$(Agent.BuildDirectory)\TestResults\*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Database Workflow Execution Specs'
        
    - script: 'if not exist "$(Agent.BuildDirectory)\TestResults\*.trx" exit 1'