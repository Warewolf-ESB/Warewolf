    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
