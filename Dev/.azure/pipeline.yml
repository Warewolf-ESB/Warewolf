trigger:
  batch: true
  # 8402: bumped to retrigger CI after batchedCI got stuck post-cancellation

pool:
  vmImage: 'windows-2022'

stages:
- stage: Compile
  jobs:

  - job: build
    displayName: 'Compile'

    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK for Publish'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - task: PowerShell@2
      inputs:
        filePath: '$(Agent.BuildDirectory)/s/Compile.ps1'
        arguments: '-ServerTests -MSBuildPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"'
        displayName: 'Compile'

    - powershell: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <subscriptionSettings>
          <add key="CustomerId" value="$env:ChargeBeeCustomerIdValue" />
          <add key="SubscriptionId" value="$env:ChargeBeeSubscriptionIdValue" />
          <add key="Status" value="Active" />
          <add key="PlanId" value="developer" />
          <add key="SubscriptionKey" value="$env:ChargeBeeSubscriptionKeyValue" />
          <add key="SubscriptionSiteName" value="warewolf-test" />
          <add key="StopExecutions" value="false" />
        </subscriptionSettings>
        "@ | Out-File -LiteralPath "$(Agent.BuildDirectory)\s\bin\ServerTests\Warewolf License.secureconfig" -Encoding utf8 -Force
      displayName: 'Programmatically License The Server Under Test'
      env:
        ChargeBeeCustomerIdValue: $(ChargeBeeCustomerId)
        ChargeBeeSubscriptionIdValue: $(ChargeBeeSubscriptionId)
        ChargeBeeSubscriptionKeyValue: $(ChargeBeeSubscriptionKey)

    - task: DeleteFiles@1
      inputs:
        SourceFolder: '$(Agent.BuildDirectory)\s\bin\ServerTests'
        Contents: 'TestResults'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\s\bin\ServerTests'
        ArtifactName: 'TestBinaries'
        publishLocation: 'Container'
        StoreAsTar: false
        displayName: 'Publish Binaries'

  - job: Install_Func_CLI
    displayName: 'Install func CLI (linux)'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: none

    - script: |
        npm install --prefix $(Agent.BuildDirectory)/func-cli azure-functions-core-tools@4 --quiet 2>&1 | tail -5
        $(Agent.BuildDirectory)/func-cli/node_modules/.bin/func --version
      displayName: 'Install func CLI locally'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish func CLI as pipeline artifact'
      inputs:
        targetPath: '$(Agent.BuildDirectory)/func-cli'
        artifact: 'FuncCLI'
        publishLocation: 'pipeline'

- stage: Test
  jobs:

  - job: Unit_Tests
    displayName: 'Unit Tests'
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 150

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)/LinuxTests'

    - task: PowerShell@2
      displayName: 'Run Unit Tests'
      inputs:
        filePath: '$(Build.SourcesDirectory)/Dev/run-tests-in-container.ps1'
        arguments: >-
          -BinDir "$(Agent.BuildDirectory)/LinuxTests"
          -ExcludeAssemblies "Warewolf.Execution.Lightweight.Tests","Warewolf.Execution.Lightweight.Integration.Tests","Dev2.Integration.Tests","Dev2.Activities.Tests", "*.Specs"
          -TestResultsDir "$(Agent.BuildDirectory)/TestResults"
          -CoverageDir "$(Agent.BuildDirectory)/coverage"
          -Filter "TestCategory!=CannotParallelize&TestCategory!=ResourceCatalog_LoadTests&TestCategory!=PluginRuntimeHandler&TestCategory!=GatherSystemInformation&TestCategory!=LocalSchedulerAdmin&TestCategory!=Multithread&TestCategory!=AnonymousRedis&TestCategory!=COMIPCSaxonCSandStudioTests&TestCategory!=WFWithRabbitMqConsumeTimeout5&TestCategory!=WarewolfCOMIPCClient_Deprecated&TestCategory!=WebPostTool_Integration&TestCategory!=WebGetTool_Integration"

    - script: 'find $(Agent.BuildDirectory)/TestResults -name "*.trx" 2>/dev/null || true'
      displayName: 'List TRX files (diagnostic)'
      condition: always()

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Unit Tests'

    - script: 'find $(Agent.BuildDirectory)/TestResults -name "*.trx" | grep . || (echo "ERROR: no .trx files found"; exit 1)'
      displayName: 'Verify test results exist'
      condition: always()

    - script: |
        dotnet tool install --global dotnet-coverage
        covXmls=$(ls "$(Agent.BuildDirectory)/coverage/"*.cobertura.xml 2>/dev/null | tr '\n' ' ')
        if [ -n "$covXmls" ]; then
          $HOME/.dotnet/tools/dotnet-coverage merge $covXmls \
            --output "$(Agent.BuildDirectory)/coverage/unit_tests.cobertura.xml" \
            --output-format cobertura \
            --nologo
          kb=$(du -k "$(Agent.BuildDirectory)/coverage/unit_tests.cobertura.xml" | cut -f1)
          echo "Unit tests coverage: ${kb}KB"
        else
          echo "WARNING: no unit test coverage files produced"
          echo '<?xml version="1.0" encoding="utf-8"?><coverage line-rate="0" branch-rate="0" version="1.9" timestamp="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0"><sources/><packages/></coverage>' \
            > "$(Agent.BuildDirectory)/coverage/unit_tests.cobertura.xml"
        fi
      displayName: 'Merge unit tests coverage'
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: 'Upload unit tests coverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/unit_tests.cobertura.xml'
        artifactName: 'UnitTestsCoverage'

