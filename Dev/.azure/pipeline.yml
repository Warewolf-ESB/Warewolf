trigger:
  batch: true
  # 8402: bumped to retrigger CI after batchedCI got stuck post-cancellation

pool:
  vmImage: 'windows-2022'

stages:
- stage: Compile
  jobs:

  - job: build
    displayName: 'Compile'

    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK for Publish'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - task: PowerShell@2
      inputs:
        filePath: '$(Agent.BuildDirectory)/s/Compile.ps1'
        arguments: '-ServerTests -MSBuildPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" -Runtime win-x64'
        displayName: 'Compile'

    - powershell: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <subscriptionSettings>
          <add key="CustomerId" value="$env:ChargeBeeCustomerIdValue" />
          <add key="SubscriptionId" value="$env:ChargeBeeSubscriptionIdValue" />
          <add key="Status" value="Active" />
          <add key="PlanId" value="developer" />
          <add key="SubscriptionKey" value="$env:ChargeBeeSubscriptionKeyValue" />
          <add key="SubscriptionSiteName" value="warewolf-test" />
          <add key="StopExecutions" value="false" />
        </subscriptionSettings>
        "@ | Out-File -LiteralPath "$(Agent.BuildDirectory)\s\bin\ServerTests\Warewolf License.secureconfig" -Encoding utf8 -Force
      displayName: 'Programmatically License The Server Under Test'
      env:
        ChargeBeeCustomerIdValue: $(ChargeBeeCustomerId)
        ChargeBeeSubscriptionIdValue: $(ChargeBeeSubscriptionId)
        ChargeBeeSubscriptionKeyValue: $(ChargeBeeSubscriptionKey)

    - task: DeleteFiles@1
      inputs:
        SourceFolder: '$(Agent.BuildDirectory)\s\bin\ServerTests'
        Contents: 'TestResults'

    - powershell: |
        Copy-Item '$(Agent.BuildDirectory)\s\Dev\.azure\coverage.runsettings' '$(Agent.BuildDirectory)\s\bin\ServerTests\coverage.runsettings' -Force
      displayName: 'Stage coverage.runsettings into TestBinaries'

    - task: PublishBuildArtifacts@1
      continueOnError: true
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\s\bin\ServerTests'
        ArtifactName: 'TestBinaries'
        publishLocation: 'Container'
        StoreAsTar: false
        displayName: 'Publish Binaries'

- stage: Test
  jobs:

  - job: Duplicate_Test_Check
    displayName: 'Duplicate Test Check'
    pool:
      vmImage: 'windows-2022'
    timeoutInMinutes: 30

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)\WindowsTests'

    - task: PowerShell@2
      displayName: 'Fail if any test is selected by more than one job'
      inputs:
        filePath: '$(Agent.BuildDirectory)\s\Dev\.azure\Find-DuplicateTests.ps1'
        arguments: >-
          -BinariesDir "$(Agent.BuildDirectory)\WindowsTests"
          -PipelineYml "$(Agent.BuildDirectory)\s\Dev\.azure\pipeline.yml"
          -OutputDir "$(Agent.BuildDirectory)\DuplicateTestReport"
          -FailOnDuplicates
        workingDirectory: '$(Agent.BuildDirectory)\s'

    - task: PublishBuildArtifacts@1
      condition: always()
      continueOnError: true
      displayName: 'Publish duplicate-test report'
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\DuplicateTestReport'
        ArtifactName: 'DuplicateTestReport'
        publishLocation: 'Container'

  - job: Unit_Tests
    displayName: 'Unit Tests'
    pool:
      vmImage: 'windows-2022'
    timeoutInMinutes: 150

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)\WindowsTests'

    - task: PowerShell@2
      displayName: 'Run Unit Tests'
      inputs:
        filePath: '$(Agent.BuildDirectory)\WindowsTests\TestRun.ps1'
        arguments: >-
          -RetryCount 6
          -Projects "Dev2.*.Tests","Warewolf.*.Tests"
          -ExcludeProjects "Warewolf.Execution.Lightweight.Tests","Warewolf.Execution.Lightweight.Integration.Tests","Dev2.Integration.Tests","Dev2.Activities.Tests","Dev2.Studio.Tests","Dev2.Studio.Core.Tests","Dev2.CustomControls.Tests","Warewolf.Studio.Models.Tests","Warewolf.Studio.ViewModels.Tests","Warewolf.Studio.CustomControls.Tests","Warewolf.UI.Tests","Warewolf.Web.UI.Tests","Dev2.Infrastructure.Tests","Warewolf.Storage.Tests","Warewolf.Auditing.Tests"
          -TestResultsDir "$(Agent.BuildDirectory)\TestResults"
          -Filter "TestCategory!=CannotParallelize&TestCategory!=ResourceCatalog_LoadTests&TestCategory!=PluginRuntimeHandler&TestCategory!=GatherSystemInformation&TestCategory!=LocalSchedulerAdmin&TestCategory!=Multithread&TestCategory!=AnonymousRedis&TestCategory!=COMIPCSaxonCSandStudioTests&TestCategory!=WFWithRabbitMqConsumeTimeout5&TestCategory!=WarewolfCOMIPCClient_Deprecated&TestCategory!=WebPostTool_Integration&TestCategory!=WebGetTool_Integration"
          -StartElasticsearchServer
          -StartRabbitMQServer
          -Coverage
          -CoverageSettings "$(Agent.BuildDirectory)\WindowsTests\coverage.runsettings"
        workingDirectory: '$(Agent.BuildDirectory)\WindowsTests'
    - powershell: Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      displayName: 'List TRX files (diagnostic)'
      condition: always()

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        publishRunAttachments: false
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Unit Tests'

    - powershell: |
        $trx = Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
        if (-not $trx) { Write-Host "ERROR: no .trx files found"; exit 1 }
      displayName: 'Verify test results exist'
      condition: always()

    - powershell: |
        $srcFile = "$(Agent.BuildDirectory)\TestResults\Cobertura.xml"
        $destFile = "$(Agent.BuildDirectory)\coverage\unit_tests.cobertura.xml"
        New-Item -ItemType Directory -Force -Path (Split-Path $destFile) | Out-Null
        if (Test-Path $srcFile) {
          Move-Item $srcFile $destFile -Force
          $kb = [Math]::Round((Get-Item $destFile).Length / 1024)
          Write-Host "Unit tests coverage: ${kb}KB"
        } else {
          Write-Host "WARNING: no unit test coverage files produced"
          '<?xml version="1.0" encoding="utf-8"?><coverage line-rate="0" branch-rate="0" version="1.9" timestamp="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0"><sources/><packages/></coverage>' | Out-File $destFile -Encoding UTF8
        }
      displayName: 'Collect unit tests coverage'
      condition: always()

    - task: PublishPipelineArtifact@1
      continueOnError: true
      displayName: 'Upload unit tests coverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/unit_tests.cobertura.xml'
        artifactName: 'UnitTestsCoverage'
 
  - job: File_And_Folder_Rename_Tool_Specs
    displayName: 'File And Folder Rename Tool Specs'
    pool:
      vmImage: 'windows-2022'
    timeoutInMinutes: 45

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)\WindowsTests'

    - powershell: |
        npm install --prefix $(Agent.BuildDirectory)\func-cli azure-functions-core-tools@4 2>&1 | Select-Object -Last 5
      displayName: 'Install func CLI'

    - powershell: |
        Write-Host "##vso[task.prependpath]$(Agent.BuildDirectory)\func-cli\node_modules\azure-functions-core-tools\bin"
        dotnet tool install --global dotnet-coverage --ignore-failed-sources 2>&1 | Write-Host
      displayName: 'Add func CLI to PATH and install dotnet-coverage'
    - task: PowerShell@2
      displayName: 'Run File And Folder Rename Tool Specs'
      inputs:
        filePath: '$(Agent.BuildDirectory)\WindowsTests\TestRun.ps1'
        arguments: >-
          -RetryCount 6
          -Projects "Warewolf.Tools.Specs"
          -TestResultsDir "$(Agent.BuildDirectory)\TestResults"
          -Filter 'TestCategory=FileAndFolderRename'
          -ServerType LightweightExecution
          -FuncExePath "$(Agent.BuildDirectory)\func-cli\node_modules\azure-functions-core-tools\bin\func.exe"
          -LightweightExecutionDir "$(Agent.BuildDirectory)\WindowsTests"
          -CoverageDir "$(Agent.BuildDirectory)\coverage"
          -EngineCoverageFile "$(Agent.BuildDirectory)\coverage\file_and_folder_rename_tool_specs.engine.cobertura.xml"
          -CoverageIncludeFiles "$(Agent.BuildDirectory)\WindowsTests\Warewolf.Execution.Lightweight.dll"
          -EngineSessionId "file_and_folder_rename_tool_specs-session"
          -StartFTPServer
          -StartFTPSServer
        workingDirectory: '$(Agent.BuildDirectory)\WindowsTests'
      env:
        AZURE_KEYVAULT_NAME: ''
        SkipFailureToRetrieveSecret: 'true'
        FUNCTIONS_WORKER_RUNTIME: 'dotnet-isolated'
    - powershell: |
        Get-Process -Name "func" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        Get-Process -Name "Warewolf.Execution.Lightweight" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      displayName: 'Stop engine (cleanup)'
      condition: always()
    - task: PublishBuildArtifacts@1
      continueOnError: true
      displayName: 'Upload engine log'
      condition: always()
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\TestResults'
        ArtifactName: '$(System.JobName)_ServerLogs'
        publishLocation: 'Container'
    - powershell: Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      displayName: 'List TRX files (diagnostic)'
      condition: always()
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        publishRunAttachments: false
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'File And Folder Rename Tool Specs'

    - powershell: |
        $trx = Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
        if (-not $trx) { Write-Host "ERROR: no .trx files found"; exit 1 }
      displayName: 'Verify test results exist'
      condition: always()
    - task: PublishPipelineArtifact@1
      continueOnError: true
      displayName: 'Upload engine coverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/file_and_folder_rename_tool_specs.engine.cobertura.xml'
        artifactName: 'FileFolderRenameEngineCoverage'

