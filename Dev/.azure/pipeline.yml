        docker run -d --name ftpsserver \
          -p 1010:21 -p 30010-30019:30010-30019 \
          -e FTP_USER_NAME=dev2 \
          -e "FTP_USER_PASS=Q/ulw&]" \
          -e FTP_USER_HOME=/home/ftpusers/dev2 \
          -e PASV_MIN_PORT=30010 \
          -e PASV_MAX_PORT=30019 \
          -e PASV_ADDRESS=127.0.0.1 \
          -e TLS_CN=localhost \
          -e TLS_ORG=Warewolf \
          -e TLS_C=ZA \
          stilliard/pure-ftpd
        sleep 5
        docker exec ftpsserver mkdir -p /home/ftpusers/dev2/FORCOPYFILETESTING || true
        for i in 0 1 2 3 4; do
          docker exec ftpsserver sh -c "echo 'testcontent' > /home/ftpusers/dev2/FORCOPYFILETESTING/copyfile${i}.txt" || true
        done
