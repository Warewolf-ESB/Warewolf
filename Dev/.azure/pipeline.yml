          Write-Host ("Merging unit test coverage: " + ($unitFiles -join ' '))
          dotnet-coverage merge $unitFiles --output "$(Agent.BuildDirectory)\coverage\merged\unit_merged.cobertura.xml" --output-format cobertura --nologo
          $kb = [Math]::Round((Get-Item "$(Agent.BuildDirectory)\coverage\merged\unit_merged.cobertura.xml").Length / 1024)
          Write-Host "Unit merged: ${kb}KB"
        } else {
          Write-Host "ERROR: no unit test coverage files found to merge"
          exit 1
        }

        $intFiles = Get-ChildItem "$(Agent.BuildDirectory)\coverage\int-*" -Filter "*.engine.cobertura.xml" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
        if ($intFiles) {
          Write-Host ("Merging integration test coverage: " + ($intFiles -join ' '))
          $prefilterPath = "$(Agent.BuildDirectory)\coverage\merged\prefilt_int.py"
          # NB: the here-string body and closing '@ must sit at the YAML
          # block's common-indent level (no extra leading whitespace) so the
          # generated script has '@ at column 0 — PowerShell requires that
          # to close a here-string.
          @'
        import xml.etree.ElementTree as ET
        import re, sys
        keep = re.compile(r'^(Dev2\.|Warewolf\.)')
        deny = re.compile(r'^(Warewolf\.Weave|Elastic\.Clients\.Elasticsearch|Microsoft\.Azure\.WebJobs\.|WebJobs\.|StackExchange\.Redis|ServiceStack|Microsoft\.Azure\.AppService|FSharp\.Core|DotNetWorker\.Grpc|Microsoft\.Azure\.Functions\.Worker\.Grpc|.*\.Tests$|.*\.Specs$|Warewolf\.Testing|Warewolf\.UnitTestAttributes$|Dev2\.UnitTestUtils$|Dev2\.Studio|Dev2\.CustomControls$|Dev2\.Intellisense$|Warewolf\.Studio\.|Warewolf\.UI$|Warewolf\.Web\.UI$|warewolfBI$)')
        def filter_xml(path):
            try:
                tree = ET.parse(path)
            except Exception as e:
                print(f'  skip {path}: {e}')
                return
            root = tree.getroot()
            pkgs = root.find('packages')
            if pkgs is None:
                return
            removed = [p for p in list(pkgs) if not keep.match(p.get('name', '')) or deny.match(p.get('name', ''))]
            for p in removed:
                pkgs.remove(p)
            tree.write(path, xml_declaration=True, encoding='unicode')
            print(f'  {path}: removed {len(removed)} packages')
        for f in sys.argv[1:]:
            filter_xml(f)
        '@ | Out-File $prefilterPath -Encoding utf8
          python $prefilterPath $intFiles
          Remove-Item $prefilterPath -Force
          dotnet-coverage merge $intFiles --output "$(Agent.BuildDirectory)\coverage\merged\integration_merged.cobertura.xml" --output-format cobertura --nologo
          $kb = [Math]::Round((Get-Item "$(Agent.BuildDirectory)\coverage\merged\integration_merged.cobertura.xml").Length / 1024)
          Write-Host "Integration merged: ${kb}KB"
        } else {
          Write-Host "ERROR: no integration test coverage files found to merge"
          exit 1
        }

        dotnet-coverage merge "$(Agent.BuildDirectory)\coverage\merged\unit_merged.cobertura.xml" "$(Agent.BuildDirectory)\coverage\merged\integration_merged.cobertura.xml" --output "$(Agent.BuildDirectory)\coverage\merged\all_merged.cobertura.xml" --output-format cobertura --nologo
        $kb = [Math]::Round((Get-Item "$(Agent.BuildDirectory)\coverage\merged\all_merged.cobertura.xml").Length / 1024)
        Write-Host "All merged: ${kb}KB"

        $filterPath = "$(Agent.BuildDirectory)\coverage\merged\filter_cov.py"
        @'
        import xml.etree.ElementTree as ET
        import re, glob, sys
        keep = re.compile(r'^(Dev2\.|Warewolf\.)')
        deny = re.compile(r'^(Warewolf\.Weave|Elastic\.Clients\.Elasticsearch|Microsoft\.Azure\.WebJobs\.|WebJobs\.|StackExchange\.Redis|ServiceStack|Microsoft\.Azure\.AppService|FSharp\.Core|DotNetWorker\.Grpc|Microsoft\.Azure\.Functions\.Worker\.Grpc|.*\.Tests$|.*\.Specs$|Warewolf\.Testing|Warewolf\.UnitTestAttributes$|Dev2\.UnitTestUtils$|Dev2\.Studio|Dev2\.CustomControls$|Dev2\.Intellisense$|Warewolf\.Studio\.|Warewolf\.UI$|Warewolf\.Web\.UI$|warewolfBI$)')
        def filter_xml(path):
            tree = ET.parse(path)
            root = tree.getroot()
            pkgs = root.find('packages')
            if pkgs is None:
                return
            removed = [p for p in list(pkgs) if not keep.match(p.get('name', '')) or deny.match(p.get('name', ''))]
            for p in removed:
                pkgs.remove(p)
            lc = lv = bc = bv = 0
            for line in root.iter('line'):
                lv += 1
                if int(line.get('hits', '0')) > 0:
                    lc += 1
                if line.get('branch') == 'True':
                    for cond in line.findall('conditions/condition'):
                        bv += 1
                        if cond.get('coverage', '0%') != '0%':
                            bc += 1
            root.set('lines-covered', str(lc))
            root.set('lines-valid', str(lv))
            root.set('branches-covered', str(bc))
            root.set('branches-valid', str(bv))
            root.set('line-rate', f'{lc/lv:.6f}' if lv else '0')
            root.set('branch-rate', f'{bc/bv:.6f}' if bv else '0')
            tree.write(path, xml_declaration=True, encoding='unicode')
            print(f'{path}: removed {len(removed)} packages, {lc}/{lv} lines, {bc}/{bv} branches')
        for f in glob.glob(f'{sys.argv[1]}/*.cobertura.xml'):
            filter_xml(f)
        '@ | Out-File $filterPath -Encoding utf8
        python $filterPath "$(Agent.BuildDirectory)\coverage\merged"
        Remove-Item $filterPath -Force
      displayName: 'Merge coverage reports'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish combined coverage'
      condition: always()
      inputs:
        summaryFileLocation: '$(Agent.BuildDirectory)/coverage/merged/all_merged.cobertura.xml'

    - powershell: |
        $minLine   = 60.0
        $report    = "$(Agent.BuildDirectory)\coverage\merged\all_merged.cobertura.xml"
        if (-not (Test-Path $report)) {
          Write-Host "##vso[task.logissue type=error]Merged coverage report not found at $report"
          exit 1
        }
        [xml]$xml = Get-Content $report
        $lineRate   = [double]$xml.coverage.'line-rate'
        $branchRate = [double]$xml.coverage.'branch-rate'
        $linePct    = [Math]::Round($lineRate   * 100, 2)
        $branchPct  = [Math]::Round($branchRate * 100, 2)
        Write-Host "Line coverage:   $linePct% (threshold $minLine%)"
        Write-Host "Branch coverage: $branchPct% (informational, no threshold)"
        if ($linePct -lt $minLine) {
          Write-Host "##vso[task.logissue type=error]Line coverage $linePct% is below the $minLine% threshold."
          exit 1
        }
        Write-Host "Coverage thresholds met."
      displayName: 'Enforce coverage thresholds (line >= 60%)'
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: 'Publish merged coverage snapshot'
      condition: always()
      continueOnError: true
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/merged/all_merged.cobertura.xml'
        artifactName: 'MergedCoverageSnapshot'
- stage: Compile_Release
  displayName: 'Compile Release'
  # 8452: Release compilation (and the git version tagging it performs) only runs
  # on main/integration branches. Developer work-item branches skip it entirely.
  condition: and(succeeded(), eq(variables['IsMainBranch'], 'true'))
  jobs:

  - job: build_release
    displayName: 'Compile for Release'

    steps:
    - checkout: self
      clean: true
      persistCredentials: true

    - task: PowerShell@2
      inputs:
        filePath: '$(Agent.BuildDirectory)/s/Compile.ps1'
        arguments: '-ServerTests -AutoVersion -Config Release -Target Rebuild -ProjectSpecificOutputs -MSBuildPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" -GitCredential ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount'
      displayName: 'Compile in Release Config'
      env:
        GitLabTagsAccount: $(GitLabTagsAccountPassword)

    - powershell: |
        Write-Host Testing Warewolf assembly file versions...
        $HighestReadVersion = "0.0.0.0"
        $LastReadVersion = "0.0.0.0"
        foreach ($file in Get-ChildItem -recurse "$(Agent.BuildDirectory)\s\Dev") {
            if (($file.Name.EndsWith(".dll") -or ($file.Name.EndsWith(".exe") -and -Not $file.Name.EndsWith(".vshost.exe"))) -and ($file.Name.StartsWith("Dev2.") -or $file.Name.StartsWith("Warewolf.") -or $file.Name.StartsWith("WareWolf")) -and $file.Name -ne "Warewolf.Usage.dll") {
                # Get version.
                $ReadVersion = [system.diagnostics.fileversioninfo]::GetVersionInfo($file.FullName).FileVersion

                 Find highest version
                $SeperateVersionNumbers = $ReadVersion.split(".")
                $SeperateVersionNumbersHighest = $HighestReadVersion.split(".")
                if ([convert]::ToInt32($SeperateVersionNumbers[0], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[0], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[1], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[1], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[2], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[2], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[3], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[3], 10)){
                    $HighestReadVersion = $ReadVersion
                }

                # Check for invalid.
                if ($ReadVersion.StartsWith("0.0.") -or ($LastReadVersion -ne $ReadVersion -and $LastReadVersion -ne "0.0.0.0")) {
                    $getFullPath = $file.FullName
                    Write-Host ERROR! Invalid version! $getFullPath $ReadVersion $LastReadVersion
                    throw "ERROR! `"$getFullPath $ReadVersion`" is either an invalid version or not equal to `"$LastReadVersion`". All Warewolf assembly versions in `"$TestsPath`" must conform and cannot start with 0.0. or end with .0"
                }
                $LastReadVersion = $ReadVersion
            }
        }
        Out-File -LiteralPath "$(Agent.BuildDirectory)\s\Dev\Dev2.Server\bin\Release\FullVersionString" -InputObject $HighestReadVersion -Encoding default -Force
        Out-File -LiteralPath "$(Agent.BuildDirectory)\s\Dev\Dev2.Studio\bin\Release\FullVersionString" -InputObject $HighestReadVersion -Encoding default -Force
        git -C "$(Build.SourcesDirectory)" tag $HighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf $HighestReadVersion
        $VersionArray = $HighestReadVersion.Split('.')
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 3) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf $TrimmedHighestReadVersion
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 2) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf $TrimmedHighestReadVersion
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 1) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf $TrimmedHighestReadVersion
        Write-Host "##vso[build.updatebuildnumber]$(Build.BuildNumber) ($HighestReadVersion)"
      env:
        GitLabTagsAccount: $(GitLabTagsAccountPassword)

    - task: PublishBuildArtifacts@1
      continueOnError: true
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\\s\\Dev\\Dev2.Server\\bin\\Release\'
        ArtifactName: 'Release Server'
        publishLocation: 'Container'
        StoreAsTar: false

    - task: PublishBuildArtifacts@1
      continueOnError: true
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\\s\\Dev\\Dev2.Studio\\bin\\Release\'
        ArtifactName: 'Release Studio'
        publishLocation: 'Container'
        StoreAsTar: false

