  - job: Gather_System_Information_Unit_Tests
    displayName: 'Gather System Information Unit Tests'
    pool:
      vmImage: 'windows-2022'
    timeoutInMinutes: 90

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)\WindowsTests'

    - task: PowerShell@2
      displayName: 'Run Gather System Information Unit Tests'
      inputs:
        filePath: '$(Agent.BuildDirectory)\WindowsTests\TestRun.ps1'
        arguments: >-
          -RetryCount 6
          -Projects "Dev2.*.Tests","Warewolf.*.Tests"
          -ExcludeProjects "Dev2.Integration.Tests","Dev2.Studio.Core.Tests","Dev2.Studio.Tests","Dev2.CustomControls.Tests","Dev2.Runtime.Tests","Dev2.Infrastructure.Tests","Warewolf.UI.Tests","Warewolf.Logger.Tests","Warewolf.Studio.Models.Tests","Warewolf.Studio.ViewModels.Tests","Warewolf.Studio.CustomControls.Tests","Warewolf.Web.UI.Tests","Warewolf.Storage.Tests","Warewolf.Auditing.Tests"
          -TestResultsDir "$(Agent.BuildDirectory)\TestResults"
          -Filter 'TestCategory=GatherSystemInformation'
          -Coverage
          -CoverageSettings "$(Agent.BuildDirectory)\WindowsTests\coverage.runsettings"
        workingDirectory: '$(Agent.BuildDirectory)\WindowsTests'
    - powershell: Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      displayName: 'List TRX files (diagnostic)'
      condition: always()

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        publishRunAttachments: false
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Gather System Information Unit Tests'

    - powershell: |
        $trx = Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
        if (-not $trx) { Write-Host "ERROR: no .trx files found"; exit 1 }
      displayName: 'Verify test results exist'
      condition: always()

    - powershell: |
        $srcFile = "$(Agent.BuildDirectory)\TestResults\Cobertura.xml"
        $destFile = "$(Agent.BuildDirectory)\coverage\gather_system_information_unit_tests.cobertura.xml"
        New-Item -ItemType Directory -Force -Path (Split-Path $destFile) | Out-Null
        if (Test-Path $srcFile) {
          Move-Item $srcFile $destFile -Force
          $kb = [Math]::Round((Get-Item $destFile).Length / 1024)
          Write-Host "Gather System Information Unit Tests coverage: ${kb}KB"
        } else {
          Write-Host "WARNING: coverage file was not produced"
          '<?xml version="1.0" encoding="utf-8"?><coverage line-rate="0" branch-rate="0" version="1.9" timestamp="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0"><sources/><packages/></coverage>' | Out-File $destFile -Encoding UTF8
        }
      displayName: 'Collect coverage'
      condition: always()

    - task: PublishPipelineArtifact@1
      continueOnError: true
      displayName: 'Upload GatherSysInfoCoverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/gather_system_information_unit_tests.cobertura.xml'
        artifactName: 'GatherSysInfoCoverage'

