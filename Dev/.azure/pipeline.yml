      displayName: 'List TRX files (diagnostic)'
      condition: always()

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Move Tool Specs From FTP'

    - script: 'find $(Agent.BuildDirectory)/TestResults -name "*.trx" | grep . || (echo "ERROR: no .trx files found"; exit 1)'
      displayName: 'Verify test results exist'
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: 'Upload engine coverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/move_tool_specs_from_ftp.engine.cobertura.xml'
        artifactName: 'MoveFromFTPEngineCoverage'

