  - job: AzureFunctionsIntegrationTests
    displayName: 'Azure Functions Integration Tests'
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 45

    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'TestBinaries'
        targetPath: '$(Agent.BuildDirectory)/LinuxTests'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download func CLI'
      inputs:
        buildType: 'current'
        ArtifactName: 'FuncCLI'
        targetPath: '$(Agent.BuildDirectory)/func-cli'

    - script: |
        echo "##vso[task.prependpath]$(Agent.BuildDirectory)/func-cli/node_modules/azure-functions-core-tools/bin"
        dotnet tool install --global dotnet-coverage
      displayName: 'Add func CLI to PATH and install dotnet-coverage'

    - script: |
        docker run -d \
          --name elasticsearch-coverage \
          -p 9200:9200 \
          -e "discovery.type=single-node" \
          -e "xpack.security.enabled=false" \
          -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
          docker.elastic.co/elasticsearch/elasticsearch:8.17.4
        echo "Waiting for Elasticsearch on port 9200..."
        for i in $(seq 1 30); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:9200/_cluster/health 2>/dev/null)
          if [ "$STATUS" = "200" ]; then
            echo "Elasticsearch ready (HTTP $STATUS)"
            exit 0
          fi
          echo "Attempt $i/30: Elasticsearch not ready (HTTP ${STATUS:-none}), waiting 2s..."
          sleep 2
        done
        echo "WARNING: Elasticsearch did not become ready within 60 seconds — continuing anyway"
      displayName: 'Start Elasticsearch'

    - script: |
        mkdir -p $(Agent.BuildDirectory)/coverage
        binDir="$(Agent.BuildDirectory)/LinuxTests"

        # Disable Azure Key Vault — engine starts without Azure in CI
        export AZURE_KEYVAULT_NAME=""
        export SkipFailureToRetrieveSecret="true"
        export ENABLECONSOLELOGGING="false"
        export ENABLEELASTICSEARCHLOGGING="false"
        export FUNCTIONS_WORKER_RUNTIME="dotnet-isolated"

        echo "Starting engine under dotnet-coverage from $binDir ..."
        echo "  session-id : engine-coverage-session"
        echo "  output     : $(Agent.BuildDirectory)/coverage/engine.cobertura.xml"
        echo "  include    : $binDir/Warewolf.Execution.Lightweight.dll"
        FUNC_BIN="$(Agent.BuildDirectory)/func-cli/node_modules/azure-functions-core-tools/bin/func"
        chmod -R +x "$(Agent.BuildDirectory)/func-cli/node_modules/azure-functions-core-tools/bin/" 2>/dev/null || true
        cd "$binDir"
        $HOME/.dotnet/tools/dotnet-coverage collect \
          --output "$(Agent.BuildDirectory)/coverage/engine.cobertura.xml" \
          --output-format cobertura \
          --include-files "$binDir/Warewolf.Execution.Lightweight.dll" \
          --session-id engine-coverage-session \
          --nologo \
          -- "$FUNC_BIN" start --port 7071 &
        echo $! > $(Agent.BuildDirectory)/engine-coverage.pid
        echo "Engine started under coverage (PID $(cat $(Agent.BuildDirectory)/engine-coverage.pid))"
      displayName: 'Start engine under dotnet-coverage'

    - script: |
        echo "Waiting for Azure Functions engine on port 7071..."
        for i in $(seq 1 60); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:7071/ 2>/dev/null)
          # 503 = "Function host is not running." — worker still loading; keep waiting.
          # Any other response >= 100 means the host is up and serving requests.
          if [ -n "$STATUS" ] && [ "$STATUS" -ge 100 ] && [ "$STATUS" -ne 503 ] 2>/dev/null; then
            echo "Engine ready (HTTP $STATUS)"
            exit 0
          fi
          echo "Attempt $i/60: engine not ready (HTTP ${STATUS:-none}), waiting 2s..."
          sleep 2
          if [ "$i" = "60" ]; then
            echo "ERROR: Engine did not become ready within 120 seconds"
            exit 1
          fi
        done
      displayName: 'Wait for engine to be ready'

    - script: |
        echo "Starting exchange-connector-testing container on port 8889..."
        docker run -d -p 8889:8080 --name exchange-connector-testing warewolfserver/exchange-connector-testing
        if [ $? -ne 0 ]; then echo "WARNING: could not start exchange-connector-testing container"; fi
        echo "Waiting 5s for exchange container to be ready..."
        sleep 5
      displayName: 'Start exchange connector testing container'

    - task: PowerShell@2
      displayName: 'Run Azure Functions Integration Tests'
      inputs:
        filePath: '$(Build.SourcesDirectory)/Dev/run-tests-in-container.ps1'
        arguments: >-
          -Assemblies "Warewolf.Execution.Lightweight.Integration.Tests"
          -BinDir "$(Agent.BuildDirectory)/LinuxTests"
          -TestResultsDir "$(Agent.BuildDirectory)/TestResults"
          -UseHostNetwork

    - script: |
        echo "Stopping engine and flushing coverage..."
        covFile="$(Agent.BuildDirectory)/coverage/engine.cobertura.xml"
        cov_pid=$(cat $(Agent.BuildDirectory)/engine-coverage.pid 2>/dev/null || true)
        echo "  coverage PID : ${cov_pid:-<not found>}"
        echo "  expected file: $covFile"

        # Request a graceful coverage flush before touching any processes.
        # dotnet-coverage shutdown tells the tool to write the output file and exit,
        # regardless of whether the subprocess is still alive.  Without this call the
        # file is only written after ALL profiled processes (func host + dotnet worker)
        # have exited, which can take longer than the hard timeout below and causes
        # the tool to be SIGKILL'd before it can write.
        echo "Requesting dotnet-coverage shutdown for session 'engine-coverage-session'..."
        if $HOME/.dotnet/tools/dotnet-coverage shutdown engine-coverage-session; then
          echo "dotnet-coverage shutdown acknowledged"
        else
          echo "WARNING: dotnet-coverage shutdown returned non-zero (session may not be reachable yet — will fall back to process-based wait)"
        fi

        # Now kill the Azure Functions host and isolated worker.
        pkill -TERM -f "azure-functions-core-tools" 2>/dev/null || \
        pkill -TERM -f "func start" 2>/dev/null || true
        pkill -TERM -f "Warewolf.Execution.Lightweight" 2>/dev/null || true

        # Wait up to 60s for the coverage file to appear (written by dotnet-coverage
        # after shutdown is acknowledged).
        echo "Waiting for coverage file to appear..."
        for i in $(seq 1 60); do
          if [ -f "$covFile" ]; then
            echo "Coverage file appeared after ${i}s"
            break
          fi
          [ "$((i % 10))" = "0" ] && echo "  still waiting... (${i}s elapsed, dotnet-coverage $(kill -0 "$cov_pid" 2>/dev/null && echo running || echo exited))"
          sleep 1
        done

        # Clean up dotnet-coverage if still running — prefer SIGTERM so it can still
        # flush; fall back to SIGKILL only after a further 5 s grace period.
        if [ -n "$cov_pid" ] && kill -0 "$cov_pid" 2>/dev/null; then
          echo "dotnet-coverage still running after wait — sending SIGTERM..."
          kill -TERM "$cov_pid" 2>/dev/null || true
          sleep 5
          kill -KILL "$cov_pid" 2>/dev/null || true
        fi

        echo "--- Coverage directory ---"
        ls -lh "$(Agent.BuildDirectory)/coverage/" 2>/dev/null || echo "(directory missing)"

        if [ -f "$covFile" ]; then
          kb=$(du -k "$covFile" | cut -f1)
          echo "Coverage file written: ${kb}KB — $covFile"
        else
          echo "##[error]Coverage file was not produced: $covFile"
          echo "##[error]Check 'Start engine under dotnet-coverage' for session startup errors"
        fi
      displayName: 'Stop engine and flush coverage'
      condition: always()

    - script: 'docker rm -f exchange-connector-testing 2>/dev/null || true'
      displayName: 'Stop exchange connector testing container'
      condition: always()

    - script: 'docker rm -f elasticsearch-coverage 2>/dev/null || true'
      displayName: 'Stop Elasticsearch'
      condition: always()

    - script: 'find $(Agent.BuildDirectory)/TestResults -name "*.trx" 2>/dev/null || true'
      displayName: 'List TRX files (diagnostic)'
      condition: always()

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/**/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Azure Functions Tests'

    - script: 'find $(Agent.BuildDirectory)/TestResults -name "*.trx" | grep . || (echo "ERROR: no .trx files found"; exit 1)'
      displayName: 'Verify test results exist'
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: 'Upload engine coverage artifact'
      condition: always()
      inputs:
        targetPath: '$(Agent.BuildDirectory)/coverage/engine.cobertura.xml'
        artifactName: 'EngineCoverage'

  - job: MergeCoverage
    displayName: 'Merge and Publish Coverage'
    dependsOn:
      - Unit_Tests
      - Activities_Tests
      - LightweightExecutionUnitTests
      - AzureFunctionsIntegrationTests
    condition: always()
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: none

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download unit tests coverage'
      inputs:
        buildType: 'current'
        ArtifactName: 'UnitTestsCoverage'
        targetPath: '$(Agent.BuildDirectory)/coverage/unit_tests'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download activities coverage'
      inputs:
        buildType: 'current'
        ArtifactName: 'ActivitiesCoverage'
        targetPath: '$(Agent.BuildDirectory)/coverage/activities'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download lightweight unit coverage'
      inputs:
        buildType: 'current'
        ArtifactName: 'UnitCoverage'
        targetPath: '$(Agent.BuildDirectory)/coverage/lightweight_unit'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download engine coverage'
      inputs:
        buildType: 'current'
        ArtifactName: 'EngineCoverage'
        targetPath: '$(Agent.BuildDirectory)/coverage/engine'

    - script: |
        dotnet tool install --global dotnet-coverage
        mkdir -p $(Agent.BuildDirectory)/coverage/merged

        # --- Unit tests: Unit_Tests + Activities_Tests + LightweightExecutionUnitTests ---
        unit_files=""
        [ -f "$(Agent.BuildDirectory)/coverage/unit_tests/unit_tests.cobertura.xml" ]       && unit_files="$unit_files $(Agent.BuildDirectory)/coverage/unit_tests/unit_tests.cobertura.xml"
        [ -f "$(Agent.BuildDirectory)/coverage/activities/activities.cobertura.xml" ]         && unit_files="$unit_files $(Agent.BuildDirectory)/coverage/activities/activities.cobertura.xml"
        [ -f "$(Agent.BuildDirectory)/coverage/lightweight_unit/unit.cobertura.xml" ]         && unit_files="$unit_files $(Agent.BuildDirectory)/coverage/lightweight_unit/unit.cobertura.xml"
        if [ -z "$unit_files" ]; then
          echo "ERROR: no unit test coverage files found to merge"; exit 1
        fi
        echo "Merging unit test coverage:$unit_files"
        $HOME/.dotnet/tools/dotnet-coverage merge $unit_files \
          --output "$(Agent.BuildDirectory)/coverage/merged/unit_merged.cobertura.xml" \
          --output-format cobertura \
          --nologo
        kb=$(du -k "$(Agent.BuildDirectory)/coverage/merged/unit_merged.cobertura.xml" | cut -f1)
        echo "Unit merged: ${kb}KB"

        # --- Integration tests: AzureFunctionsIntegrationTests ---
        int_files=""
        [ -f "$(Agent.BuildDirectory)/coverage/engine/engine.cobertura.xml" ] && int_files="$int_files $(Agent.BuildDirectory)/coverage/engine/engine.cobertura.xml"
        if [ -z "$int_files" ]; then
          echo "ERROR: no integration test coverage files found to merge"; exit 1
        fi
        echo "Merging integration test coverage:$int_files"
        $HOME/.dotnet/tools/dotnet-coverage merge $int_files \
          --output "$(Agent.BuildDirectory)/coverage/merged/integration_merged.cobertura.xml" \
          --output-format cobertura \
          --nologo
        kb=$(du -k "$(Agent.BuildDirectory)/coverage/merged/integration_merged.cobertura.xml" | cut -f1)
        echo "Integration merged: ${kb}KB"

        # --- All tests combined ---
        $HOME/.dotnet/tools/dotnet-coverage merge \
          "$(Agent.BuildDirectory)/coverage/merged/unit_merged.cobertura.xml" \
          "$(Agent.BuildDirectory)/coverage/merged/integration_merged.cobertura.xml" \
          --output "$(Agent.BuildDirectory)/coverage/merged/all_merged.cobertura.xml" \
          --output-format cobertura \
          --nologo
        kb=$(du -k "$(Agent.BuildDirectory)/coverage/merged/all_merged.cobertura.xml" | cut -f1)
        echo "All merged: ${kb}KB"

        # Filter merged XMLs to only Warewolf/Dev2 packages, removing third-party
        # assemblies (FSharp, Elastic, WebJobs, etc.) to keep the HTML report small.
        # NOTE: bash heredocs require their content at column-0, which breaks YAML
        # block-scalar indentation rules.  We use printf to build the script in a
        # temp file instead — all lines stay properly indented inside the | block.
        _fc=$(mktemp /tmp/filter_cov_XXXX.py)
        printf '%s\n' \
          'import xml.etree.ElementTree as ET' \
          'import re, glob, sys' \
          "keep = re.compile(r'^(Dev2\.|Warewolf\.)')" \
          "deny = re.compile(r'^(Warewolf\.Weave|Elastic\.Clients\.Elasticsearch|Microsoft\.Azure\.WebJobs\.|WebJobs\.|StackExchange\.Redis|ServiceStack|Microsoft\.Azure\.AppService|FSharp\.Core|DotNetWorker\.Grpc|Microsoft\.Azure\.Functions\.Worker\.Grpc)')" \
          'def filter_xml(path):' \
          '    tree = ET.parse(path)' \
          '    root = tree.getroot()' \
          "    pkgs = root.find('packages')" \
          '    if pkgs is None:' \
          '        return' \
          "    removed = [p for p in list(pkgs) if not keep.match(p.get('name', '')) or deny.match(p.get('name', ''))]" \
          '    for p in removed:' \
          '        pkgs.remove(p)' \
          '    lc = lv = bc = bv = 0' \
          "    for line in root.iter('line'):" \
          '        lv += 1' \
          "        if int(line.get('hits', '0')) > 0:" \
          '            lc += 1' \
          "        if line.get('branch') == 'True':" \
          "            for cond in line.findall('conditions/condition'):" \
          '                bv += 1' \
          "                if cond.get('coverage', '0%') != '0%':" \
          '                    bc += 1' \
          "    root.set('lines-covered', str(lc))" \
          "    root.set('lines-valid', str(lv))" \
          "    root.set('branches-covered', str(bc))" \
          "    root.set('branches-valid', str(bv))" \
          "    root.set('line-rate', f'{lc/lv:.6f}' if lv else '0')" \
          "    root.set('branch-rate', f'{bc/bv:.6f}' if bv else '0')" \
          "    tree.write(path, xml_declaration=True, encoding='unicode')" \
          "    print(f'{path}: removed {len(removed)} packages, {lc}/{lv} lines, {bc}/{bv} branches')" \
          "for f in glob.glob(f'{sys.argv[1]}/*.cobertura.xml'):" \
          '    filter_xml(f)' \
          > "$_fc"
        python3 "$_fc" "$(Agent.BuildDirectory)/coverage/merged"
        rm -f "$_fc"
      displayName: 'Merge coverage reports'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish merged coverage'
      condition: always()
      inputs:
        summaryFileLocation: '$(Agent.BuildDirectory)/coverage/merged/all_merged.cobertura.xml'

- stage: Compile_Release
  displayName: 'Compile Release'
  jobs:
  
  - job: build_release
    displayName: 'Compile for Release'
  
    steps:
    - checkout: self
      clean: true
      persistCredentials: true
      
    - task: PowerShell@2
      inputs:
        filePath: '$(Agent.BuildDirectory)/s/Compile.ps1'
        arguments: '-ServerTests -AutoVersion -Config Release -Target Rebuild -ProjectSpecificOutputs -MSBuildPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" -GitCredential ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount'
      displayName: 'Compile in Release Config'
      env:
        GitLabTagsAccount: $(GitLabTagsAccountPassword)
  
    - powershell: |
        Write-Host Testing Warewolf assembly file versions...
        $HighestReadVersion = "0.0.0.0"
        $LastReadVersion = "0.0.0.0"
        foreach ($file in Get-ChildItem -recurse "$(Agent.BuildDirectory)\s\Dev") {
            if (($file.Name.EndsWith(".dll") -or ($file.Name.EndsWith(".exe") -and -Not $file.Name.EndsWith(".vshost.exe"))) -and ($file.Name.StartsWith("Dev2.") -or $file.Name.StartsWith("Warewolf.") -or $file.Name.StartsWith("WareWolf")) -and $file.Name -ne "Warewolf.Usage.dll") {
                # Get version.
                $ReadVersion = [system.diagnostics.fileversioninfo]::GetVersionInfo($file.FullName).FileVersion
        
                 Find highest version
                $SeperateVersionNumbers = $ReadVersion.split(".")
                $SeperateVersionNumbersHighest = $HighestReadVersion.split(".")
                if ([convert]::ToInt32($SeperateVersionNumbers[0], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[0], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[1], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[1], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[2], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[2], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[3], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[3], 10)){
                    $HighestReadVersion = $ReadVersion
                }
        
                # Check for invalid.
                if ($ReadVersion.StartsWith("0.0.") -or ($LastReadVersion -ne $ReadVersion -and $LastReadVersion -ne "0.0.0.0")) {
                    $getFullPath = $file.FullName
                    Write-Host ERROR! Invalid version! $getFullPath $ReadVersion $LastReadVersion
                    throw "ERROR! `"$getFullPath $ReadVersion`" is either an invalid version or not equal to `"$LastReadVersion`". All Warewolf assembly versions in `"$TestsPath`" must conform and cannot start with 0.0. or end with .0"
                }
                $LastReadVersion = $ReadVersion
            }
        }
        Out-File -LiteralPath "$(Agent.BuildDirectory)\s\Dev\Dev2.Server\bin\Release\FullVersionString" -InputObject $HighestReadVersion -Encoding default -Force
        Out-File -LiteralPath "$(Agent.BuildDirectory)\s\Dev\Dev2.Studio\bin\Release\FullVersionString" -InputObject $HighestReadVersion -Encoding default -Force
        git -C "$(Build.SourcesDirectory)" tag $HighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf $HighestReadVersion
        $VersionArray = $HighestReadVersion.Split('.')
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 3) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf $TrimmedHighestReadVersion
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 2) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf $TrimmedHighestReadVersion
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 1) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf $TrimmedHighestReadVersion
        Write-Host "##vso[build.updatebuildnumber]$(Build.BuildNumber) ($HighestReadVersion)"
      env:
        GitLabTagsAccount: $(GitLabTagsAccountPassword)
  
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\\s\\Dev\\Dev2.Server\\bin\\Release\'
        ArtifactName: 'Release Server'
        publishLocation: 'Container'
        StoreAsTar: false
  
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\\s\\Dev\\Dev2.Studio\\bin\\Release\'
        ArtifactName: 'Release Studio'
        publishLocation: 'Container'
        StoreAsTar: false


