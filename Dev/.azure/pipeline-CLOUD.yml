# Only build (and therefore version, tag, and push release tags to GitLab) on
# main/integration branches. Developer work-item branches do not run this pipeline.
trigger:
  batch: true
  branches:
    include:
      - develop
      - 7580*

# This is the only parameter prompted for when the pipeline is queued manually
# ("Run pipeline"). PublishRelease gates the whole Release stage - leave it false
# for ordinary CI runs so every build does not push a public release. Set it true
# only when this build's artifact is ready to ship to stwwreleases/releases and
# warewolf.io.
#
# Everything else the Release stage needs is now fixed/hardcoded rather than
# prompted for on every run (Azure DevOps's "Run pipeline" UI does not allow an
# empty string to be submitted for a string parameter, which made "leave blank to
# auto-detect/use default" unusable in practice):
#   - AzureStorageServiceConnection is hardcoded below to 'AzureStorage-WarewolfReleases'
#     (must have "Storage Blob Data Contributor" on stwwreleases). Service
#     connections are authorized at pipeline-compile time, so this MUST stay a
#     literal string, never a $(variable) or runtime value.
#   - ScriptsPackageVersion has no manual override anymore - it is always
#     auto-detected by diffing Scripts/ against the last-published zip on
#     warewolf.io/release-notes.php (reused if unchanged, minor-bumped if changed).
#   - ReleaseNotesBullets is hardcoded to empty, which falls back to a generic
#     changelog-link bullet in Update-ReleaseNotes.ps1.
parameters:
- name: PublishRelease
  displayName: 'Publish this build as a public release (upload to Azure Storage + update warewolf.io)'
  type: boolean
  default: false

variables:
  AzureStorageServiceConnection: 'AzureStorage-WarewolfReleases'

pool:
  vmImage: 'windows-2022'

stages:
- stage: Build
  displayName: 'Build Lightweight Azure Functions'
  jobs:

  - job: Build_And_Publish
    displayName: 'Publish Lightweight Azure Functions Project'

    steps:
    - checkout: self
      clean: false
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK for Security Gate'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    # Packages Vulnerability Test (moved here from pipeline.yml). Runs the NuGet
    # vulnerability gates (dotnet list --vulnerable + NuGetAudit) over the
    # lightweight server's project closure and fails the build on Critical/High
    # advisories. -SkipEosCheck limits this to the package vulnerability scan;
    # the .NET end-of-support gate is not part of this test.
    - task: PowerShell@2
      displayName: 'Packages Vulnerability Test'
      inputs:
        filePath: '$(Build.SourcesDirectory)\Dev\.azure\Run-SecurityGates.ps1'
        arguments: '-RepoRoot "$(Build.SourcesDirectory)" -SkipEosCheck'
        pwsh: true

    - powershell: |
        Write-Host "Fetching git tags..."
        # git fetch writes its normal progress/status (e.g. "From https://...") to stderr.
        # The PowerShell@2 task defaults ErrorActionPreference to 'Stop', which turns that
        # merged (2>&1) stderr output into a terminating NativeCommandError even though the
        # fetch itself succeeds. Temporarily relax it and rely on $LASTEXITCODE instead.
        $prevEAP = $ErrorActionPreference
        $ErrorActionPreference = 'Continue'
        $gitFetchOutput = git -C "$(Build.SourcesDirectory)" fetch --all --tags -f 2>&1
        $ErrorActionPreference = $prevEAP
        $gitFetchOutput | ForEach-Object { Write-Host "$_" }
        if ($LASTEXITCODE -ne 0) { throw "git fetch failed with exit code $LASTEXITCODE" }

        # Check if current commit is already tagged with a version
        $FullVersionString = git -C "$(Build.SourcesDirectory)" tag --points-at HEAD |
            Where-Object { ($_.Split('.').Count - 1) -eq 3 } |
            Select-Object -First 1
        if (-not [string]::IsNullOrEmpty($FullVersionString)) {
            $FullVersionString = $FullVersionString.Trim()
            Write-Host "Commit is already tagged: $FullVersionString"
        } else {
            # Find the most recent version tag reachable from HEAD
            $FullVersionString = git -C "$(Build.SourcesDirectory)" tag -l --sort=-creatordate --merged |
                Where-Object { ($_.Split('.').Count - 1) -eq 3 } |
                Select-Object -First 1
            if ([string]::IsNullOrEmpty($FullVersionString)) {
                throw "No X.X.X.X version tags found in git history."
            }
            $FullVersionString = $FullVersionString.Trim()
            # Increment the build (4th) component
            [int]$NewBuildNumber = [int]$FullVersionString.Split(".")[3] + 1
            $FullVersionString = ($FullVersionString.Split(".")[0..2] -join ".") + ".$NewBuildNumber"
            Write-Host "Generated next version: $FullVersionString"
        }

        Write-Host "Setting assembly version to $FullVersionString"
        $CSharpVersionFile = "$(Build.SourcesDirectory)\Dev\AssemblyCommonInfo.cs"
        (Get-Content $CSharpVersionFile -Raw) `
            -replace '\[assembly: AssemblyVersion\(@?"[^"]*"\)\]', "[assembly: AssemblyVersion(`"$FullVersionString`")]" |
            Set-Content $CSharpVersionFile -Encoding UTF8 -NoNewline
        Write-Host "Updated $CSharpVersionFile"
        $FSharpVersionFile = "$(Build.SourcesDirectory)\Dev\AssemblyCommonInfo.fs"
        (Get-Content $FSharpVersionFile -Raw) `
            -replace '\[<assembly: AssemblyVersion\("[^"]*"\)>\]', "[<assembly: AssemblyVersion(`"$FullVersionString`")>]" |
            Set-Content $FSharpVersionFile -Encoding UTF8 -NoNewline
        Write-Host "Updated $FSharpVersionFile"
        exit 0
      displayName: 'Apply Version from Git Tags to AssemblyCommonInfo.cs'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Lightweight Azure Functions Project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/Dev/Warewolf.Execution.Lightweight/Warewolf.Execution.Lightweight.csproj'
        arguments: '--configuration Release --runtime win-x64 --self-contained false --output $(Agent.BuildDirectory)\AzureFunctionsPublish'
        zipAfterPublish: false
        modifyOutputPath: false
  
    - powershell: |
        Write-Host Testing Warewolf assembly file versions...
        $HighestReadVersion = "0.0.0.0"
        $LastReadVersion = "0.0.0.0"
        foreach ($file in Get-ChildItem -recurse "$(Agent.BuildDirectory)\AzureFunctionsPublish") {
            if (($file.Name.EndsWith(".dll") -or ($file.Name.EndsWith(".exe") -and -Not $file.Name.EndsWith(".vshost.exe"))) -and ($file.Name.StartsWith("Dev2.") -or $file.Name.StartsWith("Warewolf.") -or $file.Name.StartsWith("WareWolf")) -and $file.Name -ne "Warewolf.Usage.dll") {
                # Get version.
                $ReadVersion = [system.diagnostics.fileversioninfo]::GetVersionInfo($file.FullName).FileVersion
        
                # Find highest version
                $SeperateVersionNumbers = $ReadVersion.split(".")
                $SeperateVersionNumbersHighest = $HighestReadVersion.split(".")
                if ([convert]::ToInt32($SeperateVersionNumbers[0], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[0], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[1], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[1], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[2], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[2], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[3], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[3], 10)){
                    $HighestReadVersion = $ReadVersion
                }
        
                # Check for invalid.
                if ($ReadVersion.StartsWith("0.0.") -or ($LastReadVersion -ne $ReadVersion -and $LastReadVersion -ne "0.0.0.0")) {
                    $getFullPath = $file.FullName
                    Write-Host ERROR! Invalid version! $getFullPath $ReadVersion $LastReadVersion
                    throw "ERROR! `"$getFullPath $ReadVersion`" is either an invalid version or not equal to `"$LastReadVersion`". All Warewolf assembly versions in `"$TestsPath`" must conform and cannot start with 0.0. or end with .0"
                }
                $LastReadVersion = $ReadVersion
            }
        }
        Out-File -LiteralPath "$(Agent.BuildDirectory)\AzureFunctionsPublish\FullVersionString" -InputObject $HighestReadVersion -Encoding default -Force
        Write-Host "##vso[task.setvariable variable=HighestReadVersion]$HighestReadVersion"
        Write-Host "##vso[build.updatebuildnumber]$(Build.BuildNumber) ($HighestReadVersion)"

    # Tag the source repository with the binary version and push the tag(s) to
    # GitLab, mirroring pipeline.yml's Compile_Release stage. The whole pipeline
    # only triggers on main/integration branches, so this always runs on a release
    # build. The full 4-part tag (X.X.X.X) is created once; the rolling 3-, 2- and
    # 1-part tags are force-moved to this commit (delete remote + re-push) so they
    # always point at the latest release. git tag/push use the GitLabTagsAccount
    # credential embedded in the push URL (same as pipeline.yml).
    - powershell: |
        $HighestReadVersion = "$(HighestReadVersion)"
        if ([string]::IsNullOrWhiteSpace($HighestReadVersion) -or $HighestReadVersion -eq "0.0.0.0") {
            throw "HighestReadVersion was not set to a valid version; cannot tag the source repo."
        }
        $gitlab = "https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf"
        git -C "$(Build.SourcesDirectory)" tag $HighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab $HighestReadVersion
        $VersionArray = $HighestReadVersion.Split('.')
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 3) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab $TrimmedHighestReadVersion
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 2) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab $TrimmedHighestReadVersion
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 1) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab $TrimmedHighestReadVersion
      displayName: 'Tag Source and Push Version Tags to GitLab'
      env:
        GitLabTagsAccount: $(GitLabTagsAccountPassword)

    - powershell: |
        $srcPath  = "$(Build.SourcesDirectory)\Dev\Resources - Load\Resources"
        $destPath = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        if (-not (Test-Path $destPath)) { New-Item -ItemType Directory -Force -Path $destPath | Out-Null }
        Copy-Item -Path "$srcPath\*" -Destination $destPath -Recurse -Force
      displayName: 'Copy Load Testing Resources into Publish Output'

    # SecureConfigLoader reads secure.config from AppContext.BaseDirectory at
    # runtime. Without it the engine has no effective permission map and
    # WorkflowAuthPolicyLoader rejects every request with 503 (ConfigMissing),
    # which fails the "Execute Hello World" smoke test in the Azure stage.
    # The file is .gitignored, so generate it here: AES-encrypt the committed
    # plain-text source with the same SecurityEncryption routine the runtime
    # decrypts with (loaded from the freshly published Dev2.Infrastructure.dll).
    # pwsh (.NET 8) is required to load the net8.0 assembly — Windows PowerShell
    # 5.1 cannot.
    - pwsh: |
        $publishDir = "$(Agent.BuildDirectory)\AzureFunctionsPublish"
        $sourceJson = "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\secure.config.cloud.json"
        $infraDll   = Join-Path $publishDir "Dev2.Infrastructure.dll"

        if (-not (Test-Path $sourceJson)) { throw "secure.config source JSON not found: $sourceJson" }
        if (-not (Test-Path $infraDll))   { throw "Dev2.Infrastructure.dll not found in publish output: $infraDll" }

        Add-Type -Path $infraDll
        $plain     = Get-Content -LiteralPath $sourceJson -Raw
        $encrypted = [Dev2.Services.Security.SecurityEncryption]::Encrypt($plain)

        $target = Join-Path $publishDir "secure.config"
        Set-Content -LiteralPath $target -Value $encrypted -Encoding ascii -NoNewline

        $size = (Get-Item $target).Length
        if ($size -le 0) { throw "secure.config was written but is empty." }
        Write-Host "Wrote encrypted secure.config ($size bytes) to $target"
      displayName: 'Generate Encrypted secure.config for Public Workflow Execution'

    # Generate the licensing config consumed via the app.config
    #   <subscriptionSettings configSource="Warewolf License.secureconfig" />
    # link (resolved relative to the published Warewolf.Execution.Lightweight.dll.config,
    # i.e. the app base directory). WorkflowExecutor's license gate requires an
    # Active/InTrial subscription; without this file the headless UAT app is unlicensed
    # and every execution returns HTTP 500
    #   {"hasErrors":true,"errors":["Execution blocked: a valid Warewolf
    #    license/subscription is required."]}
    # The three sensitive values come from secret pipeline variables (CustomerId,
    # PlanId, SubscriptionKey) so they stay out of source control; the remaining
    # values are non-sensitive literals. Each value is AES-encrypted per-value with the
    # same SecurityEncryption routine the runtime decrypts with (matching
    # SubscriptionConfig.UpdateSubscriptionSettings), so no plaintext secret is written
    # to the artifact and SubscriptionConfig performs no re-encrypt-on-load.
    - pwsh: |
        $publishDir = "$(Agent.BuildDirectory)\AzureFunctionsPublish"
        $infraDll   = Join-Path $publishDir "Dev2.Infrastructure.dll"
        if (-not (Test-Path $infraDll)) { throw "Dev2.Infrastructure.dll not found in publish output: $infraDll" }
        Add-Type -Path $infraDll

        $customerId      = $env:CustomerIdValue
        $planId          = $env:PlanIdValue
        $subscriptionKey = $env:SubscriptionKeyValue
        if ([string]::IsNullOrWhiteSpace($customerId))      { throw "CustomerId pipeline variable is not set." }
        if ([string]::IsNullOrWhiteSpace($planId))          { throw "PlanId pipeline variable is not set." }
        if ([string]::IsNullOrWhiteSpace($subscriptionKey)) { throw "SubscriptionKey pipeline variable is not set." }

        function Enc([string]$v) { [Dev2.Services.Security.SecurityEncryption]::Encrypt($v) }

        # SubscriptionId is intentionally empty (not encrypted): SubscriptionConfig
        # ignores empty values when deciding whether the file is plain-text.
        $settings = [ordered]@{
          CustomerId           = Enc $customerId
          SubscriptionId       = ''
          Status               = Enc 'Active'
          PlanId               = Enc $planId
          SubscriptionKey      = Enc $subscriptionKey
          SubscriptionSiteName = Enc 'warewolf'
          StopExecutions       = Enc 'false'
        }

        $sb = [System.Text.StringBuilder]::new()
        [void]$sb.AppendLine('<?xml version="1.0" encoding="utf-8"?>')
        [void]$sb.AppendLine('<subscriptionSettings>')
        foreach ($k in $settings.Keys) {
          [void]$sb.AppendLine(('  <add key="{0}" value="{1}" />' -f $k, $settings[$k]))
        }
        [void]$sb.AppendLine('</subscriptionSettings>')

        $target = Join-Path $publishDir 'Warewolf License.secureconfig'
        [System.IO.File]::WriteAllText($target, $sb.ToString(), (New-Object System.Text.UTF8Encoding($false)))
        $size = (Get-Item $target).Length
        if ($size -le 0) { throw "Warewolf License.secureconfig was written but is empty." }
        Write-Host "Wrote encrypted 'Warewolf License.secureconfig' ($size bytes) to $target"
      displayName: 'Generate Warewolf License.secureconfig for Subscription Gate'
      env:
        CustomerIdValue: $(CustomerId)
        PlanIdValue: $(PlanId)
        SubscriptionKeyValue: $(SubscriptionKey)

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Compiled Output as Pipeline Artifact'
      inputs:
        targetPath: '$(Agent.BuildDirectory)\AzureFunctionsPublish'
        artifact: 'AzureFunctionsPublish'
        publishLocation: 'pipeline'
  
- stage: Azure
  displayName: 'Test on Azure'
  dependsOn: Build
  jobs:

  - job: Deploy_And_Test_Azure_Functions
    displayName: 'Deploy and Test Lightweight Execution Server in Azure Functions'

    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Compiled Artifact'
      inputs:
        artifact: 'AzureFunctionsPublish'
        path: '$(Agent.BuildDirectory)\AzureFunctionsPublish'

    # Fetches the current NewSqlServerSource.bite DB source from the devops server. Its
    # connection string points at an ngrok tunnel whose host:port rotates whenever the
    # tunnel restarts, so it cannot be committed as a static file with a fixed value at
    # all; it must be fetched fresh on every pipeline run. The endpoint sits behind
    # Cloudflare Access; CFAccessClientId/CFAccessClientSecret (a Service Auth policy on the
    # Access Application) bypass the Azure AD SSO redirect. On failure (missing/invalid
    # headers, or the Access policy not yet propagated) the endpoint still returns HTTP 200
    # but with an HTML SSO login page instead of the .bite XML, so success is validated by
    # Content-Type and response body shape, not HTTP status alone. Unlike the UAT smoke
    # tests below, this step has no continueOnError: a broken devops-server dependency is a
    # real, expected-to-always-work prerequisite, not an unrelated shared-environment
    # health signal, so a failure here must fail the build. Requests are retried a few times
    # with backoff first, though, because the devops server sits behind a Cloudflare Tunnel
    # (cloudflared) whose connector can drop briefly (surfaced as HTTP 530 / Cloudflare error
    # 1033 "no Tunnel established for this hostname") independently of the endpoint itself
    # being healthy; a single transient drop shouldn't fail the whole build.
    - powershell: |
        $uri         = 'https://devops.warewolf.online/warewolf-devops/api/download-bite/mssql'
        $destDir     = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        $targetPath  = Join-Path $destDir 'NewSqlServerSource.bite'
        $tempPath    = "$(Agent.BuildDirectory)\NewSqlServerSource.bite.download"
        $maxAttempts = 4
        $baseDelay   = 5
        if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }

        $headers = @{
            'CF-Access-Client-Id'     = $env:CFAccessClientIdValue
            'CF-Access-Client-Secret' = $env:CFAccessClientSecretValue
        }

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
                $r = Invoke-WebRequest -Uri $uri -Method GET -Headers $headers -UseBasicParsing -TimeoutSec 60 -OutFile $tempPath -PassThru

                $contentType = [string]$r.Headers['Content-Type']
                $body        = Get-Content -LiteralPath $tempPath -Raw
                Write-Host "Response StatusCode=$($r.StatusCode) Content-Type=$contentType Length=$($body.Length)"

                $looksLikeHtml   = $contentType -match 'text/html' -or $body -match '(?i)<html'
                $looksLikeSource = $body -match '<Source ' -and $body -match 'ID="b9184f70-64ea-4dc5-b23b-02fcd5f91082"'

                if ($looksLikeHtml -or -not $looksLikeSource) {
                    throw "Downloaded content is not the expected NewSqlServerSource .bite XML (Content-Type: $contentType). This usually means the Cloudflare Access Service Token headers (CFAccessClientId/CFAccessClientSecret) were rejected and an Azure AD SSO login page was returned instead."
                }

                Move-Item -LiteralPath $tempPath -Destination $targetPath -Force
                Write-Host "Wrote NewSqlServerSource.bite ($((Get-Item $targetPath).Length) bytes) to $targetPath"
                break
            } catch {
                Remove-Item -LiteralPath $tempPath -Force -ErrorAction SilentlyContinue

                if ($attempt -ge $maxAttempts) {
                    Write-Host "##[error]Request to devops download endpoint failed after $maxAttempts attempts: $($_.Exception.Message)"
                    throw
                }

                $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
                Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message). Retrying in $delaySeconds s (likely a transient Cloudflare Tunnel/connector drop)..."
                Start-Sleep -Seconds $delaySeconds
            }
        }
      displayName: 'Download NewSqlServerSource.bite from DevOps Endpoint'
      env:
        CFAccessClientIdValue: $(CFAccessClientId)
        CFAccessClientSecretValue: $(CFAccessClientSecret)

    # The devops.warewolf.online admin panel that produces NewSqlServerSource.bite only
    # exposes Host/Username/Database/Password fields (no Authentication Type selector), so
    # the smoke test would otherwise only ever exercise plain SQL Server username/password
    # auth - never the Microsoft Entra Managed Identity path this branch (#8458) adds. Inject
    # "Authentication=Active Directory Managed Identity" here instead. User ID/Password are
    # deliberately left in the connection string: SqlConnectionWrapper.CreateConnectionString
    # (Dev2.Services.Sql) detects Authentication=ActiveDirectoryManagedIdentity + credentials
    # both present, strips the credentials from the primary (Managed Identity) attempt, and
    # precomputes them as the automatic SQL-auth fallback if Managed Identity fails - see
    # DatabaseServiceExecution.MssqlSqlExecution. That means this step makes the smoke test
    # prove Entra ID auth actually works end-to-end, while still degrading gracefully to SQL
    # auth (and the existing structured SQL-error logging) if the Function App's Managed
    # Identity isn't yet provisioned as a contained user on the target database.
    #
    # Only patches a plaintext ConnectionString (contains "Data Source=" / "Initial
    # Catalog="). If devops.warewolf.online ever starts returning an encrypted
    # ConnectionString (e.g. DPAPI/WFAES ciphertext), this step intentionally leaves it
    # untouched and fails loudly rather than corrupting ciphertext it cannot safely rewrite -
    # in that case, Authentication=Active Directory Managed Identity must be added at the
    # source (the devops server) instead.
    - powershell: |
        $targetPath = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources\NewSqlServerSource.bite"

        [xml]$xml = Get-Content -LiteralPath $targetPath -Raw
        $source = $xml.Source
        $connectionString = $source.ConnectionString

        if ($connectionString -match '(?i)Authentication\s*=') {
            Write-Host "ConnectionString already specifies an Authentication mode; leaving it unmodified."
        } elseif ($connectionString -notmatch '(?i)Data Source=' -or $connectionString -notmatch '(?i)Initial Catalog=') {
            Write-Host "##[error]NewSqlServerSource.bite ConnectionString does not look like plaintext SQL Server connection string properties (no Data Source/Initial Catalog found) - it may be encrypted. Refusing to patch it; add Authentication=Active Directory Managed Identity at the devops.warewolf.online source instead."
            throw "Cannot safely inject Authentication=Active Directory Managed Identity into a non-plaintext ConnectionString."
        } else {
            # Insert right after "Initial Catalog=...;" so the existing User ID and
            # credential properties remain intact and readable afterwards.
            $connectionString = $connectionString -replace '(?i)(Initial Catalog=[^;]*;)', "`$1Authentication=Active Directory Managed Identity;"
            $source.SetAttribute('ConnectionString', $connectionString)
            $xml.Save($targetPath)

            # Deliberately does not echo the (now-patched) connection string: it still
            # carries the SQL-auth fallback credential, which must never appear in CI logs.
            Write-Host "Patched NewSqlServerSource.bite to add Authentication=Active Directory Managed Identity (existing User ID/credential properties left in place for automatic SQL-auth fallback)."
        }
      displayName: 'Patch NewSqlServerSource.bite to use Microsoft Entra Managed Identity Authentication'

    # Same rationale as the NewSqlServerSource.bite fetch above: the "Warewolf DevOps
    # RabbitMQ Source" connection string points at a broker behind a Cloudflare Tunnel
    # whose host:port rotates, so it cannot be committed as a static file and must be
    # fetched fresh on every pipeline run from the devops server, behind the same
    # Cloudflare Access Service Token headers.
    - powershell: |
        $uri         = 'https://devops.warewolf.online/warewolf-devops/api/download-bite/rabbitmq'
        $destDir     = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        $targetPath  = Join-Path $destDir 'Warewolf DevOps RabbitMQ Source.bite'
        $tempPath    = "$(Agent.BuildDirectory)\WarewolfDevOpsRabbitMQSource.bite.download"
        $maxAttempts = 4
        $baseDelay   = 5
        if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }

        $headers = @{
            'CF-Access-Client-Id'     = $env:CFAccessClientIdValue
            'CF-Access-Client-Secret' = $env:CFAccessClientSecretValue
        }

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
                $r = Invoke-WebRequest -Uri $uri -Method GET -Headers $headers -UseBasicParsing -TimeoutSec 60 -OutFile $tempPath -PassThru

                $contentType = [string]$r.Headers['Content-Type']
                $body        = Get-Content -LiteralPath $tempPath -Raw
                Write-Host "Response StatusCode=$($r.StatusCode) Content-Type=$contentType Length=$($body.Length)"

                $looksLikeHtml   = $contentType -match 'text/html' -or $body -match '(?i)<html'
                $looksLikeSource = $body -match '<Source ' -and $body -match 'ID="1a82a341-b678-4992-a25a-39cdd57198d4"'

                if ($looksLikeHtml -or -not $looksLikeSource) {
                    throw "Downloaded content is not the expected Warewolf DevOps RabbitMQ Source .bite XML (Content-Type: $contentType). This usually means the Cloudflare Access Service Token headers (CFAccessClientId/CFAccessClientSecret) were rejected and an Azure AD SSO login page was returned instead."
                }

                Move-Item -LiteralPath $tempPath -Destination $targetPath -Force
                Write-Host "Wrote Warewolf DevOps RabbitMQ Source.bite ($((Get-Item $targetPath).Length) bytes) to $targetPath"
                break
            } catch {
                Remove-Item -LiteralPath $tempPath -Force -ErrorAction SilentlyContinue

                if ($attempt -ge $maxAttempts) {
                    Write-Host "##[error]Request to devops download endpoint failed after $maxAttempts attempts: $($_.Exception.Message)"
                    throw
                }

                $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
                Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message). Retrying in $delaySeconds s (likely a transient Cloudflare Tunnel/connector drop)..."
                Start-Sleep -Seconds $delaySeconds
            }
        }
      displayName: 'Download Warewolf DevOps RabbitMQ Source.bite from DevOps Endpoint'
      env:
        CFAccessClientIdValue: $(CFAccessClientId)
        CFAccessClientSecretValue: $(CFAccessClientSecret)

    # "Azure Exchange Source" was previously committed as a static WFAES::-encrypted
    # .bite file (Dev\Warewolf.Execution.Lightweight\Resources\Azure Exchange Source.bite).
    # That value is encrypted with whatever Key Vault "dp-keyring-v1" key version was
    # current at commit time; it is never refreshed afterwards, so any later key
    # rotation (see KeyRotationRunbook.md) silently breaks it - LightweightSourceLoader
    # fails to decrypt the stale ciphertext, ResourceCatalog.GetResource<ExchangeSource>
    # returns null, and every Exchange smoke-test run fails with "Invalid Email Source"
    # (WOLF-8xxx) even though exchange.warewolf.online itself is healthy. Fetching it
    # fresh here - re-encrypted with the CURRENT Key Vault key by the devops endpoint,
    # the same pattern already used for NewSqlServerSource/RabbitMQ above - eliminates
    # that staleness. Requires a new `download-bite/exchange` route on the devops server;
    # see Dev/.azure/devops-download-bite-exchange-spec.md for the endpoint contract.
    - powershell: |
        $uri         = 'https://devops.warewolf.online/warewolf-devops/api/download-bite/exchange'
        $destDir     = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        $targetPath  = Join-Path $destDir 'Azure Exchange Source.bite'
        $tempPath    = "$(Agent.BuildDirectory)\AzureExchangeSource.bite.download"
        $maxAttempts = 4
        $baseDelay   = 5
        if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }

        $headers = @{
            'CF-Access-Client-Id'     = $env:CFAccessClientIdValue
            'CF-Access-Client-Secret' = $env:CFAccessClientSecretValue
        }

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
                $r = Invoke-WebRequest -Uri $uri -Method GET -Headers $headers -UseBasicParsing -TimeoutSec 60 -OutFile $tempPath -PassThru

                $contentType = [string]$r.Headers['Content-Type']
                $body        = Get-Content -LiteralPath $tempPath -Raw
                Write-Host "Response StatusCode=$($r.StatusCode) Content-Type=$contentType Length=$($body.Length)"

                $looksLikeHtml   = $contentType -match 'text/html' -or $body -match '(?i)<html'
                $looksLikeSource = $body -match '<Source ' -and $body -match 'ID="e8a8f864-8ce8-47a1-8fca-5aef24bd63b3"'

                if ($looksLikeHtml -or -not $looksLikeSource) {
                    throw "Downloaded content is not the expected Azure Exchange Source .bite XML (Content-Type: $contentType). This usually means the Cloudflare Access Service Token headers (CFAccessClientId/CFAccessClientSecret) were rejected and an Azure AD SSO login page was returned instead."
                }

                Move-Item -LiteralPath $tempPath -Destination $targetPath -Force
                Write-Host "Wrote Azure Exchange Source.bite ($((Get-Item $targetPath).Length) bytes) to $targetPath"
                break
            } catch {
                Remove-Item -LiteralPath $tempPath -Force -ErrorAction SilentlyContinue

                if ($attempt -ge $maxAttempts) {
                    Write-Host "##[error]Request to devops download endpoint failed after $maxAttempts attempts: $($_.Exception.Message)"
                    throw
                }

                $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
                Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message). Retrying in $delaySeconds s (likely a transient Cloudflare Tunnel/connector drop)..."
                Start-Sleep -Seconds $delaySeconds
            }
        }
      displayName: 'Download Azure Exchange Source.bite from DevOps Endpoint'
      env:
        CFAccessClientIdValue: $(CFAccessClientId)
        CFAccessClientSecretValue: $(CFAccessClientSecret)

    - powershell: |
        $zipUrl = 'https://stwwreleases.blob.core.windows.net/releases/Warewolf-ExecutionEngine-Deployment-Scripts-v2.0.zip'
        $zipPath = "$(Agent.BuildDirectory)\DeploymentScripts.zip"
        $outDir  = "$(Agent.BuildDirectory)\DeploymentScripts"
        Write-Host "Downloading deployment scripts from $zipUrl ..."
        Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
        Write-Host "Extracting to $outDir ..."
        Expand-Archive -LiteralPath $zipPath -DestinationPath $outDir -Force
        Write-Host "Stage complete."
      displayName: 'Download and Stage Deployment Scripts'

    - powershell: |
        Write-Host "Logging in to Azure CLI as service principal ..."
        az login --service-principal `
            -u $env:AzureClientIdValue `
            -p $env:AzureClientSecretValue `
            --tenant $env:AzureTenantIdValue | Out-Null
        $account = az account show | ConvertFrom-Json
        Write-Host "Logged in: $($account.name) ($($account.id))"
      displayName: 'Log in to Azure CLI'
      env:
        AzureClientIdValue: $(AzureClientId)
        AzureClientSecretValue: $(AzureClientSecret)
        AzureTenantIdValue: $(AzureTenantId)

    - pwsh: |
        & "$(Agent.BuildDirectory)\DeploymentScripts\Scripts\Deploy-WwExecutionEngine.ps1" `
            -ResourceGroup  'DEV2' `
            -Location       'eastus' `
            -StorageAccount 'warewolfserveruatsa' `
            -AppName        'warewolfserver-uat' `
            -PublishPath    "$(Agent.BuildDirectory)\AzureFunctionsPublish" `
            -SkipAuthProvisioning `
            -NonInteractive
      displayName: 'Deploy via Deployment Scripts'

    # continueOnError: these smoke tests exercise the shared warewolfserver-uat
    # environment, whose health is independent of the commit being built. A UAT
    # outage or environment misconfiguration must surface as a visible warning but
    # must NOT fail an otherwise-good build or block the release artifact.
    #
    # KNOWN UAT ENVIRONMENT REQUIREMENTS (Azure-side app config, not code defects).
    # Both are set on the warewolfserver-uat Function App (Portal > Configuration,
    # or `az functionapp config ...` / `az functionapp config appsettings set ...`);
    # the SCM zip-deploy used below cannot set them, so they must be set once:
    #
    #   1. Platform = 64 Bit (use32BitWorkerProcess = false).
    #      If left 32-bit, the worker runs in the ...DOTNET-ISOLATED_8.0_X86 app pool
    #      and cannot load the x64 entry assembly (published with --runtime win-x64),
    #      crashing at startup with
    #        System.IO.FileLoadException: Could not load file or assembly
    #        'Warewolf.Execution.Lightweight' ...
    #      -> 503 on every route.
    #      Fix: az functionapp config set --name warewolfserver-uat \
    #             --resource-group <rg> --use-32bit-worker-process false
    #
    #   2. App setting WAREWOLF_LICENSE_CHECK_ENABLED is NO LONGER required: the
    #      Build stage now provisions an encrypted "Warewolf License.secureconfig"
    #      (Status=Active) into the package from the CustomerId/PlanId/SubscriptionKey
    #      secret pipeline variables, so SubscriptionProvider reports IsLicensed=true
    #      and WorkflowExecutor's gate passes. (Setting WAREWOLF_LICENSE_CHECK_ENABLED
    #      = false remains an alternative way to skip the gate entirely if ever needed.)
    #
    # Re-tighten (remove continueOnError) once UAT is confirmed green on both fronts.
    #
    # Both smoke tests below retry with backoff before giving up. /apis.json (checked
    # by the deploy script itself) is a lightweight static discovery route and comes up
    # almost immediately, but these routes actually execute a workflow on first hit -
    # a much heavier cold start (F# language parser init, activities engine JIT,
    # workflow-index lookup) that can outlast a single fixed wait + timeout, especially
    # on a Consumption-plan Function App. Retrying distinguishes a slow cold start from
    # a genuine regression instead of treating both the same as a single timeout would.
    - powershell: |
        $ErrorActionPreference = 'Continue'
        $uri         = 'https://warewolfserver-uat.azurewebsites.net/public/Hello%20World.json?Name=Test'
        $maxAttempts = 4
        $baseDelay   = 15
        Write-Host "Waiting 30 seconds for the Azure Functions app to start..."
        Start-Sleep -Seconds 30

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          try {
            $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 60
            Write-Host "STATUS: $($r.StatusCode)"
            Write-Host "Hello World response: $($r.Content)"
            break
          } catch {
            $resp = $_.Exception.Response
            if ($resp) {
              Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $([int]$resp.StatusCode) $($resp.StatusDescription)"
              try { $sr = New-Object IO.StreamReader($resp.GetResponseStream()); Write-Host "BODY: $($sr.ReadToEnd())" } catch { Write-Host "BODY: (empty)" }
            } else { Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)" }

            if ($attempt -ge $maxAttempts) {
              Write-Host "##[error]Hello World smoke test failed after $maxAttempts attempts."
              throw
            }
            $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
            Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
            Start-Sleep -Seconds $delaySeconds
          }
        }
      displayName: 'Execute Hello World with Name=Test'
      continueOnError: true

    - powershell: |
        $ErrorActionPreference = 'Continue'
        $uri         = 'https://warewolfserver-uat.azurewebsites.net/public/Simple%20MSSQL%20Test.json'
        $maxAttempts = 4
        $baseDelay   = 15

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
