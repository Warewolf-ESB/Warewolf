trigger:
  batch: true

pool:
  vmImage: 'windows-2022'

stages:
- stage: Local
  jobs:
  
  - job: Test_Locally
    displayName: 'Build and Test Lightweight Execution Server Locally'

    steps:
    - checkout: self
      clean: false

    - powershell: |
        $filePath = "$(Build.SourcesDirectory)\Dev\Resources - Load\Resources\Azure Microsoft SQL Server Source.bite"
        $content = Get-Content -LiteralPath $filePath -Raw
        $content = $content -replace '\[\[AzureDBPassword\]\]', $env:AzureDBPasswordValue
        Set-Content -LiteralPath $filePath -Value $content -Encoding UTF8 -NoNewline
      displayName: 'Patch AzureDBPassword in Load Testing Resource'
      env:
        AzureDBPasswordValue: $(AzureDBPassword)

    - task: DotNetCoreCLI@2
      displayName: 'Publish Lightweight Azure Functions Project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/Dev/Warewolf.Execution.Lightweight/Warewolf.Execution.Lightweight.csproj'
        arguments: '--configuration Release --output $(Agent.BuildDirectory)\AzureFunctionsPublish'
        zipAfterPublish: false
        modifyOutputPath: false

    - powershell: |
        $srcPath  = "$(Build.SourcesDirectory)\Dev\Resources - Load\Resources"
        $destPath = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        if (-not (Test-Path $destPath)) { New-Item -ItemType Directory -Force -Path $destPath | Out-Null }
        Copy-Item -Path "$srcPath\*" -Destination $destPath -Recurse -Force
      displayName: 'Copy Load Testing Resources into Publish Output'

    - powershell: |
        $settingsPath = "$(Agent.BuildDirectory)\AzureFunctionsPublish\local.settings.json"
        @{
          IsEncrypted = $false
          Values = @{
            AzureWebJobsStorage      = 'none'
            FUNCTIONS_WORKER_RUNTIME = 'dotnet-isolated'
          }
        } | ConvertTo-Json | Set-Content -LiteralPath $settingsPath -Encoding UTF8
      displayName: 'Write local.settings.json for Local Host'
      
    - powershell: npm install -g azure-functions-core-tools@4 --unsafe-perm true
      displayName: 'Install Azure Functions Core Tools'

    - powershell: |
        $publishDir = "$(Agent.BuildDirectory)\AzureFunctionsPublish"
        $logFile    = "$(Agent.BuildDirectory)\func-start.log"
        $errFile    = "$(Agent.BuildDirectory)\func-start.err.log"
        $process = Start-Process -FilePath "cmd.exe" `
            -ArgumentList "/c", "func", "start", "--port", "7071" `
            -WorkingDirectory $publishDir `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError  $errFile `
            -PassThru -NoNewWindow
        $process.Id | Out-File -LiteralPath "$(Agent.BuildDirectory)\func-pid.txt" -NoNewline
        Write-Host "Started func via cmd.exe with PID $($process.Id), waiting for host to be ready..."
        $ready = $false
        for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
                $null = Invoke-WebRequest -Uri 'http://localhost:7071/public/Hello%20World.json?Name=Test' -UseBasicParsing -ErrorAction Stop
                $ready = $true
                Write-Host "Host ready after $($i * 2 + 2) seconds."
                break
            } catch { }
        }
        if (-not $ready) {
            Write-Host "=== func stdout ==="
            Get-Content $logFile -ErrorAction SilentlyContinue
            Write-Host "=== func stderr ==="
            Get-Content $errFile -ErrorAction SilentlyContinue
            throw "Azure Functions local host did not become ready within 120 seconds."
        }
      displayName: 'Start Azure Functions Host Locally'

    - powershell: |
        $response = Invoke-RestMethod -Uri 'http://localhost:7071/public/Hello%20World.json?Name=Test' -Method GET
        Write-Host "Hello World response: $($response | ConvertTo-Json -Depth 10)"
      displayName: 'Execute Hello World with Name=Test'

    - powershell: |
        $uri = 'http://localhost:7071/public/azure%20db.json?CustomerId=16BjmNSXISIQjctO&InvoiceDate=01%2F01%2F2026%2000%3A00%3A00.000'
        $response = Invoke-RestMethod -Uri $uri -Method GET
        Write-Host "Azure DB response: $($response | ConvertTo-Json -Depth 10)"
      displayName: 'Execute Azure DB Workflow'

    - powershell: |
        $pidFile = "$(Agent.BuildDirectory)\func-pid.txt"
        if (Test-Path $pidFile) {
            $funcPid = [int](Get-Content $pidFile -Raw)
            Stop-Process -Id $funcPid -Force -ErrorAction SilentlyContinue
            Write-Host "Stopped func.exe (PID $funcPid)"
        }
      displayName: 'Stop Azure Functions Host'
      condition: always()
  
- stage: Azure
  jobs:

  - job: Deploy_And_Test_Azure_Functions
    displayName: 'Deploy and Test Lightweight Execution Server in Azure Functions'

    steps:
    - checkout: self
      clean: false

    - powershell: |
        $filePath = "$(Build.SourcesDirectory)\Dev\Resources - Load\Resources\Azure Microsoft SQL Server Source.bite"
        $content = Get-Content -LiteralPath $filePath -Raw
        $content = $content -replace '\[\[AzureDBPassword\]\]', $env:AzureDBPasswordValue
        Set-Content -LiteralPath $filePath -Value $content -Encoding UTF8 -NoNewline
      displayName: 'Patch AzureDBPassword in Load Testing Resource'
      env:
        AzureDBPasswordValue: $(AzureDBPassword)

    - task: DotNetCoreCLI@2
      displayName: 'Publish Lightweight Azure Functions Project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/Dev/Warewolf.Execution.Lightweight/Warewolf.Execution.Lightweight.csproj'
        arguments: '--configuration Release --output $(Agent.BuildDirectory)\AzureFunctionsPublish'
        zipAfterPublish: false
        modifyOutputPath: false

    - powershell: |
        $srcPath  = "$(Build.SourcesDirectory)\Dev\Resources - Load\Resources"
        $destPath = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        if (-not (Test-Path $destPath)) { New-Item -ItemType Directory -Force -Path $destPath | Out-Null }
        Copy-Item -Path "$srcPath\*" -Destination $destPath -Recurse -Force
      displayName: 'Copy Load Testing Resources into Publish Output'

    - powershell: |
        $packagePath = "$(Agent.BuildDirectory)\AzureFunctionsPackage.zip"
        if (Test-Path $packagePath) { Remove-Item $packagePath -Force }
        Compress-Archive -Path "$(Agent.BuildDirectory)\AzureFunctionsPublish\*" -DestinationPath $packagePath -Force

        $publishSettings = [xml]$env:UATAzurePublishSettingsValue
        $zipProfile = $publishSettings.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1
        $userName   = $zipProfile.userName
        $password   = $zipProfile.userPWD
        $publishUrl = $zipProfile.publishUrl

        $pair         = "${userName}:${password}"
        $encodedCreds = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
        $headers      = @{ Authorization = "Basic $encodedCreds" }

        Write-Host "Deploying to https://$publishUrl/api/zipdeploy ..."
        Invoke-RestMethod -Uri "https://$publishUrl/api/zipdeploy" -Method POST -Headers $headers -InFile $packagePath -ContentType 'application/zip'
        Write-Host "Deployment complete."
      displayName: 'Package and Deploy to Azure (Zip Deploy)'
      env:
        UATAzurePublishSettingsValue: $(UATAzurePublishSettings)

    - powershell: |
        Write-Host "Waiting 30 seconds for the Azure Functions app to start..."
        Start-Sleep -Seconds 30
        $response = Invoke-RestMethod -Uri 'https://warewolfserver-uat.azurewebsites.net/public/Hello%20World.json?Name=Test' -Method GET
        Write-Host "Hello World response: $($response | ConvertTo-Json -Depth 10)"
      displayName: 'Execute Hello World with Name=Test'

    - powershell: |
        $uri = 'https://warewolfserver-uat.azurewebsites.net/public/azure%20db.json?CustomerId=16BjmNSXISIQjctO&InvoiceDate=01%2F01%2F2026%2000%3A00%3A00.000&code=B1Z9Gosse5Oxuq0TZ1XP1L2vlm8TVT5dtA9rYkTjtBfUAzFuKgvGUQ=='
        $response = Invoke-RestMethod -Uri $uri -Method GET
        Write-Host "Azure DB response: $($response | ConvertTo-Json -Depth 10)"
      displayName: 'Execute Azure DB Workflow'
      
- stage: Package
  displayName: 'Package Release Artifact'
  jobs:

  - job: Package_Release
    displayName: 'Build and Package Lightweight Azure Functions Release'

    steps:
    - checkout: self
      clean: false

    - task: DotNetCoreCLI@2
      displayName: 'Publish Lightweight Azure Functions Project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/Dev/Warewolf.Execution.Lightweight/Warewolf.Execution.Lightweight.csproj'
        arguments: '--configuration Release --output $(Agent.BuildDirectory)\AzureFunctionsPublish'
        zipAfterPublish: false
        modifyOutputPath: false

    - powershell: |
        $packagePath = "$(Agent.BuildDirectory)\AzureFunctionsPackage.zip"
        if (Test-Path $packagePath) { Remove-Item $packagePath -Force }
        Compress-Archive -Path "$(Agent.BuildDirectory)\AzureFunctionsPublish\*" -DestinationPath $packagePath -Force
        Write-Host "Package created at $packagePath"
      displayName: 'Package Publish Output as Zip'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Release Zip as Build Artifact'
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\AzureFunctionsPackage.zip'
        ArtifactName: 'AzureFunctionsRelease'
        publishLocation: 'Container'