  # Runs Test-ShovelBridgeE2E.ps1 in -DestinationMode ExternalServiceBus against a real,
  # already-provisioned Service Bus namespace (WarewolfShovelBridgeTesting, resource group
  # DEV2) instead of the local emulator used by the ShovelBridgeE2ETest job in
  # pipeline.yml — this is the "Test on Azure" stage job for that mode, referenced but not
  # yet wired up in docs/ShovelBridge-Architecture.md. Runs independently of, and in
  # parallel with, Deploy_And_Test_Azure_Functions above (no shared dependency).
  #
  # Also runs with -RabbitMqMode External against a LOCAL, choco-installed RabbitMQ Windows
  # service on this same hosted agent, rather than a docker-run rabbitmq:3-management
  # container: Docker on Microsoft-hosted Windows agents only supports Windows containers
  # (no Hyper-V/WSL2 Linux-container backend on the hosted VM, and no in-place daemon
  # switch available there), so `docker run rabbitmq:3-management` (a Linux-only image)
  # fails with "no matching manifest for windows/amd64" and `docker network create` fails
  # with "plugin bridge not found". -RabbitMqMode External only needs a reachable broker
  # with management + shovel + shovel_management enabled and caller-supplied creds — it
  # doesn't care whether that broker is genuinely remote or freshly provisioned on the
  # agent itself, so this reuses the exact 'choco install rabbitmq' + rabbitmq.conf +
  # rabbitmq-plugins enable technique TestRun.ps1's Start-HostRabbitMQServer already uses
  # for other RabbitMQ-dependent CI jobs on Windows agents (see TestRun.ps1). This
  # previously pointed at a standing, self-hosted "Warewolf DevOps RabbitMQ Source" broker
  # (rabbitmq.warewolf.online, reached over a non-Azure tunnel) - that dependency was
  # removed because its outbound network path to Azure Service Bus was assumed
  # unreliable/opaque from CI (the shovel would connect fine locally but never reach the
  # 'running' state against the real Service Bus destination). In hindsight that broker
  # was very likely hitting the SAME root cause documented in the "Install & start local
  # RabbitMQ" step below (Erlang's non-wildcard-aware TLS hostname check rejecting Azure
  # Service Bus's *.servicebus.windows.net certificate) rather than a genuine network
  # path problem - reproduced and fixed here, see docs/ShovelBridge-Architecture.md. A
  # local broker on the hosted agent still uses Microsoft's own outbound networking to
  # Azure, which is worth continuing to validate regardless. With both RabbitMQ (local
  # Windows service) and the Service Bus destination (external, real Azure) available,
  # this job needs no docker at all, so it stays on windows-2022 like the rest of this
  # pipeline.
  - job: ShovelBridgeE2ETest_ExternalServiceBus
    displayName: 'RabbitMQ Shovel -> Service Bus E2E Test (ExternalServiceBus mode, Azure)'
    pool:
      vmImage: 'windows-2022'
    timeoutInMinutes: 30
    variables:
      ServiceBusNamespace: 'WarewolfShovelBridgeTesting'
      ServiceBusResourceGroup: 'DEV2'
      ServiceBusQueueName: 'wwexecution-queue-e2e'
      ServiceBusSendRuleName: 'shovel-e2e-send'
      ServiceBusListenRuleName: 'shovel-e2e-listen'
      # The local RabbitMQ Windows service only exposes the loopback-only 'guest' user by
      # default, which is fine here: both the management API calls below AND the shovel's
      # own src-uri connection (localhost:5672, inside the same node - see
      # Test-ShovelBridgeE2E.ps1) originate from this same agent, i.e. always loopback.
      ExternalRabbitMqManagementUri: 'http://localhost:15672'
      ExternalRabbitMqUsername: 'guest'

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # Same 'choco install rabbitmq' native-Windows-service technique TestRun.ps1's
    # Start-HostRabbitMQServer uses for other RabbitMQ-dependent jobs on Windows agents
    # (see TestRun.ps1), plus enabling the shovel + shovel_management plugins this test
    # additionally needs (Start-HostRabbitMQServer's own callers never use Shovel). Runs on
    # this agent instead of docker (Windows agents can't pull the Linux-only
    # rabbitmq:3-management image) and instead of a standing external broker (removes a
    # dependency on that broker's own, opaque-to-CI outbound network path to Azure).
    - powershell: |
        $ErrorActionPreference = 'Stop'

        if (-not (Get-Service -Name 'RabbitMQ' -ErrorAction SilentlyContinue)) {
          choco install rabbitmq -y --no-progress
        }

        # RabbitMQ 4.x forbids transient (non-durable) non-exclusive queues by default
        # ('transient_nonexcl_queues' deprecated feature); re-permit it, same as
        # TestRun.ps1's Start-HostRabbitMQServer does for the choco install path.
        $confLine = 'deprecated_features.permit.transient_nonexcl_queues = true'
        $confDirs = @(
          (Join-Path $env:APPDATA 'RabbitMQ'),
          'C:\Windows\System32\config\systemprofile\AppData\Roaming\RabbitMQ'
        )

        # Erlang's default TLS peer verification (verify_peer, applied to the shovel's
        # amqp10 dest-uri whenever it omits an explicit '?verify=' override) does a
        # LITERAL hostname match against the certificate's SANs - it does not expand
        # wildcard SANs the way RFC 6125 (and Erlang's own https-specific match
        # function) does. Azure Service Bus presents *.servicebus.windows.net /
        # servicebus.windows.net, which never literal-matches a real namespace FQDN
        # (e.g. mynamespace.servicebus.windows.net), so amqp10_client's TLS handshake
        # always fails with {bad_cert, {hostname_check_failed, ...}} - surfaced by the
        # shovel only as the generic "failed to connect to destination". This is NOT a
        # SAS-key/auth/network problem (root-caused and reproduced locally against the
        # real Service Bus namespace: see docs/ShovelBridge-Architecture.md).
        #
        # Fix: apply Erlang's own wildcard-aware match function (the one built for
        # https) to amqp10_client globally via advanced.config, so the destination
        # connection keeps FULL certificate chain + hostname validation (verify_peer,
        # no downgrade to verify_none) while correctly accepting the wildcard SAN.
        $advancedConfigContent = @(
          '[',
          '  {amqp10_client, [',
          '    {ssl_options, [',
          '      {customize_hostname_check, [',
          '        {match_fun, public_key:pkix_verify_hostname_match_fun(https)}',
          '      ]}',
          '    ]}',
          '  ]}',
          '].'
        ) -join "`n"
        foreach ($d in $confDirs) {
          if (-not (Test-Path $d)) { New-Item -ItemType Directory -Path $d -Force | Out-Null }
          Set-Content -Path (Join-Path $d 'rabbitmq.conf') -Value $confLine -Encoding ascii -Force
          Set-Content -Path (Join-Path $d 'advanced.config') -Value $advancedConfigContent -Encoding ascii -Force -NoNewline
        }

        Restart-Service -Name 'RabbitMQ' -Force -ErrorAction SilentlyContinue
        Start-Service -Name 'RabbitMQ' -ErrorAction SilentlyContinue

        $bound = $false
        for ($i = 1; $i -le 30; $i++) {
          try { (New-Object System.Net.Sockets.TcpClient('127.0.0.1', 5672)).Close(); $bound = $true; break } catch { Start-Sleep 2 }
        }
        if (-not $bound) { throw 'RabbitMQ did not bind 5672 within 60s.' }

        $rabbitmqPlugins = Get-ChildItem -Path 'C:\Program Files\RabbitMQ Server' -Filter 'rabbitmq-plugins.bat' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $rabbitmqPlugins) { throw 'rabbitmq-plugins.bat not found after choco install.' }
        & $rabbitmqPlugins.FullName enable rabbitmq_management rabbitmq_shovel rabbitmq_shovel_management
        if ($LASTEXITCODE -ne 0) { throw "rabbitmq-plugins enable failed (exit $LASTEXITCODE)." }

        # The choco package auto-starts rabbitmq_management as part of its own install, so
        # by the time we reach the 'enable' call above, the management app is typically
        # already running. Hot-enabling shovel_management on top of an ALREADY-running
        # management app does not register its REST routes into the live Cowboy
        # dispatcher (a well-known RabbitMQ management-plugin gotcha - the dispatch table
        # is only built when the mgmt app itself (re)starts). Symptom seen in CI: /api/
        # overview responds fine, but /api/shovels never comes up within the E2E script's
        # own (shorter) readiness window. Force a full service restart here so the node
        # reboots with all three plugins already enabled from the start, guaranteeing
        # /api/shovels is registered - same fix as RabbitMQ's own documented workaround
        # (rabbitmqctl eval 'rabbit_mgmt_app:reset_dispatcher(ignore).'), just via restart
        # since that's already this script's established pattern for applying changes.
        Restart-Service -Name 'RabbitMQ' -Force -ErrorAction SilentlyContinue
        Start-Service -Name 'RabbitMQ' -ErrorAction SilentlyContinue

        $bound = $false
        for ($i = 1; $i -le 30; $i++) {
          try { (New-Object System.Net.Sockets.TcpClient('127.0.0.1', 5672)).Close(); $bound = $true; break } catch { Start-Sleep 2 }
        }
        if (-not $bound) { throw 'RabbitMQ did not bind 5672 within 60s after restarting for plugin activation.' }

        $authHeader = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('guest:guest')) }

        $mgmtReady = $false
        for ($i = 1; $i -le 30; $i++) {
          try { Invoke-RestMethod -Uri 'http://localhost:15672/api/overview' -Headers $authHeader -TimeoutSec 5 -ErrorAction Stop | Out-Null; $mgmtReady = $true; break } catch { Start-Sleep 2 }
        }
        if (-not $mgmtReady) { throw 'RabbitMQ management API (15672) not ready after enabling plugins.' }

        # Explicitly verify shovel_management's own endpoint here (not just /api/overview)
        # so a dispatcher-registration failure is caught - and fails loudly - in this setup
        # step, rather than surfacing later as a more opaque timeout inside the E2E script.
        $shovelApiReady = $false
        for ($i = 1; $i -le 30; $i++) {
          try { Invoke-RestMethod -Uri 'http://localhost:15672/api/shovels' -Headers $authHeader -TimeoutSec 5 -ErrorAction Stop | Out-Null; $shovelApiReady = $true; break } catch { Start-Sleep 2 }
        }
        if (-not $shovelApiReady) { throw 'RabbitMQ /api/shovels (rabbitmq_shovel_management) not ready after enabling plugins and restarting the service.' }

        Write-Host 'Local RabbitMQ (choco) is ready with management + shovel + shovel_management enabled.'
      displayName: 'Install & start local RabbitMQ (choco) with shovel plugins'

    # Reuses the same service principal (AzureClientId/AzureClientSecret/AzureTenantId)
    # already used by 'Log in to Azure CLI' in Deploy_And_Test_Azure_Functions above - no
    # new pipeline secrets needed.
    - powershell: |
        Write-Host "Logging in to Azure CLI as service principal ..."
        az login --service-principal `
            -u $env:AzureClientIdValue `
            -p $env:AzureClientSecretValue `
            --tenant $env:AzureTenantIdValue | Out-Null
        $account = az account show | ConvertFrom-Json
        Write-Host "Logged in: $($account.name) ($($account.id))"
      displayName: 'Log in to Azure CLI'
      env:
        AzureClientIdValue: $(AzureClientId)
        AzureClientSecretValue: $(AzureClientSecret)
        AzureTenantIdValue: $(AzureTenantId)

    # Self-heals a known, documented drift risk (docs/ShovelBridge-Architecture.md,
    # "Security" section): the Shovel plugin's dest-uri only ever authenticates via
    # SASL PLAIN (policy-name:key) - it has no Azure AD/OAuth client, so it cannot use
    # Managed Identity or an Entra token. If a security baseline/policy on the
    # WarewolfShovelBridgeTesting namespace flips 'disableLocalAuth' to true (i.e.
    # disables SAS/local auth), EVERY SAS-signed call against it starts failing with
    # 401 Unauthorized - both this job's own Service Bus management-API destination
    # queue check (Test-ShovelBridgeE2E.ps1's Test-ServiceBusQueueExists) AND the
    # Shovel's own AMQP connection, which would surface as the Shovel going to
    # 'terminated' with reason "failed to connect to destination". Checking/restoring
    # this here, before the queue/SAS-rule provisioning and the test run, means the
    # pipeline recovers automatically instead of failing with a misleading
    # auth/connectivity error on every drift.
    #
    # NOTE: disableLocalAuth drift is NOT the only thing that produces "failed to
    # connect to destination" - a separate, unrelated TLS certificate-validation bug
    # (Erlang's non-wildcard-aware hostname check rejecting Azure Service Bus's
    # wildcard cert) produces the exact same generic reason string even when
    # disableLocalAuth is correctly false, as confirmed live against this namespace.
    # That is fixed by the advanced.config written in the "Install & start local
    # RabbitMQ" step above; see docs/ShovelBridge-Architecture.md for the full
    # root-cause writeup. Keep both fixes - they guard against two independent,
    # equally-fatal failure modes that happen to share the same symptom text.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ns = '$(ServiceBusNamespace)'
        $rg = '$(ServiceBusResourceGroup)'

        $disableLocalAuth = az servicebus namespace show --name $ns --resource-group $rg --query disableLocalAuth -o tsv
        if ($LASTEXITCODE -ne 0) { throw "Failed to read 'disableLocalAuth' for Service Bus namespace '$ns' (exit $LASTEXITCODE)." }

        if ($disableLocalAuth -eq 'true') {
          Write-Host "##[warning]Service Bus namespace '$ns' has local (SAS) authentication disabled (disableLocalAuth=true) - this breaks the Shovel's SASL PLAIN dest-uri connection and any SAS-signed management API call. Restoring disableLocalAuth=false ..."
          az servicebus namespace update --name $ns --resource-group $rg --disable-local-auth false | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to restore 'disableLocalAuth=false' on Service Bus namespace '$ns' (exit $LASTEXITCODE)." }
          Write-Host "Restored: local (SAS) authentication is now enabled on '$ns'."
        } else {
          Write-Host "Service Bus namespace '$ns' already has local (SAS) authentication enabled (disableLocalAuth=$disableLocalAuth) - no action needed."
        }
      displayName: 'Ensure Service Bus namespace allows local (SAS) auth for the Shovel'

    # Idempotent 'show, create-if-missing' provisioning of ONE fixed, persistent queue +
    # its two queue-scoped SAS rules (Send-only for the shovel destination, Listen-only
    # for the harness's own verification connection) - same least-privilege split, and the
    # same az CLI calls, as Deploy-WwExecutionServiceBusWorker.ps1's own Send/Listen rule
    # provisioning. Nothing is deleted after the run: this is a dedicated, disposable
    # testing namespace, so the queue/rules are left in place and reused by every run
    # rather than provisioned/torn down per-run.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ns         = '$(ServiceBusNamespace)'
        $rg         = '$(ServiceBusResourceGroup)'
        $queue      = '$(ServiceBusQueueName)'
        $sendRule   = '$(ServiceBusSendRuleName)'
        $listenRule = '$(ServiceBusListenRuleName)'

        function Test-AzExists([string[]] $CliArgs) {
          # Merging stderr into the output stream via 2>&1 does NOT stop it being
          # promoted to a terminating NativeCommandError while $ErrorActionPreference
          # is 'Stop' - Windows PowerShell 5.1 converts merged stderr lines to
          # ErrorRecord objects and still honours 'Stop' for them, so the
          # expected-on-first-run "EntityNotFound" from 'az servicebus queue show'
          # aborts the whole script before $LASTEXITCODE can be checked. Scope
          # $ErrorActionPreference to 'Continue' for just this call (function-local,
          # reverts automatically on return) so only the exit code is used to decide
          # existence, while the rest of the script keeps failing fast on 'Stop'.
          $ErrorActionPreference = 'Continue'
          $null = & az @CliArgs -o json 2>&1
          return $LASTEXITCODE -eq 0
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'show', '--name', $queue, '--namespace-name', $ns, '--resource-group', $rg))) {
          Write-Host "Creating queue '$queue' on '$ns'..."
          az servicebus queue create --name $queue --namespace-name $ns --resource-group $rg | Out-Null
        } else {
          Write-Host "Queue '$queue' already exists."
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'authorization-rule', 'show', '--name', $sendRule, '--namespace-name', $ns, '--resource-group', $rg, '--queue-name', $queue))) {
          Write-Host "Creating Send-only SAS rule '$sendRule'..."
          az servicebus queue authorization-rule create --name $sendRule --namespace-name $ns --resource-group $rg --queue-name $queue --rights Send | Out-Null
        } else {
          Write-Host "Send rule '$sendRule' already exists."
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'authorization-rule', 'show', '--name', $listenRule, '--namespace-name', $ns, '--resource-group', $rg, '--queue-name', $queue))) {
          Write-Host "Creating Listen-only SAS rule '$listenRule'..."
          az servicebus queue authorization-rule create --name $listenRule --namespace-name $ns --resource-group $rg --queue-name $queue --rights Listen | Out-Null
        } else {
          Write-Host "Listen rule '$listenRule' already exists."
        }

        $sendKey = (az servicebus queue authorization-rule keys list --name $sendRule --namespace-name $ns --resource-group $rg --queue-name $queue --query primaryKey -o tsv)
        if ([string]::IsNullOrWhiteSpace($sendKey)) { throw "Failed to retrieve primary key for '$sendRule'." }
        $policyEnc = [Uri]::EscapeDataString($sendRule)
        $keyEnc    = [Uri]::EscapeDataString($sendKey)
        $destUri   = "amqps://${policyEnc}:${keyEnc}@${ns}.servicebus.windows.net:5671/?sasl=plain"

        $listenConnStr = (az servicebus queue authorization-rule keys list --name $listenRule --namespace-name $ns --resource-group $rg --queue-name $queue --query primaryConnectionString -o tsv)
        if ([string]::IsNullOrWhiteSpace($listenConnStr)) { throw "Failed to retrieve primary connection string for '$listenRule'." }

        Write-Host "##vso[task.setvariable variable=ShovelDestUri;issecret=true]$destUri"
        Write-Host "##vso[task.setvariable variable=ListenConnectionString;issecret=true]$listenConnStr"
        Write-Host "Provisioning complete. Queue '$queue' ready on '$ns' with rules '$sendRule' (Send) / '$listenRule' (Listen)."
      displayName: 'Ensure Service Bus test queue + SAS rules exist'

    # #Requires -Version 7.0 in Test-ShovelBridgeE2E.ps1 means this step MUST run under
    # PowerShell 7 (pwsh), not Windows PowerShell. Secrets are passed via env: (masked in
    # logs by ADO because they were marked issecret=true above), never inlined into a
    # command-line arguments string.
    - pwsh: |
        $connSecure = ConvertTo-SecureString $env:ListenConnectionStringValue -AsPlainText -Force
        $rabbitPasswordSecure = ConvertTo-SecureString 'guest' -AsPlainText -Force
        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Tests\Integration\Test-ShovelBridgeE2E.ps1' `
            -DestinationMode ExternalServiceBus `
            -DestinationQueueName '$(ServiceBusQueueName)' `
            -ExternalShovelDestUri $env:ShovelDestUriValue `
            -ExternalServiceBusConnectionString $connSecure `
            -RabbitMqMode External `
            -ExternalRabbitMqManagementUri '$(ExternalRabbitMqManagementUri)' `
            -ExternalRabbitMqUsername '$(ExternalRabbitMqUsername)' `
            -ExternalRabbitMqPassword $rabbitPasswordSecure
      displayName: 'Run ShovelBridge E2E test (ExternalServiceBus mode)'
      env:
        ShovelDestUriValue: $(ShovelDestUri)
        ListenConnectionStringValue: $(ListenConnectionString)

    - powershell: |
        $names = docker ps -a --filter "name=shovel-e2e-" --format '{{.Names}}' 2>$null
        if ($names) { $names -split "`n" | Where-Object { $_ } | ForEach-Object { docker rm -f $_ 2>$null | Out-Null } }
        $nets = docker network ls --filter "name=shovel-e2e-" --format '{{.Name}}' 2>$null
        if ($nets) { $nets -split "`n" | Where-Object { $_ } | ForEach-Object { docker network rm $_ 2>$null | Out-Null } }
        Stop-Service -Name 'RabbitMQ' -Force -ErrorAction SilentlyContinue
      displayName: 'Clean up any leftover containers/networks and stop local RabbitMQ'
      condition: always()

- stage: Package
  displayName: 'Package Release Artifact'
  # The release artifact is just the Build stage's published output, so it depends
  # on Build (not Azure). The Azure stage is a UAT deployment smoke test against a
  # shared environment; its result must not gate production of the release artifact
  # the downstream release pipeline consumes. Build still runs first, so a genuine
  # compile/publish failure still prevents an artifact.
  dependsOn: Build
  jobs:

  - job: Package_Release
    displayName: 'Build and Package Lightweight Azure Functions Release'

    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Compiled Artifact'
      inputs:
        artifact: 'AzureFunctionsPublish'
        path: '$(Agent.BuildDirectory)\AzureFunctionsPublish'

    # The Build stage bundles content the Azure UAT smoke tests need at runtime
    # (load-testing workflows under Resources\, the encrypted secure.config used for
    # public workflow execution, the encrypted "Warewolf License.secureconfig"
    # subscription gate, the Prompts\ folder and Settings\ logging source).
    # The released artifact, by contrast, must ship WITHOUT any of these: resources
    # and configuration (including the licence) are provided by the operator at deploy
    # time (prompted, or passed through deployment parameters). The local developer/
    # operator helper scripts (StartAsAzureFunction.ps1, Deploy-ToAzure.ps1) and the
    # SSL certificate generation folder are likewise stripped - they are run from the
    # source tree, not from the deployed Function App. Strip everything here - after
    # Azure has consumed it from the shared AzureFunctionsPublish artifact - so only
    # this release artifact is affected. The Resources folder itself is kept (emptied)
    # so it remains in place for deploy-time population.
    - powershell: |
        $publishDir = "$(Agent.BuildDirectory)\AzureFunctionsPublish"

        $resourcesPath = Join-Path $publishDir "Resources"
        if (Test-Path $resourcesPath) {
            Get-ChildItem -LiteralPath $resourcesPath -Force | Remove-Item -Recurse -Force
            Write-Host "Emptied Resources folder: $resourcesPath"
        } else {
            New-Item -ItemType Directory -Force -Path $resourcesPath | Out-Null
            Write-Host "Created empty Resources folder: $resourcesPath"
        }

        $promptsPath = Join-Path $publishDir "Prompts"
        if (Test-Path $promptsPath) {
            Remove-Item -LiteralPath $promptsPath -Recurse -Force
            Write-Host "Removed Prompts folder: $promptsPath"
        }

        $elasticBite = Join-Path $publishDir "Settings\ElasticsearchLoggingSource.bite"
        if (Test-Path $elasticBite) {
            Remove-Item -LiteralPath $elasticBite -Force
            Write-Host "Removed Settings\ElasticsearchLoggingSource.bite"
        }

        $secureConfig = Join-Path $publishDir "secure.config"
        if (Test-Path $secureConfig) {
            Remove-Item -LiteralPath $secureConfig -Force
            Write-Host "Removed secure.config"
        }

        $licenseConfig = Join-Path $publishDir "Warewolf License.secureconfig"
        if (Test-Path $licenseConfig) {
            Remove-Item -LiteralPath $licenseConfig -Force
            Write-Host "Removed Warewolf License.secureconfig"
        }

        foreach ($script in @('StartAsAzureFunction.ps1', 'Deploy-ToAzure.ps1')) {
            $scriptPath = Join-Path $publishDir $script
            if (Test-Path $scriptPath) {
                Remove-Item -LiteralPath $scriptPath -Force
                Write-Host "Removed $script"
            }
        }

        # The SSL certificate helper folder (CreateCertificate.bat / TrustCertificate.bat)
        # is local developer tooling; resolve it case-insensitively because its source
        # casing ("SSL Generation") differs from the published casing on some build paths.
        $sslFolder = Get-ChildItem -LiteralPath $publishDir -Directory -Force |
            Where-Object { $_.Name -ieq 'SSL Generation' } | Select-Object -First 1
        if ($sslFolder) {
            Remove-Item -LiteralPath $sslFolder.FullName -Recurse -Force
            Write-Host "Removed $($sslFolder.Name) folder"
        }
      displayName: 'Strip Deploy-Time Resources and Config from Release Artifact'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Release Artifact'
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\AzureFunctionsPublish'
        ArtifactName: 'AzureFunctionsRelease'
        publishLocation: 'Container'

# Publishes a build as a public release: uploads the engine zip + deployment scripts
# zip to Azure Blob Storage (stwwreleases/releases) and updates the
# "latest version" block on https://warewolf.io/release-notes.php (archiving the
# previous latest block first). Only runs when PublishRelease=true is set on a
# manually queued run - ordinary CI/CD builds never touch the public release page.
#
# AzureStorageServiceConnection is a statically-defined pipeline VARIABLE (above,
# in the top-level variables: block), referenced via the compile-time template
# expression ${{ variables.AzureStorageServiceConnection }} - NOT the runtime
# $(...) macro syntax. Service connection references are authorized at
# pipeline-compile time, before runtime $(...) macros are substituted, so a
# $(...) reference fails with "service connection ... could not be found".
#
# Required pipeline variables (Pipelines > Edit > Variables). Mark the starred one
# as "secret":
#   AzureStorageAccountName       - stwwreleases
#   AzureStorageContainerName     - releases
#   ReleaseNotesFtpHost           - 160.153.129.213
#   ReleaseNotesFtpUser           - releasenotes@new.warewolf.io
# * ReleaseNotesFtpPassword       - FTP password for ReleaseNotesFtpUser
- stage: Release
  displayName: 'Publish Release (Azure Storage + warewolf.io)'
  dependsOn: Package
  condition: and(succeeded(), eq('${{ parameters.PublishRelease }}', true))
  jobs:

  - job: Publish_Release
    displayName: 'Upload release artifacts and update release notes'

    steps:
    # Only needed to zip up Dev/Warewolf.Execution.Lightweight/Scripts - the engine
    # artifact itself comes from the Package stage, not from this checkout.
    - checkout: self
      clean: false
      fetchDepth: 1

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Release Artifact'
      inputs:
        artifact: 'AzureFunctionsRelease'
        path: '$(Agent.BuildDirectory)\AzureFunctionsRelease'

    - powershell: |
        $versionFile = Join-Path "$(Agent.BuildDirectory)\AzureFunctionsRelease" 'FullVersionString'
        if (-not (Test-Path $versionFile)) { throw "FullVersionString not found in the release artifact - was it built by the Build stage?" }
        $version = (Get-Content -LiteralPath $versionFile -Raw).Trim()
        if ($version -eq '0.0.0.0' -or [string]::IsNullOrWhiteSpace($version)) { throw "Release artifact has no valid version ($version)." }
        Write-Host "##vso[task.setvariable variable=ReleaseVersion]$version"
        Write-Host "Release version: $version"
      displayName: 'Read release version from artifact'

    # Auto-detects the deployment scripts zip version so it does not need to be
    # on every run: reads the CURRENT scripts-zip-link href off the live
    # warewolf.io/release-notes.php, downloads that zip, and compares a content
    # hash of it against the Scripts/ folder in this build. If nothing changed,
    # the existing version tag is reused (no republish needed); if it changed,
    # the tag's trailing number is bumped (e.g. v2.0 -> v2.1). There is no manual
    # override anymore - this always runs (Azure DevOps's "Run pipeline" UI does
    # not allow submitting an empty string for a parameter, so a manual-override
    # parameter could never be "left blank" in practice).
    - powershell: |
        $ErrorActionPreference = 'Stop'

        function Get-FolderHash([string]$FolderPath, [string[]]$ExcludeTopLevel) {
          $files = Get-ChildItem -LiteralPath $FolderPath -Recurse -File -Force | Where-Object {
            $rel = $_.FullName.Substring($FolderPath.Length).TrimStart('\', '/')
            -not ($ExcludeTopLevel | Where-Object { $rel -eq $_ -or $rel -like "$_\*" -or $rel -like "$_/*" })
          } | Sort-Object { $_.FullName.Substring($FolderPath.Length) }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $ms = New-Object System.IO.MemoryStream
          foreach ($f in $files) {
            $rel = $f.FullName.Substring($FolderPath.Length).TrimStart('\', '/').Replace('\', '/')
            $relBytes = [System.Text.Encoding]::UTF8.GetBytes($rel)
            $ms.Write($relBytes, 0, $relBytes.Length)
            $fileBytes = [System.IO.File]::ReadAllBytes($f.FullName)
            $ms.Write($fileBytes, 0, $fileBytes.Length)
          }
          $hashBytes = $sha.ComputeHash($ms.ToArray())
          return [System.BitConverter]::ToString($hashBytes) -replace '-', ''
        }

        function Get-BumpedVersionTag([string]$Tag) {
          if ($Tag -match '^v?(\d+(?:\.\d+)*)$') {
            $parts = $Matches[1] -split '\.'
            $parts[-1] = [string]([int]$parts[-1] + 1)
            return 'v' + ($parts -join '.')
          }
          return 'v1.0'
        }

        $scriptsSrc = "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts"
        if (-not (Test-Path $scriptsSrc)) { throw "Scripts folder not found at $scriptsSrc" }
        $newHash = Get-FolderHash -FolderPath $scriptsSrc -ExcludeTopLevel @('logs')

        $scriptsVersion = $null
        try {
            $notesResponse = Invoke-WebRequest -Uri 'https://warewolf.io/release-notes.php' -UseBasicParsing -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
            $hrefMatch = [regex]::Match($notesResponse.Content, 'data-role="scripts-zip-link"[^>]*href="([^"]+)"')
            if ($hrefMatch.Success) {
              $currentScriptsUrl = $hrefMatch.Groups[1].Value

              # Only trust scripts-zip links pointing at this pipeline's own Azure Storage
              # account - warewolf.io's release-notes.php is public content, so its markup
              # must not be treated as a trusted source for a URL the agent will fetch from
              # and expand on disk.
              $expectedScriptsHost = "$(AzureStorageAccountName).blob.core.windows.net"
              $parsedScriptsUrl = $null
              if (-not [uri]::TryCreate($currentScriptsUrl, [UriKind]::Absolute, [ref]$parsedScriptsUrl) -or
                  $parsedScriptsUrl.Scheme -ne 'https' -or
                  $parsedScriptsUrl.Host -ne $expectedScriptsHost) {
                throw "Refusing to fetch scripts zip from untrusted URL '$currentScriptsUrl' (expected https://$expectedScriptsHost/...)."
              }

              $tagMatch = [regex]::Match($currentScriptsUrl, 'Deployment-Scripts-(v[0-9.]+)\.zip')
              if ($tagMatch.Success) {
                $currentTag = $tagMatch.Groups[1].Value
                Write-Host "Current published scripts zip: $currentScriptsUrl (tag $currentTag)"

                $oldZip = Join-Path "$(Agent.BuildDirectory)" 'PreviousDeploymentScripts.zip'
                $oldDir = Join-Path "$(Agent.BuildDirectory)" 'PreviousDeploymentScripts'
                Invoke-WebRequest -Uri $currentScriptsUrl -OutFile $oldZip -UseBasicParsing -TimeoutSec 60 -MaximumRetryCount 3 -RetryIntervalSec 5
                if (Test-Path $oldDir) { Remove-Item $oldDir -Recurse -Force }
                Expand-Archive -LiteralPath $oldZip -DestinationPath $oldDir -Force

                # Older published zips may wrap their contents in a single top-level
                # "Scripts" folder while this pipeline zips the folder's contents
                # flat; normalise so the hash compares like-for-like either way.
                $oldRoot = $oldDir
                $topLevelItems = Get-ChildItem -LiteralPath $oldDir -Force
                if ($topLevelItems.Count -eq 1 -and $topLevelItems[0].PSIsContainer) {
                  $oldRoot = $topLevelItems[0].FullName
                }
                $oldHash = Get-FolderHash -FolderPath $oldRoot -ExcludeTopLevel @('logs')

                if ($oldHash -eq $newHash) {
                  $scriptsVersion = $currentTag
                  Write-Host "Scripts/ is unchanged since $currentTag - reusing that version tag."
                } else {
                  $scriptsVersion = Get-BumpedVersionTag $currentTag
                  Write-Host "Scripts/ changed since $currentTag - bumping to $scriptsVersion."
                }
              }
            }
        } catch {
            Write-Warning "Could not read/compare the currently published scripts zip ($($_.Exception.Message)); falling back to v1.0."
        }
        if (-not $scriptsVersion) { $scriptsVersion = 'v1.0' }

        Write-Host "##vso[task.setvariable variable=ScriptsPackageVersion]$scriptsVersion"
        Write-Host "Deployment scripts package version: $scriptsVersion"
      displayName: 'Auto-detect deployment scripts package version'

    - powershell: |
        $ErrorActionPreference = 'Stop'
        $engineZip = "$(Agent.BuildDirectory)\AzureFunctionsPackage-$(ReleaseVersion).zip"
        if (Test-Path $engineZip) { Remove-Item $engineZip -Force }
        Compress-Archive -Path "$(Agent.BuildDirectory)\AzureFunctionsRelease\*" -DestinationPath $engineZip -Force
        Write-Host "##vso[task.setvariable variable=EngineZipPath]$engineZip"
        Write-Host "Created $engineZip"

        $scriptsSrc = "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts"
        if (-not (Test-Path $scriptsSrc)) { throw "Scripts folder not found at $scriptsSrc" }
        $scriptsZip = "$(Agent.BuildDirectory)\Warewolf-ExecutionEngine-Deployment-Scripts-$(ScriptsPackageVersion).zip"
        if (Test-Path $scriptsZip) { Remove-Item $scriptsZip -Force }
        # Exclude local test logs / Pester output - never intended for the public package.
        $scriptsItems = Get-ChildItem -Path $scriptsSrc -Force | Where-Object { $_.Name -ne 'logs' }
        Compress-Archive -Path $scriptsItems.FullName -DestinationPath $scriptsZip -Force
        Write-Host "##vso[task.setvariable variable=ScriptsZipPath]$scriptsZip"
        Write-Host "Created $scriptsZip"
      displayName: 'Create engine + deployment-scripts zips'

    - task: AzureCLI@2
      displayName: 'Upload zips to Azure Storage'
      inputs:
        azureSubscription: '${{ variables.AzureStorageServiceConnection }}'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          az storage blob upload `
            --account-name "$(AzureStorageAccountName)" `
            --container-name "$(AzureStorageContainerName)" `
            --name "AzureFunctionsPackage-$(ReleaseVersion).zip" `
            --file "$(EngineZipPath)" `
            --auth-mode login `
            --overwrite true
          if ($LASTEXITCODE -ne 0) { throw "Engine zip upload failed" }

          az storage blob upload `
            --account-name "$(AzureStorageAccountName)" `
            --container-name "$(AzureStorageContainerName)" `
            --name "Warewolf-ExecutionEngine-Deployment-Scripts-$(ScriptsPackageVersion).zip" `
            --file "$(ScriptsZipPath)" `
            --auth-mode login `
            --overwrite true
          if ($LASTEXITCODE -ne 0) { throw "Deployment scripts zip upload failed" }

          $engineUrl = "https://$(AzureStorageAccountName).blob.core.windows.net/$(AzureStorageContainerName)/AzureFunctionsPackage-$(ReleaseVersion).zip"
          $scriptsUrl = "https://$(AzureStorageAccountName).blob.core.windows.net/$(AzureStorageContainerName)/Warewolf-ExecutionEngine-Deployment-Scripts-$(ScriptsPackageVersion).zip"
          Write-Host "##vso[task.setvariable variable=EngineZipUrl]$engineUrl"
          Write-Host "##vso[task.setvariable variable=ScriptsZipUrl]$scriptsUrl"
          Write-Host "Engine zip:   $engineUrl"
          Write-Host "Scripts zip:  $scriptsUrl"

    # Downloads the LIVE release-notes.php over FTPS (explicit FTP over TLS via
    # AUTH TLS - not HTTP, since HTTP would return PHP-rendered output, not the
    # editable source), delegates the archive+update logic to the tested
    # Update-ReleaseNotes.ps1 script (kept alongside this pipeline so it can be
    # run/tested standalone), then uploads the result back over FTPS. See that
    # script's header comment for the RELEASE:* marker format required in
    # release-notes.php.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ftpHost = "$(ReleaseNotesFtpHost)"
        $ftpUser = "$(ReleaseNotesFtpUser)"
        $ftpPass = $env:ReleaseNotesFtpPassword
        $remoteFile = "release-notes.php"
        $localFile = Join-Path "$(Agent.BuildDirectory)" $remoteFile

        function Get-FtpFile([string]$remote, [string]$local) {
          $uri = "ftp://$ftpHost/$remote"
          $req = [System.Net.FtpWebRequest]::Create($uri)
          $req.Method = [System.Net.WebRequestMethods+Ftp]::DownloadFile
          $req.Credentials = New-Object System.Net.NetworkCredential($ftpUser, $ftpPass)
          # Explicit FTPS (AUTH TLS) - confirmed supported by the host.
          $req.EnableSsl = $true
          $req.UseBinary = $true
          $req.UsePassive = $true
          $resp = $req.GetResponse()
          $stream = $resp.GetResponseStream()
          $fileStream = [System.IO.File]::Create($local)
          $stream.CopyTo($fileStream)
          $fileStream.Close()
          $stream.Close()
          $resp.Close()
        }

        function Set-FtpFile([string]$local, [string]$remote) {
          $uri = "ftp://$ftpHost/$remote"
          $req = [System.Net.FtpWebRequest]::Create($uri)
          $req.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
          $req.Credentials = New-Object System.Net.NetworkCredential($ftpUser, $ftpPass)
          # Explicit FTPS (AUTH TLS) - confirmed supported by the host.
          $req.EnableSsl = $true
          $req.UseBinary = $true
          $req.UsePassive = $true
          $req.KeepAlive = $false
          $bytes = [System.IO.File]::ReadAllBytes($local)
          $req.ContentLength = $bytes.Length
          $stream = $req.GetRequestStream()
          $stream.Write($bytes, 0, $bytes.Length)
          $stream.Close()
          $resp = $req.GetResponse()
          $resp.Close()
        }

        Write-Host "Downloading current release-notes.php ..."
        Get-FtpFile $remoteFile $localFile

        # ReleaseNotesBullets is hardcoded to empty (no manual per-run input) -
        # Update-ReleaseNotes.ps1 falls back to a generic changelog-link bullet.
        $bullets = @()

        & "$(Build.SourcesDirectory)\Dev\.azure\Update-ReleaseNotes.ps1" `
          -Path $localFile `
          -NewVersion "$(ReleaseVersion)" `
          -NotesBullets $bullets `
          -EngineZipUrl "$(EngineZipUrl)" `
          -ScriptsZipUrl "$(ScriptsZipUrl)"

        Write-Host "Uploading updated release-notes.php ..."
        Set-FtpFile $localFile $remoteFile
      displayName: 'Archive previous release and publish new version on warewolf.io'
      env:
        ReleaseNotesFtpPassword: $(ReleaseNotesFtpPassword)
