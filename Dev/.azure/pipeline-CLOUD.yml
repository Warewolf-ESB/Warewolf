trigger:
  batch: true

pool:
  vmImage: 'windows-2022'

stages:
- stage: Build
  displayName: 'Build Lightweight Azure Functions'
  jobs:

  - job: Build_And_Publish
    displayName: 'Publish Lightweight Azure Functions Project'

    steps:
    - checkout: self
      clean: false
      fetchDepth: 0

    - powershell: |
        Write-Host "Fetching git tags..."
        git -C "$(Build.SourcesDirectory)" fetch --all --tags -f 2>&1 | ForEach-Object { Write-Host $_ }

        # Check if current commit is already tagged with a version
        $FullVersionString = git -C "$(Build.SourcesDirectory)" tag --points-at HEAD |
            Where-Object { ($_.Split('.').Count - 1) -eq 3 } |
            Select-Object -First 1
        if (-not [string]::IsNullOrEmpty($FullVersionString)) {
            $FullVersionString = $FullVersionString.Trim()
            Write-Host "Commit is already tagged: $FullVersionString"
        } else {
            # Find the most recent version tag reachable from HEAD
            $FullVersionString = git -C "$(Build.SourcesDirectory)" tag -l --sort=-creatordate --merged |
                Where-Object { ($_.Split('.').Count - 1) -eq 3 } |
                Select-Object -First 1
            if ([string]::IsNullOrEmpty($FullVersionString)) {
                throw "No X.X.X.X version tags found in git history."
            }
            $FullVersionString = $FullVersionString.Trim()
            # Increment the build (4th) component
            [int]$NewBuildNumber = [int]$FullVersionString.Split(".")[3] + 1
            $FullVersionString = ($FullVersionString.Split(".")[0..2] -join ".") + ".$NewBuildNumber"
            Write-Host "Generated next version: $FullVersionString"
        }

        Write-Host "Setting assembly version to $FullVersionString"
        $CSharpVersionFile = "$(Build.SourcesDirectory)\Dev\AssemblyCommonInfo.cs"
        (Get-Content $CSharpVersionFile -Raw) `
            -replace '\[assembly: AssemblyVersion\(@?"[^"]*"\)\]', "[assembly: AssemblyVersion(`"$FullVersionString`")]" |
            Set-Content $CSharpVersionFile -Encoding UTF8 -NoNewline
        Write-Host "Updated $CSharpVersionFile"
      displayName: 'Apply Version from Git Tags to AssemblyCommonInfo.cs'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Lightweight Azure Functions Project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/Dev/Warewolf.Execution.Lightweight/Warewolf.Execution.Lightweight.csproj'
        arguments: '--configuration Release --output $(Agent.BuildDirectory)\AzureFunctionsPublish'
        zipAfterPublish: false
        modifyOutputPath: false
  
    - powershell: |
        Write-Host Testing Warewolf assembly file versions...
        $HighestReadVersion = "0.0.0.0"
        $LastReadVersion = "0.0.0.0"
        foreach ($file in Get-ChildItem -recurse "$(Agent.BuildDirectory)\AzureFunctionsPublish") {
            if (($file.Name.EndsWith(".dll") -or ($file.Name.EndsWith(".exe") -and -Not $file.Name.EndsWith(".vshost.exe"))) -and ($file.Name.StartsWith("Dev2.") -or $file.Name.StartsWith("Warewolf.") -or $file.Name.StartsWith("WareWolf")) -and $file.Name -ne "Warewolf.Usage.dll") {
                # Get version.
                $ReadVersion = [system.diagnostics.fileversioninfo]::GetVersionInfo($file.FullName).FileVersion
        
                 Find highest version
                $SeperateVersionNumbers = $ReadVersion.split(".")
                $SeperateVersionNumbersHighest = $HighestReadVersion.split(".")
                if ([convert]::ToInt32($SeperateVersionNumbers[0], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[0], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[1], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[1], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[2], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[2], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[3], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[3], 10)){
                    $HighestReadVersion = $ReadVersion
                }
        
                # Check for invalid.
                if ($ReadVersion.StartsWith("0.0.") -or ($LastReadVersion -ne $ReadVersion -and $LastReadVersion -ne "0.0.0.0")) {
                    $getFullPath = $file.FullName
                    Write-Host ERROR! Invalid version! $getFullPath $ReadVersion $LastReadVersion
                    throw "ERROR! `"$getFullPath $ReadVersion`" is either an invalid version or not equal to `"$LastReadVersion`". All Warewolf assembly versions in `"$TestsPath`" must conform and cannot start with 0.0. or end with .0"
                }
                $LastReadVersion = $ReadVersion
            }
        }
        Out-File -LiteralPath "$(Agent.BuildDirectory)\AzureFunctionsPublish\FullVersionString" -InputObject $HighestReadVersion -Encoding default -Force
        Write-Host "##vso[build.updatebuildnumber]$(Build.BuildNumber) ($HighestReadVersion)"

    - powershell: |
        $srcPath  = "$(Build.SourcesDirectory)\Dev\Resources - Load\Resources"
        $destPath = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        if (-not (Test-Path $destPath)) { New-Item -ItemType Directory -Force -Path $destPath | Out-Null }
        Copy-Item -Path "$srcPath\*" -Destination $destPath -Recurse -Force
      displayName: 'Copy Load Testing Resources into Publish Output'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Compiled Output as Pipeline Artifact'
      inputs:
        targetPath: '$(Agent.BuildDirectory)\AzureFunctionsPublish'
        artifact: 'AzureFunctionsPublish'
        publishLocation: 'pipeline'
  
- stage: Azure
  displayName: 'Test on Azure'
  dependsOn: Build
  jobs:

  - job: Deploy_And_Test_Azure_Functions
    displayName: 'Deploy and Test Lightweight Execution Server in Azure Functions'

    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Compiled Artifact'
      inputs:
        artifact: 'AzureFunctionsPublish'
        path: '$(Agent.BuildDirectory)\AzureFunctionsPublish'

    - powershell: |
        $filePath = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources\Azure Microsoft SQL Server Source.bite"
        $content = Get-Content -LiteralPath $filePath -Raw
        $content = $content -replace '\[\[AzureDBPassword\]\]', $env:AzureDBPasswordValue
        Set-Content -LiteralPath $filePath -Value $content -Encoding UTF8 -NoNewline
      displayName: 'Patch AzureDBPassword in Load Testing Resource'
      env:
        AzureDBPasswordValue: $(AzureDBPassword)

    - powershell: |
        $packagePath = "$(Agent.BuildDirectory)\AzureFunctionsPackage.zip"
        if (Test-Path $packagePath) { Remove-Item $packagePath -Force }
        Compress-Archive -Path "$(Agent.BuildDirectory)\AzureFunctionsPublish\*" -DestinationPath $packagePath -Force

        if ([string]::IsNullOrEmpty($env:UATDeployPasswordValue)) { throw "UATDeployPassword pipeline variable is not set." }
        $pair         = '$WarewolfServer-UAT:' + $env:UATDeployPasswordValue
        $encodedCreds = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair))
        $headers      = @{ Authorization = "Basic $encodedCreds" }
        Write-Host "Credential pair length: $($pair.Length) (username 19 chars + colon + password)"

        Write-Host "Deploying to https://warewolfserver-uat.scm.azurewebsites.net:443/api/zipdeploy ..."
        Invoke-RestMethod -Uri 'https://warewolfserver-uat.scm.azurewebsites.net:443/api/zipdeploy' -Method POST -Headers $headers -InFile $packagePath -ContentType 'application/zip'
        Write-Host "Deployment complete."
      displayName: 'Package and Deploy to Azure (Zip Deploy)'
      env:
        UATDeployPasswordValue: $(UATDeployPassword)

    - powershell: |
        Write-Host "Waiting 30 seconds for the Azure Functions app to start..."
        Start-Sleep -Seconds 30
        $response = Invoke-RestMethod -Uri 'https://warewolfserver-uat.azurewebsites.net/public/Hello%20World.json?Name=Test' -Method GET
        Write-Host "Hello World response: $($response | ConvertTo-Json -Depth 10)"
      displayName: 'Execute Hello World with Name=Test'

    - powershell: |
        $uri = 'https://warewolfserver-uat.azurewebsites.net/public/azure%20db.json?CustomerId=16BjmNSXISIQjctO&InvoiceDate=01%2F01%2F2026%2000%3A00%3A00.000&code=B1Z9Gosse5Oxuq0TZ1XP1L2vlm8TVT5dtA9rYkTjtBfUAzFuKgvGUQ=='
        $response = Invoke-RestMethod -Uri $uri -Method GET
        Write-Host "Azure DB response: $($response | ConvertTo-Json -Depth 10)"
      displayName: 'Execute Azure DB Workflow'
      
- stage: Package
  displayName: 'Package Release Artifact'
  dependsOn: Azure
  jobs:

  - job: Package_Release
    displayName: 'Build and Package Lightweight Azure Functions Release'

    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Compiled Artifact'
      inputs:
        artifact: 'AzureFunctionsPublish'
        path: '$(Agent.BuildDirectory)\AzureFunctionsPublish'

    - powershell: |
        $packagePath = "$(Agent.BuildDirectory)\AzureFunctionsPackage.zip"
        if (Test-Path $packagePath) { Remove-Item $packagePath -Force }
        Compress-Archive -Path "$(Agent.BuildDirectory)\AzureFunctionsPublish\*" -DestinationPath $packagePath -Force
        Write-Host "Package created at $packagePath"
      displayName: 'Package Publish Output as Zip'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Release Zip as Build Artifact'
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\AzureFunctionsPackage.zip'
        ArtifactName: 'AzureFunctionsRelease'
        publishLocation: 'Container'