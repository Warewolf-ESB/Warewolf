# Only build (and therefore version, tag, and push release tags to GitLab) on
# main/integration branches. Developer work-item branches do not run this pipeline.
trigger:
  batch: true
  branches:
    include:
      - develop
      - 7580*

# The Release stage (publish to Azure Storage + warewolf.io) only ever runs on a
# manually queued build (Build.Reason = 'Manual') - see its condition: below.
# Automatic CI/CD triggers (e.g. develop, 7580*) never run it, no matter what.
#
# There is no pipeline parameter for this - when queuing a manual run
# ("Run pipeline"), use the "Stages to run" picker to deselect the Release stage
# for an ordinary manual run, or leave it selected (the default) to publish a
# public release. Remember to deselect it unless you actually intend to ship a
# public release.
#
# Everything else the Release stage needs is fixed/hardcoded rather than
# prompted for on every run (Azure DevOps's "Run pipeline" UI does not allow an
# empty string to be submitted for a string parameter, which made "leave blank to
# auto-detect/use default" unusable in practice):
#   - AzureStorageServiceConnection is hardcoded below to 'AzureStorage-WarewolfReleases'
#     (must have "Storage Blob Data Contributor" on stwwreleases). Service
#     connections are authorized at pipeline-compile time, so this MUST stay a
#     literal string, never a $(variable) or runtime value.
#   - ScriptsPackageVersion has no manual override anymore - it is always
#     auto-detected by diffing Scripts/ against the last-published zip on
#     warewolf.io/release-notes.php (reused if unchanged, minor-bumped if changed).
#   - ReleaseNotesBullets is hardcoded to empty, which falls back to a generic
#     changelog-link bullet in Update-ReleaseNotes.ps1.
variables:
  AzureStorageServiceConnection: 'AzureStorage-WarewolfReleases'

pool:
  vmImage: 'windows-2022'

stages:
- stage: Build
  displayName: 'Build Lightweight Azure Functions'
  jobs:

  - job: Build_And_Publish
    displayName: 'Publish Lightweight Azure Functions Project'

    steps:
    - checkout: self
      clean: false
      fetchDepth: 0

    # All projects in the security gate's scope (and the Lightweight Azure
    # Functions project published later in this job) target net10.0 (see
    # 8509-Fix EOS Gate Failure), so the SDK installed here must support that
    # TFM. Installing an older SDK (e.g. 8.0.x) makes 'dotnet restore' fail
    # with NETSDK1045 for every net10.0 project.
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    # Packages Vulnerability Test (moved here from pipeline.yml). Runs the NuGet
    # vulnerability gates (dotnet list --vulnerable + NuGetAudit) over the
    # lightweight server's project closure and fails the build on Critical/High
    # advisories. -SkipEosCheck limits this to the package vulnerability scan;
    # the .NET end-of-support gate is not part of this test.
    - task: PowerShell@2
      displayName: 'Packages Vulnerability Test'
      inputs:
        filePath: '$(Build.SourcesDirectory)\Dev\.azure\Run-SecurityGates.ps1'
        arguments: '-RepoRoot "$(Build.SourcesDirectory)" -SkipEosCheck'
        pwsh: true

    - powershell: |
        Write-Host "Fetching git tags..."
        # git fetch writes its normal progress/status (e.g. "From https://...") to stderr.
        # The PowerShell@2 task defaults ErrorActionPreference to 'Stop', which turns that
        # merged (2>&1) stderr output into a terminating NativeCommandError even though the
        # fetch itself succeeds. Temporarily relax it and rely on $LASTEXITCODE instead.
        $prevEAP = $ErrorActionPreference
        $ErrorActionPreference = 'Continue'
        $gitFetchOutput = git -C "$(Build.SourcesDirectory)" fetch --all --tags -f 2>&1
        $ErrorActionPreference = $prevEAP
        $gitFetchOutput | ForEach-Object { Write-Host "$_" }
        if ($LASTEXITCODE -ne 0) { throw "git fetch failed with exit code $LASTEXITCODE" }

        # Check if current commit is already tagged with a version
        $FullVersionString = git -C "$(Build.SourcesDirectory)" tag --points-at HEAD |
            Where-Object { ($_.Split('.').Count - 1) -eq 3 } |
            Select-Object -First 1
        if (-not [string]::IsNullOrEmpty($FullVersionString)) {
            $FullVersionString = $FullVersionString.Trim()
            Write-Host "Commit is already tagged: $FullVersionString"
        } else {
            # Find the most recent version tag reachable from HEAD
            $FullVersionString = git -C "$(Build.SourcesDirectory)" tag -l --sort=-creatordate --merged |
                Where-Object { ($_.Split('.').Count - 1) -eq 3 } |
                Select-Object -First 1
            if ([string]::IsNullOrEmpty($FullVersionString)) {
                throw "No X.X.X.X version tags found in git history."
            }
            $FullVersionString = $FullVersionString.Trim()
            # Increment the build (4th) component
            [int]$NewBuildNumber = [int]$FullVersionString.Split(".")[3] + 1
            $FullVersionString = ($FullVersionString.Split(".")[0..2] -join ".") + ".$NewBuildNumber"
            Write-Host "Generated next version: $FullVersionString"
        }

        Write-Host "Setting assembly version to $FullVersionString"
        $CSharpVersionFile = "$(Build.SourcesDirectory)\Dev\AssemblyCommonInfo.cs"
        (Get-Content $CSharpVersionFile -Raw) `
            -replace '\[assembly: AssemblyVersion\(@?"[^"]*"\)\]', "[assembly: AssemblyVersion(`"$FullVersionString`")]" |
            Set-Content $CSharpVersionFile -Encoding UTF8 -NoNewline
        Write-Host "Updated $CSharpVersionFile"
        $FSharpVersionFile = "$(Build.SourcesDirectory)\Dev\AssemblyCommonInfo.fs"
        (Get-Content $FSharpVersionFile -Raw) `
            -replace '\[<assembly: AssemblyVersion\("[^"]*"\)>\]', "[<assembly: AssemblyVersion(`"$FullVersionString`")>]" |
            Set-Content $FSharpVersionFile -Encoding UTF8 -NoNewline
        Write-Host "Updated $FSharpVersionFile"
        exit 0
      displayName: 'Apply Version from Git Tags to AssemblyCommonInfo.cs'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Lightweight Azure Functions Project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/Dev/Warewolf.Execution.Lightweight/Warewolf.Execution.Lightweight.csproj'
        arguments: '--configuration Release --runtime win-x64 --self-contained false --output $(Agent.BuildDirectory)\AzureFunctionsPublish'
        zipAfterPublish: false
        modifyOutputPath: false

    # Framework-dependent, no -r/--self-contained: the QueueProcessor Dockerfile invokes the
    # DLL through the 'dotnet' muxer (see Dev/Warewolf.Execution.QueueProcessor/Dockerfile),
    # so a plain publish - portable to whichever OS builds the container image in ACR later -
    # is what both the live-container test (Azure stage) and the release zip (Release stage)
    # need. Published from the SAME version-stamped AssemblyCommonInfo.cs as the engine above.
    - task: DotNetCoreCLI@2
      displayName: 'Publish Warewolf.Execution.QueueProcessor Project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/Dev/Warewolf.Execution.QueueProcessor/Warewolf.Execution.QueueProcessor.csproj'
        arguments: '--configuration Release --output $(Agent.BuildDirectory)\QueueProcessorPublish'
        zipAfterPublish: false
        modifyOutputPath: false

    - powershell: |
        Write-Host Testing Warewolf assembly file versions...
        $HighestReadVersion = "0.0.0.0"
        $LastReadVersion = "0.0.0.0"
        foreach ($file in Get-ChildItem -recurse "$(Agent.BuildDirectory)\AzureFunctionsPublish") {
            if (($file.Name.EndsWith(".dll") -or ($file.Name.EndsWith(".exe") -and -Not $file.Name.EndsWith(".vshost.exe"))) -and ($file.Name.StartsWith("Dev2.") -or $file.Name.StartsWith("Warewolf.") -or $file.Name.StartsWith("WareWolf")) -and $file.Name -ne "Warewolf.Usage.dll") {
                # Get version.
                $ReadVersion = [system.diagnostics.fileversioninfo]::GetVersionInfo($file.FullName).FileVersion
        
                # Find highest version
                $SeperateVersionNumbers = $ReadVersion.split(".")
                $SeperateVersionNumbersHighest = $HighestReadVersion.split(".")
                if ([convert]::ToInt32($SeperateVersionNumbers[0], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[0], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[1], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[1], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[2], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[2], 10)`
                -or [convert]::ToInt32($SeperateVersionNumbers[3], 10) -gt [convert]::ToInt32($SeperateVersionNumbersHighest[3], 10)){
                    $HighestReadVersion = $ReadVersion
                }
        
                # Check for invalid.
                if ($ReadVersion.StartsWith("0.0.") -or ($LastReadVersion -ne $ReadVersion -and $LastReadVersion -ne "0.0.0.0")) {
                    $getFullPath = $file.FullName
                    Write-Host ERROR! Invalid version! $getFullPath $ReadVersion $LastReadVersion
                    throw "ERROR! `"$getFullPath $ReadVersion`" is either an invalid version or not equal to `"$LastReadVersion`". All Warewolf assembly versions in `"$TestsPath`" must conform and cannot start with 0.0. or end with .0"
                }
                $LastReadVersion = $ReadVersion
            }
        }
        Out-File -LiteralPath "$(Agent.BuildDirectory)\AzureFunctionsPublish\FullVersionString" -InputObject $HighestReadVersion -Encoding default -Force
        Write-Host "##vso[task.setvariable variable=HighestReadVersion]$HighestReadVersion"
        Write-Host "##vso[build.updatebuildnumber]$(Build.BuildNumber) ($HighestReadVersion)"

    # Tag the source repository with the binary version and push the tag(s) to
    # GitLab, mirroring pipeline.yml's Compile_Release stage. The whole pipeline
    # only triggers on main/integration branches, so this always runs on a release
    # build. The full 4-part tag (X.X.X.X) is created once; the rolling 3-, 2- and
    # 1-part tags are force-moved to this commit (delete remote + re-push) so they
    # always point at the latest release. git tag/push use the GitLabTagsAccount
    # credential embedded in the push URL (same as pipeline.yml).
    - powershell: |
        $HighestReadVersion = "$(HighestReadVersion)"
        if ([string]::IsNullOrWhiteSpace($HighestReadVersion) -or $HighestReadVersion -eq "0.0.0.0") {
            throw "HighestReadVersion was not set to a valid version; cannot tag the source repo."
        }
        $gitlab = "https://ashley.lewis%40theunlimited.co.za:$env:GitLabTagsAccount@gitlab.com/warewolf/warewolf"
        git -C "$(Build.SourcesDirectory)" tag $HighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab $HighestReadVersion
        $VersionArray = $HighestReadVersion.Split('.')
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 3) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab $TrimmedHighestReadVersion
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 2) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab $TrimmedHighestReadVersion
        $TrimmedHighestReadVersion = ($VersionArray | Select-Object -First 1) -join '.'
        git -C "$(Build.SourcesDirectory)" tag --delete $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab :refs/tags/$TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" tag $TrimmedHighestReadVersion
        git -C "$(Build.SourcesDirectory)" push $gitlab $TrimmedHighestReadVersion
      displayName: 'Tag Source and Push Version Tags to GitLab'
      env:
        GitLabTagsAccount: $(GitLabTagsAccountPassword)

    - powershell: |
        $srcPath  = "$(Build.SourcesDirectory)\Dev\Resources - Load\Resources"
        $destPath = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        if (-not (Test-Path $destPath)) { New-Item -ItemType Directory -Force -Path $destPath | Out-Null }
        Copy-Item -Path "$srcPath\*" -Destination $destPath -Recurse -Force
      displayName: 'Copy Load Testing Resources into Publish Output'

    # SecureConfigLoader reads secure.config from AppContext.BaseDirectory at
    # runtime. Without it the engine has no effective permission map and
    # WorkflowAuthPolicyLoader rejects every request with 503 (ConfigMissing),
    # which fails the "Execute Hello World" smoke test in the Azure stage.
    # The file is .gitignored, so generate it here: AES-encrypt the committed
    # plain-text source with the same SecurityEncryption routine the runtime
    # decrypts with (loaded from the freshly published Dev2.Infrastructure.dll).
    # pwsh (.NET) is required to load the net10.0 assembly — Windows PowerShell
    # 5.1 cannot.
    - pwsh: |
        $publishDir = "$(Agent.BuildDirectory)\AzureFunctionsPublish"
        $sourceJson = "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\secure.config.cloud.json"
        $infraDll   = Join-Path $publishDir "Dev2.Infrastructure.dll"

        if (-not (Test-Path $sourceJson)) { throw "secure.config source JSON not found: $sourceJson" }
        if (-not (Test-Path $infraDll))   { throw "Dev2.Infrastructure.dll not found in publish output: $infraDll" }

        Add-Type -Path $infraDll
        $plain     = Get-Content -LiteralPath $sourceJson -Raw
        $encrypted = [Dev2.Services.Security.SecurityEncryption]::Encrypt($plain)

        $target = Join-Path $publishDir "secure.config"
        Set-Content -LiteralPath $target -Value $encrypted -Encoding ascii -NoNewline

        $size = (Get-Item $target).Length
        if ($size -le 0) { throw "secure.config was written but is empty." }
        Write-Host "Wrote encrypted secure.config ($size bytes) to $target"
      displayName: 'Generate Encrypted secure.config for Public Workflow Execution'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Compiled Output as Pipeline Artifact'
      inputs:
        targetPath: '$(Agent.BuildDirectory)\AzureFunctionsPublish'
        artifact: 'AzureFunctionsPublish'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish QueueProcessor Compiled Output as Pipeline Artifact'
      inputs:
        targetPath: '$(Agent.BuildDirectory)\QueueProcessorPublish'
        artifact: 'QueueProcessorPublish'
        publishLocation: 'pipeline'

    # The Azure stage (checkout: none) and the Package stage (checkout: none) both need
    # Dev/Warewolf.Execution.Lightweight/Scripts/* plus the QueueWorker CI trigger .bite at
    # runtime - deployment/report scripts and the release scripts zip source respectively -
    # but neither checks out the repo. Stage both into one artifact here, where the source
    # tree is still available, so downstream jobs get them via DownloadPipelineArtifact
    # instead of reaching into a non-existent $(Build.SourcesDirectory). Excludes logs/,
    # matching the exclusion Package_Release already applies when zipping Scripts/.
    # Also stages the QueueProcessor Dockerfile: Deploy-WwQueueProcessor.ps1 defaults to
    # resolving it relative to its OWN location under a full repo checkout (see the script's
    # Phase 2), which doesn't exist in the Azure job (checkout: none). The Azure job passes
    # -DockerfilePath pointing at this staged copy instead of relying on that default.
    - powershell: |
        $stagingDir  = "$(Agent.BuildDirectory)\DeployScriptsStaging"
        $scriptsDest = Join-Path $stagingDir 'Scripts'
        New-Item -ItemType Directory -Force -Path $scriptsDest | Out-Null
        Get-ChildItem -Path "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts" -Force |
            Where-Object { $_.Name -ne 'logs' } |
            Copy-Item -Destination $scriptsDest -Recurse -Force
        Copy-Item -Path "$(Build.SourcesDirectory)\Dev\.azure\QueueWorker-CI-Test.trigger.bite" -Destination $stagingDir -Force
        Copy-Item -Path "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.QueueProcessor\Dockerfile" -Destination $stagingDir -Force
      displayName: 'Stage Deployment Scripts for Downstream Stages'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Deployment Scripts as Pipeline Artifact'
      inputs:
        targetPath: '$(Agent.BuildDirectory)\DeployScriptsStaging'
        artifact: 'DeployScripts'
        publishLocation: 'pipeline'

- stage: Azure
  displayName: 'Test on Azure'
  dependsOn: Build
  jobs:

  - job: Deploy_And_Test_Azure_Functions
    displayName: 'Deploy and Test Lightweight Execution Server in Azure Functions'

    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Compiled Artifact'
      inputs:
        artifact: 'AzureFunctionsPublish'
        path: '$(Agent.BuildDirectory)\AzureFunctionsPublish'

    # This job runs with checkout: none, so the deployment/report scripts and the QueueWorker
    # CI trigger .bite used by the live QueueProcessor test below cannot be read from
    # $(Build.SourcesDirectory) - it does not exist. Pull them from the DeployScripts artifact
    # the Build stage staged instead.
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Deployment Scripts'
      inputs:
        artifact: 'DeployScripts'
        path: '$(Agent.BuildDirectory)\DeployScripts'

    # Fetches the current NewSqlServerSource.bite DB source from the devops server. Its
    # connection string points at an ngrok tunnel whose host:port rotates whenever the
    # tunnel restarts, so it cannot be committed as a static file with a fixed value at
    # all; it must be fetched fresh on every pipeline run. The endpoint sits behind
    # Cloudflare Access; CFAccessClientId/CFAccessClientSecret (a Service Auth policy on the
    # Access Application) bypass the Azure AD SSO redirect. On failure (missing/invalid
    # headers, or the Access policy not yet propagated) the endpoint still returns HTTP 200
    # but with an HTML SSO login page instead of the .bite XML, so success is validated by
    # Content-Type and response body shape, not HTTP status alone. Unlike the UAT smoke
    # tests below, this step has no continueOnError: a broken devops-server dependency is a
    # real, expected-to-always-work prerequisite, not an unrelated shared-environment
    # health signal, so a failure here must fail the build. Requests are retried a few times
    # with backoff first, though, because the devops server sits behind a Cloudflare Tunnel
    # (cloudflared) whose connector can drop briefly (surfaced as HTTP 530 / Cloudflare error
    # 1033 "no Tunnel established for this hostname") independently of the endpoint itself
    # being healthy; a single transient drop shouldn't fail the whole build.
    - powershell: |
        $uri         = 'https://devops.warewolf.online/warewolf-devops/api/download-bite/mssql'
        $destDir     = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        $targetPath  = Join-Path $destDir 'NewSqlServerSource.bite'
        $tempPath    = "$(Agent.BuildDirectory)\NewSqlServerSource.bite.download"
        $maxAttempts = 4
        $baseDelay   = 5
        if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }

        $headers = @{
            'CF-Access-Client-Id'     = $env:CFAccessClientIdValue
            'CF-Access-Client-Secret' = $env:CFAccessClientSecretValue
        }

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
                $r = Invoke-WebRequest -Uri $uri -Method GET -Headers $headers -UseBasicParsing -TimeoutSec 60 -OutFile $tempPath -PassThru

                $contentType = [string]$r.Headers['Content-Type']
                $body        = Get-Content -LiteralPath $tempPath -Raw
                Write-Host "Response StatusCode=$($r.StatusCode) Content-Type=$contentType Length=$($body.Length)"

                $looksLikeHtml   = $contentType -match 'text/html' -or $body -match '(?i)<html'
                $looksLikeSource = $body -match '<Source ' -and $body -match 'ID="b9184f70-64ea-4dc5-b23b-02fcd5f91082"'

                if ($looksLikeHtml -or -not $looksLikeSource) {
                    throw "Downloaded content is not the expected NewSqlServerSource .bite XML (Content-Type: $contentType). This usually means the Cloudflare Access Service Token headers (CFAccessClientId/CFAccessClientSecret) were rejected and an Azure AD SSO login page was returned instead."
                }

                Move-Item -LiteralPath $tempPath -Destination $targetPath -Force
                Write-Host "Wrote NewSqlServerSource.bite ($((Get-Item $targetPath).Length) bytes) to $targetPath"
                break
            } catch {
                Remove-Item -LiteralPath $tempPath -Force -ErrorAction SilentlyContinue

                if ($attempt -ge $maxAttempts) {
                    Write-Host "##[error]Request to devops download endpoint failed after $maxAttempts attempts: $($_.Exception.Message)"
                    throw
                }

                $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
                Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message). Retrying in $delaySeconds s (likely a transient Cloudflare Tunnel/connector drop)..."
                Start-Sleep -Seconds $delaySeconds
            }
        }
      displayName: 'Download NewSqlServerSource.bite from DevOps Endpoint'
      env:
        CFAccessClientIdValue: $(CFAccessClientId)
        CFAccessClientSecretValue: $(CFAccessClientSecret)

    # The devops.warewolf.online admin panel that produces NewSqlServerSource.bite only
    # exposes Host/Username/Database/Password fields (no Authentication Type selector), so
    # the smoke test would otherwise only ever exercise plain SQL Server username/password
    # auth - never the Microsoft Entra Managed Identity path this branch (#8458) adds. Inject
    # "Authentication=Active Directory Managed Identity" here instead. User ID/Password are
    # deliberately left in the connection string: SqlConnectionWrapper.CreateConnectionString
    # (Dev2.Services.Sql) detects Authentication=ActiveDirectoryManagedIdentity + credentials
    # both present, strips the credentials from the primary (Managed Identity) attempt, and
    # precomputes them as the automatic SQL-auth fallback if Managed Identity fails - see
    # DatabaseServiceExecution.MssqlSqlExecution. That means this step makes the smoke test
    # prove Entra ID auth actually works end-to-end, while still degrading gracefully to SQL
    # auth (and the existing structured SQL-error logging) if the Function App's Managed
    # Identity isn't yet provisioned as a contained user on the target database.
    #
    # Only patches a plaintext ConnectionString (contains "Data Source=" / "Initial
    # Catalog="). If devops.warewolf.online ever starts returning an encrypted
    # ConnectionString (e.g. DPAPI/WFAES ciphertext), this step intentionally leaves it
    # untouched and fails loudly rather than corrupting ciphertext it cannot safely rewrite -
    # in that case, Authentication=Active Directory Managed Identity must be added at the
    # source (the devops server) instead.
    - powershell: |
        $targetPath = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources\NewSqlServerSource.bite"

        [xml]$xml = Get-Content -LiteralPath $targetPath -Raw
        $source = $xml.Source
        $connectionString = $source.ConnectionString

        if ($connectionString -match '(?i)Authentication\s*=') {
            Write-Host "ConnectionString already specifies an Authentication mode; leaving it unmodified."
        } elseif ($connectionString -notmatch '(?i)Data Source=' -or $connectionString -notmatch '(?i)Initial Catalog=') {
            Write-Host "##[error]NewSqlServerSource.bite ConnectionString does not look like plaintext SQL Server connection string properties (no Data Source/Initial Catalog found) - it may be encrypted. Refusing to patch it; add Authentication=Active Directory Managed Identity at the devops.warewolf.online source instead."
            throw "Cannot safely inject Authentication=Active Directory Managed Identity into a non-plaintext ConnectionString."
        } else {
            # Insert right after "Initial Catalog=...;" so the existing User ID and
            # credential properties remain intact and readable afterwards.
            $connectionString = $connectionString -replace '(?i)(Initial Catalog=[^;]*;)', "`$1Authentication=Active Directory Managed Identity;"
            $source.SetAttribute('ConnectionString', $connectionString)
            $xml.Save($targetPath)

            # Deliberately does not echo the (now-patched) connection string: it still
            # carries the SQL-auth fallback credential, which must never appear in CI logs.
            Write-Host "Patched NewSqlServerSource.bite to add Authentication=Active Directory Managed Identity (existing User ID/credential properties left in place for automatic SQL-auth fallback)."
        }
      displayName: 'Patch NewSqlServerSource.bite to use Microsoft Entra Managed Identity Authentication'

    # Same rationale as the NewSqlServerSource.bite fetch above: the "Warewolf DevOps
    # RabbitMQ Source" connection string points at a broker behind a Cloudflare Tunnel
    # whose host:port rotates, so it cannot be committed as a static file and must be
    # fetched fresh on every pipeline run from the devops server, behind the same
    # Cloudflare Access Service Token headers.
    - powershell: |
        $uri         = 'https://devops.warewolf.online/warewolf-devops/api/download-bite/rabbitmq'
        $destDir     = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        $targetPath  = Join-Path $destDir 'Warewolf DevOps RabbitMQ Source.bite'
        $tempPath    = "$(Agent.BuildDirectory)\WarewolfDevOpsRabbitMQSource.bite.download"
        $maxAttempts = 4
        $baseDelay   = 5
        if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }

        $headers = @{
            'CF-Access-Client-Id'     = $env:CFAccessClientIdValue
            'CF-Access-Client-Secret' = $env:CFAccessClientSecretValue
        }

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
                $r = Invoke-WebRequest -Uri $uri -Method GET -Headers $headers -UseBasicParsing -TimeoutSec 60 -OutFile $tempPath -PassThru

                $contentType = [string]$r.Headers['Content-Type']
                $body        = Get-Content -LiteralPath $tempPath -Raw
                Write-Host "Response StatusCode=$($r.StatusCode) Content-Type=$contentType Length=$($body.Length)"

                $looksLikeHtml   = $contentType -match 'text/html' -or $body -match '(?i)<html'
                $looksLikeSource = $body -match '<Source ' -and $body -match 'ID="1a82a341-b678-4992-a25a-39cdd57198d4"'

                if ($looksLikeHtml -or -not $looksLikeSource) {
                    throw "Downloaded content is not the expected Warewolf DevOps RabbitMQ Source .bite XML (Content-Type: $contentType). This usually means the Cloudflare Access Service Token headers (CFAccessClientId/CFAccessClientSecret) were rejected and an Azure AD SSO login page was returned instead."
                }

                Move-Item -LiteralPath $tempPath -Destination $targetPath -Force
                Write-Host "Wrote Warewolf DevOps RabbitMQ Source.bite ($((Get-Item $targetPath).Length) bytes) to $targetPath"
                break
            } catch {
                Remove-Item -LiteralPath $tempPath -Force -ErrorAction SilentlyContinue

                if ($attempt -ge $maxAttempts) {
                    Write-Host "##[error]Request to devops download endpoint failed after $maxAttempts attempts: $($_.Exception.Message)"
                    throw
                }

                $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
                Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message). Retrying in $delaySeconds s (likely a transient Cloudflare Tunnel/connector drop)..."
                Start-Sleep -Seconds $delaySeconds
            }
        }
      displayName: 'Download Warewolf DevOps RabbitMQ Source.bite from DevOps Endpoint'
      env:
        CFAccessClientIdValue: $(CFAccessClientId)
        CFAccessClientSecretValue: $(CFAccessClientSecret)

    # "Azure Exchange Source" was previously committed as a static WFAES::-encrypted
    # .bite file (Dev\Warewolf.Execution.Lightweight\Resources\Azure Exchange Source.bite).
    # That value is encrypted with whatever Key Vault "dp-keyring-v1" key version was
    # current at commit time; it is never refreshed afterwards, so any later key
    # rotation (see KeyRotationRunbook.md) silently breaks it - LightweightSourceLoader
    # fails to decrypt the stale ciphertext, ResourceCatalog.GetResource<ExchangeSource>
    # returns null, and every Exchange smoke-test run fails with "Invalid Email Source"
    # (WOLF-8xxx) even though exchange.warewolf.online itself is healthy. Fetching it
    # fresh here - re-encrypted with the CURRENT Key Vault key by the devops endpoint,
    # the same pattern already used for NewSqlServerSource/RabbitMQ above - eliminates
    # that staleness. Requires a new `download-bite/exchange` route on the devops server;
    # see Dev/.azure/devops-download-bite-exchange-spec.md for the endpoint contract.
    - powershell: |
        $uri         = 'https://devops.warewolf.online/warewolf-devops/api/download-bite/exchange'
        $destDir     = "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources"
        $targetPath  = Join-Path $destDir 'Azure Exchange Source.bite'
        $tempPath    = "$(Agent.BuildDirectory)\AzureExchangeSource.bite.download"
        $maxAttempts = 4
        $baseDelay   = 5
        if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }

        $headers = @{
            'CF-Access-Client-Id'     = $env:CFAccessClientIdValue
            'CF-Access-Client-Secret' = $env:CFAccessClientSecretValue
        }

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
                $r = Invoke-WebRequest -Uri $uri -Method GET -Headers $headers -UseBasicParsing -TimeoutSec 60 -OutFile $tempPath -PassThru

                $contentType = [string]$r.Headers['Content-Type']
                $body        = Get-Content -LiteralPath $tempPath -Raw
                Write-Host "Response StatusCode=$($r.StatusCode) Content-Type=$contentType Length=$($body.Length)"

                $looksLikeHtml   = $contentType -match 'text/html' -or $body -match '(?i)<html'
                $looksLikeSource = $body -match '<Source ' -and $body -match 'ID="e8a8f864-8ce8-47a1-8fca-5aef24bd63b3"'

                if ($looksLikeHtml -or -not $looksLikeSource) {
                    throw "Downloaded content is not the expected Azure Exchange Source .bite XML (Content-Type: $contentType). This usually means the Cloudflare Access Service Token headers (CFAccessClientId/CFAccessClientSecret) were rejected and an Azure AD SSO login page was returned instead."
                }

                Move-Item -LiteralPath $tempPath -Destination $targetPath -Force
                Write-Host "Wrote Azure Exchange Source.bite ($((Get-Item $targetPath).Length) bytes) to $targetPath"
                break
            } catch {
                Remove-Item -LiteralPath $tempPath -Force -ErrorAction SilentlyContinue

                if ($attempt -ge $maxAttempts) {
                    Write-Host "##[error]Request to devops download endpoint failed after $maxAttempts attempts: $($_.Exception.Message)"
                    throw
                }

                $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
                Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message). Retrying in $delaySeconds s (likely a transient Cloudflare Tunnel/connector drop)..."
                Start-Sleep -Seconds $delaySeconds
            }
        }
      displayName: 'Download Azure Exchange Source.bite from DevOps Endpoint'
      env:
        CFAccessClientIdValue: $(CFAccessClientId)
        CFAccessClientSecretValue: $(CFAccessClientSecret)

    - powershell: |
        $zipUrl = 'https://stwwreleases.blob.core.windows.net/releases/Warewolf-ExecutionEngine-Deployment-Scripts-v2.0.zip'
        $zipPath = "$(Agent.BuildDirectory)\DeploymentScripts.zip"
        $outDir  = "$(Agent.BuildDirectory)\DeploymentScripts"
        Write-Host "Downloading deployment scripts from $zipUrl ..."
        Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
        Write-Host "Extracting to $outDir ..."
        Expand-Archive -LiteralPath $zipPath -DestinationPath $outDir -Force
        Write-Host "Stage complete."
      displayName: 'Download and Stage Deployment Scripts'

    - powershell: |
        Write-Host "Logging in to Azure CLI as service principal ..."
        az login --service-principal `
            -u $env:AzureClientIdValue `
            -p $env:AzureClientSecretValue `
            --tenant $env:AzureTenantIdValue | Out-Null
        $account = az account show | ConvertFrom-Json
        Write-Host "Logged in: $($account.name) ($($account.id))"
      displayName: 'Log in to Azure CLI'
      env:
        AzureClientIdValue: $(AzureClientId)
        AzureClientSecretValue: $(AzureClientSecret)
        AzureTenantIdValue: $(AzureTenantId)

    - pwsh: |
        & "$(Agent.BuildDirectory)\DeploymentScripts\Scripts\Deploy-WwExecutionEngine.ps1" `
            -ResourceGroup  'DEV2' `
            -Location       'southafricanorth' `
            -StorageAccount 'warewolfserversa' `
            -AppName        'warewolfserver' `
            -PublishPath    "$(Agent.BuildDirectory)\AzureFunctionsPublish" `
            -SkipAuthProvisioning `
            -LicenseCheckEnabled:$false `
            -NonInteractive
      displayName: 'Deploy via Deployment Scripts'

    # continueOnError: these smoke tests exercise the shared warewolfserver
    # environment, whose health is independent of the commit being built. An
    # outage or environment misconfiguration must surface as a visible warning but
    # must NOT fail an otherwise-good build or block the release artifact.
    #
    # NOTE: this job was moved off warewolfserver-uat onto warewolfserver (a separate
    # Function App) so it no longer races with ShovelBridgeE2ETest_ExternalServiceBus's
    # -VerifyWorkflowExecution leg below, which polls warewolfserver-uat for an actual
    # workflow-execution result. Both jobs run in parallel in this stage with no
    # dependsOn between them (see the comment above that job); when they targeted the
    # same app, this job's deploy/restart could make the other job's poll of
    # /secure/servicebus-result/{correlationId} return a transient 503. Splitting the
    # target app removes the race. If warewolfserver-uat's ServiceBusSecureTrigger setup
    # (see docs/ServiceBusSecureTrigger-Architecture.md) is ever reprovisioned onto
    # warewolfserver instead, VerifyEngineBaseUrl below must move with it.
    #
    # KNOWN ENVIRONMENT REQUIREMENTS (Azure-side app config, not code defects).
    # Both are set on the warewolfserver Function App (Portal > Configuration,
    # or `az functionapp config ...` / `az functionapp config appsettings set ...`);
    # the SCM zip-deploy used below cannot set them, so they must be set once:
    #
    #   1. Platform = 64 Bit (use32BitWorkerProcess = false).
    #      If left 32-bit, the worker runs in the ...DOTNET-ISOLATED_8.0_X86 app pool
    #      and cannot load the x64 entry assembly (published with --runtime win-x64),
    #      crashing at startup with
    #        System.IO.FileLoadException: Could not load file or assembly
    #        'Warewolf.Execution.Lightweight' ...
    #      -> 503 on every route.
    #      Fix: az functionapp config set --name warewolfserver \
    #             --resource-group <rg> --use-32bit-worker-process false
    #
    #   2. App setting WAREWOLF_LICENSE_CHECK_ENABLED is set to 'false' by the
    #      'Deploy via Deployment Scripts' step above (-LicenseCheckEnabled:$false),
    #      so WorkflowExecutor's license/subscription gate is bypassed entirely for
    #      this deployment — no "Warewolf License.secureconfig" is staged or
    #      required.
    #
    # Re-tighten (remove continueOnError) once this environment is confirmed green on both fronts.
    #
    # Both smoke tests below retry with backoff before giving up. /apis.json (checked
    # by the deploy script itself) is a lightweight static discovery route and comes up
    # almost immediately, but these routes actually execute a workflow on first hit -
    # a much heavier cold start (F# language parser init, activities engine JIT,
    # workflow-index lookup) that can outlast a single fixed wait + timeout, especially
    # on a Consumption-plan Function App. Retrying distinguishes a slow cold start from
    # a genuine regression instead of treating both the same as a single timeout would.
    - powershell: |
        $ErrorActionPreference = 'Continue'
        $uri         = 'https://warewolfserver.azurewebsites.net/public/Hello%20World.json?Name=Test'
        $maxAttempts = 4
        $baseDelay   = 15
        Write-Host "Waiting 30 seconds for the Azure Functions app to start..."
        Start-Sleep -Seconds 30

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          try {
            $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 60
            Write-Host "STATUS: $($r.StatusCode)"
            Write-Host "Hello World response: $($r.Content)"
            break
          } catch {
            $resp = $_.Exception.Response
            if ($resp) {
              Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $([int]$resp.StatusCode) $($resp.StatusDescription)"
              try { $sr = New-Object IO.StreamReader($resp.GetResponseStream()); Write-Host "BODY: $($sr.ReadToEnd())" } catch { Write-Host "BODY: (empty)" }
            } else { Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)" }

            if ($attempt -ge $maxAttempts) {
              Write-Host "##[error]Hello World smoke test failed after $maxAttempts attempts."
              throw
            }
            $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
            Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
            Start-Sleep -Seconds $delaySeconds
          }
        }
      displayName: 'Execute Hello World with Name=Test'
      continueOnError: true

    - powershell: |
        $ErrorActionPreference = 'Continue'
        $uri         = 'https://warewolfserver.azurewebsites.net/public/Simple%20MSSQL%20Test.json'
        $maxAttempts = 4
        $baseDelay   = 15

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          try {
            $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 60
            Write-Host "STATUS: $($r.StatusCode)"
            Write-Host "Simple MSSQL Test response: $($r.Content)"
            break
          } catch {
            $resp = $_.Exception.Response
            if ($resp) {
              Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $([int]$resp.StatusCode) $($resp.StatusDescription)"
              try { $sr = New-Object IO.StreamReader($resp.GetResponseStream()); Write-Host "BODY: $($sr.ReadToEnd())" } catch { Write-Host "BODY: (empty)" }
            } else { Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)" }

            if ($attempt -ge $maxAttempts) {
              Write-Host "##[error]Simple MSSQL Test smoke test failed after $maxAttempts attempts."
              throw
            }
            $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
            Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
            Start-Sleep -Seconds $delaySeconds
          }
        }
      displayName: 'Execute Simple MSSQL Test Workflow'
      continueOnError: true

    - powershell: |
        $ErrorActionPreference = 'Continue'
        $uri         = 'https://warewolfserver.azurewebsites.net/public/Simple%20RabbitMQ%20Publish%20Test.json'
        $maxAttempts = 4
        $baseDelay   = 15

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          try {
            $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 60
            Write-Host "STATUS: $($r.StatusCode)"
            Write-Host "Simple RabbitMQ Publish Test response: $($r.Content)"
            break
          } catch {
            $resp = $_.Exception.Response
            if ($resp) {
              Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $([int]$resp.StatusCode) $($resp.StatusDescription)"
              try { $sr = New-Object IO.StreamReader($resp.GetResponseStream()); Write-Host "BODY: $($sr.ReadToEnd())" } catch { Write-Host "BODY: (empty)" }
            } else { Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)" }

            if ($attempt -ge $maxAttempts) {
              Write-Host "##[error]Simple RabbitMQ Publish Test smoke test failed after $maxAttempts attempts."
              throw
            }
            $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
            Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
            Start-Sleep -Seconds $delaySeconds
          }
        }
      displayName: 'Execute Simple RabbitMQ Publish Test Workflow'
      continueOnError: true

    # "Simple Exchange Test" invokes the Exchange Email connector against the real
    # "Azure Exchange Source" (exchange.warewolf.online), a shared devops Exchange
    # server. The workflow's DsfExchangeEmailNewActivity.SavedSource element only
    # carries the ResourceID/display metadata (no secret) - the actual source, with
    # its Key-Vault-encrypted ConnectionString, is resolved on demand by
    # LightweightSourceLoader from Resources\Azure Exchange Source.bite. That file
    # is now fetched fresh on every pipeline run by "Download Azure Exchange
    # Source.bite from DevOps Endpoint" above (same dynamic-fetch pattern as
    # NewSqlServerSource/RabbitMQ) so it always carries a ConnectionString encrypted
    # with the CURRENT Key Vault key, rather than a static commit that goes stale on
    # the next key rotation. Dev\Resources - Load\Resources\Simple Exchange
    # Test.bite (the workflow itself) is still copied into the publish output by
    # "Copy Load Testing Resources into Publish Output" above.
    - powershell: |
        $ErrorActionPreference = 'Continue'
        $uri         = 'https://warewolfserver.azurewebsites.net/public/Simple%20Exchange%20Test.json'
        $maxAttempts = 4
        $baseDelay   = 15

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          try {
            $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 60
            Write-Host "STATUS: $($r.StatusCode)"
            Write-Host "Simple Exchange Test response: $($r.Content)"
            break
          } catch {
            $resp = $_.Exception.Response
            if ($resp) {
              Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $([int]$resp.StatusCode) $($resp.StatusDescription)"
              try { $sr = New-Object IO.StreamReader($resp.GetResponseStream()); Write-Host "BODY: $($sr.ReadToEnd())" } catch { Write-Host "BODY: (empty)" }
            } else { Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)" }

            if ($attempt -ge $maxAttempts) {
              Write-Host "##[error]Simple Exchange Test smoke test failed after $maxAttempts attempts."
              throw
            }
            $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
            Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
            Start-Sleep -Seconds $delaySeconds
          }
        }
      displayName: 'Execute Simple Exchange Test Workflow'
      continueOnError: true

    # ── Live QueueProcessor container test ──────────────────────────────────────────────
    # Everything above proves the ENGINE side of RabbitMQ (Simple RabbitMQ Publish Test just
    # publishes a message). Nothing so far proves a live Warewolf.Execution.QueueProcessor
    # container - the Linux worker on Azure Container Apps that CONSUMES that message and
    # calls the engine back - actually works. These steps close that gap by deploying the
    # real container image (built server-side via `az acr build`, so no Docker daemon is
    # needed on this windows-2022 agent even though the image itself is Linux - see
    # Dev/Warewolf.Execution.QueueProcessor/Dockerfile), publishing one live message to it,
    # and verifying it was actually processed.
    #
    # Redeploys the SAME fixed CI app/queue (wwqpci- prefix, queue
    # 'wwexecution-queueworker-ci-test') every run rather than a fresh throwaway one, mirroring
    # how this job already redeploys the SAME warewolfserver Function App every run instead of
    # a new one per build. The trigger targets rabbit\RabbitProcess against
    # NewSqlServerSource.bite and the SAME "Warewolf DevOps RabbitMQ Source.bite" already
    # downloaded above (QueueSourceId 1a82a341-... matches) - both already fetched fresh this
    # run by the steps earlier in this job.
    - task: DownloadPipelineArtifact@2
      displayName: 'Download QueueProcessor Compiled Artifact'
      inputs:
        artifact: 'QueueProcessorPublish'
        path: '$(Agent.BuildDirectory)\QueueProcessorPublish'

    # Requires a pre-provisioned Key Vault secret (Library/variable group pipeline variable
    # QueueWorkerCiRabbitMqSecretUri, e.g. https://kvwarewolf.vault.azure.net/secrets/rabbitmq-uri)
    # holding the CURRENT devops RabbitMQ broker AMQP URI, kept fresh the same way the .bite
    # fetched above is - see that step's comment for why the broker's host:port rotates.
    # Without a valid secret the KEDA scale rule has no broker auth (Deploy-WwQueueProcessor.ps1
    # only warns, does not fail) and the verification step below will find nothing processed;
    # continueOnError treats that as a shared-environment warning, same as the smoke tests above.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        & '$(Agent.BuildDirectory)\DeployScripts\Scripts\Deploy-WwQueueProcessor.ps1' `
            -ResourceGroup       'DEV2' `
            -Location            'southafricanorth' `
            -AcaEnvironment      'aca-warewolf' `
            -AcrName             'acrwarewolf' `
            -AppNamePrefix       'wwqpci-' `
            -PublishPath         "$(Agent.BuildDirectory)\QueueProcessorPublish" `
            -DockerfilePath      "$(Agent.BuildDirectory)\DeployScripts\Dockerfile" `
            -TriggerFilePath     '$(Agent.BuildDirectory)\DeployScripts\QueueWorker-CI-Test.trigger.bite' `
            -QueueSourcePath     "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources" `
            -EngineBaseUrl       'https://warewolfserver.azurewebsites.net' `
            -EngineResourceAppId 'e200900a-2d5d-4356-94c0-cd7e33232ce0' `
            -KeyVaultName        'kvwarewolf' `
            -KeyVaultSecretName  'wwaeskey' `
            -RabbitMqSecretUri   $env:QueueWorkerCiRabbitMqSecretUriValue `
            -EncryptStagedSettings `
            -LogDir              "$(Agent.BuildDirectory)\QueueWorkerCiDeploy" `
            -NonInteractive

        $summary = Get-ChildItem "$(Agent.BuildDirectory)\QueueWorkerCiDeploy\deploy-WwQueueProcessor-*.summary.json" -ErrorAction Stop |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
        $deployed = (Get-Content -LiteralPath $summary.FullName -Raw | ConvertFrom-Json).queueProcessorApps | Select-Object -First 1
        if (-not $deployed -or $deployed.status -ne 'deployed') {
            throw "QueueProcessor deploy did not succeed for trigger '$($deployed.trigger)': $($deployed.error)"
        }
        Write-Host "##vso[task.setvariable variable=QueueWorkerCiAppName]$($deployed.app)"
        Write-Host "Deployed live QueueProcessor Container App: $($deployed.app)"
      displayName: 'Deploy live QueueProcessor container (az acr build, DEV2/aca-warewolf)'
      env:
        QueueWorkerCiRabbitMqSecretUriValue: $(QueueWorkerCiRabbitMqSecretUri)
      continueOnError: true

    # PublishRabbitMQActivity (used by the smoke test above) cannot create the exchange/queue/
    # binding a trigger needs on a queue that has never been published to before - a failed
    # passive declare closes the AMQP channel before the active declare can run. Declare it
    # explicitly first (same helper the E2E harness uses) so the very first CI run does not fail
    # only because the topology did not exist yet.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Import-Module '$(Agent.BuildDirectory)\DeployScripts\Scripts\WwE2E.Common.psm1' -Force
        Initialize-E2ERabbitClient -PublishPath "$(Agent.BuildDirectory)\QueueProcessorPublish"
        $amqpUri = Resolve-E2EBrokerUri -SourceBitePath "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources\Warewolf DevOps RabbitMQ Source.bite"
        if (-not $amqpUri) { throw 'Could not resolve a plaintext AMQP URI from the downloaded RabbitMQ source .bite.' }
        $session = New-E2EBrokerSession -AmqpUri $amqpUri -ClientName 'wwqp-ci-topology'
        try {
            Initialize-E2EQueueTopology -Session $session -QueueName 'wwexecution-queueworker-ci-test' -Durable $false | Out-Null
        } finally {
            Close-E2EBrokerSession -Session $session
        }
      displayName: 'Ensure QueueWorker CI test queue topology exists'
      continueOnError: true

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        & '$(Agent.BuildDirectory)\DeployScripts\Scripts\Publish-WwQueueBurst.ps1' `
            -QueueName      'wwexecution-queueworker-ci-test' `
            -SuccessCount   1 `
            -Label          'ci' `
            -SourceBitePath "$(Agent.BuildDirectory)\AzureFunctionsPublish\Resources\Warewolf DevOps RabbitMQ Source.bite" `
            -PublishPath    "$(Agent.BuildDirectory)\QueueProcessorPublish" `
            -ManifestPath   "$(Agent.BuildDirectory)\QueueWorkerCiManifest.json"
      displayName: 'Publish one live message to the QueueWorker CI test queue'
      continueOnError: true

    # Log Analytics ingestion lags ~2-5 minutes behind a live delivery (see
    # docs/E2E-Harness-README.md); a shorter wait reads as "nothing happened" even on a
    # healthy deploy - see Get-WwQueueRunReport.ps1's own guard on zero deliveries.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Write-Host 'Waiting 4 minutes for Log Analytics ingestion...'
        Start-Sleep -Seconds 240

        & '$(Agent.BuildDirectory)\DeployScripts\Scripts\Get-WwQueueRunReport.ps1' `
            -ResourceGroup      'DEV2' `
            -AcaEnvironment     'aca-warewolf' `
            -AppName            '$(QueueWorkerCiAppName)' `
            -LastMinutes        15 `
            -ExpectedManifest   "$(Agent.BuildDirectory)\QueueWorkerCiManifest.json" `
            -OutputDir          "$(Agent.BuildDirectory)\QueueWorkerCiReport"

        $reportFile = Get-ChildItem "$(Agent.BuildDirectory)\QueueWorkerCiReport\queue-run-report-*.json" -ErrorAction Stop |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
        $result = Get-Content -LiteralPath $reportFile.FullName -Raw | ConvertFrom-Json

        if ($result.totals.deliveries -eq 0) {
            throw "No deliveries observed for '$(QueueWorkerCiAppName)' - the live QueueProcessor container did not process the test message."
        }
        if ($result.reconciliation.missing.Count -gt 0 -or $result.reconciliation.mismatched.Count -gt 0) {
            throw "QueueWorker CI test message was not reconciled: $($result.reconciliation.missing.Count) missing, $($result.reconciliation.mismatched.Count) mismatched."
        }
        Write-Host "Live QueueProcessor container test passed: $($result.totals.succeeded) succeeded, $($result.totals.deadLettered) dead-lettered."
      displayName: 'Verify the live QueueProcessor container processed the test message'
      continueOnError: true

  # Runs Test-ShovelBridgeE2E.ps1 in -DestinationMode ExternalServiceBus against a real,
  # already-provisioned Service Bus namespace (WarewolfShovelBridgeTesting, resource group
  # DEV2) instead of the local emulator used by the ShovelBridgeE2ETest job in
  # pipeline.yml — this is the "Test on Azure" stage job for that mode, referenced but not
  # yet wired up in docs/ShovelBridge-Architecture.md. Runs independently of, and in
  # parallel with, Deploy_And_Test_Azure_Functions above (no shared dependency). This is
  # now safe: Deploy_And_Test_Azure_Functions deploys/smoke-tests warewolfserver, while
  # this job's -VerifyWorkflowExecution leg polls warewolfserver-uat (a separate Function
  # App) - they no longer race for the same app instance (see the note above Deploy_And_
  # Test_Azure_Functions's smoke-test steps for the history of the collision this avoids).
  #
  # Also runs with -RabbitMqMode External against a LOCAL, choco-installed RabbitMQ Windows
  # service on this same hosted agent, rather than a docker-run rabbitmq:3-management
  # container: Docker on Microsoft-hosted Windows agents only supports Windows containers
  # (no Hyper-V/WSL2 Linux-container backend on the hosted VM, and no in-place daemon
  # switch available there), so `docker run rabbitmq:3-management` (a Linux-only image)
  # fails with "no matching manifest for windows/amd64" and `docker network create` fails
  # with "plugin bridge not found". -RabbitMqMode External only needs a reachable broker
  # with management + shovel + shovel_management enabled and caller-supplied creds — it
  # doesn't care whether that broker is genuinely remote or freshly provisioned on the
  # agent itself, so this reuses the exact 'choco install rabbitmq' + rabbitmq.conf +
  # rabbitmq-plugins enable technique TestRun.ps1's Start-HostRabbitMQServer already uses
  # for other RabbitMQ-dependent CI jobs on Windows agents (see TestRun.ps1). This
  # previously pointed at a standing, self-hosted "Warewolf DevOps RabbitMQ Source" broker
  # (rabbitmq.warewolf.online, reached over a non-Azure tunnel) - that dependency was
  # removed because its outbound network path to Azure Service Bus was assumed
  # unreliable/opaque from CI (the shovel would connect fine locally but never reach the
  # 'running' state against the real Service Bus destination). In hindsight that broker
  # was very likely hitting the SAME root cause documented in the "Install & start local
  # RabbitMQ" step below (Erlang's non-wildcard-aware TLS hostname check rejecting Azure
  # Service Bus's *.servicebus.windows.net certificate) rather than a genuine network
  # path problem - reproduced and fixed here, see docs/ShovelBridge-Architecture.md. A
  # local broker on the hosted agent still uses Microsoft's own outbound networking to
  # Azure, which is worth continuing to validate regardless. With both RabbitMQ (local
  # Windows service) and the Service Bus destination (external, real Azure) available,
  # this job needs no docker at all, so it stays on windows-2022 like the rest of this
  # pipeline.
  - job: ShovelBridgeE2ETest_ExternalServiceBus
    displayName: 'RabbitMQ Shovel -> Service Bus E2E Test (ExternalServiceBus mode, Azure)'
    pool:
      vmImage: 'windows-2022'
    # +5 min over the original 30: the workflow-execution leg below adds a second
    # Test-ShovelBridgeE2E.ps1 invocation and polling the UAT engine's
    # /secure/servicebus-result endpoint. No propagation wait is needed here (unlike the
    # earlier per-run secret-rotation design) since the daemon's client secret is a stored
    # pipeline variable, not freshly minted on every run - see the token-acquisition step below.
    timeoutInMinutes: 35
    variables:
      ServiceBusNamespace: 'WarewolfShovelBridgeTesting'
      ServiceBusResourceGroup: 'DEV2'
      ServiceBusQueueName: 'wwexecution-queue-e2e'
      ServiceBusSendRuleName: 'shovel-e2e-send'
      ServiceBusListenRuleName: 'shovel-e2e-listen'
      # The local RabbitMQ Windows service only exposes the loopback-only 'guest' user by
      # default, which is fine here: both the management API calls below AND the shovel's
      # own src-uri connection (localhost:5672, inside the same node - see
      # Test-ShovelBridgeE2E.ps1) originate from this same agent, i.e. always loopback.
      ExternalRabbitMqManagementUri: 'http://localhost:15672'
      ExternalRabbitMqUsername: 'guest'

      # ── Full end-to-end "workflow execution" leg (additive) ──────────────────────────
      # Proves RabbitMQ -> Shovel -> Service Bus -> the UAT-deployed Lightweight engine's
      # in-process secure Service Bus trigger -> actual workflow EXECUTION, not just message
      # arrival (see docs/ServiceBusSecureTrigger-Architecture.md, Test-ShovelBridgeE2E.ps1
      # -VerifyWorkflowExecution). Uses a DIFFERENT queue than ServiceBusQueueName above: it
      # must match WAREWOLF_SERVICEBUS_TRIGGER_QUEUE already configured on VerifyEngineBaseUrl,
      # and is consumed exclusively by the engine's own Managed Identity subscription - only a
      # Send-only SAS rule is provisioned for it, deliberately no Listen rule (see
      # Run-ShovelBridgeE2E-DevOpsRabbit.ps1's own -VerifyWorkflowExecution provisioning).
      VerifyServiceBusQueueName: 'wwexecution-secure-trigger-queue-e2e'
      VerifyServiceBusSendRuleName: 'shovel-e2e-verify-send'
      VerifyEngineBaseUrl: 'https://warewolfserver-uat.azurewebsites.net'
      # RabbitProcess (Resources/rabbit/RabbitProcess.bite) now targets a re-provisioned,
      # WFAES-encrypted SQL source (NewSqlServerSource.bite, Active Directory Password auth,
      # decrypted at runtime via the engine's Key Vault wiring) instead of the old
      # DPAPI-locked-to-authoring-machine source, so it's safe to load-test against here.
      # RabbitProcess's DataList exposes a single Input, 'message'.
      # Folder-qualified: WorkflowIndex.Resolve() (Warewolf.Execution.Lightweight
      # /Infrastructure/WorkflowIndex.cs) does an exact key match against
      # workflow-index.json, which keys entries by full relative path (e.g.
      # 'rabbit/rabbitprocess') - and the legacy on-disk fallback in
      # WorkflowFunctionHelper.cs is also non-recursive. A bare 'RabbitProcess'
      # cannot resolve once the .bite lives under Resources/rabbit/, which is how
      # VerifyEngineBaseUrl's Resources folder is staged (see
      # docs/Deploy-UAT-Redeploy-Spec.md §5.4) - confirmed live via
      # Test-ShovelBridgeE2E.ps1 during WOLF-8510.
      VerifyWorkflowName: 'rabbit/RabbitProcess'
      VerifyWorkflowInputsJson: '{"message":"loadtest"}'
      # Dedicated Entra app registration minting the CALLER's own delegated-identity token
      # embedded in the message (NOT a system/shared credential - see
      # docs/ServiceBusSecureTrigger-Architecture.md "Already provisioned in the DEV2 tenant").
      # Per docs/KB-ClientApps-Configuration.md (Daemon client convention across this
      # codebase), this secret is minted ONCE by an Application Administrator (via
      # 'az ad app credential reset' or Configure-WwExecutionAuth-Clients.ps1) and reused
      # directly for client-credentials token requests - NOT rotated on every run. Rotating
      # fresh per-run (the previous design here) forced the pipeline's own low-privilege
      # service principal to hold Graph Application.ReadWrite.OwnedBy/.All, which app-only
      # callers need in addition to (not satisfied by) being listed as an app Owner - see
      # docs/ServiceBusSecureTrigger-Architecture.md "Root cause found" for the full story.
      # ShovelE2EDaemonClientSecret is a secure pipeline variable (Library/variable group,
      # secret) set by whoever minted the secret - it is deliberately NOT set here in-repo.
      ShovelE2EEntraTenantId: 'ca0cc53b-9af4-4067-bcdf-be9c648450d1'
      ShovelE2EDaemonClientId: 'dc1182bc-ffc1-4a1d-a414-ab672998eb9a'
      ShovelE2EResourceAppId: 'e200900a-2d5d-4356-94c0-cd7e33232ce0'

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    # Same 'choco install rabbitmq' native-Windows-service technique TestRun.ps1's
    # Start-HostRabbitMQServer uses for other RabbitMQ-dependent jobs on Windows agents
    # (see TestRun.ps1), plus enabling the shovel + shovel_management plugins this test
    # additionally needs (Start-HostRabbitMQServer's own callers never use Shovel). Runs on
    # this agent instead of docker (Windows agents can't pull the Linux-only
    # rabbitmq:3-management image) and instead of a standing external broker (removes a
    # dependency on that broker's own, opaque-to-CI outbound network path to Azure).
    - powershell: |
        $ErrorActionPreference = 'Stop'

        if (-not (Get-Service -Name 'RabbitMQ' -ErrorAction SilentlyContinue)) {
          choco install rabbitmq -y --no-progress
        }

        # RabbitMQ 4.x forbids transient (non-durable) non-exclusive queues by default
        # ('transient_nonexcl_queues' deprecated feature); re-permit it, same as
        # TestRun.ps1's Start-HostRabbitMQServer does for the choco install path.
        $confLine = 'deprecated_features.permit.transient_nonexcl_queues = true'
        $confDirs = @(
          (Join-Path $env:APPDATA 'RabbitMQ'),
          'C:\Windows\System32\config\systemprofile\AppData\Roaming\RabbitMQ'
        )

        # Erlang's default TLS peer verification (verify_peer, applied to the shovel's
        # amqp10 dest-uri whenever it omits an explicit '?verify=' override) does a
        # LITERAL hostname match against the certificate's SANs - it does not expand
        # wildcard SANs the way RFC 6125 (and Erlang's own https-specific match
        # function) does. Azure Service Bus presents *.servicebus.windows.net /
        # servicebus.windows.net, which never literal-matches a real namespace FQDN
        # (e.g. mynamespace.servicebus.windows.net), so amqp10_client's TLS handshake
        # always fails with {bad_cert, {hostname_check_failed, ...}} - surfaced by the
        # shovel only as the generic "failed to connect to destination". This is NOT a
        # SAS-key/auth/network problem (root-caused and reproduced locally against the
        # real Service Bus namespace: see docs/ShovelBridge-Architecture.md).
        #
        # Fix: apply Erlang's own wildcard-aware match function (the one built for
        # https) to amqp10_client globally via advanced.config, so the destination
        # connection keeps FULL certificate chain + hostname validation (verify_peer,
        # no downgrade to verify_none) while correctly accepting the wildcard SAN.
        $advancedConfigContent = @(
          '[',
          '  {amqp10_client, [',
          '    {ssl_options, [',
          '      {customize_hostname_check, [',
          '        {match_fun, public_key:pkix_verify_hostname_match_fun(https)}',
          '      ]}',
          '    ]}',
          '  ]}',
          '].'
        ) -join "`n"
        foreach ($d in $confDirs) {
          if (-not (Test-Path $d)) { New-Item -ItemType Directory -Path $d -Force | Out-Null }
          Set-Content -Path (Join-Path $d 'rabbitmq.conf') -Value $confLine -Encoding ascii -Force
          Set-Content -Path (Join-Path $d 'advanced.config') -Value $advancedConfigContent -Encoding ascii -Force -NoNewline
        }

        Restart-Service -Name 'RabbitMQ' -Force -ErrorAction SilentlyContinue
        Start-Service -Name 'RabbitMQ' -ErrorAction SilentlyContinue

        $bound = $false
        for ($i = 1; $i -le 30; $i++) {
          try { (New-Object System.Net.Sockets.TcpClient('127.0.0.1', 5672)).Close(); $bound = $true; break } catch { Start-Sleep 2 }
        }
        if (-not $bound) { throw 'RabbitMQ did not bind 5672 within 60s.' }

        $rabbitmqPlugins = Get-ChildItem -Path 'C:\Program Files\RabbitMQ Server' -Filter 'rabbitmq-plugins.bat' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $rabbitmqPlugins) { throw 'rabbitmq-plugins.bat not found after choco install.' }
        & $rabbitmqPlugins.FullName enable rabbitmq_management rabbitmq_shovel rabbitmq_shovel_management
        if ($LASTEXITCODE -ne 0) { throw "rabbitmq-plugins enable failed (exit $LASTEXITCODE)." }

        # The choco package auto-starts rabbitmq_management as part of its own install, so
        # by the time we reach the 'enable' call above, the management app is typically
        # already running. Hot-enabling shovel_management on top of an ALREADY-running
        # management app does not register its REST routes into the live Cowboy
        # dispatcher (a well-known RabbitMQ management-plugin gotcha - the dispatch table
        # is only built when the mgmt app itself (re)starts). Symptom seen in CI: /api/
        # overview responds fine, but /api/shovels never comes up within the E2E script's
        # own (shorter) readiness window. Force a full service restart here so the node
        # reboots with all three plugins already enabled from the start, guaranteeing
        # /api/shovels is registered - same fix as RabbitMQ's own documented workaround
        # (rabbitmqctl eval 'rabbit_mgmt_app:reset_dispatcher(ignore).'), just via restart
        # since that's already this script's established pattern for applying changes.
        Restart-Service -Name 'RabbitMQ' -Force -ErrorAction SilentlyContinue
        Start-Service -Name 'RabbitMQ' -ErrorAction SilentlyContinue

        $bound = $false
        for ($i = 1; $i -le 30; $i++) {
          try { (New-Object System.Net.Sockets.TcpClient('127.0.0.1', 5672)).Close(); $bound = $true; break } catch { Start-Sleep 2 }
        }
        if (-not $bound) { throw 'RabbitMQ did not bind 5672 within 60s after restarting for plugin activation.' }

        $authHeader = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('guest:guest')) }

        $mgmtReady = $false
        for ($i = 1; $i -le 30; $i++) {
          try { Invoke-RestMethod -Uri 'http://localhost:15672/api/overview' -Headers $authHeader -TimeoutSec 5 -ErrorAction Stop | Out-Null; $mgmtReady = $true; break } catch { Start-Sleep 2 }
        }
        if (-not $mgmtReady) { throw 'RabbitMQ management API (15672) not ready after enabling plugins.' }

        # Explicitly verify shovel_management's own endpoint here (not just /api/overview)
        # so a dispatcher-registration failure is caught - and fails loudly - in this setup
        # step, rather than surfacing later as a more opaque timeout inside the E2E script.
        $shovelApiReady = $false
        for ($i = 1; $i -le 30; $i++) {
          try { Invoke-RestMethod -Uri 'http://localhost:15672/api/shovels' -Headers $authHeader -TimeoutSec 5 -ErrorAction Stop | Out-Null; $shovelApiReady = $true; break } catch { Start-Sleep 2 }
        }
        if (-not $shovelApiReady) { throw 'RabbitMQ /api/shovels (rabbitmq_shovel_management) not ready after enabling plugins and restarting the service.' }

        Write-Host 'Local RabbitMQ (choco) is ready with management + shovel + shovel_management enabled.'
      displayName: 'Install & start local RabbitMQ (choco) with shovel plugins'

    # Reuses the same service principal (AzureClientId/AzureClientSecret/AzureTenantId)
    # already used by 'Log in to Azure CLI' in Deploy_And_Test_Azure_Functions above - no
    # new pipeline secrets needed.
    - powershell: |
        Write-Host "Logging in to Azure CLI as service principal ..."
        az login --service-principal `
            -u $env:AzureClientIdValue `
            -p $env:AzureClientSecretValue `
            --tenant $env:AzureTenantIdValue | Out-Null
        $account = az account show | ConvertFrom-Json
        Write-Host "Logged in: $($account.name) ($($account.id))"
      displayName: 'Log in to Azure CLI'
      env:
        AzureClientIdValue: $(AzureClientId)
        AzureClientSecretValue: $(AzureClientSecret)
        AzureTenantIdValue: $(AzureTenantId)

    # Self-heals a known, documented drift risk (docs/ShovelBridge-Architecture.md,
    # "Security" section): the Shovel plugin's dest-uri only ever authenticates via
    # SASL PLAIN (policy-name:key) - it has no Azure AD/OAuth client, so it cannot use
    # Managed Identity or an Entra token. If a security baseline/policy on the
    # WarewolfShovelBridgeTesting namespace flips 'disableLocalAuth' to true (i.e.
    # disables SAS/local auth), EVERY SAS-signed call against it starts failing with
    # 401 Unauthorized - both this job's own Service Bus management-API destination
    # queue check (Test-ShovelBridgeE2E.ps1's Test-ServiceBusQueueExists) AND the
    # Shovel's own AMQP connection, which would surface as the Shovel going to
    # 'terminated' with reason "failed to connect to destination". Checking/restoring
    # this here, before the queue/SAS-rule provisioning and the test run, means the
    # pipeline recovers automatically instead of failing with a misleading
    # auth/connectivity error on every drift.
    #
    # NOTE: disableLocalAuth drift is NOT the only thing that produces "failed to
    # connect to destination" - a separate, unrelated TLS certificate-validation bug
    # (Erlang's non-wildcard-aware hostname check rejecting Azure Service Bus's
    # wildcard cert) produces the exact same generic reason string even when
    # disableLocalAuth is correctly false, as confirmed live against this namespace.
    # That is fixed by the advanced.config written in the "Install & start local
    # RabbitMQ" step above; see docs/ShovelBridge-Architecture.md for the full
    # root-cause writeup. Keep both fixes - they guard against two independent,
    # equally-fatal failure modes that happen to share the same symptom text.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ns = '$(ServiceBusNamespace)'
        $rg = '$(ServiceBusResourceGroup)'

        $disableLocalAuth = az servicebus namespace show --name $ns --resource-group $rg --query disableLocalAuth -o tsv
        if ($LASTEXITCODE -ne 0) { throw "Failed to read 'disableLocalAuth' for Service Bus namespace '$ns' (exit $LASTEXITCODE)." }

        if ($disableLocalAuth -eq 'true') {
          Write-Host "##[warning]Service Bus namespace '$ns' has local (SAS) authentication disabled (disableLocalAuth=true) - this breaks the Shovel's SASL PLAIN dest-uri connection and any SAS-signed management API call. Restoring disableLocalAuth=false ..."
          az servicebus namespace update --name $ns --resource-group $rg --disable-local-auth false | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to restore 'disableLocalAuth=false' on Service Bus namespace '$ns' (exit $LASTEXITCODE)." }
          Write-Host "Restored: local (SAS) authentication is now enabled on '$ns'."
        } else {
          Write-Host "Service Bus namespace '$ns' already has local (SAS) authentication enabled (disableLocalAuth=$disableLocalAuth) - no action needed."
        }
      displayName: 'Ensure Service Bus namespace allows local (SAS) auth for the Shovel'

    # Idempotent 'show, create-if-missing' provisioning of ONE fixed, persistent queue +
    # its two queue-scoped SAS rules (Send-only for the shovel destination, Listen-only
    # for the harness's own verification connection) - same least-privilege split, and the
    # same az CLI calls, as Deploy-WwExecutionServiceBusWorker.ps1's own Send/Listen rule
    # provisioning. Nothing is deleted after the run: this is a dedicated, disposable
    # testing namespace, so the queue/rules are left in place and reused by every run
    # rather than provisioned/torn down per-run.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ns         = '$(ServiceBusNamespace)'
        $rg         = '$(ServiceBusResourceGroup)'
        $queue      = '$(ServiceBusQueueName)'
        $sendRule   = '$(ServiceBusSendRuleName)'
        $listenRule = '$(ServiceBusListenRuleName)'

        function Test-AzExists([string[]] $CliArgs) {
          # Merging stderr into the output stream via 2>&1 does NOT stop it being
          # promoted to a terminating NativeCommandError while $ErrorActionPreference
          # is 'Stop' - Windows PowerShell 5.1 converts merged stderr lines to
          # ErrorRecord objects and still honours 'Stop' for them, so the
          # expected-on-first-run "EntityNotFound" from 'az servicebus queue show'
          # aborts the whole script before $LASTEXITCODE can be checked. Scope
          # $ErrorActionPreference to 'Continue' for just this call (function-local,
          # reverts automatically on return) so only the exit code is used to decide
          # existence, while the rest of the script keeps failing fast on 'Stop'.
          $ErrorActionPreference = 'Continue'
          $null = & az @CliArgs -o json 2>&1
          return $LASTEXITCODE -eq 0
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'show', '--name', $queue, '--namespace-name', $ns, '--resource-group', $rg))) {
          Write-Host "Creating queue '$queue' on '$ns'..."
          az servicebus queue create --name $queue --namespace-name $ns --resource-group $rg | Out-Null
        } else {
          Write-Host "Queue '$queue' already exists."
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'authorization-rule', 'show', '--name', $sendRule, '--namespace-name', $ns, '--resource-group', $rg, '--queue-name', $queue))) {
          Write-Host "Creating Send-only SAS rule '$sendRule'..."
          az servicebus queue authorization-rule create --name $sendRule --namespace-name $ns --resource-group $rg --queue-name $queue --rights Send | Out-Null
        } else {
          Write-Host "Send rule '$sendRule' already exists."
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'authorization-rule', 'show', '--name', $listenRule, '--namespace-name', $ns, '--resource-group', $rg, '--queue-name', $queue))) {
          Write-Host "Creating Listen-only SAS rule '$listenRule'..."
          az servicebus queue authorization-rule create --name $listenRule --namespace-name $ns --resource-group $rg --queue-name $queue --rights Listen | Out-Null
        } else {
          Write-Host "Listen rule '$listenRule' already exists."
        }

        $sendKey = (az servicebus queue authorization-rule keys list --name $sendRule --namespace-name $ns --resource-group $rg --queue-name $queue --query primaryKey -o tsv)
        if ([string]::IsNullOrWhiteSpace($sendKey)) { throw "Failed to retrieve primary key for '$sendRule'." }
        $policyEnc = [Uri]::EscapeDataString($sendRule)
        $keyEnc    = [Uri]::EscapeDataString($sendKey)
        $destUri   = "amqps://${policyEnc}:${keyEnc}@${ns}.servicebus.windows.net:5671/?sasl=plain"

        $listenConnStr = (az servicebus queue authorization-rule keys list --name $listenRule --namespace-name $ns --resource-group $rg --queue-name $queue --query primaryConnectionString -o tsv)
        if ([string]::IsNullOrWhiteSpace($listenConnStr)) { throw "Failed to retrieve primary connection string for '$listenRule'." }

        Write-Host "##vso[task.setvariable variable=ShovelDestUri;issecret=true]$destUri"
        Write-Host "##vso[task.setvariable variable=ListenConnectionString;issecret=true]$listenConnStr"
        Write-Host "Provisioning complete. Queue '$queue' ready on '$ns' with rules '$sendRule' (Send) / '$listenRule' (Listen)."
      displayName: 'Ensure Service Bus test queue + SAS rules exist'

    # #Requires -Version 7.0 in Test-ShovelBridgeE2E.ps1 means this step MUST run under
    # PowerShell 7 (pwsh), not Windows PowerShell. Secrets are passed via env: (masked in
    # logs by ADO because they were marked issecret=true above), never inlined into a
    # command-line arguments string.
    - pwsh: |
        $connSecure = ConvertTo-SecureString $env:ListenConnectionStringValue -AsPlainText -Force
        $rabbitPasswordSecure = ConvertTo-SecureString 'guest' -AsPlainText -Force
        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Tests\Integration\Test-ShovelBridgeE2E.ps1' `
            -DestinationMode ExternalServiceBus `
            -DestinationQueueName '$(ServiceBusQueueName)' `
            -ExternalShovelDestUri $env:ShovelDestUriValue `
            -ExternalServiceBusConnectionString $connSecure `
            -RabbitMqMode External `
            -ExternalRabbitMqManagementUri '$(ExternalRabbitMqManagementUri)' `
            -ExternalRabbitMqUsername '$(ExternalRabbitMqUsername)' `
            -ExternalRabbitMqPassword $rabbitPasswordSecure
      displayName: 'Run ShovelBridge E2E test (ExternalServiceBus mode)'
      env:
        ShovelDestUriValue: $(ShovelDestUri)
        ListenConnectionStringValue: $(ListenConnectionString)

    # Idempotent 'show, create-if-missing' provisioning for the workflow-execution leg's OWN
    # queue (VerifyServiceBusQueueName) - deliberately Send-only, no Listen rule: this queue is
    # consumed exclusively by VerifyEngineBaseUrl's own Managed Identity subscription, and a
    # second SAS-based Listen consumer on it would compete for messages with that engine (see
    # Run-ShovelBridgeE2E-DevOpsRabbit.ps1's own -VerifyWorkflowExecution provisioning, and
    # Test-ShovelBridgeE2E.ps1's -VerifyWorkflowExecution help). This queue is expected to
    # already exist (created when the secure Service Bus trigger was provisioned on the target
    # engine via Enable-ServiceBusSecureTrigger.ps1) - the create-if-missing here is only a
    # safety net, not the source of truth for that provisioning.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ns       = '$(ServiceBusNamespace)'
        $rg       = '$(ServiceBusResourceGroup)'
        $queue    = '$(VerifyServiceBusQueueName)'
        $sendRule = '$(VerifyServiceBusSendRuleName)'

        function Test-AzExists([string[]] $CliArgs) {
          # See the identical helper + comment in 'Ensure Service Bus test queue + SAS rules
          # exist' above for why $ErrorActionPreference must be scoped to 'Continue' here.
          $ErrorActionPreference = 'Continue'
          $null = & az @CliArgs -o json 2>&1
          return $LASTEXITCODE -eq 0
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'show', '--name', $queue, '--namespace-name', $ns, '--resource-group', $rg))) {
          Write-Host "Creating queue '$queue' on '$ns'..."
          az servicebus queue create --name $queue --namespace-name $ns --resource-group $rg | Out-Null
        } else {
          Write-Host "Queue '$queue' already exists."
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'authorization-rule', 'show', '--name', $sendRule, '--namespace-name', $ns, '--resource-group', $rg, '--queue-name', $queue))) {
          Write-Host "Creating Send-only SAS rule '$sendRule'..."
          az servicebus queue authorization-rule create --name $sendRule --namespace-name $ns --resource-group $rg --queue-name $queue --rights Send | Out-Null
        } else {
          Write-Host "Send rule '$sendRule' already exists."
        }

        $sendKey = (az servicebus queue authorization-rule keys list --name $sendRule --namespace-name $ns --resource-group $rg --queue-name $queue --query primaryKey -o tsv)
        if ([string]::IsNullOrWhiteSpace($sendKey)) { throw "Failed to retrieve primary key for '$sendRule'." }
        $policyEnc = [Uri]::EscapeDataString($sendRule)
        $keyEnc    = [Uri]::EscapeDataString($sendKey)
        $destUri   = "amqps://${policyEnc}:${keyEnc}@${ns}.servicebus.windows.net:5671/?sasl=plain"

        Write-Host "##vso[task.setvariable variable=VerifyShovelDestUri;issecret=true]$destUri"
        Write-Host "Provisioning complete. Queue '$queue' ready on '$ns' with rule '$sendRule' (Send-only)."
      displayName: 'Ensure ShovelBridge E2E verification queue + Send-only SAS rule exist'

    # Acquires a fresh Entra app-only (client-credentials) access token for the dedicated
    # 'Warewolf-ShovelBridgeE2E-Daemon' app registration (see
    # docs/ServiceBusSecureTrigger-Architecture.md "Already provisioned in the DEV2 tenant").
    # Deliberately does NOT rotate the secret here (that was the previous design, and the
    # reason this leg needed permissions the pipeline's own service principal doesn't have -
    # see docs/ServiceBusSecureTrigger-Architecture.md "Root cause found"). Per this codebase's
    # own Daemon-client convention (docs/KB-ClientApps-Configuration.md), a Daemon's client
    # secret is minted ONCE by an Application Administrator and reused directly for
    # client-credentials token requests thereafter - not rotated on every run. The secret
    # below is $(ShovelE2EDaemonClientSecret), a secure pipeline variable (Library/variable
    # group) set by whoever minted it; it is deliberately not stored in this file. Re-mint and
    # update that pipeline variable manually before the secret expires (--years 1 originally -
    # see docs/ServiceBusSecureTrigger-Architecture.md for the exact 'az ad app credential
    # reset' command an Application Administrator can run).
    - powershell: |
        $ErrorActionPreference = 'Stop'

        if ([string]::IsNullOrWhiteSpace($env:ShovelE2EDaemonClientSecretValue)) {
          throw "Pipeline variable 'ShovelE2EDaemonClientSecret' is not set. An Application Administrator must mint a client secret for app 'dc1182bc-ffc1-4a1d-a414-ab672998eb9a' (see docs/ServiceBusSecureTrigger-Architecture.md) and store it as a secure pipeline variable of this name."
        }

        $tokenResponse = Invoke-RestMethod -Method POST `
          -Uri "https://login.microsoftonline.com/$(ShovelE2EEntraTenantId)/oauth2/v2.0/token" `
          -ContentType 'application/x-www-form-urlencoded' `
          -Body @{
            grant_type    = 'client_credentials'
            client_id     = '$(ShovelE2EDaemonClientId)'
            client_secret = $env:ShovelE2EDaemonClientSecretValue
            scope         = 'api://$(ShovelE2EResourceAppId)/.default'
          }
        if ([string]::IsNullOrWhiteSpace($tokenResponse.access_token)) {
          throw 'Failed to acquire an Entra access token for the ShovelBridge E2E daemon app. Verify the ShovelE2EDaemonClientSecret pipeline variable is current and not expired.'
        }

        Write-Host "##vso[task.setvariable variable=ShovelE2EAccessToken;issecret=true]$($tokenResponse.access_token)"
        Write-Host 'Acquired Entra access token for the workflow-execution verification leg.'
      displayName: 'Acquire Entra token for ShovelBridge E2E daemon (stored secret)'
      env:
        # Secret pipeline variables are NOT expanded via '$(...)' macro syntax directly inside
        # a script body (ADO deliberately withholds that for secret variables) - they must be
        # mapped through 'env:' and read as an environment variable instead, same pattern as
        # ShovelDestUriValue/ListenConnectionStringValue above.
        ShovelE2EDaemonClientSecretValue: $(ShovelE2EDaemonClientSecret)

    # Second, additive invocation of Test-ShovelBridgeE2E.ps1 against the SAME local RabbitMQ
    # broker used above, but in -VerifyWorkflowExecution mode: this proves the FULL pipeline,
    # including actual workflow EXECUTION on VerifyEngineBaseUrl (the UAT-deployed Lightweight
    # engine), not just bare message arrival at a Service Bus queue - see
    # docs/ServiceBusSecureTrigger-Architecture.md and Test-ShovelBridgeE2E.ps1's own
    # -VerifyWorkflowExecution doc comment. Uses distinct -SourceQueueName/-ShovelName so this
    # leg's RabbitMQ objects never collide with (or get silently reconfigured by) the
    # bare-arrival leg above. #Requires -Version 7.0 in Test-ShovelBridgeE2E.ps1 means this step
    # MUST run under PowerShell 7 (pwsh), not Windows PowerShell.
    #
    # -ResultTimeoutSeconds 180 (default 90): Phase 0's pre-warm only hits the engine's HTTP
    # host (GET /apis.json) - it does NOT guarantee the Service-Bus-triggered function's own
    # listener is warm too, on this Consumption-plan (no alwaysOn) app. App Insights
    # (warewolfserver-uat-ai) shows the FIRST ServiceBusWorkflowTrigger execution of a run
    # regularly taking 70-110s end-to-end (e.g. 110403ms on 2026-08-17, 90380ms on
    # 2026-08-16) even though it ultimately Succeeds, vs sub-second once warm under burst
    # load. The 90s default sits right on that edge and intermittently times out this
    # single-message run before the result is ever polled successfully - confirmed via
    # Application Insights that the workflow had, in fact, succeeded just after the
    # harness's poll window closed. Raised to 180s for headroom; the job's 35-minute
    # timeoutInMinutes budget easily absorbs this.
    - pwsh: |
        $messageAuthTokenSecure = ConvertTo-SecureString $env:ShovelE2EAccessTokenValue -AsPlainText -Force
        $rabbitPasswordSecure = ConvertTo-SecureString 'guest' -AsPlainText -Force
        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Tests\Integration\Test-ShovelBridgeE2E.ps1' `
            -DestinationMode ExternalServiceBus `
            -DestinationQueueName '$(VerifyServiceBusQueueName)' `
            -ExternalShovelDestUri $env:VerifyShovelDestUriValue `
            -RabbitMqMode External `
            -ExternalRabbitMqManagementUri '$(ExternalRabbitMqManagementUri)' `
            -ExternalRabbitMqUsername '$(ExternalRabbitMqUsername)' `
            -ExternalRabbitMqPassword $rabbitPasswordSecure `
            -SourceQueueName 'wwexecution-shovel-source-verify-e2e' `
            -ShovelName 'wwexecution-shovel-verify-e2e' `
            -VerifyWorkflowExecution `
            -WorkflowName '$(VerifyWorkflowName)' `
            -WorkflowInputsJson '$(VerifyWorkflowInputsJson)' `
            -EngineBaseUrl '$(VerifyEngineBaseUrl)' `
            -MessageAuthToken $messageAuthTokenSecure `
            -ResultTimeoutSeconds 180
      displayName: 'Run ShovelBridge E2E test (VerifyWorkflowExecution mode, UAT engine)'
      env:
        VerifyShovelDestUriValue: $(VerifyShovelDestUri)
        ShovelE2EAccessTokenValue: $(ShovelE2EAccessToken)

    - powershell: |
        $names = docker ps -a --filter "name=shovel-e2e-" --format '{{.Names}}' 2>$null
        if ($names) { $names -split "`n" | Where-Object { $_ } | ForEach-Object { docker rm -f $_ 2>$null | Out-Null } }
        $nets = docker network ls --filter "name=shovel-e2e-" --format '{{.Name}}' 2>$null
        if ($nets) { $nets -split "`n" | Where-Object { $_ } | ForEach-Object { docker network rm $_ 2>$null | Out-Null } }
        Stop-Service -Name 'RabbitMQ' -Force -ErrorAction SilentlyContinue
      displayName: 'Clean up any leftover containers/networks and stop local RabbitMQ'
      condition: always()

- stage: Package
  displayName: 'Package Release Artifact'
  # The release artifact is just the Build stage's published output, so it depends
  # on Build (not Azure). The Azure stage is a UAT deployment smoke test against a
  # shared environment; its result must not gate production of the release artifact
  # the downstream release pipeline consumes. Build still runs first, so a genuine
  # compile/publish failure still prevents an artifact.
  dependsOn: Build
  jobs:

  - job: Package_Release
    displayName: 'Build and Package Lightweight Azure Functions Release'

    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Compiled Artifact'
      inputs:
        artifact: 'AzureFunctionsPublish'
        path: '$(Agent.BuildDirectory)\AzureFunctionsPublish'

    # This job runs with checkout: none, so Dev/Warewolf.Execution.Lightweight/Scripts (zipped
    # below into the public release artifact) cannot be read from $(Build.SourcesDirectory) -
    # it does not exist. Pull it from the DeployScripts artifact the Build stage staged.
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Deployment Scripts'
      inputs:
        artifact: 'DeployScripts'
        path: '$(Agent.BuildDirectory)\DeployScripts'

    # The Build stage bundles content the Azure UAT smoke tests need at runtime
    # (load-testing workflows under Resources\, the encrypted secure.config used for
    # public workflow execution, the Prompts\ folder and Settings\ logging source).
    # The released artifact, by contrast, must ship WITHOUT any of these: resources
    # and configuration are provided by the operator at deploy time (prompted, or
    # passed through deployment parameters). The local developer/
    # operator helper scripts (StartAsAzureFunction.ps1, Deploy-ToAzure.ps1) and the
    # SSL certificate generation folder are likewise stripped - they are run from the
    # source tree, not from the deployed Function App. Strip everything here - after
    # Azure has consumed it from the shared AzureFunctionsPublish artifact - so only
    # this release artifact is affected. The Resources folder itself is kept (emptied)
    # so it remains in place for deploy-time population.
    - powershell: |
        $publishDir = "$(Agent.BuildDirectory)\AzureFunctionsPublish"

        $resourcesPath = Join-Path $publishDir "Resources"
        if (Test-Path $resourcesPath) {
            Get-ChildItem -LiteralPath $resourcesPath -Force | Remove-Item -Recurse -Force
            Write-Host "Emptied Resources folder: $resourcesPath"
        } else {
            New-Item -ItemType Directory -Force -Path $resourcesPath | Out-Null
            Write-Host "Created empty Resources folder: $resourcesPath"
        }

        $promptsPath = Join-Path $publishDir "Prompts"
        if (Test-Path $promptsPath) {
            Remove-Item -LiteralPath $promptsPath -Recurse -Force
            Write-Host "Removed Prompts folder: $promptsPath"
        }

        $elasticBite = Join-Path $publishDir "Settings\ElasticsearchLoggingSource.bite"
        if (Test-Path $elasticBite) {
            Remove-Item -LiteralPath $elasticBite -Force
            Write-Host "Removed Settings\ElasticsearchLoggingSource.bite"
        }

        $secureConfig = Join-Path $publishDir "secure.config"
        if (Test-Path $secureConfig) {
            Remove-Item -LiteralPath $secureConfig -Force
            Write-Host "Removed secure.config"
        }

        foreach ($script in @('StartAsAzureFunction.ps1', 'Deploy-ToAzure.ps1')) {
            $scriptPath = Join-Path $publishDir $script
            if (Test-Path $scriptPath) {
                Remove-Item -LiteralPath $scriptPath -Force
                Write-Host "Removed $script"
            }
        }

        # The SSL certificate helper folder (CreateCertificate.bat / TrustCertificate.bat)
        # is local developer tooling; resolve it case-insensitively because its source
        # casing ("SSL Generation") differs from the published casing on some build paths.
        $sslFolder = Get-ChildItem -LiteralPath $publishDir -Directory -Force |
            Where-Object { $_.Name -ieq 'SSL Generation' } | Select-Object -First 1
        if ($sslFolder) {
            Remove-Item -LiteralPath $sslFolder.FullName -Recurse -Force
            Write-Host "Removed $($sslFolder.Name) folder"
        }
      displayName: 'Strip Deploy-Time Resources and Config from Release Artifact'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Release Artifact'
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\AzureFunctionsPublish'
        ArtifactName: 'AzureFunctionsRelease'
        publishLocation: 'Container'

    # No stripping needed here, unlike AzureFunctionsPublish above: the QueueProcessor publish
    # output never carries Settings/ or any secret in the first place (Warewolf.Execution.
    # QueueProcessor.csproj sets CopyToPublishDirectory=Never on Settings\**\*.bite precisely
    # so deploy-time config can only arrive via Deploy-WwQueueProcessor.ps1, never ride along
    # in this artifact).
    - task: DownloadPipelineArtifact@2
      displayName: 'Download QueueProcessor Compiled Artifact'
      inputs:
        artifact: 'QueueProcessorPublish'
        path: '$(Agent.BuildDirectory)\QueueProcessorPublish'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish QueueProcessor Release Artifact'
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\QueueProcessorPublish'
        ArtifactName: 'QueueProcessorRelease'
        publishLocation: 'Container'

# Publishes a build as a public release: uploads the engine zip + deployment scripts zip +
# queueprocessor zip to Azure Blob Storage (stwwreleases/releases) and updates the
# "latest version" block on https://warewolf.io/release-notes.php (archiving the
# previous latest block first). Only runs on a manually queued build
# (Build.Reason = 'Manual') - automatic CI/CD triggers never touch the public
# release page. When queuing a manual run, use the "Stages to run" picker
# ("Run pipeline" dialog) to deselect this Release stage unless you actually
# intend to publish a public release.
#
# AzureStorageServiceConnection is a statically-defined pipeline VARIABLE (above,
# in the top-level variables: block), referenced via the compile-time template
# expression ${{ variables.AzureStorageServiceConnection }} - NOT the runtime
# $(...) macro syntax. Service connection references are authorized at
# pipeline-compile time, before runtime $(...) macros are substituted, so a
# $(...) reference fails with "service connection ... could not be found".
#
# Required pipeline variables (Pipelines > Edit > Variables). Mark the starred one
# as "secret":
#   AzureStorageAccountName       - stwwreleases
#   AzureStorageContainerName     - releases
#   ReleaseNotesFtpHost           - 160.153.129.213
#   ReleaseNotesFtpUser           - releasenotes@new.warewolf.io
# * ReleaseNotesFtpPassword       - FTP password for ReleaseNotesFtpUser
- stage: Release
  displayName: 'Publish Release (Azure Storage + warewolf.io)'
  dependsOn: Package
  condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
  jobs:

  - job: Publish_Release
    displayName: 'Upload release artifacts and update release notes'

    steps:
    # Only needed to zip up Dev/Warewolf.Execution.Lightweight/Scripts - the engine
    # artifact itself comes from the Package stage, not from this checkout.
    - checkout: self
      clean: false
      fetchDepth: 1

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Release Artifact'
      inputs:
        artifact: 'AzureFunctionsRelease'
        path: '$(Agent.BuildDirectory)\AzureFunctionsRelease'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download QueueProcessor Release Artifact'
      inputs:
        artifact: 'QueueProcessorRelease'
        path: '$(Agent.BuildDirectory)\QueueProcessorRelease'

    - powershell: |
        $versionFile = Join-Path "$(Agent.BuildDirectory)\AzureFunctionsRelease" 'FullVersionString'
        if (-not (Test-Path $versionFile)) { throw "FullVersionString not found in the release artifact - was it built by the Build stage?" }
        $version = (Get-Content -LiteralPath $versionFile -Raw).Trim()
        if ($version -eq '0.0.0.0' -or [string]::IsNullOrWhiteSpace($version)) { throw "Release artifact has no valid version ($version)." }
        Write-Host "##vso[task.setvariable variable=ReleaseVersion]$version"
        Write-Host "Release version: $version"
      displayName: 'Read release version from artifact'

    # Auto-detects the deployment scripts zip version so it does not need to be
    # on every run: reads the CURRENT scripts-zip-link href off the live
    # warewolf.io/release-notes.php, downloads that zip, and compares a content
    # hash of it against the Scripts/ folder in this build. If nothing changed,
    # the existing version tag is reused (no republish needed); if it changed,
    # the tag's trailing number is bumped (e.g. v2.0 -> v2.1). There is no manual
    # override anymore - this always runs (Azure DevOps's "Run pipeline" UI does
    # not allow submitting an empty string for a parameter, so a manual-override
    # parameter could never be "left blank" in practice).
    - powershell: |
        $ErrorActionPreference = 'Stop'

        function Get-FolderHash([string]$FolderPath, [string[]]$ExcludeTopLevel) {
          $files = Get-ChildItem -LiteralPath $FolderPath -Recurse -File -Force | Where-Object {
            $rel = $_.FullName.Substring($FolderPath.Length).TrimStart('\', '/')
            -not ($ExcludeTopLevel | Where-Object { $rel -eq $_ -or $rel -like "$_\*" -or $rel -like "$_/*" })
          } | Sort-Object { $_.FullName.Substring($FolderPath.Length) }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $ms = New-Object System.IO.MemoryStream
          foreach ($f in $files) {
            $rel = $f.FullName.Substring($FolderPath.Length).TrimStart('\', '/').Replace('\', '/')
            $relBytes = [System.Text.Encoding]::UTF8.GetBytes($rel)
            $ms.Write($relBytes, 0, $relBytes.Length)
            $fileBytes = [System.IO.File]::ReadAllBytes($f.FullName)
            $ms.Write($fileBytes, 0, $fileBytes.Length)
          }
          $hashBytes = $sha.ComputeHash($ms.ToArray())
          return [System.BitConverter]::ToString($hashBytes) -replace '-', ''
        }

        function Get-BumpedVersionTag([string]$Tag) {
          if ($Tag -match '^v?(\d+(?:\.\d+)*)$') {
            $parts = $Matches[1] -split '\.'
            $parts[-1] = [string]([int]$parts[-1] + 1)
            return 'v' + ($parts -join '.')
          }
          return 'v1.0'
        }

        $scriptsSrc = "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts"
        if (-not (Test-Path $scriptsSrc)) { throw "Scripts folder not found at $scriptsSrc" }
        $newHash = Get-FolderHash -FolderPath $scriptsSrc -ExcludeTopLevel @('logs')

        $scriptsVersion = $null
        try {
            $notesResponse = Invoke-WebRequest -Uri 'https://warewolf.io/release-notes.php' -UseBasicParsing -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
            $hrefMatch = [regex]::Match($notesResponse.Content, 'data-role="scripts-zip-link"[^>]*href="([^"]+)"')
            if ($hrefMatch.Success) {
              $currentScriptsUrl = $hrefMatch.Groups[1].Value

              # Only trust scripts-zip links pointing at this pipeline's own Azure Storage
              # account - warewolf.io's release-notes.php is public content, so its markup
              # must not be treated as a trusted source for a URL the agent will fetch from
              # and expand on disk.
              $expectedScriptsHost = "$(AzureStorageAccountName).blob.core.windows.net"
              $parsedScriptsUrl = $null
              if (-not [uri]::TryCreate($currentScriptsUrl, [UriKind]::Absolute, [ref]$parsedScriptsUrl) -or
                  $parsedScriptsUrl.Scheme -ne 'https' -or
                  $parsedScriptsUrl.Host -ne $expectedScriptsHost) {
                throw "Refusing to fetch scripts zip from untrusted URL '$currentScriptsUrl' (expected https://$expectedScriptsHost/...)."
              }

              $tagMatch = [regex]::Match($currentScriptsUrl, 'Deployment-Scripts-(v[0-9.]+)\.zip')
              if ($tagMatch.Success) {
                $currentTag = $tagMatch.Groups[1].Value
                Write-Host "Current published scripts zip: $currentScriptsUrl (tag $currentTag)"

                $oldZip = Join-Path "$(Agent.BuildDirectory)" 'PreviousDeploymentScripts.zip'
                $oldDir = Join-Path "$(Agent.BuildDirectory)" 'PreviousDeploymentScripts'
                Invoke-WebRequest -Uri $currentScriptsUrl -OutFile $oldZip -UseBasicParsing -TimeoutSec 60 -MaximumRetryCount 3 -RetryIntervalSec 5
                if (Test-Path $oldDir) { Remove-Item $oldDir -Recurse -Force }
                Expand-Archive -LiteralPath $oldZip -DestinationPath $oldDir -Force

                # Older published zips may wrap their contents in a single top-level
                # "Scripts" folder while this pipeline zips the folder's contents
                # flat; normalise so the hash compares like-for-like either way.
                $oldRoot = $oldDir
                $topLevelItems = Get-ChildItem -LiteralPath $oldDir -Force
                if ($topLevelItems.Count -eq 1 -and $topLevelItems[0].PSIsContainer) {
                  $oldRoot = $topLevelItems[0].FullName
                }
                $oldHash = Get-FolderHash -FolderPath $oldRoot -ExcludeTopLevel @('logs')

                if ($oldHash -eq $newHash) {
                  $scriptsVersion = $currentTag
                  Write-Host "Scripts/ is unchanged since $currentTag - reusing that version tag."
                } else {
                  $scriptsVersion = Get-BumpedVersionTag $currentTag
                  Write-Host "Scripts/ changed since $currentTag - bumping to $scriptsVersion."
                }
              }
            }
        } catch {
            Write-Warning "Could not read/compare the currently published scripts zip ($($_.Exception.Message)); falling back to v1.0."
        }
        if (-not $scriptsVersion) { $scriptsVersion = 'v1.0' }

        Write-Host "##vso[task.setvariable variable=ScriptsPackageVersion]$scriptsVersion"
        Write-Host "Deployment scripts package version: $scriptsVersion"
      displayName: 'Auto-detect deployment scripts package version'

    - powershell: |
        $ErrorActionPreference = 'Stop'
        $engineZip = "$(Agent.BuildDirectory)\AzureFunctionsPackage-$(ReleaseVersion).zip"
        if (Test-Path $engineZip) { Remove-Item $engineZip -Force }
        Compress-Archive -Path "$(Agent.BuildDirectory)\AzureFunctionsRelease\*" -DestinationPath $engineZip -Force
        Write-Host "##vso[task.setvariable variable=EngineZipPath]$engineZip"
        Write-Host "Created $engineZip"

        $scriptsSrc = "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts"
        if (-not (Test-Path $scriptsSrc)) { throw "Scripts folder not found at $scriptsSrc" }
        $scriptsZip = "$(Agent.BuildDirectory)\Warewolf-ExecutionEngine-Deployment-Scripts-$(ScriptsPackageVersion).zip"
        if (Test-Path $scriptsZip) { Remove-Item $scriptsZip -Force }
        # Exclude local test logs / Pester output - never intended for the public package.
        $scriptsItems = Get-ChildItem -Path $scriptsSrc -Force | Where-Object { $_.Name -ne 'logs' }
        Compress-Archive -Path $scriptsItems.FullName -DestinationPath $scriptsZip -Force
        Write-Host "##vso[task.setvariable variable=ScriptsZipPath]$scriptsZip"
        Write-Host "Created $scriptsZip"

        # Tagged with the SAME ReleaseVersion as the engine zip - the two are built from the
        # same commit/tag by the Build stage, so there is no separate version to auto-detect
        # here (unlike the scripts zip above, which changes independently of engine releases).
        $queueWorkerZip = "$(Agent.BuildDirectory)\Warewolf-QueueProcessor-$(ReleaseVersion).zip"
        if (Test-Path $queueWorkerZip) { Remove-Item $queueWorkerZip -Force }
        Compress-Archive -Path "$(Agent.BuildDirectory)\QueueProcessorRelease\*" -DestinationPath $queueWorkerZip -Force
        Write-Host "##vso[task.setvariable variable=QueueWorkerZipPath]$queueWorkerZip"
        Write-Host "Created $queueWorkerZip"
      displayName: 'Create engine + deployment-scripts + queueprocessor zips'

    - task: AzureCLI@2
      displayName: 'Upload zips to Azure Storage'
      inputs:
        azureSubscription: '${{ variables.AzureStorageServiceConnection }}'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          az storage blob upload `
            --account-name "$(AzureStorageAccountName)" `
            --container-name "$(AzureStorageContainerName)" `
            --name "AzureFunctionsPackage-$(ReleaseVersion).zip" `
            --file "$(EngineZipPath)" `
            --auth-mode login `
            --overwrite true
          if ($LASTEXITCODE -ne 0) { throw "Engine zip upload failed" }

          az storage blob upload `
            --account-name "$(AzureStorageAccountName)" `
            --container-name "$(AzureStorageContainerName)" `
            --name "Warewolf-ExecutionEngine-Deployment-Scripts-$(ScriptsPackageVersion).zip" `
            --file "$(ScriptsZipPath)" `
            --auth-mode login `
            --overwrite true
          if ($LASTEXITCODE -ne 0) { throw "Deployment scripts zip upload failed" }

          az storage blob upload `
            --account-name "$(AzureStorageAccountName)" `
            --container-name "$(AzureStorageContainerName)" `
            --name "Warewolf-QueueProcessor-$(ReleaseVersion).zip" `
            --file "$(QueueWorkerZipPath)" `
            --auth-mode login `
            --overwrite true
          if ($LASTEXITCODE -ne 0) { throw "QueueProcessor zip upload failed" }

          $engineUrl = "https://$(AzureStorageAccountName).blob.core.windows.net/$(AzureStorageContainerName)/AzureFunctionsPackage-$(ReleaseVersion).zip"
          $scriptsUrl = "https://$(AzureStorageAccountName).blob.core.windows.net/$(AzureStorageContainerName)/Warewolf-ExecutionEngine-Deployment-Scripts-$(ScriptsPackageVersion).zip"
          $queueWorkerUrl = "https://$(AzureStorageAccountName).blob.core.windows.net/$(AzureStorageContainerName)/Warewolf-QueueProcessor-$(ReleaseVersion).zip"
          Write-Host "##vso[task.setvariable variable=EngineZipUrl]$engineUrl"
          Write-Host "##vso[task.setvariable variable=ScriptsZipUrl]$scriptsUrl"
          Write-Host "##vso[task.setvariable variable=QueueWorkerZipUrl]$queueWorkerUrl"
          Write-Host "Engine zip:        $engineUrl"
          Write-Host "Scripts zip:       $scriptsUrl"
          Write-Host "QueueProcessor zip: $queueWorkerUrl"

    # Downloads the LIVE release-notes.php over FTPS (explicit FTP over TLS via
    # AUTH TLS - not HTTP, since HTTP would return PHP-rendered output, not the
    # editable source), delegates the archive+update logic to the tested
    # Update-ReleaseNotes.ps1 script (kept alongside this pipeline so it can be
    # run/tested standalone), then uploads the result back over FTPS. See that
    # script's header comment for the RELEASE:* marker format required in
    # release-notes.php.
    #
    # The GoDaddy shared-hosting box behind ReleaseNotesFtpHost presents its
    # shared server certificate (CN/SAN "*.prod.sxb1.secureserver.net") for
    # FTPS on port 21, never one matching warewolf.io/the FTP host or IP -
    # GoDaddy shared hosting does not issue FTPS certs for customer domains.
    # That means .NET's default hostname check always fails here with
    # RemoteCertificateNameMismatch, even though the certificate itself is
    # valid/trusted/unexpired. The callback below accepts ONLY that specific,
    # expected mismatch, and only when the cert is still the genuine,
    # in-date GoDaddy/Starfield shared cert for *.prod.sxb1.secureserver.net -
    # any other TLS problem (expired cert, untrusted chain, tampering, a
    # differently-named subject) still fails the connection. GoDaddy
    # periodically re-issues this cert under a different intermediate CA
    # (e.g. "Starfield Secure Certificate Authority - G2" vs. "Go Daddy
    # Secure Certificate Authority - G2"), so the issuer check accepts any
    # of their known CA names rather than a single hardcoded one - pinning
    # instead on the certificate's expected Subject CN, which is what
    # actually protects against impersonation here.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $ftpHost = "$(ReleaseNotesFtpHost)"
        $ftpUser = "$(ReleaseNotesFtpUser)"
        $ftpPass = $env:ReleaseNotesFtpPassword
        $remoteFile = "release-notes.php"
        $localFile = Join-Path "$(Agent.BuildDirectory)" $remoteFile

        [System.Net.ServicePointManager]::ServerCertificateValidationCallback = {
          param($senderObj, $certificate, $chain, $sslPolicyErrors)
          if ($sslPolicyErrors -eq [System.Net.Security.SslPolicyErrors]::None) { return $true }

          $nameMismatch = [System.Net.Security.SslPolicyErrors]::RemoteCertificateNameMismatch
          # Bitwise check: allow ONLY the expected name-mismatch flag - any other
          # flag (chain errors, unavailable cert, etc.) combined with it must still fail.
          $onlyNameMismatch = ($sslPolicyErrors -band (-bnot $nameMismatch)) -eq 0
          if (-not $onlyNameMismatch) { return $false }

          $cert2 = [System.Security.Cryptography.X509Certificates.X509Certificate2]$certificate
          $now = Get-Date
          $expectedSubject = 'CN=*.prod.sxb1.secureserver.net'
          $knownIssuerPatterns = @('*Starfield*', '*Go Daddy*', '*GoDaddy*')
          $issuerMatches = $false
          foreach ($pattern in $knownIssuerPatterns) {
            if ($cert2.Issuer -like $pattern) { $issuerMatches = $true; break }
          }
          $isExpectedCert = ($cert2.Subject -eq $expectedSubject -and $issuerMatches -and $cert2.NotBefore -lt $now -and $cert2.NotAfter -gt $now)

          if (-not $isExpectedCert) {
            Write-Host "##[warning]FTPS certificate validation rejected an unexpected certificate. SslPolicyErrors=$sslPolicyErrors Subject=$($cert2.Subject) Issuer=$($cert2.Issuer) NotBefore=$($cert2.NotBefore) NotAfter=$($cert2.NotAfter)"
          }
          return $isExpectedCert
        }

        function Get-FtpFile([string]$remote, [string]$local) {
          $uri = "ftp://$ftpHost/$remote"
          $req = [System.Net.FtpWebRequest]::Create($uri)
          $req.Method = [System.Net.WebRequestMethods+Ftp]::DownloadFile
          $req.Credentials = New-Object System.Net.NetworkCredential($ftpUser, $ftpPass)
          # Explicit FTPS (AUTH TLS) - confirmed supported by the host.
          $req.EnableSsl = $true
          $req.UseBinary = $true
          $req.UsePassive = $true
          $resp = $req.GetResponse()
          $stream = $resp.GetResponseStream()
          $fileStream = [System.IO.File]::Create($local)
          $stream.CopyTo($fileStream)
          $fileStream.Close()
          $stream.Close()
          $resp.Close()
        }

        function Set-FtpFile([string]$local, [string]$remote) {
          $uri = "ftp://$ftpHost/$remote"
          $req = [System.Net.FtpWebRequest]::Create($uri)
          $req.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
          $req.Credentials = New-Object System.Net.NetworkCredential($ftpUser, $ftpPass)
          # Explicit FTPS (AUTH TLS) - confirmed supported by the host.
          $req.EnableSsl = $true
          $req.UseBinary = $true
          $req.UsePassive = $true
          $req.KeepAlive = $false
          $bytes = [System.IO.File]::ReadAllBytes($local)
          $req.ContentLength = $bytes.Length
          $stream = $req.GetRequestStream()
          $stream.Write($bytes, 0, $bytes.Length)
          $stream.Close()
          $resp = $req.GetResponse()
          $resp.Close()
        }

        Write-Host "Downloading current release-notes.php ..."
        Get-FtpFile $remoteFile $localFile

        # ReleaseNotesBullets is hardcoded to empty (no manual per-run input) -
        # Update-ReleaseNotes.ps1 falls back to a generic changelog-link bullet.
        $bullets = @()

        & "$(Build.SourcesDirectory)\Dev\.azure\Update-ReleaseNotes.ps1" `
          -Path $localFile `
          -NewVersion "$(ReleaseVersion)" `
          -NotesBullets $bullets `
          -EngineZipUrl "$(EngineZipUrl)" `
          -ScriptsZipUrl "$(ScriptsZipUrl)" `
          -QueueWorkerZipUrl "$(QueueWorkerZipUrl)"

        Write-Host "Uploading updated release-notes.php ..."
        Set-FtpFile $localFile $remoteFile
      displayName: 'Archive previous release and publish new version on warewolf.io'
      env:
        ReleaseNotesFtpPassword: $(ReleaseNotesFtpPassword)
