trigger: none
name: $(Date:yyyyMMdd).$(Rev:r)
variables:
  # The Warewolf Lightweight Execution Engine (Linux x64 Azure Functions package) the CD pipeline deploys.
  WarewolfEngineVersion: '3.0.3.8'
  # Where the engine finds its AES key (the DevOps Key Vault, Jira AD-2463); token of
  # Engine\executionengine.settings.json.txt.
  ProfilerEngineKeyVaultName: 'Dev2AzureDevopsKeyVault'
  ProfilerEngineKeyVaultSecretName: 'ProfilerEngineEncryptionKey'
  # Not read by the build: Engine\ProfilerEngineConcurrency.json.txt now holds only the trigger concurrency
  # (read by Set-ProfilerEngineConcurrency.ps1), so these are kept only for the CD pipeline and the pipeline tests.
  ProfilerEnvironment: 'dev'
  ProfilerCdServicePrincipalName: 'dev-sp-devops'
  # No APIM instance exists yet: set to 'true' (with real APIMServiceName/APIMResourceGroup/ProfilerAzureFunctionURL
  # vault secrets) to import Swagger.json into API Management.
  ProfilerImportToApim: 'false'
jobs:
- job: ProfilerMS
  displayName: ProfilerMS Pipeline
  pool:
    vmImage: windows-2022
  steps:
  - checkout: self
    clean: true
  - task: AzureKeyVault@2
    displayName: 'Azure Key Vault: Dev2AzureDevopsKeyVault'
    inputs:
      ConnectedServiceName: 'dev-sp-devops'
      KeyVaultName: Dev2AzureDevopsKeyVault
      RunAsPreJob: true

  - task: MSBuild@1
    displayName: Build SQL
    inputs:
      solution: Dev/Unlimited.ProfilerServices/Database/Warewolf.ProfilerDB.sln

  - task: replacetokens@5
    displayName: Replace tokens in **/*.json
    inputs:
      rootDirectory: Dev/Unlimited.ProfilerServices/Warewolf.ProfilerServices/Sources
      targetFiles: '**/*.json'
      tokenPattern: octopus
      actionOnMissing: fail
      keepToken: true
      actionOnNoFiles: fail
      
  - task: replacetokens@5
    displayName: Replace tokens in **/*.bite
    inputs:
      rootDirectory: Dev/Unlimited.ProfilerServices/Warewolf.ProfilerServices/Sources
      targetFiles: '**/*.bite'
      tokenPattern: octopus
      actionOnMissing: fail
      keepToken: true
      actionOnNoFiles: fail
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - task: replacetokens@5
    displayName: Replace tokens in **/*.txt
    inputs:
      rootDirectory: Dev/Unlimited.ProfilerServices/Warewolf.ProfilerServices/Triggers
      targetFiles: '**/*.txt'
      tokenPattern: octopus
      actionOnMissing: fail
      keepToken: true
      actionOnNoFiles: fail
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))  

  # The secret-bearing parts of the engine package (engine and Service Bus trigger settings, infrastructure config)
  # and the WFAES key that encrypts its sources (EngineEncryptionKey.txt, removed again before 'drop' is copied),
  # as templates in the Engine folder. The engine package steps read them.
  - task: replacetokens@5
    displayName: Replace tokens in Engine **/*.txt
    inputs:
      rootDirectory: Dev/Unlimited.ProfilerServices/Warewolf.ProfilerServices/Engine
      targetFiles: '**/*.txt'
      tokenPattern: octopus
      actionOnMissing: fail
      keepToken: true
      actionOnNoFiles: fail
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - task: PowerShell@2
    displayName: Create Engine **/*.bite and **/*.json from their .txt templates
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $files = @(Get-ChildItem -LiteralPath '$(Build.SourcesDirectory)/Dev/Unlimited.ProfilerServices/Warewolf.ProfilerServices/Engine' -Recurse -File -Filter '*.bite.txt')
        if (-not $files) { throw 'No *.bite.txt templates found in the Engine folder.' }
        foreach ($f in $files) {
          Move-Item -LiteralPath $f.FullName -Destination ($f.FullName -replace '\.txt$', '') -Force
          Write-Host "Created $($f.Name -replace '\.txt$', '')"
        }
        $settings = @(Get-ChildItem -LiteralPath '$(Build.SourcesDirectory)/Dev/Unlimited.ProfilerServices/Warewolf.ProfilerServices/Engine' -Recurse -File -Filter '*.json.txt')
        if (-not $settings) { throw 'No *.json.txt templates found in the Engine folder.' }
        foreach ($f in $settings) {
          Move-Item -LiteralPath $f.FullName -Destination ($f.FullName -replace '\.txt$', '') -Force
          Write-Host "Created $($f.Name -replace '\.txt$', '')"
        }
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - task: DotNetCoreCLI@2
    displayName: 'Restore .NET projects'
    inputs:
      command: 'restore'
      projects: 'Dev/Unlimited.ProfilerServices/AzureFunctions.ProfilerServices/AzureFunctions.ProfilerServices.sln'

  - task: DotNetCoreCLI@2
    displayName: Publish Azure Functions
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: 'Dev/Unlimited.ProfilerServices/AzureFunctions.ProfilerServices/AzureFunctions.ProfilerServices.csproj'
      arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish'
      zipAfterPublish: true

  # ── Generate OpenAPI (Swagger.json) from the running Function host ────────────
  - task: PowerShell@2
    displayName: 'Swagger: Generate Swagger.json'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'

        $projectPath = 'Dev/Unlimited.ProfilerServices/AzureFunctions.ProfilerServices/AzureFunctions.ProfilerServices.csproj'
        $pubDir      = Join-Path '$(Agent.TempDirectory)' 'openapi-publish'
        $swaggerOut  = Join-Path '$(Build.ArtifactStagingDirectory)' 'Swagger.json'
        $swaggerUrl  = 'http://localhost:7071/api/openapi/v3.json'

        # Dedicated unzipped publish so the Function host can be launched in-place
        dotnet publish $projectPath --configuration Release --output $pubDir

        # Ensure Azure Functions Core Tools is available on the agent
        if (-not (Get-Command func -ErrorAction SilentlyContinue)) {
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
            throw "Neither 'func' (Azure Functions Core Tools) nor 'npm' is available on this agent. Install Azure Functions Core Tools v4 on the 'Default' agent, or add Node.js (npm) so it can be installed automatically."
          }
          npm install -g azure-functions-core-tools@4 --unsafe-perm true
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Azure Functions Core Tools via npm (exit code $LASTEXITCODE)." }
        }

        # Start the host in OpenAPI-generation mode (skips Elasticsearch sink) with anonymous doc endpoints
        $env:OPENAPI_GEN                  = 'true'
        $env:OpenApi__AuthLevel__Document = 'Anonymous'
        $env:OpenApi__AuthLevel__UI       = 'Anonymous'

        # CRITICAL: 'dotnet publish' does NOT copy local.settings.json to the publish output,
        # so FUNCTIONS_WORKER_RUNTIME is absent there. Without it, 'func host start' drops into
        # an interactive "select a worker runtime" prompt that hangs forever on a headless build
        # agent, the host never starts, and the OpenAPI fetch times out. Setting it explicitly
        # (and AzureWebJobsStorage for the no-storage scenario) keeps the host fully non-interactive.
        $env:FUNCTIONS_WORKER_RUNTIME = 'dotnet-isolated'
        if (-not $env:AzureWebJobsStorage) { $env:AzureWebJobsStorage = 'UseDevelopmentStorage=true' }

        $hostLog = Join-Path '$(Agent.TempDirectory)' 'func-host.log'
        if (Test-Path $hostLog) { Remove-Item $hostLog -Force }

        Push-Location $pubDir
        # '--no-build' avoids re-invoking the SDK (which can also prompt); redirect output so we can
        # diagnose any startup failure instead of guessing.
        # npm installs 'func' as an extensionless shell shim that Start-Process cannot launch (not a valid Win32 app); go through cmd.exe to run func.cmd/func.exe.
        $proc = Start-Process cmd `
          -ArgumentList '/c func host start --port 7071 --no-build' `
          -PassThru -NoNewWindow `
          -RedirectStandardOutput $hostLog `
          -RedirectStandardError "$hostLog.err"
        Pop-Location

        $ready = $false
        foreach ($i in 1..30) {
          # Bail out early if the host process died (e.g. bad config) instead of waiting the full timeout
          if ($proc.HasExited) { break }
          try {
            Invoke-WebRequest -Uri $swaggerUrl -OutFile $swaggerOut -UseBasicParsing -TimeoutSec 3
            $ready = $true
            break
          } catch {
            Start-Sleep -Seconds 2
          }
        }

        # Always stop the host and any spawned worker processes
        if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
        Get-Process func -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

        if (-not $ready) {
          Write-Host '----- func host start output (stdout) -----'
          if (Test-Path $hostLog)        { Get-Content $hostLog        | Write-Host }
          Write-Host '----- func host start output (stderr) -----'
          if (Test-Path "$hostLog.err")  { Get-Content "$hostLog.err"  | Write-Host }
          throw "Failed to retrieve OpenAPI document from $swaggerUrl"
        }
        Write-Host "Swagger.json generated at $swaggerOut"

  # ── Import Swagger.json into Azure API Management ────────────────────────────
  - task: AzureCLI@2
    displayName: 'Swagger: Import API to APIM'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['ProfilerImportToApim'], 'true'))
    inputs:
      azureSubscription: 'dev-sp-devops'
      scriptType: ps
      scriptLocation: inlineScript
      inlineScript: |
        az apim api import `
          --resource-group "$(APIMResourceGroup)" `
          --service-url "$(ProfilerAzureFunctionURL)" `
          --service-name "$(APIMServiceName)" `
          --api-id "profilerlwdev-timer-function" `
          --path "/profilerlwservice/api" `
          --display-name "Profiler API (Lightweight)" `
          --specification-format OpenApiJson `
          --specification-path "$(Build.ArtifactStagingDirectory)\Swagger.json" `
          --subscription-required false

  # ── Warewolf Lightweight Execution Engine ───────────────────────────────────
  # Builds the deployable engine package here, so the CD pipeline only has to deploy it, the way the Dockerfile
  # builds the Warewolf Server image: the pinned engine package with the profiler's token-replaced files copied
  # in, every source WFAES-encrypted. It is published as the 'ProfilerEngine' artifact (profiler-engine.zip).
  - task: PowerShell@2
    displayName: 'Download Warewolf Lightweight Execution Engine'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $expectedHost = 'stwwreleases.blob.core.windows.net'
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $ProgressPreference = 'SilentlyContinue'
        Add-Type -AssemblyName System.IO.Compression.FileSystem

        function Get-Package([string] $Url, [string] $OutDir, [string] $RequiredEntry) {
          # The URLs are built from pipeline variables, so check they still point at the Warewolf releases storage.
          $parsed = $null
          if (-not [uri]::TryCreate($Url, [UriKind]::Absolute, [ref]$parsed) -or $parsed.Scheme -ne 'https' -or $parsed.Host -ne $expectedHost) {
            throw "Refusing to fetch '$Url' (expected https://$expectedHost/...)."
          }
          if (Test-Path $OutDir) { Remove-Item $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          $outFile = Join-Path $OutDir ([IO.Path]::GetFileName($parsed.AbsolutePath))
          foreach ($attempt in 1..3) {
            try {
              Invoke-WebRequest -Uri $parsed.AbsoluteUri -OutFile $outFile -UseBasicParsing -TimeoutSec 600
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Host "##[warning]Attempt $attempt/3 failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if ((Get-Item $outFile).Length -le 0) { throw "Downloaded package is empty: $Url" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($outFile)
          try {
            if (-not ($zip.Entries | Where-Object { $_.Name -eq $RequiredEntry })) { throw "$RequiredEntry not found in $outFile." }
          } finally { $zip.Dispose() }
          Write-Host "Downloaded $Url ($([math]::Round((Get-Item $outFile).Length / 1MB, 1)) MB)."
        }

        # The packaging step reads host.json from the root of the engine package, so a package without it is
        # not what it should be.
        # Only the CD pipeline uses the engine package. A failed download must not fail this build, which the
        # VM-era releases (ProfilerServices-CD-*-VM) and the Helm releases also consume, so it is a warning
        # and the package is simply not built or published.
        try {
          Get-Package ('https://' + $expectedHost + '/releases/AzureFunctionsPackage-linux-x64-$(WarewolfEngineVersion).zip') (Join-Path '$(Agent.TempDirectory)' 'WarewolfEngine') 'host.json'

          Write-Host '##vso[task.setvariable variable=WarewolfEngineDownloaded]true'
        } catch {
          Write-Host "##vso[task.logissue type=warning]The Warewolf engine package was not downloaded, so the CD pipeline cannot deploy this build: $($_.Exception.Message)"
        }

  # secure.config and the license are git-ignored in this repo (they are never committed), so they come
  # from the Library and are placed in the Engine folder, where the Unlimited repo keeps them.
  - task: DownloadSecureFile@1
    name: profilerSecureConfig
    displayName: 'Download Profiler secure.config'
    inputs:
      secureFile: 'Profiler Services secure.config'

  - task: DownloadSecureFile@1
    name: warewolfLicense
    displayName: 'Download Warewolf License.secureconfig'
    inputs:
      secureFile: 'Profiler Services Warewolf License.secureconfig'

  - task: PowerShell@2
    displayName: 'Place secure.config and the license in the Engine folder'
    inputs:
      pwsh: true
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $engine = '$(Build.SourcesDirectory)\Dev\Unlimited.ProfilerServices\Warewolf.ProfilerServices\Engine'
        Copy-Item -LiteralPath '$(profilerSecureConfig.secureFilePath)' -Destination "$engine\secure.config" -Force
        Copy-Item -LiteralPath '$(warewolfLicense.secureFilePath)' -Destination "$engine\Warewolf License.secureconfig" -Force

  # Where the engine reads each file, as the Dockerfile's ADDs place them for the Warewolf Server:
  #   Resources\  Profiler\* (without the design-time Scenarios folders) and Sources\*.bite
  #   Settings\   Engine\executionengine.settings.json and servicebustrigger.bite, and
  #               Sources\ProfilerLoggingESSource.bite as ElasticsearchLoggingSource.bite
  #   \           Engine\secure.config and Engine\Warewolf License.secureconfig
  # There is no workflow-index.json: the engine indexes Resources\ itself at cold start. There are no persistence
  # settings either: persistence (Hangfire) is off, and no profiler workflow suspends or resumes.
  - task: ExtractFiles@1
    displayName: 'Extract the Warewolf engine package'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['WarewolfEngineDownloaded'], 'true'))
    inputs:
      archiveFilePatterns: '$(Agent.TempDirectory)\WarewolfEngine\*.zip'
      destinationFolder: '$(Agent.TempDirectory)\ProfilerEngineStage'
      cleanDestinationFolder: true
      overwriteExistingFiles: true

  - task: PowerShell@2
    displayName: 'Add the profiler workflows, sources and settings'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['WarewolfEngineDownloaded'], 'true'))
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $src   = '$(Build.SourcesDirectory)\Dev\Unlimited.ProfilerServices\Warewolf.ProfilerServices'
        $stage = '$(Agent.TempDirectory)\ProfilerEngineStage'
        New-Item -ItemType Directory -Force -Path "$stage\Resources", "$stage\Settings" | Out-Null
        Copy-Item -Path "$src\Profiler\*" -Destination "$stage\Resources" -Recurse -Force
        foreach ($dir in @(Get-ChildItem -LiteralPath "$stage\Resources" -Recurse -Directory -Filter 'Scenarios')) {
          if (Test-Path -LiteralPath $dir.FullName) { Remove-Item -LiteralPath $dir.FullName -Recurse -Force }
        }
        Copy-Item -Path "$src\Sources\*.bite" -Destination "$stage\Resources" -Force
        Copy-Item -LiteralPath "$src\Engine\secure.config", "$src\Engine\Warewolf License.secureconfig" -Destination $stage -Force
        Copy-Item -LiteralPath "$src\Engine\executionengine.settings.json", "$src\Engine\servicebustrigger.bite" -Destination "$stage\Settings" -Force
        Copy-Item -LiteralPath "$src\Sources\ProfilerLoggingESSource.bite" -Destination "$stage\Settings\ElasticsearchLoggingSource.bite" -Force

  # Engine\EngineEncryptionKey.txt holds the WFAES key (Dev2AzureDevopsKeyVault secret ProfilerEngineEncryptionKey),
  # put there by 'Replace tokens in Engine **/*.txt'. Encrypt-Resources.ps1 encrypts every source's
  # ConnectionString with it, so the published package holds no plain-text connection strings.
  # Set-ProfilerEngineConcurrency.ps1 applies ProfilerEngineConcurrency.json's trigger concurrency to host.json and
  # Settings\executionengine.settings.json.
  - task: PowerShell@2
    displayName: 'Encrypt the sources and apply the trigger concurrency'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['WarewolfEngineDownloaded'], 'true'))
    inputs:
      pwsh: true
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $scripts = '$(Build.SourcesDirectory)\Dev\Unlimited.ProfilerServices\SolutionItems\Scripts'
        $engine  = '$(Build.SourcesDirectory)\Dev\Unlimited.ProfilerServices\Warewolf.ProfilerServices\Engine'
        $stage   = '$(Agent.TempDirectory)\ProfilerEngineStage'
        $encryptScript = Join-Path '$(Build.SourcesDirectory)' 'Dev\Warewolf.Execution.Lightweight\Scripts\Encrypt-Resources.ps1'
        $keyMaterial = (Get-Content -LiteralPath "$engine\EngineEncryptionKey.txt" -Raw).Trim()
        $encrypted = 0
        foreach ($dir in 'Resources', 'Settings') {
          # In place and all-or-nothing; the key reaches the script as a parameter.
          $r = & $encryptScript -KVSecret $keyMaterial -SourceDirectory "$stage\$dir" -OutputDirectory "$stage\$dir"
          $encrypted += $r.SourcesEncrypted + $r.AlreadyEncrypted
        }
        if ($encrypted -lt 1) { throw 'No source ConnectionString was encrypted.' }
        & "$scripts\Set-ProfilerEngineConcurrency.ps1" -PackageRoot $stage -ConfigPath "$engine\ProfilerEngineConcurrency.json"

  - task: ArchiveFiles@2
    displayName: 'Zip the profiler engine package'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['WarewolfEngineDownloaded'], 'true'))
    inputs:
      rootFolderOrFile: '$(Agent.TempDirectory)\ProfilerEngineStage'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(Agent.TempDirectory)\ProfilerEngine\profiler-engine.zip'
      replaceExistingArchive: true

  # The key must not reach 'drop' (a copy of the sources folder), whether or not the package was built.
  - task: PowerShell@2
    displayName: 'Remove the WFAES key file'
    condition: always()
    inputs:
      targetType: inline
      script: |
        Remove-Item -LiteralPath '$(Build.SourcesDirectory)\Dev\Unlimited.ProfilerServices\Warewolf.ProfilerServices\Engine\EngineEncryptionKey.txt' -Force -ErrorAction SilentlyContinue

  - task: PublishPipelineArtifact@1
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['WarewolfEngineDownloaded'], 'true'))
    displayName: 'Publish Artifact: ProfilerEngine'
    inputs:
      targetPath: $(Agent.TempDirectory)\ProfilerEngine
      artifact: ProfilerEngine

  - task: CopyFiles@2
    displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: '**'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      CleanTargetFolder: false

  - task: PublishPipelineArtifact@1
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    displayName: 'Publish Artifact: drop'
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifact: drop
...
