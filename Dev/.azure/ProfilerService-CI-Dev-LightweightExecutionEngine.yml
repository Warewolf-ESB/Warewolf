# Profiler DEV CI - Warewolf Lightweight Execution Engine + RabbitMQ QueueProcessor (Azure Container Apps + KEDA).
#
# SIBLING OF Dev/.azure/ProfilerService-CI-UAT-LightweightExecutionEngine.yml. The two files deploy
# THE SAME ENGINE APP (wwprofilerlw, DEV2) with identical engine settings; they differ only in HOW
# messages reach it:
#
#   UAT file : RabbitMQ -> Shovel -> Azure Service Bus -> the engine's own ServiceBusTrigger
#   THIS file: RabbitMQ (CloudAMQP) -> Warewolf.Execution.QueueProcessor on ACA (KEDA 0..N)
#              -> HTTPS POST /Secure/{workflow} on the engine
#
# Everything from "download the release" through the engine deploy, the HTTP smoke test and the
# sink checks is carried over unchanged from the UAT file, so a deploy from either file leaves the
# engine in the same state. Read that file's header for the release-zip rationale, the service
# connection caveats and the DEV2 resource choices; they all still apply here.
#
# ── TWO THINGS MUST BE TRUE BEFORE THE FIRST RUN (and one is done FOR you) ──────────────────
#
# 1. THE OLD SHOVEL IS GONE - AUTOMATIC. The shovel 'wwprofilerlw-shovel' and this file's worker
#    would feed the same engine and database through two competing paths, so 'Disable the legacy
#    ShovelBridge shovel' below DELETES it on every run (a no-op when it is already gone) and then
#    verifies it is no longer listed, failing the build if it is not. Re-running the UAT file -
#    which recreates the shovel - is therefore harmless to this one: the next run removes it again.
#    The delete is the same call as by hand:
#      DELETE https://rabbitmq.warewolf.online/api/parameters/shovel/%2f/wwprofilerlw-shovel
#    (the /api/parameters/shovel/{vhost}/{name} resource Configure-RabbitMqShovel.ps1 PUTs to create
#    it; /api/shovels/... is only the read-only status listing.)
#    The ASB namespace 'wwprofilerlwsb' is deliberately LEFT ALONE: idle, reversible, and the
#    engine's own ServiceBusTrigger still resolves its queue against it. Messages already sitting in
#    the shovel's source queue are not touched either - only the forwarding stops.
#
# 2. THE ENGINE HAS AN ENTRA APP. The worker calls ONLY /Secure/{workflow} (EngineWorkflowClient),
#    with a managed-identity token whose audience is api://<ProfilerEngineEntraAppId>. wwprofilerlw
#    was open-access on /public/* and had NO app registration, so /secure/* answered 401 to
#    everything. Registering one needs Application.Administrator, which the pipeline SP does not
#    hold, so it is a one-off admin step:
#      ./Scripts/Configure-WwExecutionAuth.ps1 -SubscriptionId <id> -TenantId <id> `
#          -ResourceGroupName DEV2 -FunctionAppName wwprofilerlw
#    then set ProfilerEngineEntraAppId in this file's variables block to the resulting appId (NOT
#    at queue time - the YAML value shadows it). DONE: 'wwprofilerlw-auth' (fd3359c7-...) exists
#    and is set below. That app defines no 'Warewolf_QueueProcessor' app role, so the deploy's
#    optional role grant is skipped with a note; the worker authenticates without it.
#    The Entra config lives in the app setting WAREWOLF_ENTRA_CONFIG, which an app RECREATE drops -
#    'Verify engine Entra config' below fails early with the repair command instead of letting
#    every message dead-letter on a 401.
#
# 3. KEY VAULT HOLDS THE CLOUDAMQP AMQP URI. KEDA's rabbitmq scaler (protocol=amqp) authenticates
#    with a Container App secret sourced from a Key Vault secret. Set ProfilerWorkerRabbitMqSecretUri
#    to that secret's URI. DONE: the existing https://wwexecutionengine.vault.azure.net/secrets/rabbitmq-uri
#    already holds exactly this URI and is set below.
#    The value is the full URI: amqp://bmkzdabu:<password>@ostrich-01.lmq.cloudamqp.com:5672/bmkzdabu
#
# ── WHAT IS DELIBERATELY DIFFERENT FROM THE UAT FILE ────────────────────────────────────────
#
# - The engine deploy still passes -ServiceBusTriggerQueueName / -ServiceBusTriggerWorkflowName and
#   the -ServiceBus* throughput flags, although nothing feeds that trigger any more. The engine
#   package always contains the ServiceBusTrigger function, and its '%WAREWOLF_SERVICEBUS_TRIGGER_QUEUE%'
#   binding fails to INDEX when that app setting is absent (Deploy-WwExecutionEngine.ps1, "QueueName
#   MUST also be a real app setting"). Keeping the arguments identical also stops the flags from
#   reverting silently, which the UAT file warns about. Cost: the trigger listens on an empty queue.
# - The queue trigger's Concurrency is 20 (Dev/.azure/ProfilerDev.trigger.bite), so maxReplicas = 20
#   and the worker can issue up to 20 concurrent engine calls; the engine's own ceiling is
#   -FlexMaximumInstanceCount 30. The database, not the engine, is the real limit (see the UAT file's
#   throughput note): if a burst produces SQL command timeouts, lower Concurrency in the trigger.
# - KEDA runs against CloudAMQP, which is LavinMQ. The scaler's amqp protocol only needs a passive
#   queue declare, which LavinMQ supports, but this combination had not been exercised when this
#   file was written. Treat the first burst as the calibration run.
#
# AGENT: Microsoft-hosted 'windows-2022', as the UAT file. The worker image is built server-side by
# `az acr build`, so no Docker daemon is needed on the agent even though the image is Linux.

trigger: none

pool:
  vmImage: 'windows-2022'

variables:
  # ── DEV2 TARGET (differs from the source file - see header) ────────────────────────────
  # The source file's own header comment (its lines 62-70) notes an already hand-deployed spike
  # app 'wwprofilerlw' living in "the Warewolf DEV2 subscription" from prior manual testing - this
  # reuses that exact app/storage-account pair rather than provisioning new ones.
  ProfilerEngineAppName: 'wwprofilerlw'
  ProfilerEngineStorageAccount: 'wwprofilerlwsa'
  ProfilerEngineResourceGroup: 'DEV2'
  ProfilerEngineLocation: 'southafricanorth'

  # Read at connection time by Dev/Dev2.Services.Sql/SqlConnectionWrapper.cs (line ~45): when true,
  # the SqlClient connection is opened with TrustServerCertificate. Microsoft.Data.SqlClient defaults
  # to Encrypt=true, so a SQL Server whose certificate this app does not trust otherwise fails with
  # 'certificate chain ... not trusted' - see docs/KB-Deploying-Encrypted-Sources.md. Azure SQL
  # presents a trusted certificate and does NOT need this; the profiler sources are WFAES-encrypted,
  # so which server they resolve to cannot be read from the repo, and the flag is set here to match
  # what the app carried before.
  #
  # DECLARED HERE because the deploy orchestrator does not manage it. Deploy-WwExecutionEngine.ps1
  # has no parameter for arbitrary App Settings, and the 'Back Up Engine App Settings' step above
  # backs settings up but never restores them - so this value survived only as a hand-set setting on
  # a long-lived app. It was lost on 2026-09-18 when wwprofilerlw had to be deleted and recreated
  # (its storage account had been deleted out from under it), which is exactly the fragility this
  # step removes. Set to 'false' at queue time to turn it off.
  ProfilerEngineSqlTrustServerCert: 'true'

  # Reuses the SAME Key Vault + AES-key secret pipeline-LOADTEST.yml's own Deploy_UAT stage
  # already uses for -EncryptResources on this subscription (see that file's 'Deploy via
  # Deployment Scripts' step) - not the source file's 'UATAzureDevopsKeyVault' /
  # 'ProfilerEngineEncryptionKey', which belong to The Unlimited's own Key Vault.
  ProfilerEngineKeyVaultName: 'WWExecutionEngine'
  ProfilerEngineKeyVaultSecretName: 'WWExecutionEngineTestSecret'

  # Service connection names are authorised at pipeline COMPILE time, before runtime $(...)
  # macros are substituted, so every reference below uses the compile-time template expression
  # ${{ variables.AzureServiceConnection }} - see this variable's own header-comment entry for
  # why this connection was chosen and what to verify before the first run.
  AzureServiceConnection: 'AzureStorage-WarewolfReleases'

  # Where the published Lightweight engine + deployment scripts come from - same storage account
  # the 'AzureStorage-WarewolfReleases' service connection above already uploads to (see
  # pipeline-CLOUD.yml's 'Upload zips to Azure Storage' step), with current URLs published on
  # warewolf.online/release-notes.php, which the resolve step below reads.
  #
  # Leave the two *ZipUrl variables EMPTY for normal runs: the engine then always tracks the
  # latest published release. Set them (queue-time variables, full https URLs) only to pin a
  # specific build for a rollback or a reproduction - see the source file's own comment on these
  # same variables for the WOLF-8512 incident this guards against. The engine zip is the
  # linux-x64 one (AzureFunctionsPackage-linux-x64-<ver>.zip, data-role="engine-linux-zip-link"):
  # wwprofilerlw is Flex Consumption, which is Linux-only - a win-x64 pin is rejected.
  WarewolfReleasesStorageAccount: 'stwwreleases'
  WarewolfEngineZipUrl: ''
  WarewolfScriptsZipUrl: ''

  # ── Post-deploy smoke test (workflow + queue sink) ─────────────────────────────────────
  # The workflow the post-deploy smoke test executes: ProfilerWrapper/RequestForProfiling, the
  # real production entry point, and the same workflow pipeline-LOADTEST.yml's own Load_Test job
  # drives (it switched to it on 2026-09-14, from ProfilerMain). Deliberately the same value as
  # ProfilerServiceBusTriggerWorkflowName below and as the WorkflowName in
  # Dev/.azure/ProfilerDev.trigger.bite (the latter is checked by 'Verify trigger file matches
  # pipeline variables'), but kept as its own variable so the HTTP smoke test can be pointed at a
  # different workflow without silently changing the others. Folder-qualified for the same reason.
  ProfilerSmokeWorkflowRoute: 'ProfilerServices/ProfilerWrapper/RequestForProfiling'

  # THE SINK. RequestForProfiling's trailing 'RabbitMQ Publish' activity publishes
  # [[ProfilerInstruction]] to this queue via RabbitMQSource 0b142714-8f6d-41b7-9832-2aefa8c731ec.
  # The queue name is baked into RequestForProfiling.bite; this must match it. No provisioning
  # step is needed - PublishRabbitMQActivity declares the queue if it is absent (see
  # Dev2.Activities/Activities/RabbitMQ/Publish/PublishRabbitMQActivity.cs).
  ProfilerSinkQueueName: 'collectionv2.profilerrecommendation.request'

  # ── The CloudAMQP broker: the RESULT sink AND (below) the worker's trigger queue ───────
  # Two different brokers exist in this rig and must never be conflated, exactly as
  # pipeline-LOADTEST.yml warns in its own ProfilerPublishRabbitMq* block:
  #   self-hosted 'rabbitmq.warewolf.online' (user 'testuser', secret ExternalRabbitMqPassword)
  #                             -> the LEGACY shovel's broker; here it is only used to delete that shovel.
  #   CloudAMQP (this block)    -> RequestForProfiling publishes its RESULT to the sink queue on it,
  #                                and the QueueProcessor consumes its trigger queue from it (a
  #                                DIFFERENT queue on the same instance, declared below).
  # Both queues share one instance/vhost/credential (secret CLOUDAMQP_SHOVEL_PASSWORD).
  # On CloudAMQP the username and the vhost are both the instance name ('bmkzdabu'). The AMQP
  # port is the plaintext 5672, not AMQPS 5671, because RabbitMQSource has no TLS option
  # (HostName/Port/UserName/Password/VirtualHost only - Dev2.Data/ServiceModel/RabbitMQSource.cs).
  # The instance runs LavinMQ since CloudAMQP migrated it silently; that does not affect a plain
  # AMQP 0-9-1 publish, only Shovel amqp10 destinations.
  ProfilerSinkRabbitMqHost: 'ostrich-01.lmq.cloudamqp.com'
  ProfilerSinkRabbitMqPort: '5672'
  ProfilerSinkRabbitMqUsername: 'bmkzdabu'
  ProfilerSinkRabbitMqVirtualHost: 'bmkzdabu'
  # The management API the smoke test reads the queue over - HTTPS on the same host, port 443.
  # Separate from the AMQP endpoint above: one is for publishing, one for inspecting.
  ProfilerSinkRabbitMqManagementUri: 'https://ostrich-01.lmq.cloudamqp.com'

  # ── Legacy ShovelBridge (DELETED by this file, never created) ───────────────────────────
  # These name the objects the UAT file creates. This file needs them for exactly one thing: finding
  # and deleting the shovel, because a live shovel and this file's worker would both feed the same
  # engine. The management calls go to ProfilerRabbitMqManagementUri over https.
  ProfilerShovelName: 'wwprofilerlw-shovel'
  ProfilerRabbitMqManagementUri: 'https://rabbitmq.warewolf.online'
  ProfilerRabbitMqUsername: 'testuser'
  ProfilerRabbitMqVirtualHost: '/'

  # ── Engine's own (now idle) ServiceBusTrigger - still configured, see the header ────────
  # Passed to Deploy-WwExecutionEngine.ps1 UNCHANGED from the UAT file. The engine package always
  # contains the ServiceBusTrigger function and its '%WAREWOLF_SERVICEBUS_TRIGGER_QUEUE%' binding
  # only indexes when that app setting exists, so dropping these arguments would be a config change
  # to the shared app, not a no-op. WorkflowName is folder-qualified because
  # WorkflowIndex.Resolve() keys entries by their full relative path under Resources/. Nothing
  # produces messages for this queue any more (the shovel is deleted), so it is simply idle.
  ProfilerServiceBusTriggerQueueName: 'wwprofilerlw-trigger-queue'
  ProfilerServiceBusTriggerWorkflowName: 'ProfilerServices/ProfilerWrapper/RequestForProfiling'

  # ── QueueProcessor (RabbitMQ -> ACA worker -> engine /Secure/{workflow}) ─────────────────
  # The trigger queue lives on CLOUDAMQP, the same instance as the sink above, because the ACA
  # worker needs an AMQP endpoint reachable from Azure and the self-hosted broker publishes only 443.
  # The names MUST match Dev/.azure/ProfilerDev.trigger.bite (QueueName / DeadLetterQueue); the
  # 'Verify trigger file matches pipeline variables' step fails the build if they drift.
  ProfilerWorkerQueueName: 'wwprofilerlw.queueprocessor.trigger.request'
  ProfilerWorkerDeadLetterQueueName: 'wwprofilerlw.queueprocessor.trigger.request-errors'

  # Same ACA environment + registry the live QueueProcessor tests in pipeline-CLOUD.yml and
  # pipeline-LOADTEST.yml already deploy to. A fixed, dedicated prefix keeps this rig's Container App
  # (wwqp-profilerdev-<trigger>) from ever colliding with theirs; it is redeployed every run so a
  # stale image cannot keep serving.
  ProfilerAcaEnvironment: 'aca-warewolf'
  ProfilerAcrName: 'acrwarewolf'
  ProfilerWorkerAppNamePrefix: 'wwqp-profilerdev-'

  # Neither value is a secret, so both live HERE. Do not move them to the pipeline UI or queue
  # time: a variable declared in this YAML block takes precedence over a UI/queue-time value of the
  # same name, so an empty '' here silently shadowed any value set there (build 30835). The
  # pre-flight step still fails with the exact remediation if either is blanked.
  #   ProfilerEngineEntraAppId          appId of 'wwprofilerlw-auth', the Entra app registered for
  #                                     wwprofilerlw (header, item 2); must equal the audience in the
  #                                     engine's WAREWOLF_ENTRA_CONFIG app setting
  #   ProfilerWorkerRabbitMqSecretUri   Key Vault secret holding the CloudAMQP AMQP URI (header, item 3)
  ProfilerEngineEntraAppId: 'fd3359c7-13e1-4a6e-8ab2-2fe6c56df1f7'
  ProfilerWorkerRabbitMqSecretUri: 'https://wwexecutionengine.vault.azure.net/secrets/rabbitmq-uri'

  # Where the published QueueProcessor comes from: data-role="queueworker-zip-link" on
  # warewolf.online/release-notes.php (Dev/.azure/Update-ReleaseNotes.ps1), same trust rules as the
  # engine zip. Leave empty to track the latest release; pin (https URL) to reproduce a build.
  WarewolfQueueWorkerZipUrl: ''

  # Burst sizing. The sink queue is capped at 20000 messages by CloudAMQP policy and the worker's
  # concurrency is 20, so 200 messages exercise scale-out without filling the sink. Raise at queue
  # time for a load run; every message is reconciled individually, so cost grows with it.
  ProfilerBurstMessageCount: '200'
  ProfilerDrainQuietSeconds: '120'
  ProfilerDrainTimeoutSeconds: '2400'

  # Application Insights component of the ENGINE, so the run report can join engine-side log lines
  # to each worker delivery. Empty = worker-side reconciliation only (the report still proves every
  # message was acked or dead-lettered, but not what the engine did with it). Not verified against
  # the live resource name - set it once it is known.
  ProfilerEngineAppInsightsName: ''

jobs:
- job: ProfilerMS
  displayName: ProfilerMS Lightweight Engine + QueueProcessor Pipeline (DEV2 Dev)
  steps:
  - checkout: self
    clean: true

  # ── Fail-fast pre-flight (no Azure access needed) ────────────────────────────────────────
  # Everything here is a static check on values the pipeline already holds. It runs FIRST so a
  # missing prerequisite costs seconds, not the 10+ minutes of an engine deploy that a later step
  # would have failed after. Each message names the exact remediation.
  #
  # Pipeline variables that are not defined are NOT expanded by Azure DevOps: '$(Name)' arrives
  # verbatim. Every "is it set" test below therefore also rejects a value that still looks like a
  # macro - an unset secret must never be mistaken for a real one.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $problems = New-Object System.Collections.Generic.List[string]

      function Test-Unset([string] $Value) {
        return [string]::IsNullOrWhiteSpace($Value) -or $Value -match '^\$\('
      }

      # ProfilerEngineEntraAppId: the audience the worker's managed identity mints its token for.
      $appId = '$(ProfilerEngineEntraAppId)'
      if ((Test-Unset $appId) -or $appId -notmatch '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$') {
        $problems.Add("ProfilerEngineEntraAppId is not a GUID ('$appId'). Register the Entra app for wwprofilerlw (see this file's header, item 2) and set this variable to its appId.")
      }

      # ProfilerWorkerRabbitMqSecretUri: the Key Vault secret KEDA authenticates to the broker with.
      $secretUri = '$(ProfilerWorkerRabbitMqSecretUri)'
      if ((Test-Unset $secretUri) -or $secretUri -notmatch '^https://[^/]+\.vault\.azure\.net/secrets/[^/]+') {
        $problems.Add("ProfilerWorkerRabbitMqSecretUri is not a Key Vault secret URI ('$secretUri'). Store the CloudAMQP AMQP URI as a Key Vault secret and set this variable to its URI (see this file's header, item 3). Without it the KEDA rule has no broker auth and the worker never scales out of zero.")
      }

      # Secret pipeline variables. The names are checked, never the values echoed.
      $secrets = [ordered]@{
        CLOUDAMQP_SHOVEL_PASSWORD = $env:CloudAmqpPasswordValue
        ExternalRabbitMqPassword  = $env:ExternalRabbitMqPasswordValue
        AzureClientId             = $env:AzureClientIdValue
        AzureClientSecret         = $env:AzureClientSecretValue
        AzureTenantId             = $env:AzureTenantIdValue
      }
      foreach ($name in $secrets.Keys) {
        if (Test-Unset ([string]$secrets[$name])) {
          $problems.Add("Secret pipeline variable '$name' is not set on this pipeline definition.")
        }
      }

      if ($problems.Count -gt 0) {
        foreach ($p in $problems) { Write-Host "##[error]$p" }
        throw "$($problems.Count) prerequisite(s) missing - nothing has been deployed."
      }
      Write-Host 'Prerequisites present: Entra app id, Key Vault secret URI, and all five secret variables.'
    displayName: 'Validate Dev QueueProcessor prerequisites'
    env:
      CloudAmqpPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)
      ExternalRabbitMqPasswordValue: $(ExternalRabbitMqPassword)
      # The QueueProcessor deploy (Container Apps, ACR, role assignments) is run under a raw service
      # principal login, exactly as pipeline-LOADTEST.yml and pipeline-CLOUD.yml run it, rather than
      # under the AzureCLI@2 service connection the engine steps use: Deploy-WwQueueProcessor.ps1
      # grants AcrPull and 'Key Vault Secrets User' to each new app identity, which needs
      # Microsoft.Authorization/roleAssignments/write - and that connection holds only a
      # condition-constrained grant for the Service Bus Data Receiver role.
      AzureClientIdValue: $(AzureClientId)
      AzureClientSecretValue: $(AzureClientSecret)
      AzureTenantIdValue: $(AzureTenantId)

  # The trigger file is what Deploy-WwQueueProcessor.ps1 bakes into the image, so it - not this
  # file's variables - decides which queue the worker consumes and how far it scales. The
  # variables above are only used to DECLARE the queue and to read it back, so a mismatch does
  # not fail loudly: the worker would consume an empty queue while the burst fills another, and
  # the run would end as "no deliveries". Compare them here, before anything is created.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $path = '$(Build.SourcesDirectory)\Dev\.azure\ProfilerDev.trigger.bite'
      $trigger = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
      $problems = New-Object System.Collections.Generic.List[string]

      if ($trigger.QueueName       -ne '$(ProfilerWorkerQueueName)')           { $problems.Add("QueueName is '$($trigger.QueueName)', pipeline variable ProfilerWorkerQueueName is '$(ProfilerWorkerQueueName)'.") }
      if ($trigger.DeadLetterQueue -ne '$(ProfilerWorkerDeadLetterQueueName)') { $problems.Add("DeadLetterQueue is '$($trigger.DeadLetterQueue)', pipeline variable ProfilerWorkerDeadLetterQueueName is '$(ProfilerWorkerDeadLetterQueueName)'.") }
      # The generated CloudAMQP source ('Generate RequestForProfiling CloudAMQP publish source').
      if ($trigger.QueueSourceId   -ne '0b142714-8f6d-41b7-9832-2aefa8c731ec') { $problems.Add("QueueSourceId is '$($trigger.QueueSourceId)', expected the generated CloudAMQP source 0b142714-8f6d-41b7-9832-2aefa8c731ec.") }
      if ($trigger.QueueSinkId     -ne $trigger.QueueSourceId)                 { $problems.Add("QueueSinkId '$($trigger.QueueSinkId)' differs from QueueSourceId - the dead-letter queue must live on the same broker.") }
      if ([int]$trigger.Concurrency -lt 1)                                     { $problems.Add("Concurrency is $($trigger.Concurrency); 0 disables the worker (min = max = 0 replicas).") }
      if ($trigger.WorkflowName.Replace('\', '/') -ne '$(ProfilerSmokeWorkflowRoute)') { $problems.Add("WorkflowName is '$($trigger.WorkflowName)', the smoke workflow is '$(ProfilerSmokeWorkflowRoute)'.") }
      if ((Get-Content -LiteralPath $path -Raw) -match '#\{') { $problems.Add('The trigger still contains an unsubstituted #{...} release token.') }

      if ($problems.Count -gt 0) {
        foreach ($p in $problems) { Write-Host "##[error]$p" }
        throw "ProfilerDev.trigger.bite does not match this pipeline ($($problems.Count) problem(s))."
      }
      Write-Host "Trigger '$($trigger.Name)': queue '$($trigger.QueueName)', concurrency $($trigger.Concurrency) (=> up to $($trigger.Concurrency) replicas), workflow '$($trigger.WorkflowName)'."
    displayName: 'Verify trigger file matches pipeline variables'

  # THE LEGACY BRIDGE MUST BE OFF, AND THIS STEP TURNS IT OFF. The UAT file's shovel forwards a
  # self-hosted-broker queue into Azure Service Bus and thence into this SAME engine app; this
  # file's worker feeds the engine over HTTP from a different queue. Both live at once means two
  # independent paths into one database whose ceiling is already the limiting factor, and every
  # count in this run becomes ambiguous.
  #
  # NOTE THIS STEP WRITES to the shared self-hosted broker: it removes one dynamic shovel (the
  # runtime parameter, so the broker also forgets it across restarts). It touches only the shovel
  # named by ProfilerShovelName - no queue, exchange, binding or message is deleted.
  #
  # Looked up by NAME in the vhost's shovel list first, so the delete is only issued for a shovel
  # that is really there, and a 404 on the delete is read as "already gone" (someone else removed
  # it between the list and the delete) rather than as a failure. The list call itself must
  # succeed: an unreachable broker or a bad credential fails the build here, loudly, instead of
  # being mistaken for "no shovel".
  #
  # It then RE-LISTS and fails the build if the shovel is still there. A delete that returns
  # success but leaves the shovel running is exactly the state this step exists to rule out, and
  # 'starting' shovels retry forever - so the wait is polled, not a single read.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $mgmtUri  = '$(ProfilerRabbitMqManagementUri)'
      $vhost    = '$(ProfilerRabbitMqVirtualHost)'
      $shovel   = '$(ProfilerShovelName)'
      $pair     = "$(ProfilerRabbitMqUsername):$env:RabbitMqPasswordValue"
      $headers  = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
      $vhostEnc = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }

      function Get-LegacyShovel {
        $all = @(Invoke-RestMethod -Uri "$mgmtUri/api/shovels/$vhostEnc" -Headers $headers -TimeoutSec 30)
        return @{ Mine = @($all | Where-Object { $_.name -eq $shovel }); Total = $all.Count }
      }

      $found = Get-LegacyShovel
      if ($found.Mine.Count -eq 0) {
        Write-Host "Shovel '$shovel' is not present on vhost '$vhost' ($($found.Total) other shovel(s)) - nothing to delete."
        return
      }

      Write-Host "Deleting legacy shovel '$shovel' from vhost '$vhost' (state: $($found.Mine[0].state))..."
      try {
        Invoke-RestMethod -Method Delete -Uri "$mgmtUri/api/parameters/shovel/$vhostEnc/$([Uri]::EscapeDataString($shovel))" -Headers $headers -TimeoutSec 30 | Out-Null
      } catch {
        if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) {
          Write-Host "The broker answered 404 - the shovel was already gone."
        } else {
          $detail = if ($_.ErrorDetails.Message) { $_.ErrorDetails.Message } else { $_.Exception.Message }
          throw "DELETE /api/parameters/shovel/$vhostEnc/$shovel failed: $detail. The user '$(ProfilerRabbitMqUsername)' needs the policymaker (or administrator) tag to remove a dynamic shovel."
        }
      }

      $deadline = (Get-Date).AddSeconds(30)
      do {
        $found = Get-LegacyShovel
        if ($found.Mine.Count -eq 0) { break }
        Start-Sleep -Seconds 3
      } while ((Get-Date) -lt $deadline)

      if ($found.Mine.Count -gt 0) {
        throw ("Shovel '$shovel' is still listed on $mgmtUri 30s after the delete was accepted (state: $($found.Mine[0].state)). " +
               "It would compete with this pipeline's QueueProcessor. Remove it by hand: " +
               "DELETE $mgmtUri/api/parameters/shovel/$vhostEnc/$shovel")
      }
      Write-Host "Verified: shovel '$shovel' is gone from vhost '$vhost' ($($found.Total) other shovel(s) remain)."
    displayName: 'Disable the legacy ShovelBridge shovel (delete if present)'
    env:
      RabbitMqPasswordValue: $(ExternalRabbitMqPassword)


  # Resolves the currently published engine + deployment-scripts zip URLs from
  # warewolf.online/release-notes.php, which carries data-role="engine-linux-zip-link" and
  # data-role="scripts-zip-link" anchors maintained by the Warewolf release pipeline
  # (Dev/.azure/Update-ReleaseNotes.ps1). Same step as the source file, DEV2 variable names
  # swapped in.
  #
  # release-notes.php is PUBLIC content, so its markup is untrusted input for a URL this agent
  # will fetch and expand on disk. Both resolved URLs are therefore checked to be https and to
  # point at the expected storage account host before anything is downloaded - the same guard
  # the source file applies when it reads the scripts link off that page. A pinned
  # $(Warewolf*ZipUrl) override is held to the identical check: a pipeline variable is a softer
  # target than it looks, and there is no reason to trust one more than the page.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $expectedHost = '$(WarewolfReleasesStorageAccount).blob.core.windows.net'

      function Assert-TrustedReleaseUrl {
          param([string] $Url, [string] $What)
          $parsed = $null
          if (-not [uri]::TryCreate($Url, [UriKind]::Absolute, [ref]$parsed) -or
              $parsed.Scheme -ne 'https' -or $parsed.Host -ne $expectedHost) {
              throw "Refusing to fetch the $What from untrusted URL '$Url' (expected https://$expectedHost/...)."
          }
          return $Url
      }

      $engineUrl  = '$(WarewolfEngineZipUrl)'
      $scriptsUrl = '$(WarewolfScriptsZipUrl)'

      if ([string]::IsNullOrWhiteSpace($engineUrl) -or [string]::IsNullOrWhiteSpace($scriptsUrl)) {
          $notes = Invoke-WebRequest -Uri 'https://warewolf.online/release-notes.php' -UseBasicParsing -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
          if ([string]::IsNullOrWhiteSpace($engineUrl)) {
              # The LINUX engine zip specifically: wwprofilerlw is a Flex Consumption app
              # (-HostingPlan 'Flex' below), and Flex is Linux-only. The release page carries a
              # linux-x64 and a win-x64 engine zip (7580); deliberately no fallback to the legacy
              # pre-split data-role="engine-zip-link", whose runtime depends on the release that
              # published it - pin WarewolfEngineZipUrl instead until a split release is live.
              $m = [regex]::Match($notes.Content, 'data-role="engine-linux-zip-link"[^>]*href="([^"]+)"')
              if (-not $m.Success) { throw 'Could not find data-role="engine-linux-zip-link" on warewolf.online/release-notes.php. Pin WarewolfEngineZipUrl (a linux-x64 AzureFunctionsPackage zip) as a queue-time variable to unblock this build.' }
              $engineUrl = $m.Groups[1].Value
          }
          if ([string]::IsNullOrWhiteSpace($scriptsUrl)) {
              $m = [regex]::Match($notes.Content, 'data-role="scripts-zip-link"[^>]*href="([^"]+)"')
              if (-not $m.Success) { throw 'Could not find data-role="scripts-zip-link" on warewolf.online/release-notes.php. Pin WarewolfScriptsZipUrl as a queue-time variable to unblock this build.' }
              $scriptsUrl = $m.Groups[1].Value
          }
      }

      $engineUrl  = Assert-TrustedReleaseUrl -Url $engineUrl  -What 'engine package'
      # A pinned override is held to the same runtime rule as the page: a win-x64 package
      # deploys "successfully" to a Linux Flex app and then fails every invocation.
      if ($engineUrl -match 'win-x64') { throw "WarewolfEngineZipUrl '$engineUrl' is a win-x64 package; wwprofilerlw is Linux (Flex) and needs the linux-x64 AzureFunctionsPackage zip." }
      $scriptsUrl = Assert-TrustedReleaseUrl -Url $scriptsUrl -What 'deployment scripts package'

      Write-Host "##vso[task.setvariable variable=ResolvedEngineZipUrl]$engineUrl"
      Write-Host "##vso[task.setvariable variable=ResolvedScriptsZipUrl]$scriptsUrl"
      Write-Host "Engine package : $engineUrl"
      Write-Host "Scripts package: $scriptsUrl"
    displayName: 'Resolve Published Lightweight Engine Release URLs'

  # -PublishPath accepts a .zip directly (the script extracts it and stages secure.config, the
  # license and the workflow tree into the extracted folder before publishing), so the release
  # package is downloaded as-is rather than unpacked here.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $dest = "$(Agent.BuildDirectory)\LightweightEngine"
      New-Item -ItemType Directory -Force -Path $dest | Out-Null
      $zip = Join-Path $dest 'AzureFunctionsPackage.zip'
      Invoke-WebRequest -Uri '$(ResolvedEngineZipUrl)' -OutFile $zip -UseBasicParsing -TimeoutSec 300 -MaximumRetryCount 3 -RetryIntervalSec 10
      $size = (Get-Item $zip).Length
      if ($size -le 0) { throw "Downloaded engine package is empty: $zip" }
      Write-Host "##vso[task.setvariable variable=EngineZipPath]$zip"
      Write-Host "Downloaded engine package ($([math]::Round($size / 1MB, 1)) MB) to $zip"
    displayName: 'Download Lightweight Engine Package'

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $zip = "$(Agent.BuildDirectory)\DeploymentScripts.zip"
      $dir = "$(Agent.BuildDirectory)\DeploymentScripts"
      Invoke-WebRequest -Uri '$(ResolvedScriptsZipUrl)' -OutFile $zip -UseBasicParsing -TimeoutSec 120 -MaximumRetryCount 3 -RetryIntervalSec 10
      if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
      Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force

      # Published zips have shipped both flat and wrapped in a single top-level folder over time
      # (the source file's own release pipeline normalises for the same reason when it diffs the
      # previous release), so locate the orchestrator rather than assuming either layout.
      $deployScript = Get-ChildItem -LiteralPath $dir -Recurse -Filter 'Deploy-WwExecutionEngine.ps1' | Select-Object -First 1
      if (-not $deployScript) { throw "Deploy-WwExecutionEngine.ps1 not found anywhere under $dir - the published scripts package layout has changed." }
      Write-Host "##vso[task.setvariable variable=DeployScriptPath]$($deployScript.FullName)"
      Write-Host "Deployment orchestrator: $($deployScript.FullName)"

      # Same package, same discovery style - Deploy-WwQueueProcessor.ps1 ships alongside
      # Deploy-WwExecutionEngine.ps1 in the Warewolf repo's own Scripts/ folder (the release
      # pipeline zips that whole folder), so no second download is needed. Only the DEPLOY script
      # comes from the release, as for the engine; the burst publisher, run report and sink checks
      # are pipeline-side verification and run from this checkout (see the UAT file's note on the
      # sink steps), so they always reflect the commit under test.
      $queueDeployScript = Get-ChildItem -LiteralPath $dir -Recurse -Filter 'Deploy-WwQueueProcessor.ps1' | Select-Object -First 1
      if (-not $queueDeployScript) { throw "Deploy-WwQueueProcessor.ps1 not found anywhere under $dir - the published scripts package layout has changed, or the release predates the QueueProcessor scripts. Pin WarewolfScriptsZipUrl to a build that carries it." }
      Write-Host "##vso[task.setvariable variable=QueueProcessorDeployScriptPath]$($queueDeployScript.FullName)"
      Write-Host "QueueProcessor orchestrator: $($queueDeployScript.FullName)"
    displayName: 'Download Warewolf Deployment Scripts'

  # Replaces the source file's "Stage Profiler Workflow Resources" step (which copied from the
  # Unlimited.ProfilerServices repo's own Warewolf.ProfilerServices/Profiler + Sources/*.bite).
  # This repo already carries an equivalent, committed tree at
  # Dev/Warewolf.Execution.Lightweight/Resources/ProfilerServices (+ Resources/rabbit for
  # NewSqlServerSource/RabbitProcess, which RequestForProfiling's nested calls depend on) - the
  # exact tree pipeline-LOADTEST.yml already proves out for its own Profiler load test. Staged
  # as two subfolders under one root, mirroring pipeline-LOADTEST.yml's own two staging steps.
  - powershell: |
      $ErrorActionPreference = 'Stop'
      $destRoot = "$(Agent.BuildDirectory)\ProfilerWorkflowResources"

      $rabbitDest = Join-Path $destRoot 'rabbit'
      New-Item -ItemType Directory -Force -Path $rabbitDest | Out-Null
      Get-ChildItem '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Resources\rabbit' -File |
          Where-Object { $_.Name -ne 'NewSqlServerSource (Local Backup).bite' } |
          Copy-Item -Destination $rabbitDest -Force

      $profilerDest = Join-Path $destRoot 'ProfilerServices'
      New-Item -ItemType Directory -Force -Path $profilerDest | Out-Null
      Copy-Item '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Resources\ProfilerServices\*' `
          -Destination $profilerDest -Recurse -Force
      Remove-Item -LiteralPath (Join-Path $profilerDest 'Provision-ProfilerSchema.sql') -Force -ErrorAction SilentlyContinue

      # WOLF-8512 (build 30705): Sources\ProfilerRabbitMQSource.bite is the release-token
      # TEMPLATE - its ConnectionString carries the literal, never-substituted
      # '#{WarewolfGenericRabbitMQSourceHost}' etc, because this file drops the source file's
      # replacetokens@5 steps. It shares ResourceID 0b142714-8f6d-41b7-9832-2aefa8c731ec with the
      # REAL, CloudAMQP-credentialed copy the 'Generate RequestForProfiling CloudAMQP publish
      # source' step below writes to ProfilerWrapper\ProfilerRabbitMQSource.bite, and
      # LightweightSourceLoader.BuildFileIndex (Directory.EnumerateFiles, unordered) lets whichever
      # is enumerated LAST silently win. Remove it from THIS staged copy so only the generated,
      # real source ever ships. Do NOT remove it from the source Resources tree - it belongs to
      # the 1:1 mirror of the authoritative Unlimited.ProfilerServices layout.
      Remove-Item -LiteralPath (Join-Path $profilerDest 'Sources\ProfilerRabbitMQSource.bite') -Force -ErrorAction SilentlyContinue

      $count = (Get-ChildItem -LiteralPath $destRoot -Recurse -File -Filter '*.bite').Count
      Write-Host "Staged $count .bite resource(s) into $destRoot"
    displayName: 'Stage Profiler Workflow Resources (from this repo''s own Resources tree)'

  # Closes the same dependency-closure gap pipeline-LOADTEST.yml's own
  # "Generate RequestForProfiling CloudAMQP publish source" step closes, and for the same reason:
  # RequestForProfiling's PublishRabbitMQActivity needs RabbitMQSource
  # 0b142714-8f6d-41b7-9832-2aefa8c731ec, and the only copy this repo commits
  # (Resources/ProfilerServices/Sources/ProfilerRabbitMQSource.bite) is a RELEASE-TOKEN TEMPLATE -
  # its ConnectionString carries the literal, never-substituted '#{WarewolfGenericRabbitMQSourceHost}'
  # etc. The source file substitutes those via replacetokens@5 over Octopus variables; this DEV2
  # copy drops those steps (see the header), so without this step the publish resolves
  # '#{WarewolfGenericRabbitMQSourceHost}' as a hostname and fails with
  # BrokerUnreachableException / 'No such host is known' - observed live on wwprofilerlw on
  # 2026-09-18, and the same failure WOLF-8512 / build 30705 hit at load.
  #
  # The staging step above removes the template so only this generated file carries ResourceID
  # 0b142714-...: LightweightSourceLoader.BuildFileIndex enumerates with Directory.EnumerateFiles
  # (unordered), so with both present whichever is read LAST silently wins the ID collision.
  #
  # GENERATED, never committed - the broker password is a secret, and writing it into a
  # source-controlled .bite would put a live credential in git. Emitted as PLAIN TEXT because the
  # deploy below runs with -EncryptResources:$true and encrypts the staged tree itself.
  - powershell: |
      $ErrorActionPreference = 'Stop'

      $amqpHost  = '$(ProfilerSinkRabbitMqHost)'
      $amqpPort  = '$(ProfilerSinkRabbitMqPort)'
      $amqpUser  = '$(ProfilerSinkRabbitMqUsername)'
      $amqpVHost = '$(ProfilerSinkRabbitMqVirtualHost)'
      $amqpPass  = $env:CloudAmqpPasswordValue

      # Deliberately NOT a PowerShell here-string: its closing '"@' must sit at column 0, which
      # dedents out of this YAML block scalar and makes the whole file unparseable.
      if ([string]::IsNullOrWhiteSpace($amqpHost)) {
        throw ("ProfilerSinkRabbitMqHost is not set, so RequestForProfiling's RabbitMQ publish source " +
               "cannot be generated. It must be the CLOUDAMQP AMQP endpoint (the result broker the smoke " +
               "test inspects), not the self-hosted broker the legacy shovel lived on.")
      }
      # Distinct from ExternalRabbitMqPassword, which belongs to the SELF-HOSTED broker's
      # 'testuser' and is only used to delete the legacy shovel. This is the CloudAMQP
      # instance credential ('bmkzdabu').
      if ([string]::IsNullOrWhiteSpace($amqpPass)) {
        throw ("Secret pipeline variable 'CLOUDAMQP_SHOVEL_PASSWORD' is empty - it is required to build " +
               "RequestForProfiling's CloudAMQP publish source, and to verify the published message. Set it " +
               "(as a secret) on this pipeline definition in Azure DevOps to the 'bmkzdabu' instance password.")
      }

      # SecurityElement::Escape covers & < > " ' so a password containing XML metacharacters
      # cannot corrupt the attribute (or inject markup into the resource).
      $connectionString = "HostName=$amqpHost;Port=$amqpPort;UserName=$amqpUser;Password=$amqpPass;VirtualHost=$amqpVHost"
      $escaped = [System.Security.SecurityElement]::Escape($connectionString)

      $destDir = "$(Agent.BuildDirectory)\ProfilerWorkflowResources\ProfilerServices\ProfilerWrapper"
      New-Item -ItemType Directory -Force -Path $destDir | Out-Null
      $destFile = Join-Path $destDir 'ProfilerRabbitMQSource.bite'

      $xml = @(
        '<Source ID="0b142714-8f6d-41b7-9832-2aefa8c731ec" Name="ProfilerRabbitMQSource" ResourceType="RabbitMQSource" IsValid="false" ConnectionString="' + $escaped + '" Type="RabbitMQSource" ServerVersion="0.0.0.0" ServerID="51a58300-7e9d-4927-a57b-e5d700b11b55">'
        '  <DisplayName>ProfilerRabbitMQSource</DisplayName>'
        '  <TypeOf>RabbitMQSource</TypeOf>'
        '</Source>'
      ) -join [Environment]::NewLine

      [System.IO.File]::WriteAllText($destFile, $xml, (New-Object System.Text.UTF8Encoding($false)))

      # Never echo $connectionString - it carries the password. Host/port/user only.
      Write-Host "Generated RabbitMQ publish source 0b142714-8f6d-41b7-9832-2aefa8c731ec -> amqp://$amqpUser@${amqpHost}:$amqpPort/$($amqpVHost.TrimStart('/'))"
    displayName: 'Generate RequestForProfiling CloudAMQP publish source'
    env:
      CloudAmqpPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)


  # The QueueProcessor package, and the broker source it bakes into its image.
  #
  # PACKAGE: the published Warewolf-QueueProcessor-<ver>.zip is the raw `dotnet publish` output
  # (pipeline-CLOUD.yml zips 'QueueProcessorRelease', which is that folder). Resolved and trust-
  # checked exactly like the engine zip: release-notes.php is public content, so the host is
  # verified before anything is fetched.
  #
  # SOURCE: Deploy-WwQueueProcessor.ps1 bakes the RabbitMQ source into the image and looks it up by
  # QueueSourceId, scanning only the TOP LEVEL of -QueueSourcePath - the generated CloudAMQP source
  # sits three folders down inside the engine's workflow tree, so it is copied to a folder of its own.
  # Copied HERE, before the engine deploy, and not read back from the workflow tree later: that
  # tree is handed to -EncryptResources:$true, and a plaintext copy must not depend on it surviving.
  # The copy is plain text on the agent only; the worker deploy encrypts its own staged copy
  # (-EncryptStagedSettings) so the image never carries the broker password in clear.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $expectedHost = '$(WarewolfReleasesStorageAccount).blob.core.windows.net'

      $workerUrl = '$(WarewolfQueueWorkerZipUrl)'
      if ([string]::IsNullOrWhiteSpace($workerUrl)) {
        $notes = Invoke-WebRequest -Uri 'https://warewolf.online/release-notes.php' -UseBasicParsing -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
        $m = [regex]::Match($notes.Content, 'data-role="queueworker-zip-link"[^>]*href="([^"]+)"')
        if (-not $m.Success) { throw 'Could not find data-role="queueworker-zip-link" on warewolf.online/release-notes.php. Pin WarewolfQueueWorkerZipUrl (a Warewolf-QueueProcessor-<ver>.zip) as a queue-time variable to unblock this build.' }
        $workerUrl = $m.Groups[1].Value
      }
      $parsed = $null
      if (-not [uri]::TryCreate($workerUrl, [UriKind]::Absolute, [ref]$parsed) -or $parsed.Scheme -ne 'https' -or $parsed.Host -ne $expectedHost) {
        throw "Refusing to fetch the QueueProcessor package from untrusted URL '$workerUrl' (expected https://$expectedHost/...)."
      }

      $zip = "$(Agent.BuildDirectory)\QueueProcessor.zip"
      $dir = "$(Agent.BuildDirectory)\QueueProcessorPublish"
      Invoke-WebRequest -Uri $workerUrl -OutFile $zip -UseBasicParsing -TimeoutSec 300 -MaximumRetryCount 3 -RetryIntervalSec 10
      if ((Get-Item $zip).Length -le 0) { throw "Downloaded QueueProcessor package is empty: $zip" }
      if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
      Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force

      # Flat today; tolerate a single wrapping folder the way the scripts-zip discovery does.
      $dll = Get-ChildItem -LiteralPath $dir -Recurse -Filter 'Warewolf.Execution.QueueProcessor.dll' | Select-Object -First 1
      if (-not $dll) { throw "Warewolf.Execution.QueueProcessor.dll not found under $dir - this is not a QueueProcessor publish package." }
      $publishRoot = $dll.DirectoryName
      Write-Host "##vso[task.setvariable variable=QueueWorkerPublishPath]$publishRoot"
      Write-Host "QueueProcessor package : $workerUrl"
      Write-Host "Publish root           : $publishRoot"

      $sourceId   = '0b142714-8f6d-41b7-9832-2aefa8c731ec'
      $generated  = "$(Agent.BuildDirectory)\ProfilerWorkflowResources\ProfilerServices\ProfilerWrapper\ProfilerRabbitMQSource.bite"
      if (-not (Test-Path -LiteralPath $generated)) { throw "The generated CloudAMQP source is missing at $generated - 'Generate RequestForProfiling CloudAMQP publish source' must run first." }
      $sourcesDir = "$(Agent.BuildDirectory)\ProfilerQueueSources"
      New-Item -ItemType Directory -Force -Path $sourcesDir | Out-Null
      Copy-Item -LiteralPath $generated -Destination (Join-Path $sourcesDir "$sourceId.bite") -Force
      Write-Host "##vso[task.setvariable variable=QueueWorkerSourcePath]$sourcesDir"
      Write-Host "Staged worker broker source $sourceId.bite into $sourcesDir"
    displayName: 'Download QueueProcessor Package + stage broker source'
  # Pulls the licensed subscription config from the Azure DevOps Library ('Warewolf
  # License.secureconfig' under Pipelines > Library > Secure files) - the same org-wide secure
  # file pipeline-LOADTEST.yml's own Deploy_UAT job already downloads, not a Profiler/Unlimited
  # secret.
  - task: DownloadSecureFile@1
    name: warewolfLicense
    displayName: 'Download Warewolf License.secureconfig'
    inputs:
      secureFile: 'Warewolf License.secureconfig'

  # Backed up BEFORE anything is touched, same rationale as the source file's own step:
  # WAREWOLF_ENTRA_CONFIG-style app settings on an existing engine app cannot be reconstructed
  # from this repo. continueOnError because a failed backup must be visible but must not block the
  # deploy - on the very first run of a brand-new app this step is expected to fail.
  - task: AzureCLI@2
    displayName: 'Back Up Engine App Settings'
    continueOnError: true
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        $dir = "$(Agent.BuildDirectory)\EngineSettingsBackup"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' -o json |
            Out-File -LiteralPath (Join-Path $dir 'appsettings-backup.json') -Encoding utf8
        az functionapp show --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' -o json |
            Out-File -LiteralPath (Join-Path $dir 'site-backup.json') -Encoding utf8
        Write-Host "Backed up app settings + site config to $dir"

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Engine Settings Backup'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      targetPath: '$(Agent.BuildDirectory)\EngineSettingsBackup'
      artifact: EngineSettingsBackup
      publishLocation: pipeline

  # The deploy itself - same parameter set as the source file's own 'Deploy via Deployment
  # Scripts' step, minus -SecureConfigPath (no Profiler secure.config exists in this repo; the
  # 'Bypass secure.config workflow authorization' step below opens the app up the same way
  # pipeline-LOADTEST.yml's own Deploy_UAT job does instead) and -EnablePerformanceCounters,
  # -EnableElasticsearch/-ElasticsearchSourcePath (no Elasticsearch endpoint provisioned for this
  # dry-run app; add back once one exists for wwprofilerlw specifically). -PublishPath and
  # scriptPath now point at the DOWNLOADED release zip/orchestrator (see the header comment's
  # "CONSEQUENCE" note on what this trades away), not this checked-out commit.
  #
  # -SkipEntraConfigDriftRepair (build 30815, 2026-09-24): wwprofilerlw has never had an Entra
  # app registration - no "wwprofilerlw-auth" app exists (verified live via `az ad app list`) -
  # since this engine is fully open access (see -SecureConfigPath note above), so Phase 2's
  # WAREWOLF_ENTRA_CONFIG drift auto-repair under -SkipAuthProvisioning is a false positive for
  # it: it ran `az ad app list --display-name wwprofilerlw-auth` (Microsoft Graph) every deploy,
  # which the pipeline SP has no permission for ("Insufficient privileges to complete the
  # operation") and hard-failed Phase 2, aborting the whole deploy. Do NOT "fix" this by adding
  # -EntraConfigRepairClientId instead - unlike WarewolfServer-UAT (build 30806, which DOES have
  # a real Entra registration to repair towards), there is no appId here to repair with; this
  # switch says there is nothing to repair, full stop. Requires the release zip to carry this
  # switch (see the release-zip note above) - until re-published, this line is a no-op and the
  # deploy will keep failing the same way.
  #
  # -EnablePersistence:$true (a [nullable[bool]], NOT a switch - it must be passed with the colon
  # syntax or it binds the next argument) plus the two staged paths above: see the staging step's
  # own comment for why a queue-triggered engine without persistence de-duplicates blind.
  #
  # THE FOUR THROUGHPUT FLAGS BELOW ARE ONE SETTING, and they are the same set pipeline-LOADTEST.yml
  # applies to WarewolfServer-UAT. -ServiceBusMaxConcurrentCalls 2 (host.json's
  # extensions.serviceBus.maxConcurrentCalls) and -ServiceBusTriggerMaxConcurrentExecutions 2 (the
  # trigger's own semaphore) cap what one instance will run at once; -DisableDynamicConcurrency is
  # MANDATORY alongside them, because the dynamic-concurrency manager overrides a static
  # maxConcurrentCalls and the caps become decorative; -FlexMaximumInstanceCount 30 caps the
  # instance count, so peak concurrency is a number you can actually compute (30 x 2). This is the
  # FLEX equivalent of the classic plan's -FunctionAppScaleLimit - Flex Consumption has no
  # siteConfig.functionAppScaleLimit, so Deploy-WwExecutionEngine.ps1 rejects that flag outright
  # when -HostingPlan Flex is set (fails at plan time, before anything is touched).
  #
  # These exist because the ceiling is the DATABASE, not the engine: the Profiler schema and
  # dbo.jobs1 share one Azure SQL database, and scaling left to grow freely simply converts that
  # into SQL command timeouts - which the trigger dead-letters on the FIRST delivery
  # (IsTransientFailure is set only for memory pressure), so an over-scaled run loses messages
  # rather than merely slowing down.
  #
  # -HostingPlan 'Flex' (2026-09-22, AD-2383): wwprofilerlw was deleted (it was a Windows classic
  # Consumption/Y1 app; Flex Consumption is Linux-only and 'functionapp create' fixes the SKU, so
  # an existing app is never converted - see Deploy-RunGuide.md's own -HostingPlan row) and is
  # recreated on THIS run as Flex Consumption, sku FlexConsumption - a different resource shape,
  # not a tier of the classic plan. -FlexInstanceMemoryMB 4096 pins a 4GB instance size at create
  # time; later runs against the now-existing app ignore it, since only 'functionapp create'
  # honours it. Recreating the app mints a NEW system-assigned managed identity, which drops every
  # RBAC grant the OLD identity held. The 'Key Vault Secrets User' grant is re-applied by the
  # deploy script itself on every run. The 'Azure Service Bus Data Receiver' grant is NOT: it was
  # applied by the UAT file's 'Enable Service Bus Secure Trigger' step, which this file does not
  # have. After a recreate the idle ServiceBusTrigger therefore cannot listen (log noise on that
  # one function only - the HTTP routes the worker uses are unaffected); re-run the UAT file's
  # step, or grant the role by hand, if the trigger is ever wanted again.
  #
  # ALL FOUR REVERT SILENTLY IF A LATER EDIT DROPS THEM from this argument list - the engine keeps
  # whatever the last deploy set. Re-verify after any deploy with
  # 'az functionapp scale config show ... --query maximumInstanceCount' (Flex) and the host.json in
  # the deployed package, rather than trusting this file.
  # ── Persistence (Hangfire) ─────────────────────────────────────────────────────────────
  # Both files are git-tracked here and are staged under the EXACT leaf names
  # Deploy-WwExecutionEngine.ps1 validates ('persistencesettings.json' /
  # 'persistencesettingsdbsource.bite'), exactly as pipeline-LOADTEST.yml's Deploy_UAT stage
  # stages them for WarewolfServer-UAT.
  #
  # WHY PERSISTENCE IS NOT OPTIONAL ON A QUEUE-TRIGGERED ENGINE. With it off,
  # ServiceBusReplayAndResultStore falls back to a process-local ConcurrentDictionary, so its
  # de-duplication is blind across instances - and a Dynamic-plan Function App scales to many
  # instances and recycles them under load. That is the documented cause of the 5,000-message
  # re-execution storm (7,648 executions for 5,000 messages) chased on 2026-09-15: every
  # redelivery after a host recycle looked brand new to the store.
  #
  # The Hangfire store is the shared 'wwexecution-uat-hangfire' database (WFAES-encrypted in the
  # .bite). Hangfire is designed for multiple servers against one storage and correlation ids are
  # GUIDs, so sharing it with wwuat3 is safe; give this app its own database only if the two rigs
  # ever need to be load-tested at the same time.
  - powershell: |
      $ErrorActionPreference = 'Stop'
      New-Item -ItemType Directory -Force -Path "$(Agent.BuildDirectory)\ProfilerPersistence" | Out-Null
      Copy-Item -LiteralPath "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\persistencesettings.uat.json" `
          -Destination "$(Agent.BuildDirectory)\ProfilerPersistence\persistencesettings.json" -Force
      Copy-Item -LiteralPath "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\persistencesettingsdbsource.uat.bite" `
          -Destination "$(Agent.BuildDirectory)\ProfilerPersistence\persistencesettingsdbsource.bite" -Force
      Get-ChildItem "$(Agent.BuildDirectory)\ProfilerPersistence" | ForEach-Object { Write-Host "Staged $($_.Name) ($($_.Length) bytes)" }
    displayName: 'Stage persistence settings (Enable: true)'

  - task: AzureCLI@2
    displayName: 'Deploy via Deployment Scripts'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: '$(DeployScriptPath)'
      arguments: >-
        -ResourceGroup '$(ProfilerEngineResourceGroup)'
        -Location '$(ProfilerEngineLocation)'
        -StorageAccount '$(ProfilerEngineStorageAccount)'
        -AppName '$(ProfilerEngineAppName)'
        -PublishPath '$(EngineZipPath)'
        -WorkflowsSourcePath '$(Agent.BuildDirectory)\ProfilerWorkflowResources'
        -LicenseConfigPath '$(warewolfLicense.secureFilePath)'
        -LicenseCheckEnabled:$true
        -KeyVaultName '$(ProfilerEngineKeyVaultName)'
        -KeyVaultSecretName '$(ProfilerEngineKeyVaultSecretName)'
        -EncryptResources:$true
        -SkipAuthProvisioning
        -SkipEntraConfigDriftRepair
        -ServiceBusTriggerQueueName '$(ProfilerServiceBusTriggerQueueName)'
        -ServiceBusTriggerWorkflowName '$(ProfilerServiceBusTriggerWorkflowName)'
        -EnablePersistence:$true
        -PersistenceSettingsPath '$(Agent.BuildDirectory)\ProfilerPersistence\persistencesettings.json'
        -PersistenceDbSourcePath '$(Agent.BuildDirectory)\ProfilerPersistence\persistencesettingsdbsource.bite'
        -ServiceBusMaxConcurrentCalls 2
        -DisableDynamicConcurrency
        -ServiceBusTriggerMaxConcurrentExecutions 2
        -HostingPlan 'Flex'
        -FlexInstanceMemoryMB 4096
        -FlexMaximumInstanceCount 30
        -NonInteractive

  # Same bypass pipeline-LOADTEST.yml's own Deploy_UAT job applies to WarewolfServer-UAT, and for
  # the identical reason: this repo has no source-controlled secure.config for
  # ProfilerWrapper/RequestForProfiling's ResourceID, so bypassing WorkflowAuthPolicyLoader here
  # (rather than trying to reconstruct one) keeps this dry run self-contained. See that job's own
  # step comment for the full az.cmd-quoting root cause this verify-after-write guards against
  # (WOLF-8512 / build 30636).
  #
  # MUST be AzureCLI@2, not a bare 'powershell:' step (build 30741). That task sets
  # AZURE_CONFIG_DIR to a per-task temp dir (D:\a\_temp\.azclitask-*) holding the service
  # connection's login, so an `az` call from any OTHER step has no account at all and dies with
  # 'ERROR: Please run az login to setup account.' This step had never actually executed - every
  # earlier run failed in the deploy step above and skipped it - so the missing login only
  # surfaced on the first build to get this far.
  - task: AzureCLI@2
    displayName: 'Bypass secure.config workflow authorization'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'

        $settingsFile = Join-Path $env:AGENT_TEMPDIRECTORY 'ww-security-flags.json'
        $payload = '[{"name":"WAREWOLF_SECURITY_FLAGS","value":"{\"bypassSecureConfig\":true}"}]'
        Set-Content -LiteralPath $settingsFile -Value $payload -Encoding utf8

        az functionapp config appsettings set --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --settings "@$settingsFile" | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "az failed to set WAREWOLF_SECURITY_FLAGS (exit $LASTEXITCODE)." }

        $stored = az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --query "[?name=='WAREWOLF_SECURITY_FLAGS'].value | [0]" -o tsv
        if ($LASTEXITCODE -ne 0) { throw "az failed to read back WAREWOLF_SECURITY_FLAGS (exit $LASTEXITCODE)." }

        try {
          $parsed = $stored | ConvertFrom-Json
        } catch {
          throw "WAREWOLF_SECURITY_FLAGS was stored as INVALID JSON: '$stored'."
        }
        if ($parsed.bypassSecureConfig -ne $true) {
          throw "WAREWOLF_SECURITY_FLAGS parsed as valid JSON but bypassSecureConfig is not true (stored: '$stored')."
        }

        Remove-Item -LiteralPath $settingsFile -Force -ErrorAction SilentlyContinue
        Write-Host "Verified WAREWOLF_SECURITY_FLAGS on $(ProfilerEngineAppName) is valid JSON with bypassSecureConfig=true: $stored"

  # Applied AFTER the deploy and BEFORE the stop/start below, so the cold start that follows is the
  # first one that sees it. AzureCLI@2 rather than a bare 'powershell:' step: the CLI task scopes its
  # own AZURE_CONFIG_DIR to the service connection, which is the only shape guaranteed to be logged
  # in. Verified by read-back for the same reason the bypass step above is (WOLF-8512 / build 30636):
  # 'az ... appsettings set' exits 0 whether or not the value landed as intended.
  - task: AzureCLI@2
    displayName: 'Apply WAREWOLF_SQL_TRUST_SERVER_CERT'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        $expected = '$(ProfilerEngineSqlTrustServerCert)'

        az functionapp config appsettings set --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --settings "WAREWOLF_SQL_TRUST_SERVER_CERT=$expected" -o none
        if ($LASTEXITCODE -ne 0) { throw "az failed to set WAREWOLF_SQL_TRUST_SERVER_CERT (exit $LASTEXITCODE)." }

        $stored = az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' --query "[?name=='WAREWOLF_SQL_TRUST_SERVER_CERT'].value | [0]" -o tsv
        if ($LASTEXITCODE -ne 0) { throw "az failed to read back WAREWOLF_SQL_TRUST_SERVER_CERT (exit $LASTEXITCODE)." }
        if ($stored -ne $expected) {
          throw "WAREWOLF_SQL_TRUST_SERVER_CERT stored as '$stored', expected '$expected'."
        }
        Write-Host "Verified WAREWOLF_SQL_TRUST_SERVER_CERT on $(ProfilerEngineAppName) is '$stored'."

  # WEBSITE_RUN_FROM_PACKAGE=1 means a zip deploy uploads a new package but the running worker
  # keeps serving the old one until recycled - see the source file's own comment on this step for
  # why 'az functionapp restart' is not sufficient (a warm Consumption-plan worker can keep
  # previously-decrypted WFAES sources in memory). A full stop-then-start forces every instance to
  # cold start and re-decrypt.
  - task: AzureCLI@2
    displayName: 'Stop/Start Engine App (apply package + resources)'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        az functionapp stop --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)'
        if ($LASTEXITCODE -ne 0) { throw "az functionapp stop failed (exit $LASTEXITCODE)." }
        az functionapp start --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)'
        if ($LASTEXITCODE -ne 0) { throw "az functionapp start failed (exit $LASTEXITCODE)." }
        Write-Host "Stopped and started $(ProfilerEngineAppName) (full cold start)."

  # Same retry-with-backoff pattern as the source file: a Consumption-plan cold start after the
  # restart above routinely outlasts a single fixed timeout. Windows PowerShell (not pwsh) to keep
  # the $_.Exception.Response 5.1 error shape the catch block below expects.
  - powershell: |
      $ErrorActionPreference = 'Continue'
      $uri         = 'https://$(ProfilerEngineAppName).azurewebsites.net/apis.json'
      $maxAttempts = 5
      $baseDelay   = 15
      Write-Host "Waiting 30 seconds for the Function App to start..."
      Start-Sleep -Seconds 30

      for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
        try {
          $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 60
          Write-Host "STATUS: $($r.StatusCode)"
          Write-Host "apis.json length: $($r.Content.Length)"
          break
        } catch {
          $resp = $_.Exception.Response
          if ($resp) {
            Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $([int]$resp.StatusCode) $($resp.StatusDescription)"
          } else {
            Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)"
          }
          if ($attempt -ge $maxAttempts) {
            Write-Host "##[error]Engine discovery route did not respond after $maxAttempts attempts."
            throw
          }
          $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
          Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
          Start-Sleep -Seconds $delaySeconds
        }
      }
    displayName: 'Smoke Test: Engine Discovery Route'

  # -- Sink depth BEFORE the run --------------------------------------------------------
  # The first half of the delta assertion. Captured before the workflow is executed so the
  # verification step below can prove THIS run added a message, on a queue whose absolute depth
  # is meaningless (it is a load-test sink with no consumer attached - 19,100 messages when this
  # check was written).
  #
  # Sourced from the CHECKOUT, not from the downloaded deployment-scripts zip: this is
  # pipeline-side verification, not part of the deploy contract the release package defines, so
  # it must reflect the commit under test rather than the last published release (see this file's
  # header on what the downloaded scripts do and do not prove).
  #
  # - pwsh:, NOT - powershell: - see the verification step below for the TLS renegotiation this
  # cannot survive under 5.1.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
      # Depth AND the cumulative publish counter: the sink is capped (max-length 20000 by
      # CloudAMQP policy), and once full its depth never moves - builds 30775/30778/30797 all read
      # "depth 20000 before the run, 20000 now" over a healthy engine. The counter still counts.
      $baseline = & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
                   -ReportBaselineOnly `
                   -ManagementUri '$(ProfilerSinkRabbitMqManagementUri)' `
                   -QueueName     '$(ProfilerSinkQueueName)' `
                   -VHost         '$(ProfilerSinkRabbitMqVirtualHost)' `
                   -Username      '$(ProfilerSinkRabbitMqUsername)' `
                   -Password      $pw
      Write-Host "##vso[task.setvariable variable=SinkDepthBefore]$($baseline.Depth)"
      Write-Host "##vso[task.setvariable variable=SinkPublishedBefore]$($baseline.Published)"
    displayName: 'Smoke Test: Capture Sink Depth (before run)'
    env:
      SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

  # Executes ProfilerWrapper/RequestForProfiling - the SAME workflow pipeline-LOADTEST.yml's own
  # Load_Test job drives (the 16 input fields below are that job's VerifyWorkflowInputsJson
  # verbatim, with MandateId run-scoped) - and then proves the run reached the SINK.
  #
  # THE SINK IS THE QUEUE, NOT A DATABASE. RequestForProfiling's trailing 'RabbitMQ Publish'
  # activity publishes [[ProfilerInstruction]] to '$(ProfilerSinkQueueName)' via RabbitMQSource
  # 0b142714-8f6d-41b7-9832-2aefa8c731ec. The 'Verify Sink Queue' step below asserts that THIS
  # run added a message there, by comparing the queue's depth against the value the capture step
  # above recorded. Where the queue is shallow enough for a payload peek to be meaningful it also
  # looks for this run's own MandateId, which upgrades the result to run-attributable. Nothing is
  # consumed either way: the peek uses ackmode 'reject_requeue_true', which is the only mode that
  # actually puts messages back on this broker - 'ack_requeue_true', which this step used to send,
  # CONSUMES on LavinMQ (measured: depth 3 -> 0 on one peek). See Test-WwSinkDelivery.ps1's
  # Get-QueueHeadMessages for the measurement and what it means for the builds that ran before it.
  #
  # Why the sink, and not the HTTP status, is the assertion: the publish is the LAST thing the
  # workflow does, so a status code cannot distinguish "published" from "everything up to the
  # publish worked". A non-2xx is still reported as a warning here, and a sink depth that never
  # rises is what fails the verification step below.
  #
  # NOTE THIS STEP WRITES. Unlike the read-only usp_GetSpecialHolidays DAL probe it replaces,
  # each run publishes one real message and (via the nested ProfilerMain call) leaves database
  # rows behind. MandateId is a fresh GUID per run, so runs never collide and every artefact a
  # run leaves is attributable to it.
  #
  # Windows PowerShell (- powershell:, not - pwsh:) deliberately, exactly as the discovery test
  # above: the catch block reads $_.Exception.Response as an HttpWebResponse (.StatusDescription,
  # .GetResponseStream()), which is the 5.1 error shape. pwsh surfaces an HttpResponseMessage
  # instead, which has no GetResponseStream(), and the handler would fail while reporting the
  # real failure.
  #
  # The sink's depth is captured BEFORE this step runs (see the step immediately above) because
  # the assertion after it is a depth DELTA - see that step's own comment for why a payload peek
  # alone cannot work here.
  #
  # That shell choice is why sink verification is a SEPARATE - pwsh: step rather than the tail of
  # this one: it cannot run under 5.1 at all (see that step's own comment for why).
  - powershell: |
      $ErrorActionPreference = 'Continue'
      $mandateId   = [guid]::NewGuid().ToString()
      $maxAttempts = 4
      $baseDelay   = 15

      # The 16 fields RequestForProfiling's own DataList declares, taken verbatim from
      # pipeline-LOADTEST.yml's VerifyWorkflowInputsJson, with MandateId run-scoped.
      $inputs = [ordered]@{
        ForPaymentCycle       = '202402'
        MandateCanTrack       = 'false'
        MandateDRI            = '22'
        MandateId             = $mandateId
        RelatedMandates       = '5B9800B6-2183-EB11-A812-000D3ABE1AD1'
        ResultDate            = '2024-01-27'
        ResultDebitRunId      = '22'
        ResultMethod          = 'DebiCheck'
        ResultPaymentCycle    = '202401'
        ResultPresentedOnDate = '2024-01-22'
        ResultType            = 'Success'
        ScoreThisResult       = 'true'
        IsFixedExtract        = 'false'
        SourcePaymentId       = '1234'
        RequestType           = ''
        FASGroup              = ''
      }
      $qs  = ($inputs.GetEnumerator() | ForEach-Object { "$($_.Key)=$([uri]::EscapeDataString([string]$_.Value))" }) -join '&'
      $uri = 'https://$(ProfilerEngineAppName).azurewebsites.net/public/$(ProfilerSmokeWorkflowRoute).json?' + $qs

      Write-Host "Run-scoped MandateId: $mandateId"

      # Published BEFORE the call below, not after: the verification step must be able to name
      # this run's MandateId even if everything from here on fails.
      Write-Host "##vso[task.setvariable variable=SmokeMandateId]$mandateId"

      for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
        try {
          $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 180
          Write-Host "STATUS: $($r.StatusCode)"
          Write-Host "RequestForProfiling response: $($r.Content)"
          break
        } catch {
          $resp = $_.Exception.Response
          if ($resp) {
            $code = [int]$resp.StatusCode
            $body = '(empty)'
            try { $sr = New-Object IO.StreamReader($resp.GetResponseStream()); $body = $sr.ReadToEnd() } catch { }
            Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $code $($resp.StatusDescription)"
            Write-Host "BODY: $body"
            # A hasErrors envelope means the ENGINE ran and answered - retrying cannot change the
            # outcome, so stop and let the sink check below decide. Anything else (a platform
            # 5xx, a gateway timeout) is still a candidate cold start and is retried.
            if ($body -match '"hasErrors"') {
              Write-Host "Engine returned its own error envelope - not a cold start; proceeding to sink verification."
              break
            }
          } else {
            Write-Host "##[warning]Attempt $attempt/$maxAttempts failed with no response: $($_.Exception.Message)"
          }
          if ($attempt -ge $maxAttempts) {
            Write-Host "##[warning]RequestForProfiling did not return a usable response after $maxAttempts attempts - the sink check below is now the only signal."
            break
          }
          $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
          Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
          Start-Sleep -Seconds $delaySeconds
        }
      }

    displayName: 'Smoke Test: Execute Profiler Workflow'
    continueOnError: true

  # -- Sink verification: the queue RequestForProfiling publishes to ----------------------
  # Asserts that THIS run added a message to the sink, by comparing the queue's depth against the
  # value captured before the run. Delegated to Scripts/Test-WwSinkDelivery.ps1, which carries the
  # full rationale and the trade-offs, and has its own Pester suite
  # (Scripts/Tests/Test-WwSinkDelivery.Tests.ps1).
  #
  # WHY NOT A PAYLOAD PEEK, which is what this step used to do: the management API's
  # POST .../get serves from the HEAD of the queue, and a message published moments ago is at the
  # TAIL. Build 30750 peeked 50 messages 18 times against a queue holding 19,100, could only ever
  # see the oldest ~900, and failed a deploy whose publish had in fact succeeded. Purging that
  # queue and re-running the identical assertion made it pass on the first poll. The sink has no
  # consumer attached, so a deep backlog is its NORMAL state, not an anomaly to be cleaned up once.
  #
  # The peek is still made, as an opportunistic upgrade, whenever the queue is shallow enough for
  # it to mean anything (-PeekThreshold); a hit then makes the result run-attributable. The cost
  # of a delta when it is not: a concurrent publisher could satisfy it while this run's own publish
  # failed. Nothing else publishes here today - the load test uses its own '-loadtest' queues.
  #
  # - pwsh:, NOT - powershell:, and not by preference - Windows PowerShell CANNOT make this call.
  # CloudAMQP's nginx front end asks for a TLS renegotiation mid-request (visible on the wire as
  # 'remote party requests renegotiation', after the request has been sent). .NET Framework's
  # HttpWebRequest - which is what Invoke-RestMethod is under 5.1 - refuses server-initiated
  # renegotiation and reports it as the generic 'The request was aborted: Could not create
  # SSL/TLS secure channel' (build 30747). .NET 8, which pwsh runs on, handles it and returns the
  # response normally. It is NOT a protocol-version problem: forcing SecurityProtocol to Tls12
  # changes nothing, and the engine call in the step above reaches HTTPS from 5.1 quite happily.
  #
  # succeededOrFailed() because the step above is continueOnError and may only have warned - the
  # sink is then the ONLY signal, so it must still run.
  - pwsh: |
      $ErrorActionPreference = 'Stop'

      # Set by 'Smoke Test: Execute Profiler Workflow' before it made any call. A literal '$(...)'
      # back means that step died before it could publish the variable, so there is nothing to
      # attribute a delivery to - the delta is still asserted, it just cannot be attributed.
      $mandateId = '$(SmokeMandateId)'
      if ([string]::IsNullOrWhiteSpace($mandateId) -or $mandateId -match '^\$\(') {
        Write-Host "##[warning]No MandateId was published by 'Smoke Test: Execute Profiler Workflow' - verifying the depth delta only."
        $mandateId = ''
      }

      # Same sentinel handling for the pre-run depth: a literal '$(...)' back means the capture
      # step never ran. Passed on as -1, which the script REJECTS rather than reading as an empty
      # queue - a broken capture step must not be able to produce a silent pass.
      $depthBefore = '$(SinkDepthBefore)'
      if ([string]::IsNullOrWhiteSpace($depthBefore) -or $depthBefore -match '^\$\(') { $depthBefore = '-1' }
      # -1 here only drops the publish-counter signal; the depth delta is still asserted.
      $publishedBefore = '$(SinkPublishedBefore)'
      if ([string]::IsNullOrWhiteSpace($publishedBefore) -or $publishedBefore -match '^\$\(') { $publishedBefore = '-1' }

      $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
      try {
        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
              -ManagementUri    '$(ProfilerSinkRabbitMqManagementUri)' `
              -QueueName        '$(ProfilerSinkQueueName)' `
              -VHost            '$(ProfilerSinkRabbitMqVirtualHost)' `
              -Username         '$(ProfilerSinkRabbitMqUsername)' `
              -Password         $pw `
              -DepthBefore      ([int]$depthBefore) `
              -PublishedBefore  ([long]$publishedBefore) `
              -CorrelationToken $mandateId
      } catch {
        Write-Host "##[error]$($_.Exception.Message)"
        Write-Host "##vso[task.setvariable variable=WorkflowSmokeTestFailed]true"
        throw
      }
    displayName: 'Smoke Test: Verify Sink Queue'
    condition: succeededOrFailed()
    continueOnError: true
    env:
      # The CloudAMQP instance ('bmkzdabu') password - the SAME secret the generation step above
      # uses to build the publish source, so the smoke test always reads the broker the workflow
      # was just pointed at. Deliberately NOT ExternalRabbitMqPassword, which belongs to the
      # self-hosted rabbitmq.warewolf.online broker, which this file only uses to delete the legacy shovel.
      SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

  # ── QueueProcessor: RabbitMQ (CloudAMQP) -> ACA worker (KEDA) -> engine /Secure/{workflow} ─────
  # Replaces the UAT file's ShovelBridge half. Order matters: the engine must be able to authenticate
  # the worker BEFORE the worker exists, and the queue must exist BEFORE KEDA first polls it.

  # The worker's only route in is /Secure/{workflow}, which needs the engine to validate a bearer
  # token. That is configured by the app setting WAREWOLF_ENTRA_CONFIG, which the engine deploy
  # above does NOT manage under -SkipAuthProvisioning, and which an app recreate silently drops -
  # after which every /secure/* call answers 401 and the worker dead-letters every message it
  # receives (the queue drains, the app scales to zero, the run looks clean). Checked here, before
  # any container is built, so that failure mode costs one step instead of a whole burst.
  #
  # The setting can carry a client secret, so it is only ever tested, never printed. The audience
  # check is a substring match on the appId: the config stores it as a bare GUID and/or as
  # api://<guid>, and either form contains it. A mismatch is the documented cause of a 401 storm
  # (the worker minted a token for a different app than the engine validates against).
  - task: AzureCLI@2
    displayName: 'Verify engine Entra config (WAREWOLF_ENTRA_CONFIG)'
    inputs:
      azureSubscription: ${{ variables.AzureServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        $appId = '$(ProfilerEngineEntraAppId)'
        $cfg = az functionapp config appsettings list --name '$(ProfilerEngineAppName)' --resource-group '$(ProfilerEngineResourceGroup)' `
            --query "[?name=='WAREWOLF_ENTRA_CONFIG'].value | [0]" -o tsv
        if ($LASTEXITCODE -ne 0) { throw "Failed to read the app settings of '$(ProfilerEngineAppName)' (exit $LASTEXITCODE)." }

        if ([string]::IsNullOrWhiteSpace($cfg)) {
          throw ("WAREWOLF_ENTRA_CONFIG is not set on '$(ProfilerEngineAppName)', so /secure/* cannot validate the worker's token and every message would be dead-lettered on a 401. " +
                 "Repair it (needs Graph permission the pipeline SP lacks): ./Scripts/Configure-WwExecutionAuth.ps1 -RepairEntraConfigOnly -NonInteractive " +
                 "-SubscriptionId <id> -TenantId <id> -ResourceGroupName '$(ProfilerEngineResourceGroup)' -FunctionAppName '$(ProfilerEngineAppName)' -KnownClientId $appId")
        }
        if ($cfg -notmatch [regex]::Escape($appId)) {
          throw ("WAREWOLF_ENTRA_CONFIG on '$(ProfilerEngineAppName)' does not reference appId $appId (ProfilerEngineEntraAppId). " +
                 "The worker would mint tokens for an audience the engine does not accept. Check the variable, or re-run Configure-WwExecutionAuth.ps1 -RepairEntraConfigOnly -KnownClientId <the right appId>.")
        }
        Write-Host "Verified: WAREWOLF_ENTRA_CONFIG is set on $(ProfilerEngineAppName) and references appId $appId."

  # A raw service-principal login for the QueueProcessor steps - see 'Validate Dev QueueProcessor
  # prerequisites' for why these are not AzureCLI@2 steps. The session lives in this job's default
  # AZURE_CONFIG_DIR, which AzureCLI@2 steps never read or write (each uses a per-task dir), so it
  # cannot leak into the engine steps above.
  #
  # AzureClientId/AzureClientSecret on the definition MUST be the 'Warewolf DevOps' SP (appId
  # a15fdb40-..., the same one Load Tests/Cloud use): it holds User Access Administrator on
  # acrwarewolf and on the WWExecutionEngine vault, which Deploy-WwQueueProcessor.ps1's
  # Assert-RoleAssigned needs for the AcrPull / Key Vault Secrets User grants. The definition
  # originally carried 'shovel bridge staging load test' (e510a863-...), which holds NO Azure role
  # at all - so the check below reads the caller's effective permissions on both scopes (ARM
  # permissions API: no Graph needed) and fails here, not after the image build.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      az login --service-principal -u $env:AzureClientIdValue -p $env:AzureClientSecretValue --tenant $env:AzureTenantIdValue --allow-no-subscriptions | Out-Null
      if ($LASTEXITCODE -ne 0) { throw "az login as the pipeline service principal failed (exit $LASTEXITCODE)." }
      $account = az account show | ConvertFrom-Json
      Write-Host "Logged in: $($account.name) ($($account.id)) as SP $env:AzureClientIdValue"

      $vaultName = ([Uri]'$(ProfilerWorkerRabbitMqSecretUri)').Host.Split('.')[0]
      $scopes = [ordered]@{
        "registry $(ProfilerAcrName)" = "/subscriptions/$($account.id)/resourceGroups/$(ProfilerEngineResourceGroup)/providers/Microsoft.ContainerRegistry/registries/$(ProfilerAcrName)"
        "vault $vaultName"            = "/subscriptions/$($account.id)/resourceGroups/$(ProfilerEngineResourceGroup)/providers/Microsoft.KeyVault/vaults/$vaultName"
      }
      $missing = @()
      foreach ($label in $scopes.Keys) {
        $perms = az rest --method get --url "https://management.azure.com$($scopes[$label])/providers/Microsoft.Authorization/permissions?api-version=2022-04-01" 2>$null | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0 -or -not $perms) { $missing += "$label (cannot even read it)"; continue }
        $can = $false
        foreach ($p in @($perms.value)) {
          $granted = @($p.actions) | Where-Object { $_ -in '*', 'Microsoft.Authorization/*', 'Microsoft.Authorization/roleAssignments/*', 'Microsoft.Authorization/roleAssignments/write' }
          $denied  = @($p.notActions) | Where-Object { $_ -in 'Microsoft.Authorization/*', 'Microsoft.Authorization/roleAssignments/*', 'Microsoft.Authorization/roleAssignments/write', 'Microsoft.Authorization/*/Write' }
          if ($granted -and -not $denied) { $can = $true }
        }
        if (-not $can) { $missing += $label }
      }
      if ($missing) {
        throw ("Service principal $env:AzureClientIdValue cannot create role assignments on: $($missing -join ', '). " +
               "Deploy-WwQueueProcessor.ps1 must grant the worker identity AcrPull and 'Key Vault Secrets User' there. " +
               "Set AzureClientId/AzureClientSecret on this pipeline definition to the 'Warewolf DevOps' SP (a15fdb40-...), as the Load Tests pipeline does.")
      }
      Write-Host "Verified: SP can create role assignments on $($scopes.Keys -join ' and ')."
    displayName: 'Log in to Azure CLI (QueueProcessor steps)'
    env:
      AzureClientIdValue: $(AzureClientId)
      AzureClientSecretValue: $(AzureClientSecret)
      AzureTenantIdValue: $(AzureTenantId)

  # Declares the worker's queue AND its dead-letter queue on CloudAMQP: exchange + queue + binding
  # with an EMPTY routing key, for the reasons documented on the UAT file's identical step
  # (PublishRabbitMQActivity and Publish-WwQueueBurst publish to an exchange NAMED AFTER THE QUEUE;
  # a queue alone routes nothing and the broker discards every publish without an error).
  #
  # DURABLE, and checked. The trigger file declares Durable=true for both queues, and RabbitMQ
  # answers PRECONDITION_FAILED to a redeclare with different arguments - which the worker would
  # hit at startup, crash-looping in a way ACA reports only as CrashLoopBackOff. A queue that
  # already exists NON-durable (an earlier hand-made test queue, say) is therefore a hard failure
  # with the fix spelled out, rather than something to "tolerate".
  #
  # Talks to CloudAMQP's management API, which is LavinMQ's. LavinMQ implements the queue, exchange
  # and binding endpoints used here, but this exact sequence had not been run against it when this
  # was written - if it fails, the response body is printed.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $mgmtUri  = '$(ProfilerSinkRabbitMqManagementUri)'
      $vhost    = '$(ProfilerSinkRabbitMqVirtualHost)'
      $pair     = "$(ProfilerSinkRabbitMqUsername):$env:CloudAmqpPasswordValue"
      $headers  = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
      $vhostEnc = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }

      function Get-BrokerObject([string] $Path) {
        try {
          # Assign first: see the UAT file's Get-RabbitObject for why 'return <cmd>' mangles arrays.
          $result = Invoke-RestMethod -Method Get -Uri "$mgmtUri/$Path" -Headers $headers -TimeoutSec 30
          return $result
        } catch {
          if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) { return $null }
          throw
        }
      }

      function Send-Broker([string] $Method, [string] $Path, [string] $Body) {
        try {
          Invoke-RestMethod -Method $Method -Uri "$mgmtUri/$Path" -Headers $headers -ContentType 'application/json' -Body $Body -TimeoutSec 30 | Out-Null
        } catch {
          $detail = if ($_.ErrorDetails.Message) { $_.ErrorDetails.Message } else { $_.Exception.Message }
          throw "$Method $Path failed: $detail"
        }
      }

      function Confirm-QueueTopology([string] $Name) {
        $enc = [Uri]::EscapeDataString($Name)

        $queue = Get-BrokerObject "api/queues/$vhostEnc/$enc"
        if ($queue) {
          if ($queue.durable -ne $true) {
            throw "Queue '$Name' already exists on vhost '$vhost' but is NOT durable. The trigger declares it durable, so the worker would fail with PRECONDITION_FAILED at startup. Delete the queue (DELETE $mgmtUri/api/queues/$vhostEnc/$enc) and re-run."
          }
          Write-Host "Queue '$Name' already exists (durable)."
        } else {
          Write-Host "Declaring queue '$Name' (durable)..."
          Send-Broker 'Put' "api/queues/$vhostEnc/$enc" '{"durable":true,"auto_delete":false,"arguments":{}}'
        }

        if (Get-BrokerObject "api/exchanges/$vhostEnc/$enc") {
          Write-Host "Exchange '$Name' already exists."
        } else {
          Write-Host "Declaring exchange '$Name' (direct, durable)..."
          Send-Broker 'Put' "api/exchanges/$vhostEnc/$enc" '{"type":"direct","durable":true,"auto_delete":false,"internal":false,"arguments":{}}'
        }

        $bound = @((Get-BrokerObject "api/queues/$vhostEnc/$enc/bindings") | Where-Object { $_.source -eq $Name -and $_.routing_key -eq '' }).Count -gt 0
        if (-not $bound) {
          Write-Host "Binding exchange '$Name' -> queue '$Name' (empty routing key)..."
          Send-Broker 'Post' "api/bindings/$vhostEnc/e/$enc/q/$enc" '{"routing_key":"","arguments":{}}'
        }

        # Re-read: a half-built topology must not reach the burst, where it is indistinguishable
        # from a broker that accepts messages and loses them.
        $final = @((Get-BrokerObject "api/queues/$vhostEnc/$enc/bindings") | Where-Object { $_.source -eq $Name -and $_.routing_key -eq '' }).Count -gt 0
        if (-not $final) {
          throw "Topology INCOMPLETE for '$Name': no binding from exchange '$Name' with an empty routing key. Every publish would be accepted and silently discarded."
        }
        Write-Host "Topology OK for '$Name' (queue + exchange + empty-key binding)."
      }

      Confirm-QueueTopology '$(ProfilerWorkerQueueName)'
      Confirm-QueueTopology '$(ProfilerWorkerDeadLetterQueueName)'
    displayName: 'Ensure worker queue + dead-letter topology exists (CloudAMQP)'
    env:
      CloudAmqpPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

  # Sink baseline for THIS burst, taken after the HTTP smoke test above has already added its own
  # message, so the burst's delta is measured against the true starting point. Depth AND the publish
  # counter - the sink is capped at 20000 and depth stops moving once it is full (see the UAT file).
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
      $baseline = & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
                   -ReportBaselineOnly `
                   -ManagementUri '$(ProfilerSinkRabbitMqManagementUri)' `
                   -QueueName     '$(ProfilerSinkQueueName)' `
                   -VHost         '$(ProfilerSinkRabbitMqVirtualHost)' `
                   -Username      '$(ProfilerSinkRabbitMqUsername)' `
                   -Password      $pw
      Write-Host "##vso[task.setvariable variable=WorkerSinkDepthBefore]$($baseline.Depth)"
      Write-Host "##vso[task.setvariable variable=WorkerSinkPublishedBefore]$($baseline.Published)"
      Write-Host "Sink before the worker burst: depth $($baseline.Depth), published counter $($baseline.Published)"
    displayName: 'Capture sink baseline (before worker burst)'
    env:
      SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

  # Deploys ONE Container App for the trigger (0..20 replicas on the KEDA rabbitmq scaler), redeployed
  # in place every run. Deploy-WwQueueProcessor.ps1 comes from the downloaded scripts zip, like the
  # engine orchestrator - see the UAT file's header on what that does and does not prove.
  #
  # -EngineResourceAppId is the audience of the Entra app registered for wwprofilerlw; the worker's
  # managed identity mints its own token against it, so no client secret is involved. The
  # Warewolf_QueueProcessor app-role grant the script attempts needs AppRoleAssignment.ReadWrite.All
  # and is NON-FATAL: check the printed engineAppRole status rather than assuming it landed.
  #
  # The deploy is judged by its own summary JSON, not by its exit code: a per-trigger failure is
  # recorded there and the run can otherwise finish looking clean.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      & '$(QueueProcessorDeployScriptPath)' `
          -ResourceGroup       '$(ProfilerEngineResourceGroup)' `
          -Location            '$(ProfilerEngineLocation)' `
          -AcaEnvironment      '$(ProfilerAcaEnvironment)' `
          -AcrName             '$(ProfilerAcrName)' `
          -AppNamePrefix       '$(ProfilerWorkerAppNamePrefix)' `
          -PublishPath         '$(QueueWorkerPublishPath)' `
          -DockerfilePath      '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.QueueProcessor\Dockerfile' `
          -TriggerFilePath     '$(Build.SourcesDirectory)\Dev\.azure\ProfilerDev.trigger.bite' `
          -QueueSourcePath     '$(QueueWorkerSourcePath)' `
          -EngineBaseUrl       'https://$(ProfilerEngineAppName).azurewebsites.net' `
          -EngineResourceAppId '$(ProfilerEngineEntraAppId)' `
          -KeyVaultName        '$(ProfilerEngineKeyVaultName)' `
          -KeyVaultSecretName  '$(ProfilerEngineKeyVaultSecretName)' `
          -RabbitMqSecretUri   $env:WorkerRabbitMqSecretUriValue `
          -EncryptStagedSettings `
          -LogDir              "$(Agent.BuildDirectory)\ProfilerDevWorkerDeploy" `
          -NonInteractive

      $summary = Get-ChildItem "$(Agent.BuildDirectory)\ProfilerDevWorkerDeploy\deploy-WwQueueProcessor-*.summary.json" -ErrorAction Stop |
          Sort-Object LastWriteTime -Descending | Select-Object -First 1
      $deployed = (Get-Content -LiteralPath $summary.FullName -Raw | ConvertFrom-Json).queueProcessorApps | Select-Object -First 1
      if (-not $deployed -or $deployed.status -ne 'deployed') {
        throw "QueueProcessor deploy did not succeed for trigger '$($deployed.trigger)': $($deployed.error)"
      }
      if ($deployed.PSObject.Properties.Name -contains 'engineAppRole') {
        Write-Host "Engine app role grant for $($deployed.app): $($deployed.engineAppRole | ConvertTo-Json -Compress)"
      }
      Write-Host "##vso[task.setvariable variable=ProfilerWorkerAppName]$($deployed.app)"
      Write-Host "Deployed QueueProcessor Container App: $($deployed.app)"
    displayName: 'Deploy QueueProcessor Container App (az acr build, DEV2/aca-warewolf)'
    env:
      WorkerRabbitMqSecretUriValue: $(ProfilerWorkerRabbitMqSecretUri)

  # Publishes the burst in the FLAT 16-field shape RequestForProfiling declares - required by the
  # trigger's MapEntireMessage:false binding (see Publish-WwQueueBurst.ps1's '-BodyShape Profiler').
  # Publish-WwQueueBurst.ps1 re-checks the topology itself and proves the publish against the
  # broker's own counter, so a burst the broker never received cannot be reported as sent.
  # -PublishPath supplies RabbitMQ.Client from the worker package.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Write-Host "##vso[task.setvariable variable=WorkerBurstStartedUtc]$([DateTime]::UtcNow.ToString('o'))"
      & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Publish-WwQueueBurst.ps1' `
          -QueueName      '$(ProfilerWorkerQueueName)' `
          -SuccessCount   $(ProfilerBurstMessageCount) `
          -BodyShape      'Profiler' `
          -Label          'profilerdev' `
          -SourceBitePath '$(QueueWorkerSourcePath)\0b142714-8f6d-41b7-9832-2aefa8c731ec.bite' `
          -PublishPath    '$(QueueWorkerPublishPath)' `
          -ManifestPath   "$(Agent.BuildDirectory)\ProfilerDevManifest.json"
    displayName: 'Publish the burst ($(ProfilerBurstMessageCount) messages, RequestForProfiling shape)'

  # Polls the worker queue's depth over the management API until it has been EMPTY for the quiet
  # window. An empty reading alone is not the signal: the depth counts ready and unacked messages,
  # but a replica that has just been scaled to zero mid-drain, or one still holding a delivery,
  # can make the queue look finished for a poll or two - the quiet window covers that.
  # A drain that never completes is reported and the run continues to the reconciliation, which
  # then names exactly which messages were never processed.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $mgmtUri  = '$(ProfilerSinkRabbitMqManagementUri)'
      $vhost    = '$(ProfilerSinkRabbitMqVirtualHost)'
      $pair     = "$(ProfilerSinkRabbitMqUsername):$env:CloudAmqpPasswordValue"
      $headers  = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
      $vhostEnc = if ($vhost -eq '/') { '%2f' } else { [Uri]::EscapeDataString($vhost) }

      function Get-Depth([string] $Name) {
        Invoke-RestMethod -Uri "$mgmtUri/api/queues/$vhostEnc/$([Uri]::EscapeDataString($Name))" -Headers $headers -TimeoutSec 30
      }

      $quiet      = [int]'$(ProfilerDrainQuietSeconds)'
      $deadline   = (Get-Date).AddSeconds([int]'$(ProfilerDrainTimeoutSeconds)')
      $emptySince = $null
      while ((Get-Date) -lt $deadline) {
        $q = Get-Depth '$(ProfilerWorkerQueueName)'
        $d = Get-Depth '$(ProfilerWorkerDeadLetterQueueName)'
        Write-Host ("{0}  queue={1,-6} consumers={2,-3} dlq={3,-6}" -f (Get-Date).ToUniversalTime().ToString('HH:mm:ss'), $q.messages, $q.consumers, $d.messages)

        if ($q.messages -gt 0) { $emptySince = $null } elseif (-not $emptySince) { $emptySince = Get-Date }
        if ($emptySince -and ((Get-Date) - $emptySince).TotalSeconds -ge $quiet) {
          Write-Host "Drained: queue empty for ${quiet}s (dlq depth $($d.messages))."
          break
        }
        Start-Sleep -Seconds 15
      }
      if (-not $emptySince -or ((Get-Date) - $emptySince).TotalSeconds -lt $quiet) {
        Write-Host "##[warning]Drain wait exceeded $(ProfilerDrainTimeoutSeconds)s without a ${quiet}s quiet window - proceeding to the report so the last observed state is captured. If consumers stayed at 0 the KEDA rule never scaled the worker out of zero (check the broker secret and the LavinMQ note in this file's header)."
      }
    displayName: 'Wait for the worker queue to drain'
    env:
      CloudAmqpPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

  # Log Analytics ingestion lags 2-5 minutes behind a live delivery; a report run straight after
  # the drain reads as "nothing happened" even on a healthy run (see Get-WwQueueRunReport.ps1).
  - powershell: |
      Write-Host 'Waiting 4 minutes for Log Analytics ingestion...'
      Start-Sleep -Seconds 240
    displayName: 'Wait for Log Analytics ingestion'

  # Reconstructs every delivery from the worker's (and, when ProfilerEngineAppInsightsName is set,
  # the engine's) logs and reconciles it against the published manifest. A drained queue proves
  # nothing on its own: success AND dead-lettering both empty it and both scale the app to zero.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      if ([string]::IsNullOrWhiteSpace($env:WorkerAppNameValue) -or $env:WorkerAppNameValue -match '^\$\(') {
        throw "ProfilerWorkerAppName was not set - the 'Deploy QueueProcessor Container App' step must have failed before recording the app name."
      }

      $reportArgs = @{
        ResourceGroup    = '$(ProfilerEngineResourceGroup)'
        AcaEnvironment   = '$(ProfilerAcaEnvironment)'
        AppName          = $env:WorkerAppNameValue
        LastMinutes      = 120
        ExpectedManifest = "$(Agent.BuildDirectory)\ProfilerDevManifest.json"
        OutputDir        = "$(Agent.BuildDirectory)\ProfilerDevReport"
      }
      $engineAi = '$(ProfilerEngineAppInsightsName)'
      if (-not [string]::IsNullOrWhiteSpace($engineAi) -and $engineAi -notmatch '^\$\(') {
        $reportArgs.IncludeEngine          = $true
        $reportArgs.EngineAppInsightsName  = $engineAi
      } else {
        Write-Host '##[warning]ProfilerEngineAppInsightsName is not set - reconciling worker-side only (each message acked or dead-lettered), without the engine response per message.'
      }
      & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Get-WwQueueRunReport.ps1' @reportArgs

      $reportFile = Get-ChildItem "$(Agent.BuildDirectory)\ProfilerDevReport\queue-run-report-*.json" -ErrorAction Stop |
          Sort-Object LastWriteTime -Descending | Select-Object -First 1
      $result = Get-Content -LiteralPath $reportFile.FullName -Raw | ConvertFrom-Json

      if ($result.totals.deliveries -eq 0) {
        throw "No deliveries observed for '$($env:WorkerAppNameValue)' - the worker did not process the burst (never scaled out of zero, or its logs have not been ingested yet)."
      }
      if ($result.reconciliation.missing.Count -gt 0 -or $result.reconciliation.mismatched.Count -gt 0) {
        foreach ($mm in $result.reconciliation.mismatched) {
          foreach ($msg in @($result.messages | Where-Object { $_.Txn -eq $mm.Txn })) {
            $engine = if ($msg.EngineStatus) { "HTTP $($msg.EngineStatus) ($($msg.EngineClass))" }
                      elseif ($msg.EngineTransport) { "transport: $($msg.EngineTransport)" }
                      else { 'NOT RECORDED' }
            Write-Host "##[warning]Txn '$($mm.Txn)' -> Outcome=$($msg.Outcome) Engine=$engine Url='$($msg.EngineUrl)' ExecutionId=$($msg.ExecutionId)"
            if ($msg.EngineBody) { Write-Host "##[warning]  Engine body: $($msg.EngineBody)" }
          }
        }
        $codes = @($result.totals.engineStatusCounts.PSObject.Properties | ForEach-Object { "$($_.Name) x$($_.Value)" }) -join ', '
        $why = if ($codes) { " Engine responses: $codes." }
               elseif ($result.totals.engineTransportFailures -gt 0) { " Engine was unreachable ($($result.totals.engineTransportFailures) transport failure(s))." }
               else { ' No engine response was recorded - check the published report artefact.' }
        # 401 x N here is the signature of an engine Entra/audience problem, not of a bad message.
        throw "Dev burst was not reconciled: $($result.reconciliation.missing.Count) missing, $($result.reconciliation.mismatched.Count) mismatched.$why"
      }
      Write-Host "QueueProcessor burst passed: $($result.totals.succeeded) succeeded, $($result.totals.deadLettered) dead-lettered."
    displayName: 'Verify the QueueProcessor burst was processed'
    env:
      WorkerAppNameValue: $(ProfilerWorkerAppName)

  - task: PublishPipelineArtifact@1
    displayName: 'Publish QueueProcessor run report'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      targetPath: '$(Agent.BuildDirectory)\ProfilerDevReport'
      artifact: ProfilerDevQueueRunReport
      publishLocation: pipeline

  # The last leg, and the one the worker-side report cannot see: RequestForProfiling's own publish
  # to the sink. The engine returns 2xx before the sink is proven, so a delivery that "succeeded"
  # can still have lost its result. Compared on the broker's cumulative publish COUNTER - the sink is
  # capped at 20000, so its depth stops rising once full. If the counter is unavailable the check
  # degrades to a warning, because the per-message reconciliation above has already established that
  # every message reached the engine and was answered.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $expected = [int]'$(ProfilerBurstMessageCount)'
      $before = '$(WorkerSinkPublishedBefore)'
      if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^\$\(') { $before = '-1' }

      $pw = ConvertTo-SecureString $env:SinkRabbitMqPasswordValue -AsPlainText -Force
      $after = & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Test-WwSinkDelivery.ps1' `
                -ReportBaselineOnly `
                -ManagementUri '$(ProfilerSinkRabbitMqManagementUri)' `
                -QueueName     '$(ProfilerSinkQueueName)' `
                -VHost         '$(ProfilerSinkRabbitMqVirtualHost)' `
                -Username      '$(ProfilerSinkRabbitMqUsername)' `
                -Password      $pw

      if ([long]$before -lt 0 -or $after.Published -lt 0) {
        Write-Host "##[warning]The sink's publish counter is unavailable (before=$before, after=$($after.Published)) - cannot count the burst's results at the sink. Worker-side reconciliation stands."
        return
      }
      $delta = $after.Published - [long]$before
      Write-Host "Sink publish counter: $before -> $($after.Published) (+$delta); expected at least +$expected."
      if ($delta -lt $expected) {
        throw "Only $delta of $expected results reached the sink '$(ProfilerSinkQueueName)'. The engine answered the worker but RequestForProfiling's RabbitMQ publish did not complete for $($expected - $delta) message(s)."
      }
    displayName: 'Verify results reached the sink (worker burst)'
    condition: succeeded()
    env:
      SinkRabbitMqPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)
