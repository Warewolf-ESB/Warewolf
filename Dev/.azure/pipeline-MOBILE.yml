# Mobile Studio release: publishes the signed Android APK that pipeline.yml ("Warewolf",
# Compile_Release > build_release_apk) built, to the public release container, and links it from
# the run's summary page:
#
#   https://stwwreleases.blob.core.windows.net/releases/WarewolfStudio-<version>.apk   (immutable)
#   https://stwwreleases.blob.core.windows.net/releases/WarewolfStudio-latest.apk      (stable link)
#
# It runs when the "Warewolf" pipeline's Compile_Release stage succeeds on a main branch (develop,
# 7580*, 7232* - the branches pipeline.yml's IsMainBranch covers, the only ones that build the APK).
# The Release stage checks that branch again, so a manual run against a feature-branch build of
# "Warewolf" cannot publish anything.
#
# A versioned APK is never overwritten (--overwrite false), so re-running this for a published
# version fails by design. WarewolfStudio-latest.apk is overwritten, but only by a HIGHER version
# (its x-ms-meta-version records which one it is), so an older build finishing late cannot move it back.
#
# One-time setup:
#   - Create this pipeline from Dev/.azure/pipeline-MOBILE.yml and name it "Mobile Studio Release".
#   - Allow it to use the service connection 'AzureStorage-WarewolfReleases' (the one pipeline-CLOUD.yml
#     uses; it must have "Storage Blob Data Contributor" on stwwreleases) and the "Warewolf" pipeline's
#     artifacts. Service connections are authorized at compile time, so it stays a literal below.
trigger: none
pr: none

resources:
  pipelines:
  - pipeline: ci
    source: 'Warewolf'
    trigger:
      branches:
        include:
          - develop
          - 7580*
          - 7232*
      stages:
        - Compile_Release

variables:
  AzureStorageAccountName: 'stwwreleases'
  AzureStorageContainerName: 'releases'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Release
  displayName: 'Publish Mobile Studio APK (Azure Storage)'
  condition: and(succeeded(), or(eq(variables['resources.pipeline.ci.sourceBranch'], 'refs/heads/develop'), startsWith(variables['resources.pipeline.ci.sourceBranch'], 'refs/heads/7580'), startsWith(variables['resources.pipeline.ci.sourceBranch'], 'refs/heads/7232')))
  jobs:

  - job: Publish_Apk
    displayName: 'Upload APK and link it'

    steps:
    # Only for WwAzCli.psm1 (az retries); the APK itself comes from the "Warewolf" run.
    - checkout: self
      fetchDepth: 1

    - download: ci
      artifact: MobileStudioApk
      displayName: 'Download MobileStudioApk from the Warewolf run'

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $dir = '$(Pipeline.Workspace)/ci/MobileStudioApk'
        $versionFile = Join-Path $dir 'FullVersionString'
        if (-not (Test-Path -LiteralPath $versionFile)) { throw "FullVersionString not found in MobileStudioApk - was it built by build_release_apk?" }
        $version = (Get-Content -LiteralPath $versionFile -Raw).Trim()
        if ([string]::IsNullOrWhiteSpace($version) -or $version.StartsWith('0.0.')) { throw "MobileStudioApk has no valid version ('$version')." }
        $apk = Join-Path $dir "WarewolfStudio-$version.apk"
        if (-not (Test-Path -LiteralPath $apk)) { throw "$apk not found in MobileStudioApk." }
        Write-Host "##vso[task.setvariable variable=ApkVersion]$version"
        Write-Host "##vso[task.setvariable variable=ApkPath]$apk"
        Write-Host "APK $version from $(resources.pipeline.ci.sourceBranch), Warewolf run $(resources.pipeline.ci.runName)"
      displayName: 'Read APK version'

    - task: AzureCLI@2
      displayName: 'Upload APK to Azure Storage'
      inputs:
        azureSubscription: 'AzureStorage-WarewolfReleases'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          Import-Module '$(Build.SourcesDirectory)/Dev/Warewolf.Execution.Lightweight/Scripts/WwAzCli.psm1' -Force
          Set-Alias -Name az -Value Invoke-WwAz -Scope Script
          $contentType = 'application/vnd.android.package-archive'
          $versionedName = 'WarewolfStudio-$(ApkVersion).apk'
          $latestName = 'WarewolfStudio-latest.apk'

          # A published version is immutable.
          az storage blob upload `
            --account-name '$(AzureStorageAccountName)' `
            --container-name '$(AzureStorageContainerName)' `
            --name $versionedName `
            --file '$(ApkPath)' `
            --content-type $contentType `
            --metadata "version=$(ApkVersion)" `
            --auth-mode login `
            --overwrite false
          if ($LASTEXITCODE -ne 0) { throw "APK upload failed ($versionedName)" }

          # The stable link only moves forward.
          $latestVersion = $null
          $exists = az storage blob exists `
            --account-name '$(AzureStorageAccountName)' `
            --container-name '$(AzureStorageContainerName)' `
            --name $latestName `
            --auth-mode login `
            --query exists -o tsv
          if ($LASTEXITCODE -ne 0) { throw "Could not check $latestName" }
          if ($exists -eq 'true') {
            $latestVersion = az storage blob metadata show `
              --account-name '$(AzureStorageAccountName)' `
              --container-name '$(AzureStorageContainerName)' `
              --name $latestName `
              --auth-mode login `
              --query version -o tsv
            if ($LASTEXITCODE -ne 0) { throw "Could not read the version of $latestName" }
          }
          if ($latestVersion -and ([version]$latestVersion -ge [version]'$(ApkVersion)')) {
            Write-Host "$latestName is already $latestVersion (>= $(ApkVersion)); leaving it."
          } else {
            az storage blob upload `
              --account-name '$(AzureStorageAccountName)' `
              --container-name '$(AzureStorageContainerName)' `
              --name $latestName `
              --file '$(ApkPath)' `
              --content-type $contentType `
              --metadata "version=$(ApkVersion)" `
              --auth-mode login `
              --overwrite true
            if ($LASTEXITCODE -ne 0) { throw "APK upload failed ($latestName)" }
            Write-Host "$latestName now points at $(ApkVersion) (was: $(if ($latestVersion) { $latestVersion } else { 'none' }))."
          }

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $base = 'https://$(AzureStorageAccountName).blob.core.windows.net/$(AzureStorageContainerName)'
        $versionedUrl = "$base/WarewolfStudio-$(ApkVersion).apk"
        $latestUrl = "$base/WarewolfStudio-latest.apk"
        $summary = Join-Path '$(Agent.TempDirectory)' 'MobileStudioDownload.md'
        @(
          '# Warewolf Mobile Studio $(ApkVersion)'
          ''
          "- Download this version: [WarewolfStudio-$(ApkVersion).apk]($versionedUrl)"
          "- Always the latest: [WarewolfStudio-latest.apk]($latestUrl)"
          ''
          'Built from $(resources.pipeline.ci.sourceBranch), Warewolf run $(resources.pipeline.ci.runName).'
          'Install on Android: allow installs from your browser or file manager, then open the APK.'
        ) | Set-Content -LiteralPath $summary -Encoding utf8
        Write-Host "##vso[task.uploadsummary]$summary"
        Write-Host "##vso[build.updatebuildnumber]Mobile Studio $(ApkVersion)"
        Write-Host "APK (this version): $versionedUrl"
        Write-Host "APK (latest):       $latestUrl"
      displayName: 'Publish download links'
