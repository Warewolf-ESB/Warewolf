trigger: none

parameters:
  # Manual-run escape hatch for iterating on the rest of the pipeline without paying for
  # (or waiting on) the warm-up call. Defaults to false: leaving pre-warm OFF by default would
  # silently reintroduce the Consumption-plan cold-start failure mode documented at the
  # 'Warm up UAT engine before the load-test burst' step below (64.7s cold vs ~3.1s warm;
  # 31/100 discarded un-warmed vs 0/100 warmed) - a load-test run with SkipPreWarm=true is not
  # representative and should not be used to judge engine capacity.
  - name: SkipPreWarm
    displayName: 'Skip the pre-warm step (debugging only - results will show cold-start failures)'
    type: boolean
    default: false
  # Opt-in: the ProfilerLoadTest_QueueProcessor job (Load_Test stage) deploys its own Container
  # App and publishes a second 20,000-message burst after the Service Bus one has drained, which
  # roughly doubles the stage's wall-clock and Azure spend. Off by default so a routine run proves
  # the Service Bus path only; tick it to load-test the QueueProcessor architecture as well. When
  # off, the job is reported as Skipped and creates no Azure resources.
  - name: RunQueueProcessorLoadTest
    displayName: 'Run the RabbitMQ QueueProcessor load test (20000 messages, ACA)'
    type: boolean
    default: false

pool:
  vmImage: 'windows-2022'

# Pipeline-scoped (visible to every stage/job below) rather than job-scoped: the queue name
# and workflow are needed by BOTH the Deploy_UAT stage's Deploy-WwExecutionEngine.ps1 call
# (-ServiceBusTriggerQueueName/-ServiceBusTriggerWorkflowName, staged into
# Settings/servicebustrigger.bite - WOLF-8517) AND the Load_Test stage's
# ShovelBridgeLoadTest_ExternalServiceBus job (VerifyServiceBusQueueName/VerifyWorkflowName
# below) - a single source of truth keeps the two from drifting apart. Must also match
# whatever -TriggerQueueName Enable-ServiceBusSecureTrigger.ps1 was run against
# WarewolfServer-UAT with (queue creation/RBAC/app-setting - a separate, manual operator
# step per that script's own .SYNOPSIS).
variables:
  WwExecutionServiceBusTriggerQueueName: 'wwexecution-secure-trigger-queue-e2e'
  # 2026-09-14: switched from 'profiler/ProfilerMain' to the real production entry point
  # 'ProfilerServices/ProfilerWrapper/RequestForProfiling' - see the "Stage
  # ProfilerServices/ProfilerWrapper/*.bite" step below for what that workflow actually
  # requires. 2026-09-23: now the authoritative Unlimited.ProfilerServices copy (VersionNumber 4) -
  # it nests ProfilerMain only; the load-test-only RabbitProcess call and dbo.usp_jobs2_* logging
  # were removed.
  WwExecutionServiceBusTriggerWorkflowName: 'ProfilerServices/ProfilerWrapper/RequestForProfiling'

  # ── RabbitMQ source for RequestForProfiling's OWN publish leg ──────────────────────
  # Pipeline-scoped, not job-scoped, because the source .bite is generated in the
  # Stage_UAT_Resources job (which stages UATWorkflowResources) while the rest of the
  # ExternalRabbitMq* settings live in ShovelBridgeLoadTest_ExternalServiceBus's own
  # job-scoped variables block - a job cannot see another job's variables.
  #
  # RequestForProfiling.bite contains a PublishRabbitMQActivity that publishes
  # [[ProfilerInstruction]] to 'collectionv2.profilerrecommendation.request' using
  # RabbitMQSourceResourceId 0b142714-8f6d-41b7-9832-2aefa8c731ec. That source resource existed
  # NOWHERE under Resources/ - its only copy in the repo is a QueueProcessor UNIT-TEST fixture
  # (Warewolf.Execution.QueueProcessor.Tests/TestResources/sources/) which is IsValid="false" and
  # points at a long-dead ngrok tunnel. So the engine had no source to resolve, the publish never
  # happened, and the run still LOOKED healthy: the nested ProfilerMain call's DB writes land via
  # ProfilerDBSource/NewSqlServerSource, which is the only thing -DbVerificationMode
  # 'ProfilerRecommendation' checks. This activity is the ONLY publisher in the whole chain.
  #
  # PublishRabbitMQActivity self-provisions its destination (passive-declare, then
  # ExchangeDeclare/QueueDeclare/QueueBind if absent - see
  # Dev2.Activities/Activities/RabbitMQ/Publish/PublishRabbitMQActivity.cs), so the queue itself
  # needs no provisioning step here.
  #
  # THIS IS THE CLOUDAMQP BROKER, NOT the self-hosted ngrok-tunnelled one. The two brokers sit at
  # OPPOSITE ENDS of this pipeline and must not be conflated:
  #   START of the run - the 20,000-message burst is published to the SELF-HOSTED broker
  #     (ExternalRabbitMqManagementUri 'https://rabbitmq.warewolf.online', reached over its
  #     rotating ngrok TCP tunnel) and shovelled from there into Service Bus.
  #   END of the run   - each execution of RequestForProfiling publishes its own result to
  #     'collectionv2.profilerrecommendation.request' on CLOUDAMQP, which is where those messages
  #     are expected to land and be inspected.
  # -FunctionAppScaleLimit 30 in the Deploy_UAT stage below is already derived from THIS broker's
  # vhost connection limit (40; measured plateau 32/40 on the sibling wwuat3 app) - see that
  # parameter's own comment, which documents the publish target as CloudAMQP. Note that plateau was
  # measured on wwuat3, the app whose deployment DOES carry this source; on WarewolfServer-UAT the
  # publish has never actually opened a connection, because the source below did not exist.
  #
  # Host is the AMQP endpoint, NOT a management URI: PublishRabbitMQActivity opens an AMQP 0-9-1
  # connection, and RabbitMQSource has no TLS option (HostName/Port/UserName/Password/VirtualHost
  # only - Dev2.Data/ServiceModel/RabbitMQSource.cs), so this must be the plaintext AMQP port 5672
  # rather than AMQPS 5671. On CloudAMQP the username and vhost are both the instance name.
  # The instance now runs LavinMQ (CloudAMQP migrated it silently - see the ExternalRabbitMq*
  # variables' own note), which is why it was abandoned as the SHOVEL SOURCE: LavinMQ's Shovel
  # cannot do amqp10 destinations. That does not affect this leg - a plain AMQP 0-9-1 publish is
  # fully supported.
  ProfilerPublishRabbitMqHost: 'ostrich-01.lmq.cloudamqp.com'
  ProfilerPublishRabbitMqPort: '5672'
  ProfilerPublishRabbitMqUserName: 'bmkzdabu'
  ProfilerPublishRabbitMqVirtualHost: 'bmkzdabu'

  # Where the published Lightweight engine, QueueProcessor worker and deployment scripts come from
  # (warewolf.online/release-notes.php) - the same source the Profiler Dev/UAT pipelines deploy
  # from. Leave the *ZipUrl variables EMPTY to track the latest release; set them (queue time, full
  # https URLs on the storage account) only to pin a build - including a build you published to
  # load-test in-flight engine/worker/deploy-script changes, since this pipeline no longer compiles
  # them from the commit. The engine zip is the win-x64 one: WarewolfServer-UAT is a WINDOWS app on
  # the classic Consumption (Y1) plan (2026-10-05; it was Linux Flex before - see Deploy_UAT's
  # -HostingPlan comment). Resolved ONCE, in Deploy_UAT's 'Resolve Published Release
  # URLs' step, and handed to the QueueProcessor job as output variables, so the engine and the
  # worker in one run always come from the same release.
  WarewolfReleasesStorageAccount: 'stwwreleases'
  WarewolfEngineZipUrl: ''
  WarewolfScriptsZipUrl: ''
  WarewolfQueueWorkerZipUrl: ''

stages:
# Compile stage removed (was a full `Compile.ps1 -ServerTests` solution-wide publish of
# ~55 test projects + 3 Function Apps into one flat directory, needed only by the
# Load_Tests job below). That job's "Load Tests" category tests are all in-process
# perf/unit tests (ResourceCatalog, ExecutionManager, tokenizer, PulseTracker,
# DataListViewModel) with no HTTP call to a live engine, so no
# server-under-test is needed and no solution-wide build is needed either. The engine and
# QueueProcessor are no longer compiled here either: both are DOWNLOADED from the published
# release (see WarewolfEngineZipUrl above), so this stage only stages the UAT workflow tree and
# publishes the load-test binaries.
- stage: Build
  jobs:

  - job: Stage_UAT_Resources
    displayName: 'Stage UAT Workflow Resources'
    pool:
      vmImage: 'windows-2022'
    steps:
    - checkout: self
      clean: false

    # WOLF-8510: previously downloaded NewSqlServerSource.bite fresh from the devops
    # endpoint on every run (its connection string used to rotate on every tunnel
    # restart, so it couldn't be committed as a static file). That endpoint dependency
    # has been removed: Resources/rabbit/NewSqlServerSource.bite
    # (SourceId="b9184f70-64ea-4dc5-b23b-02fcd5f91082") is now committed to source
    # control pre-encrypted (WFAES::…, decrypted at runtime via the engine's Key Vault
    # wiring — see docs/KB-Deploying-Encrypted-Sources.md), and is staged into
    # UATWorkflowResources\rabbit alongside RabbitProcess.bite/RabbitProcess2.bite by
    # the "Stage rabbit/*.bite Load-Test Workflows" step below. Do NOT reintroduce a
    # second copy of NewSqlServerSource.bite anywhere else under UATWorkflowResources:
    # LightweightSourceLoader indexes .bite files by ResourceID across the whole
    # Resources tree (Warewolf.Execution.Lightweight/Infrastructure/
    # LightweightSourceLoader.cs BuildFileIndex) and silently lets the last file found
    # win on an ID collision - the CFAccessClientId/CFAccessClientSecret pipeline
    # secrets this step used are no longer needed here.

    # Required resource set per docs/Deploy-UAT-Redeploy-Spec.md §5.4: both load-test
    # workflows plus the committed NewSqlServerSource.bite, EXCLUDING
    # 'NewSqlServerSource (Local Backup).bite' (d3f6a2e1-…) - that source is
    # unreferenced by both workflows and is DPAPI-encrypted under its author's own
    # Windows account, so it can never decrypt on this agent or in Azure.
    - powershell: |
        $destDir = "$(Agent.BuildDirectory)\UATWorkflowResources\rabbit"
        New-Item -ItemType Directory -Force -Path $destDir | Out-Null
        Get-ChildItem '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Resources\rabbit' -File |
            Where-Object { $_.Name -ne 'NewSqlServerSource (Local Backup).bite' } |
            Copy-Item -Destination $destDir -Force
        Write-Host "Staged $((Get-ChildItem $destDir).Count) file(s) into $destDir"
      displayName: 'Stage rabbit/*.bite Load-Test Workflows'

    # 2026-09-17: unpruned. Resources/profiler (a flat, hand-curated 20-file dependency-closure
    # subset of ProfilerMain/RequestForProfiling) has been retired and folded into a single
    # unified Resources/ProfilerServices tree that mirrors the authoritative Unlimited.ProfilerServices
    # layout one-for-one (Auth/, Mock/, Profiler/V2/{API,Private,Private/DAL,Functions,TestFramework},
    # ProfilerWrapper/, Sources/) - the same structure already proven live on the sibling wwuat3 app's
    # C:\UAT3\resources\ProfilerServices. All 53 .bite files are staged now, not just ProfilerMain's
    # narrow runtime closure, so this folder no longer needs the file-by-file gap analysis the old
    # comment block here documented (kept in git history if that trail is ever needed again).
    #
    # ProfilerWrapper/RequestForProfiling.bite is taken VERBATIM from the authoritative tree
    # (VersionNumber 4, 2026-03-09) as of 2026-09-23. The former committed VersionNumber 19 added
    # load-test-only steps (dbo.usp_jobs2_LogStart/LogFinished SQL calls on NewSqlServerSource and a
    # nested RabbitProcess call) that the production workflow does not have; they were removed so the
    # load test replicates production. Its <Category> reads 'ProfilerService\...' (upstream spelling) -
    # harmless, WorkflowIndex resolves by relative path, not Category.
    #
    # One file was deliberately NOT taken verbatim from the authoritative tree when it was merged in,
    # because the committed copy is AHEAD of it:
    #   - Sources/ProfilerDBSource.bite: the authoritative tree's copy is an unresolved release-token
    #     template (ConnectionString="Data Source=#{GenericDBSourceDBServer},...") - never substituted by
    #     this pipeline. The committed copy is the resolved, WFAES-encrypted WarewolfDevOpsTestDb value
    #     every DAL workflow here already depends on; keep it.
    # Profiler/V2/Private/GetTrackingPeriod.bite went the other way - the committed copy was stale
    # (VersionNumber 5, 2026-02-13) against the authoritative tree's VersionNumber 12 (2026-09-08), so
    # the newer copy was taken.
    #
    # Dependency closure re-verified across the full 53-file tree (every SourceID/ResourceID attribute
    # value diffed against every root <Service ID=.../<Source ID=... present): nothing under
    # Resources/ProfilerServices references Resources/rabbit/ any more (NewSqlServerSource b9184f70-...
    # and RabbitProcess 6e09115d-... were only needed by the old v19 RequestForProfiling). No
    # ResourceID collides between Resources/rabbit and Resources/ProfilerServices (checked directly) -
    # LightweightSourceLoader's BuildFileIndex lets the last file found silently win on a collision, so
    # re-check this if either tree ever gains a file with a duplicate ID. Re-run the closure check after
    # adding or removing any resource under Resources/ProfilerServices.
    #
    # The nine newly-added Sources/*.bite files (ALGNAPISource, CampuscanAPISource, Globals,
    # GlobalVariables, JourneyEmailSource, ProfilerLoggingESSource, ProfilerRabbitMQAPISource,
    # ProfilerRabbitMQSource, ProfilerService_CollectionApiSource) are all IsValid="false" release-token
    # templates carrying no real credential (same #{...} pattern as ProfilerDBSource's authoritative
    # copy) - safe to stage as inert placeholders; nothing in this pipeline's exercised path invokes them.
    #
    # A single recursive copy now replaces the two former flat/single-file steps below, because
    # WorkflowIndex.Resolve() keys ProfilerWrapper/RequestForProfiling by its full nested relative path
    # ('profilerservices/profilerwrapper/requestforprofiling') while everything else resolves by
    # ResourceID regardless of path - preserving the whole tree's folder structure satisfies both, so
    # there is no longer a reason to treat ProfilerWrapper as a special case.
    - powershell: |
        $destDir = "$(Agent.BuildDirectory)\UATWorkflowResources\ProfilerServices"
        New-Item -ItemType Directory -Force -Path $destDir | Out-Null
        Copy-Item '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Resources\ProfilerServices\*' `
            -Destination $destDir -Recurse -Force
        # Provision-ProfilerSchema.sql is a DBA artefact (schema + reference data), not an engine
        # resource - the engine only ever indexes *.bite, so it is staged then dropped rather than
        # bloating every deploy artefact. Matches the old profiler/ step's same exclusion rationale.
        Remove-Item -LiteralPath (Join-Path $destDir 'Provision-ProfilerSchema.sql') -Force -ErrorAction SilentlyContinue

        # WOLF-8512 (build 30705): Sources\ProfilerRabbitMQSource.bite here is the release-token
        # TEMPLATE - its ConnectionString carries the literal, never-substituted
        # '#{WarewolfGenericRabbitMQSourceHost}' etc. (see ProfilerPublishRabbitMqHost's own comment
        # at the top of this file). It shares ResourceID 0b142714-8f6d-41b7-9832-2aefa8c731ec with the
        # REAL, CloudAMQP-credentialed copy the "Generate RequestForProfiling CloudAMQP publish
        # source" step below writes to ProfilerWrapper\ProfilerRabbitMQSource.bite.
        # LightweightSourceLoader.BuildFileIndex (Directory.EnumerateFiles, unordered) lets whichever
        # of the two is enumerated LAST silently win a ResourceID collision - build 30705 hit the
        # broken template, dead-lettering all 20000 messages with BrokerUnreachableException/'No such
        # host is known' on RequestForProfiling's trailing RabbitMQ publish step, even though every DB
        # write underneath it succeeded (Profiler.ProfilerRecommendation/MandateScores both showed
        # 20000/20000 reconciled - only the result publish failed). Remove the template from THIS
        # staged copy so only the generated, real source ever ships. Do not remove the file from the
        # source Resources tree itself - it still needs to exist there as part of the 1:1 mirror of
        # the authoritative Unlimited.ProfilerServices layout (see the "unpruned" comment above).
        Remove-Item -LiteralPath (Join-Path $destDir 'Sources\ProfilerRabbitMQSource.bite') -Force -ErrorAction SilentlyContinue

        $staged = Get-ChildItem $destDir -Recurse -File -Filter '*.bite'
        Write-Host "Staged $($staged.Count) file(s) into $destDir"
      displayName: 'Stage ProfilerServices/* Load-Test Workflows (full unpruned set)'

    # Closes the dependency-closure gap described in ProfilerPublishRabbitMqHost's comment at the
    # top of this file: RequestForProfiling's PublishRabbitMQActivity needs RabbitMQSource
    # 0b142714-8f6d-41b7-9832-2aefa8c731ec, which no staged resource provided.
    #
    # GENERATED, never committed. The broker password is a secret pipeline variable
    # (CLOUDAMQP_SHOVEL_PASSWORD - NOT ExternalRabbitMqPassword, which is the self-hosted burst broker's
    # 'testuser' credential; see this step's own check below) - writing it into a
    # source-controlled .bite would put a live credential in git. It is emitted as PLAIN TEXT here
    # and converted to WFAES by the Deploy_UAT stage's -EncryptResources pass, so no plaintext
    # credential is ever uploaded to the Function App. RabbitMQSource's XElement ctor accepts either
    # (Dev2.Data/ServiceModel/RabbitMQSource.cs: CanBeDecrypted() ? Decrypt() : conString, where
    # CanBeDecrypted recognises the WFAES:: prefix via DPAPIWrapper's AES hook) - so the plaintext
    # form works at this stage and the encrypted form works at runtime. Do NOT switch this to DPAPI:
    # a DPAPI blob encrypted on the agent can never decrypt in Azure, which is exactly why
    # 'NewSqlServerSource (Local Backup).bite' is excluded from staging above.
    #
    # ID and ServerID must match the activity's RabbitMQSourceResourceId exactly - sources resolve
    # by ResourceID, not by filename or folder (WorkflowResourceCache.Resolve()), which is also why
    # this file's location alongside the workflow is a readability choice, not a requirement.
    # IsValid="false" deliberately mirrors NewSqlServerSource.bite, the source this same pipeline
    # already resolves successfully - the loader does not gate on that design-time attribute.
    #
    # Named 'ProfilerRabbitMQSource' after the equivalent source in the authoritative profiler tree
    # (C:\builds\Unlimited.ProfilerServices - see docs/ShovelBridge-Architecture.md's 2026-09-13
    # entry). Deliberately NOT 'Warewolf DevOps RabbitMQ Source': that name belongs to a DIFFERENT,
    # pre-existing source (ID 1a82a341-...) for the SELF-HOSTED dev broker, which pipeline-CLOUD.yml
    # downloads into its own Resources folder - reusing it here would imply these two point at the
    # same broker when they are opposite ends of this pipeline. The test fixture this ID was
    # recovered from carries that misleading name; do not copy it back.
    - powershell: |
        $ErrorActionPreference = 'Stop'

        $amqpHost   = '$(ProfilerPublishRabbitMqHost)'
        $amqpPort   = '$(ProfilerPublishRabbitMqPort)'
        $amqpUser   = '$(ProfilerPublishRabbitMqUserName)'
        $amqpVHost  = '$(ProfilerPublishRabbitMqVirtualHost)'
        $amqpPass   = $env:CloudAmqpPasswordValue

        # Deliberately NOT a PowerShell here-string: its closing '"@' must sit at column 0, which
        # dedents out of this YAML block scalar and makes the whole file unparseable.
        if ([string]::IsNullOrWhiteSpace($amqpHost)) {
          throw ("ProfilerPublishRabbitMqHost is not set, so RequestForProfiling's RabbitMQ publish source " +
                 "cannot be generated. It must be the CLOUDAMQP AMQP endpoint (the end-of-run result broker), " +
                 "not the self-hosted ngrok-tunnelled broker the start-of-run burst is published to. Without it " +
                 "the workflow's publish to 'collectionv2.profilerrecommendation.request' silently does nothing " +
                 "while DB rows still appear.")
        }
        # Distinct from ExternalRabbitMqPassword, which belongs to the SELF-HOSTED broker's
        # 'testuser' and authenticates the start-of-run burst. This is the CloudAMQP instance
        # credential ('bmkzdabu'). Named to match the CLOUDAMQP_SHOVEL_PASSWORD convention the
        # integration harness already reads from the environment (see
        # Scripts/Tests/Integration/Run-ShovelBridgeE2E-DevOpsRabbit.ps1).
        if ([string]::IsNullOrWhiteSpace($amqpPass)) {
          throw ("Secret pipeline variable 'CLOUDAMQP_SHOVEL_PASSWORD' is empty - it is required to build " +
                 "RequestForProfiling's CloudAMQP publish source. Set it (as a secret) on this pipeline in " +
                 "Azure DevOps to the 'bmkzdabu' instance password.")
        }

        # SecurityElement::Escape covers & < > " ' so a password containing XML metacharacters
        # cannot corrupt the attribute (or inject markup into the resource).
        $connectionString = "HostName=$amqpHost;Port=$amqpPort;UserName=$amqpUser;Password=$amqpPass;VirtualHost=$amqpVHost"
        $escaped = [System.Security.SecurityElement]::Escape($connectionString)

        $destDir = "$(Agent.BuildDirectory)\UATWorkflowResources\ProfilerServices\ProfilerWrapper"
        New-Item -ItemType Directory -Force -Path $destDir | Out-Null
        $destFile = Join-Path $destDir 'ProfilerRabbitMQSource.bite'

        $xml = @(
          '<Source ID="0b142714-8f6d-41b7-9832-2aefa8c731ec" Name="ProfilerRabbitMQSource" ResourceType="RabbitMQSource" IsValid="false" ConnectionString="' + $escaped + '" Type="RabbitMQSource" ServerVersion="0.0.0.0" ServerID="51a58300-7e9d-4927-a57b-e5d700b11b55">'
          '  <DisplayName>ProfilerRabbitMQSource</DisplayName>'
          '  <TypeOf>RabbitMQSource</TypeOf>'
          '</Source>'
        ) -join [Environment]::NewLine

        [System.IO.File]::WriteAllText($destFile, $xml, (New-Object System.Text.UTF8Encoding($false)))

        # Never echo $connectionString - it carries the password. Host/port/user only.
        Write-Host "Generated RabbitMQ publish source 0b142714-8f6d-41b7-9832-2aefa8c731ec -> amqp://$amqpUser@${amqpHost}:$amqpPort/$($amqpVHost.TrimStart('/'))"
        Write-Host "Staged $((Get-ChildItem $destDir).Count) file(s) into $destDir"
      displayName: 'Generate RequestForProfiling CloudAMQP publish source'
      env:
        CloudAmqpPasswordValue: $(CLOUDAMQP_SHOVEL_PASSWORD)

    - task: PublishPipelineArtifact@1
      displayName: 'Publish UAT Workflow Resources'
      inputs:
        targetPath: '$(Agent.BuildDirectory)\UATWorkflowResources'
        artifact: 'UATWorkflowResources'
        publishLocation: 'pipeline'

  - job: Build_LoadTestBinaries
    displayName: 'Publish Load Test Binaries'
    pool:
      vmImage: 'windows-2022'
    steps:
    - checkout: self
      clean: false

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    # Dev2.Integration.Tests is the only project Load_Tests below actually needs. Building
    # just this project (a plain project publish, not the ServerTests.sln solution publish)
    # pulls in its own transitive project-reference graph (Dev2.Studio.Core,
    # Dev2.Runtime.Hosting, Dev2.Common, Dev2.Data, Dev2.Controller, ...) without any of the
    # flat-directory collisions ServerTests.sln's multi-project publish requires re-pinning
    # host.json/worker.config.json/RabbitMQ.Client.dll for (see WOLF-8508 above) - none of
    # that machinery is relevant here, since no Function App is published in this job.
    # -c Debug matches Compile.ps1's own default $Config for this project (its Resources
    # content items are conditioned on Configuration==Debug) - this project has never been
    # built in Release in CI, so Debug is the proven configuration, not an arbitrary choice.
    - task: DotNetCoreCLI@2
      displayName: 'Publish Load Test Binaries (Dev2.Integration.Tests, Debug)'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/Dev/Dev2.IntegrationTests/Dev2.Integration.Tests.csproj'
        # This project's reference closure includes Dev2.Server, Dev2.Studio, and several
        # test projects that each produce their own apphost.exe/deps.json/runtimeconfig.json.
        # --runtime win-x64 publishes that whole closure RID-aware into one flat --output
        # folder, so those files collide (NETSDK1152) without the same flag Compile.ps1
        # uses for its own flat solution-wide publish (Compile.ps1 line ~381).
        arguments: '--configuration Debug --runtime win-x64 --self-contained false --output $(Agent.BuildDirectory)\LoadTestBinaries -p:ErrorOnDuplicatePublishOutputFiles=false'
        zipAfterPublish: false
        modifyOutputPath: false

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Load Test Binaries'
      inputs:
        targetPath: '$(Agent.BuildDirectory)\LoadTestBinaries'
        artifact: 'LoadTestBinaries'
        publishLocation: 'pipeline'

# Deploys the PUBLISHED Lightweight engine to WarewolfServer-UAT before Load_Test runs against
# it. Added per docs/Deploy-UAT-Redeploy-Spec.md §10 ("Automate UAT deploys... add a deploy
# stage to pipeline-LOADTEST.yml") — until this stage existed, NOTHING in CI deployed
# WarewolfServer-UAT: pipeline-CLOUD.yml's own Deploy_And_Test_Azure_Functions job deliberately
# targets a DIFFERENT app ('warewolfserver', not '-uat' — see that job's header comment on why it
# was moved off UAT), so ShovelBridgeLoadTest_ExternalServiceBus below was silently exercising
# whatever a manual, undocumented deploy had last left running - the exact gap that produced the
# 2026-08-13/14 stale-deployment chase documented across that spec's §9-§13.
#
# 2026-10-05: the engine package AND Deploy-WwExecutionEngine.ps1 now come from the published
# release (warewolf.online/release-notes.php), exactly as the Profiler Dev/UAT pipelines
# (ProfilerService-CI-*-LightweightExecutionEngine.yml) deploy them - this pipeline load-tests
# what has been RELEASED, not in-flight edits on this commit. To load-test unreleased engine or
# deploy-script changes, publish a build and pin WarewolfEngineZipUrl/WarewolfScriptsZipUrl to it.
# Every run still deploys a fresh package and full-restarts the app, so the §9-§13 stale-
# deployment failure mode stays closed: the pipeline deploys exactly the release it names.
- stage: Deploy_UAT
  displayName: 'Deploy Lightweight Engine to UAT'
  jobs:

  - job: Deploy_UAT
    displayName: 'Deploy to WarewolfServer-UAT'
    pool:
      vmImage: 'windows-2022'
    steps:
    # Repo checkout still needed: the persistence settings, the persistence DB source and
    # WwAzCli.psm1 are git-tracked here, and every verification step (security-flag read-back,
    # smoke test) runs from this commit. Only the engine and its DEPLOY script come from the
    # release.
    - checkout: self
      clean: false

    # Resolves the currently published engine, deployment-scripts and QueueProcessor zip URLs from
    # warewolf.online/release-notes.php, which carries data-role="engine-windows-zip-link",
    # data-role="scripts-zip-link" and data-role="queueworker-zip-link" anchors maintained by the
    # Warewolf release pipeline (Dev/.azure/Update-ReleaseNotes.ps1). Same step as the Profiler
    # Dev/UAT pipelines', plus the worker URL - resolved HERE, once, and published as output
    # variables (name: ResolveRelease) so the Load_Test stage's ProfilerLoadTest_QueueProcessor job
    # deploys a worker and scripts from the SAME release as this engine, even if a new release
    # lands on the page mid-run.
    #
    # release-notes.php is PUBLIC content, so its markup is untrusted input for a URL this agent
    # will fetch and expand on disk. Every resolved URL is therefore checked to be https and to
    # point at the expected storage account host before anything is downloaded. A pinned
    # $(Warewolf*ZipUrl) override is held to the identical check: a pipeline variable is a softer
    # target than it looks, and there is no reason to trust one more than the page.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $expectedHost = '$(WarewolfReleasesStorageAccount).blob.core.windows.net'

        function Assert-TrustedReleaseUrl {
            param([string] $Url, [string] $What)
            $parsed = $null
            if (-not [uri]::TryCreate($Url, [UriKind]::Absolute, [ref]$parsed) -or
                $parsed.Scheme -ne 'https' -or $parsed.Host -ne $expectedHost) {
                throw "Refusing to fetch the $What from untrusted URL '$Url' (expected https://$expectedHost/...)."
            }
            return $Url
        }

        $engineUrl  = '$(WarewolfEngineZipUrl)'
        $scriptsUrl = '$(WarewolfScriptsZipUrl)'
        $workerUrl  = '$(WarewolfQueueWorkerZipUrl)'

        if ([string]::IsNullOrWhiteSpace($engineUrl) -or [string]::IsNullOrWhiteSpace($scriptsUrl) -or [string]::IsNullOrWhiteSpace($workerUrl)) {
            $notes = Invoke-WebRequest -Uri 'https://warewolf.online/release-notes.php' -UseBasicParsing -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
            if ([string]::IsNullOrWhiteSpace($engineUrl)) {
                # The WINDOWS engine zip specifically: WarewolfServer-UAT is a classic Consumption
                # (Y1) app (-HostingPlan 'Consumption' below), created with --os-type Windows.
                # Deliberately no fallback to the legacy pre-split data-role="engine-zip-link",
                # whose runtime depends on the release that published it - pin
                # WarewolfEngineZipUrl instead.
                $m = [regex]::Match($notes.Content, 'data-role="engine-windows-zip-link"[^>]*href="([^"]+)"')
                if (-not $m.Success) { throw 'Could not find data-role="engine-windows-zip-link" on warewolf.online/release-notes.php. Pin WarewolfEngineZipUrl (a win-x64 AzureFunctionsPackage zip) as a queue-time variable to unblock this build.' }
                $engineUrl = $m.Groups[1].Value
            }
            if ([string]::IsNullOrWhiteSpace($scriptsUrl)) {
                $m = [regex]::Match($notes.Content, 'data-role="scripts-zip-link"[^>]*href="([^"]+)"')
                if (-not $m.Success) { throw 'Could not find data-role="scripts-zip-link" on warewolf.online/release-notes.php. Pin WarewolfScriptsZipUrl as a queue-time variable to unblock this build.' }
                $scriptsUrl = $m.Groups[1].Value
            }
            if ([string]::IsNullOrWhiteSpace($workerUrl)) {
                $m = [regex]::Match($notes.Content, 'data-role="queueworker-zip-link"[^>]*href="([^"]+)"')
                if (-not $m.Success) { throw 'Could not find data-role="queueworker-zip-link" on warewolf.online/release-notes.php. Pin WarewolfQueueWorkerZipUrl (a Warewolf-QueueProcessor-<ver>.zip) as a queue-time variable to unblock this build.' }
                $workerUrl = $m.Groups[1].Value
            }
        }

        $engineUrl  = Assert-TrustedReleaseUrl -Url $engineUrl  -What 'engine package'
        # A pinned override is held to the same runtime rule as the page: a linux-x64 package
        # deploys "successfully" to a Windows Y1 app and then fails every invocation.
        if ($engineUrl -match 'linux-x64') { throw "WarewolfEngineZipUrl '$engineUrl' is a linux-x64 package; WarewolfServer-UAT is Windows (Consumption Y1) and needs the win-x64 AzureFunctionsPackage zip." }
        $scriptsUrl = Assert-TrustedReleaseUrl -Url $scriptsUrl -What 'deployment scripts package'
        $workerUrl  = Assert-TrustedReleaseUrl -Url $workerUrl  -What 'QueueProcessor package'

        Write-Host "##vso[task.setvariable variable=ResolvedEngineZipUrl]$engineUrl"
        Write-Host "##vso[task.setvariable variable=ResolvedScriptsZipUrl]$scriptsUrl"
        # Output variables for ProfilerLoadTest_QueueProcessor (Load_Test stage).
        Write-Host "##vso[task.setvariable variable=ResolvedScriptsZipUrl;isOutput=true]$scriptsUrl"
        Write-Host "##vso[task.setvariable variable=ResolvedQueueWorkerZipUrl;isOutput=true]$workerUrl"
        Write-Host "Engine package        : $engineUrl"
        Write-Host "Scripts package       : $scriptsUrl"
        Write-Host "QueueProcessor package: $workerUrl"
      name: ResolveRelease
      displayName: 'Resolve Published Release URLs'

    # -PublishPath accepts a .zip directly (the script extracts it and stages secure.config, the
    # license and the workflow tree into the extracted folder before publishing), so the release
    # package is downloaded as-is rather than unpacked here.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $dest = "$(Agent.BuildDirectory)\LightweightEngine"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        $zip = Join-Path $dest 'AzureFunctionsPackage.zip'
        Invoke-WebRequest -Uri '$(ResolvedEngineZipUrl)' -OutFile $zip -UseBasicParsing -TimeoutSec 300 -MaximumRetryCount 3 -RetryIntervalSec 10
        $size = (Get-Item $zip).Length
        if ($size -le 0) { throw "Downloaded engine package is empty: $zip" }
        Write-Host "##vso[task.setvariable variable=EngineZipPath]$zip"
        Write-Host "Downloaded engine package ($([math]::Round($size / 1MB, 1)) MB) to $zip"
      displayName: 'Download Lightweight Engine Package'

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $zip = "$(Agent.BuildDirectory)\DeploymentScripts.zip"
        $dir = "$(Agent.BuildDirectory)\DeploymentScripts"
        Invoke-WebRequest -Uri '$(ResolvedScriptsZipUrl)' -OutFile $zip -UseBasicParsing -TimeoutSec 120 -MaximumRetryCount 3 -RetryIntervalSec 10
        if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
        Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force

        # Published zips have shipped both flat and wrapped in a single top-level folder over time,
        # so locate the orchestrator rather than assuming either layout.
        $deployScript = Get-ChildItem -LiteralPath $dir -Recurse -Filter 'Deploy-WwExecutionEngine.ps1' | Select-Object -First 1
        if (-not $deployScript) { throw "Deploy-WwExecutionEngine.ps1 not found anywhere under $dir - the published scripts package layout has changed." }
        Write-Host "##vso[task.setvariable variable=DeployScriptPath]$($deployScript.FullName)"
        Write-Host "Deployment orchestrator: $($deployScript.FullName)"
      displayName: 'Download Warewolf Deployment Scripts'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download UAT Workflow Resources'
      inputs:
        buildType: 'current'
        artifactName: 'UATWorkflowResources'
        targetPath: '$(Agent.BuildDirectory)\UATWorkflowResources'

    # The Hangfire persistence DB source (docs/Deploy-UAT-Redeploy-Spec.md §14) carries a
    # SQL credential to wwexecution-uat-hangfire, but its ConnectionString is WFAES-
    # encrypted at rest (only decryptable via this app's own Key Vault key at runtime) -
    # exactly the same precedent already set by the committed, encrypted
    # Settings/ElasticsearchLoggingSource.bite. So this is committed to source control too
    # (Scripts/persistencesettingsdbsource.uat.bite) rather than treated as a raw secret;
    # this step just renames it to the exact leaf name Deploy-WwExecutionEngine.ps1
    # requires ('persistencesettingsdbsource.bite') - see that file's own header comment.
    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(Agent.BuildDirectory)\UatPersistence" | Out-Null
        Copy-Item -LiteralPath "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\persistencesettingsdbsource.uat.bite" `
            -Destination "$(Agent.BuildDirectory)\UatPersistence\persistencesettingsdbsource.bite" -Force
      displayName: 'Stage UAT persistencesettingsdbsource.bite'

    - pwsh: |
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        Write-Host "Logging in to Azure CLI as service principal ..."
        az login --service-principal `
            -u $env:AzureClientIdValue `
            -p $env:AzureClientSecretValue `
            --tenant $env:AzureTenantIdValue | Out-Null
        $account = az account show | ConvertFrom-Json
        Write-Host "Logged in: $($account.name) ($($account.id))"
      displayName: 'Log in to Azure CLI'
      env:
        AzureClientIdValue: $(AzureClientId)
        AzureClientSecretValue: $(AzureClientSecret)
        AzureTenantIdValue: $(AzureTenantId)

    # Back up app settings BEFORE touching anything (docs/Deploy-UAT-Redeploy-Spec.md
    # §5.1, "mandatory, do first") - several are secrets not reconstructible from the repo.
    # continueOnError: a backup failure must be visible but must not itself block a deploy
    # whose whole point is to fix a known-broken load test.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        New-Item -ItemType Directory -Force -Path "$(Agent.BuildDirectory)\UatBackup" | Out-Null
        az functionapp config appsettings list --name WarewolfServer-UAT --resource-group DEV2 -o json |
            Out-File -LiteralPath "$(Agent.BuildDirectory)\UatBackup\uat-appsettings-backup.json" -Encoding utf8
        az functionapp show --name WarewolfServer-UAT --resource-group DEV2 -o json |
            Out-File -LiteralPath "$(Agent.BuildDirectory)\UatBackup\uat-site-backup.json" -Encoding utf8
        Write-Host "Backed up app settings + site config to $(Agent.BuildDirectory)\UatBackup"
      displayName: 'Back Up WarewolfServer-UAT App Settings (§5.1)'
      continueOnError: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish UAT Settings Backup'
      condition: always()
      continueOnError: true
      inputs:
        targetPath: '$(Agent.BuildDirectory)\UatBackup'
        artifact: 'UatSettingsBackup'
        publishLocation: 'pipeline'

    # 2026-10-05: WarewolfServer-UAT moved BACK from Flex Consumption (Linux) to the classic
    # Consumption (Y1) plan on Windows. Deploy-WwExecutionEngine.ps1 never converts an existing app
    # between the two (the SKU and OS are fixed by `functionapp create`) and does not fail on the
    # mismatch either - it reports it and carries on, so the win-x64 package would deploy
    # "successfully" onto the old Linux app and the engine would never start. This step turns that
    # silent failure into an explicit one. It deliberately does NOT delete the app: recreating it
    # mints a new managed identity (dropping its Key Vault / Service Bus RBAC grants) and loses its
    # app settings, so the delete is an operator decision - take the UatSettingsBackup artifact
    # above first (it is published even when this step fails). A missing app passes: the deploy
    # below creates it as Y1.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script

        # `list` + a name filter rather than `show`, so a missing app is an empty result rather than
        # an error to tell apart from a real failure.
        $kind = az functionapp list --resource-group DEV2 --query "[?name=='WarewolfServer-UAT'].kind | [0]" -o tsv
        if ($LASTEXITCODE -ne 0) { throw "az failed to list Function Apps in DEV2 (exit $LASTEXITCODE)." }
        $kind = "$kind".Trim()

        if (-not $kind) {
            Write-Host 'WarewolfServer-UAT does not exist; the deploy will create it on the Consumption (Y1) plan (Windows).'
        } elseif ($kind -match 'linux') {
            throw ("WarewolfServer-UAT exists as a LINUX app (kind '$kind' - the former Flex Consumption deployment). " +
                   'It cannot be converted to the Windows Consumption (Y1) plan in place. Delete it ' +
                   '(az functionapp delete --name WarewolfServer-UAT --resource-group DEV2) after saving this ' +
                   "run's UatSettingsBackup artifact, then re-run so the deploy recreates it as Y1. The new " +
                   'managed identity then needs its Service Bus grant re-applied (Enable-ServiceBusSecureTrigger.ps1) ' +
                   'and Easy Auth re-applied - see docs/Deploy-UAT-Redeploy-Spec.md.')
        } else {
            Write-Host "WarewolfServer-UAT is a Windows app (kind '$kind'); safe to deploy the win-x64 package."
        }
      displayName: 'Assert WarewolfServer-UAT is not a Linux (Flex) app'

    # -StorageAccount is passed to Deploy-WwExecutionEngine.ps1 for Phase 1 existence/creation
    # bookkeeping ONLY - the script never applies it to an existing app's AzureWebJobsStorage
    # (that connection string is only set inside `functionapp create`, which never runs for a
    # redeploy of an app that already exists). So WarewolfServer-UAT keeps running on its real,
    # existing storage account untouched, regardless of this value.
    #
    # This used to be resolved dynamically from the app's own AzureWebJobsStorage setting
    # (docs/Deploy-UAT-Redeploy-Spec.md §6.2) specifically to avoid hardcoding/guessing a name.
    # That backfired: the real account (storageaccountwarew83c6) lives in RG 'Warewolf', not
    # 'DEV2', and this pipeline's service principal only has RBAC on 'DEV2' - so the script's
    # cross-RG existence check silently returned "not found" (403 swallowed by -AllowFail) and
    # it tried to recreate an account that already exists globally, failing with
    # StorageAccountAlreadyExists. Since the value is just Phase-1 bookkeeping, a small
    # dedicated placeholder account owned by this SP directly in DEV2 - same pattern as
    # pipeline-CLOUD.yml's 'warewolfserversa' - sidesteps the whole class of bug.
    #
    # Renames the git-tracked, Enable:true persistencesettings.uat.json to the exact
    # leaf name Deploy-WwExecutionEngine.ps1 requires ('persistencesettings.json') -
    # see that file's own header comment for why it cannot be committed under that name
    # directly (it would collide with, and could be confused for, the repo's
    # Enable:false default in Settings/persistencesettings.json).
    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(Agent.BuildDirectory)\UatPersistence" | Out-Null
        Copy-Item -LiteralPath "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\persistencesettings.uat.json" `
            -Destination "$(Agent.BuildDirectory)\UatPersistence\persistencesettings.json" -Force
      displayName: 'Stage UAT persistencesettings.json (Enable: true)'

    # Pulls the licensed subscription config from the Azure DevOps Library ('Warewolf
    # License.secureconfig' under Pipelines > Library > Secure files) - same secure file
    # pipeline-CLOUD.yml's warewolfserver deploy downloads. DownloadSecureFile lands the
    # file at $(Agent.TempDirectory)\Warewolf License.secureconfig and exposes that path
    # as $(warewolfLicense.secureFilePath); the task self-cleans it from the agent at the
    # end of the job.
    - task: DownloadSecureFile@1
      name: warewolfLicense
      displayName: 'Download Warewolf License.secureconfig'
      inputs:
        secureFile: 'Warewolf License.secureconfig'

    # Deploy via the checked-out orchestrator. -SkipAuthProvisioning: Entra/Easy Auth is
    # already configured on this app (docs/Deploy-UAT-Redeploy-Spec.md §3, "out of
    # scope"). -LicenseCheckEnabled:$true with -LicenseConfigPath staging the secure file
    # downloaded above: WorkflowExecutor's license/subscription gate is enforced on this
    # app - see §2's app-settings table (kept in sync with this). -EnablePersistence:$true
    # (EnablePersistence is a [nullable[bool]] param, not a switch - it must be passed with a
    # colon-bound value) with the two paths below: MANDATORY per §14, or a full redeploy
    # silently reverts persistence to disabled and every "no result" load-test symptom returns.
    # -ServiceBusMaxConcurrentCalls 2 (WOLF-8512): sets host.json's
    # extensions.serviceBus.maxConcurrentCalls, capping how many Service Bus messages the
    # Functions host DISPATCHES to the trigger at once - upstream of, and independent from,
    # -ServiceBusTriggerMaxConcurrentExecutions 2 below (the trigger's OWN semaphore gate,
    # AFTER dispatch). Matched so both concurrency gates agree - see
    # docs/ShovelBridge-Architecture.md's WOLF-8512 entries for the ThreadPool-starvation
    # root cause this is mitigating.
    # -DisableDynamicConcurrency: MANDATORY ALONGSIDE THE TWO CAPS ABOVE, and the reason they
    # are not merely redundant-but-harmless. Azure Functions' dynamic concurrency OVERRIDES
    # every static concurrency setting in host.json, and this engine's host.json ships
    # concurrency.dynamicConcurrencyEnabled:true - so from the WOLF-8512 mitigation until
    # 2026-09-15 BOTH caps were written correctly, loaded correctly, and then ignored by the
    # host. Measured on the sibling wwuat3 app with both caps set to 2:
    #   Applying status snapshot for function Host.Functions.ServiceBusWorkflowTrigger (Concurrency: 170)
    # 170 against a requested 2, which saturated the 1-vCore serverless SQL database behind the
    # workflow ("The request limit for the database is 120 and has been reached" x10,646 in two
    # minutes) and dead-lettered the run. Without this flag the two caps above are decorative.
    # The deploy script warns at plan time if the cap is passed without it.
    # -FunctionAppScaleLimit 30 (2026-09-15, added with the 20,000-message raise): caps
    # Consumption-plan scale-out at 30 instances. This is a BROKER CONNECTION budget, not a
    # throughput tune. The workflow this pipeline runs (RequestForProfiling) publishes its
    # result to a CloudAMQP queue, and LightweightRabbitMqConnectionCache keys its entries by
    # broker endpoint (RabbitMqCacheKey.For(host, port, user, vhost, password)) - so a
    # single-broker workload holds roughly ONE connection per INSTANCE regardless of the
    # cache's own maxConnections, which is a cache-size ceiling rather than a connection one
    # (and when it does fire, AcquireCore falls through to Uncached(factory) and opens a
    # connection anyway, so lowering it produces MORE sockets, not fewer). Measured on the
    # sibling wwuat3 app: 48 instances against a vhost capped at 40 gave 'NOT_ALLOWED - access
    # to vhost refused: connection limit (40) is reached' and dead-lettered every message whose
    # instance lost the race. At this cap, connections plateau at 32/40 under sustained load -
    # a margin of 8, not 34 - and that plateau tracks the INSTANCE cap, not message volume (it
    # was identical at 5,000 and 15,000), which is precisely why raising MessageCount to 20,000
    # is safe but raising this number is not. 30 x the maxConcurrentExecutions 2 above is 60
    # concurrent executions, comfortably under WarewolfDevOpsTestDb's own 120-request ceiling,
    # so bounding one constraint does not reintroduce the other.
    # CAVEAT: 30 is derived from wwuat3's broker limit, NOT measured on this app. If
    # WarewolfServer-UAT's result broker is a different CloudAMQP plan, or a second publisher
    # shares the vhost, recompute it - the invariant to preserve is
    # 'instances + recycling-headroom < vhost connection limit'.
    # -EnablePerformanceCounters:$true: registers the AI PerformanceCollectorModule so
    # process memory/CPU samples land in App Insights' performanceCounters table during
    # the load-test burst below - previously empty, which meant a silent process death
    # (e.g. an unrecoverable OOM under Consumption-plan burst load) had no corroborating
    # telemetry after the fact - observed directly against a local ShovelBridge run on
    # 2026-09-01 (2 stuck correlation ids, 000858/000859, with zero telemetry of any kind).
    #
    # 2026-09-16: -EncryptResources:$true is NEW, and is what keeps the generated
    # 'Warewolf DevOps RabbitMQ Source.bite' (see the Build stage's generation step) from shipping a
    # plaintext broker password to the Function App - the staged plaintext ConnectionString is
    # converted to WFAES here, using the same Key Vault key/secret already passed below, before
    # anything is uploaded. Safe to leave on permanently despite the script's "Encrypt ONCE"
    # guidance: Encrypt-Config.ps1 SKIPS files that already carry the WFAES:: prefix (so the
    # already-encrypted NewSqlServerSource.bite is untouched, not double-encrypted), and the only
    # DPAPI-encrypted source in the repo, 'NewSqlServerSource (Local Backup).bite', is excluded from
    # staging by the 'Stage rabbit/*.bite' step - nothing staged here can fail an agent-side DPAPI
    # decrypt. Verified against the full staged set: every other source is already WFAES
    # (ProfilerDBSource, NewSqlServerSource, and the six root sources the build output ships) and so
    # is skipped by prefix WITHOUT being decrypted; only the generated plaintext source is encrypted.
    #
    # -VerifyDecryption is DELIBERATELY NOT passed, despite being the obvious companion.
    # Encrypt-Config.ps1 -VerifyOnly decrypts EVERY encrypted value in the whole folder and exits 1
    # if any one fails - and the publish output ships six unrelated committed WFAES sources
    # (Azure Dropbox/Email/Exchange/SharePoint, Local Exchange/SharePoint) that this pipeline never
    # exercises. 'Azure Exchange Source.bite' is already documented as a stale blob encrypted on
    # 2026-04-27 under a DIFFERENT vault key ('dp-keyring-v1') and never re-encrypted since - see
    # Dev/.azure/devops-download-bite-exchange-spec.md. Enabling verification would therefore couple
    # every deploy of this pipeline to the health of sources it has nothing to do with, turning an
    # unrelated stale blob into a hard deploy failure. The encryption pass still reports per-file
    # results and fails on an encrypt error, which is the signal that matters for the source added
    # here. (There is no per-file verify switch: Invoke-EncryptAndVerify always targets the whole
    # Resources folder.)
    # NOTE: this requires the pipeline's service principal to have GET on the
    # 'WWExecutionEngineTestSecret' secret in the 'WWExecutionEngine' vault - passing
    # -KeyVaultName/-KeyVaultSecretName alone (the previous behaviour) only wired the engine's
    # RUNTIME managed-identity role and never needed the SP to read the key itself.
    # 2026-09-16, build 30696: that GET requirement is now also what keeps this step OFF the
    # role-assignment path. Deploy-WwExecutionEngine.ps1's Phase 3 used to resolve the operator
    # with `az ad signed-in-user show` - a Microsoft Graph /me call that is valid ONLY for a
    # delegated (interactive) token - so the first run to reach it under the service-principal
    # login above died with "/me request is only valid with delegated authentication flow".
    # The script now probes the secret first and skips the 'Key Vault Secrets Officer' grant
    # when the key is already readable (this pipeline's case: the vault and key both predate
    # the run, so nothing is written), and resolves the principal via `az account show` when a
    # grant IS genuinely needed. If the SP ever loses that GET, the failure is now an explicit
    # message naming the vault, the secret and the exact role-assignment command to run.
    # -HostingPlan Consumption / -FunctionAppScaleLimit 30 (2026-10-05): WarewolfServer-UAT is back
    # on the classic Consumption (Y1) plan as a WINDOWS app, deploying the win-x64 engine package,
    # after a period on Flex Consumption (Linux, 4 GB/instance, -FlexMaximumInstanceCount 16, from
    # 2026-09-21). This load test now measures the Windows Y1 engine. The two plans are
    # different resource shapes and an existing app cannot be converted between them, so the
    # Flex app has to be deleted for this deploy to recreate it - enforced, not assumed, by the
    # 'Assert WarewolfServer-UAT is not a Linux (Flex) app' step above.
    # -FunctionAppScaleLimit is the classic-plan scale ceiling (siteConfig.functionAppScaleLimit);
    # the broker-connection-budget reasoning in the -FunctionAppScaleLimit comment above applies
    # unchanged. 30, not Flex's 16: Flex brought its whole instance cap up AT ONCE, so every
    # instance cold-started together and (without the single-flight fix in
    # LightweightRabbitMqConnectionCache.AcquireCore) each could open one result-publish
    # connection PER CONCURRENT EXECUTION (2) - 30 x 2 plus the ~4 long-lived Container Apps
    # connections broke CloudAMQP 'bmkzdabu''s 40-connection limit (build 30857). Classic Y1 RAMPS
    # (~14 min to full scale-out), so cold misses are spread out and the measured Y1 plateau was
    # 32/40 at 30 instances (wwuat3). CAVEAT: 30 + ~4 Container Apps connections leaves almost no
    # headroom; if the released engine predates the AcquireCore fix and a run dead-letters with
    # 'connection limit (40) is reached', drop this back toward 16. Every app publishing to that
    # vhost draws on the SAME 40 - never run two of these rigs at once.
    # -EntraConfigRepairClientId / -EntraConfigRepairAppDisplayName (2026-10-05): recreating the app
    # as Y1 wipes WAREWOLF_ENTRA_CONFIG, and -SkipAuthProvisioning's Phase 2 self-heal
    # (docs/Deploy-UAT-Redeploy-Spec.md §17) would otherwise look the Entra app up through Microsoft
    # Graph, which this pipeline's service principal cannot do (§18, build 30806). Passing the appId
    # skips that lookup. It is the app the live WAREWOLF_ENTRA_CONFIG was read back from before the
    # Flex app was deleted (clientId and audience api://<appId>) - the same resource app the load-test
    # jobs below request tokens for (ShovelE2EResourceAppId / ProfilerLoadTestResourceAppId). It is a
    # no-op while the setting is present.
    #
    # The orchestrator and -PublishPath are the DOWNLOADED release script and zip (see 'Resolve
    # Published Release URLs'). The arguments are splatted so they can be checked against the
    # released script's own parameter list first: a release older than one of these parameters
    # otherwise dies mid-deploy with "A parameter cannot be found" (build 30947, the Profiler
    # pipelines), and some - the four throughput flags above - would be impossible to drop without
    # silently changing what the load test measures. So every missing one fails the step up front,
    # naming the pin that unblocks it.
    - pwsh: |
        $deployArgs = [ordered]@{
            ResourceGroup                            = 'DEV2'
            Location                                 = 'southafricanorth'
            StorageAccount                           = 'warewolfuatsa'
            AppName                                  = 'WarewolfServer-UAT'
            PublishPath                              = '$(EngineZipPath)'
            WorkflowsSourcePath                      = "$(Agent.BuildDirectory)\UATWorkflowResources"
            SkipAuthProvisioning                     = $true
            EntraConfigRepairClientId                = 'e200900a-2d5d-4356-94c0-cd7e33232ce0'
            EntraConfigRepairAppDisplayName          = 'Warewolf-ShovelBridgeE2E-ServiceBusTrigger'
            HostingPlan                              = 'Consumption'
            LicenseCheckEnabled                      = $true
            LicenseConfigPath                        = "$(warewolfLicense.secureFilePath)"
            EnablePersistence                        = $true
            PersistenceSettingsPath                  = "$(Agent.BuildDirectory)\UatPersistence\persistencesettings.json"
            PersistenceDbSourcePath                  = "$(Agent.BuildDirectory)\UatPersistence\persistencesettingsdbsource.bite"
            ServiceBusMaxConcurrentCalls             = 2
            DisableDynamicConcurrency                = $true
            ServiceBusTriggerMaxConcurrentExecutions = 2
            FunctionAppScaleLimit                    = 30
            ServiceBusTriggerQueueName               = '$(WwExecutionServiceBusTriggerQueueName)'
            ServiceBusTriggerWorkflowName            = '$(WwExecutionServiceBusTriggerWorkflowName)'
            KeyVaultName                             = 'WWExecutionEngine'
            KeyVaultSecretName                       = 'WWExecutionEngineTestSecret'
            EncryptResources                         = $true
            EnablePerformanceCounters                = $true
            NonInteractive                           = $true
        }

        $declared = (Get-Command -Name '$(DeployScriptPath)' -CommandType ExternalScript).Parameters
        $missing  = @($deployArgs.Keys | Where-Object { -not $declared.ContainsKey($_) })
        if ($missing.Count) {
            throw "The released Deploy-WwExecutionEngine.ps1 ($(DeployScriptPath)) predates parameter(s) this deploy passes: -$($missing -join ', -'). Pin WarewolfScriptsZipUrl (and WarewolfEngineZipUrl) to a release that carries them."
        }

        & '$(DeployScriptPath)' @deployArgs
      displayName: 'Deploy via Deployment Scripts'

    # Deploy-WwExecutionEngine.ps1 deliberately never sets WAREWOLF_SECURITY_FLAGS itself (see
    # that script's own comment: "NON-CONFIGURABLE... not exposed as parameters... an admin can
    # add it manually only if a specific override is ever required") - so this repo has no
    # source-controlled record of how WarewolfServer-UAT's secure.config-based per-workflow
    # authorization was ever set up for RabbitProcess, and adding a matching entry for the new
    # ProfilerMain workflow (ResourceID 81f22395-ba64-4cd0-80b3-c7595ab2eaba) would mean editing
    # live Azure state this pipeline cannot see or reproduce. Bypassing the whole policy layer
    # here instead makes this pipeline fully self-contained: WorkflowAuthPolicyLoader.GetPolicy
    # (Auth/WorkflowAuthPolicyLoader.cs) returns Bypass() whenever bypassSecureConfig=true, so
    # every workflow on this app - ProfilerMain, RabbitProcess, RabbitProcess2, any smoke test -
    # skips the per-workflow permission check entirely. Deliberately left set permanently (not
    # reverted after Load_Test): WarewolfServer-UAT is dedicated to this pipeline's own load
    # testing, so leaving it open avoids the need for a second, brittle revert step and a second
    # cold-start cycle for it to take effect.
    # WOLF-8512 (2026-09-08): this step previously passed the JSON inline as
    #   --settings 'WAREWOLF_SECURITY_FLAGS={"bypassSecureConfig":true}'
    # On a Windows agent 'az' is az.cmd, a batch wrapper whose cmd.exe layer STRIPS the inner
    # double quotes, so Azure actually stored the invalid JSON  {bypassSecureConfig:true}
    # (confirmed by reading the live app setting back). SecurityFlags.FromEnvironment()
    # (Infrastructure/SecurityFlags.cs) cannot parse that, catches the JsonException and safely
    # degrades to all-flags-false - which silently RE-ENABLES policy enforcement, so
    # WorkflowAuthPolicyLoader returns ConfigMissingDeny and every request 503s with
    # {"error":"config_missing"}. That is exactly what failed build 30636: 0/1000 executions,
    # 30 minutes of polling, and a root cause invisible from the pipeline log.
    #
    # Fix: hand az a --settings @file instead of an inline value, which removes shell quoting
    # from the path entirely, then READ THE VALUE BACK AND PARSE IT. The 'set' call reports
    # success even when it stores a mangled value, so writing without verifying is what let this
    # reach a 1000-message load test undetected.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script

        $settingsFile = Join-Path $env:AGENT_TEMPDIRECTORY 'ww-security-flags.json'
        # Single-quoted: PowerShell performs no interpolation, so the backslash-escaped quotes
        # are written to the file verbatim as the JSON string escaping they are meant to be.
        $payload = '[{"name":"WAREWOLF_SECURITY_FLAGS","value":"{\"bypassSecureConfig\":true}"}]'
        Set-Content -LiteralPath $settingsFile -Value $payload -Encoding utf8

        az functionapp config appsettings set --name WarewolfServer-UAT --resource-group DEV2 --settings "@$settingsFile" | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "az failed to set WAREWOLF_SECURITY_FLAGS (exit $LASTEXITCODE)." }

        $stored = az functionapp config appsettings list --name WarewolfServer-UAT --resource-group DEV2 --query "[?name=='WAREWOLF_SECURITY_FLAGS'].value | [0]" -o tsv
        if ($LASTEXITCODE -ne 0) { throw "az failed to read back WAREWOLF_SECURITY_FLAGS (exit $LASTEXITCODE)." }

        try {
          $parsed = $stored | ConvertFrom-Json
        } catch {
          throw "WAREWOLF_SECURITY_FLAGS was stored as INVALID JSON: '$stored'. The engine's SecurityFlags parser would treat every flag as false, re-enabling policy enforcement, and every workflow request would return 503 config_missing (this is the build 30636 failure mode)."
        }
        if ($parsed.bypassSecureConfig -ne $true) {
          throw "WAREWOLF_SECURITY_FLAGS parsed as valid JSON but bypassSecureConfig is not true (stored: '$stored')."
        }

        Remove-Item -LiteralPath $settingsFile -Force -ErrorAction SilentlyContinue
        Write-Host "Verified WAREWOLF_SECURITY_FLAGS on WarewolfServer-UAT is valid JSON with bypassSecureConfig=true: $stored"
      displayName: 'Bypass secure.config workflow authorization on WarewolfServer-UAT'

    # WOLF-8522: WarewolfServer-UAT intermittently rejected a genuinely valid, Active
    # Chargebee license with "Execution blocked: a valid Warewolf license/subscription is
    # required." Root-caused via Application Insights: host.json ships with
    # concurrency.dynamicConcurrencyEnabled=true, which (together with the default-enabled
    # health monitor) makes the WebJobs Script Host acquire/renew a "primary host" lease and
    # periodically restart itself in place - confirmed live: the same instance ID re-ran the
    # entire Program.cs startup sequence twice within under a minute (07:11:44 and 07:12:40
    # in the UAT trace). Each such restart re-reads 'Warewolf License.secureconfig' via
    # classic System.Configuration.ConfigurationManager against the
    # WEBSITE_RUN_FROM_PACKAGE=1 read-only package mount; occasionally that read races the
    # restart and throws FileNotFoundException even though the file is genuinely present -
    # other instances, and the same instance moments later, read it fine and see
    # Status: Active. SubscriptionConfig swallows that exception and degrades to
    # Status=NotActive, and WorkflowExecutor's license gate then blocks whatever request
    # lands on that poisoned instance until it next recycles.
    #
    # TestRun.ps1's own Start-LightweightExecution (used by every OTHER lightweight-engine CI
    # job) already disables both features for exactly this reason - see its comment on the
    # "Host lock lease acquired...Restarting host" dance and
    # Azure/azure-functions-dotnet-worker#2124 - but that mitigation was never carried over to
    # this app's actual Azure app settings. Applied here, BEFORE the Stop/Start below, so the
    # one resulting cold start already has the fix in effect rather than needing a second
    # restart cycle.
    - pwsh: |
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        az functionapp config appsettings set --name WarewolfServer-UAT --resource-group DEV2 --settings `
            AzureFunctionsJobHost__concurrency__dynamicConcurrencyEnabled=false `
            AzureFunctionsJobHost__healthMonitor__enabled=false | Out-Null
        Write-Host "Disabled dynamic concurrency + health monitor lease renewal on WarewolfServer-UAT (WOLF-8522 license-gate race fix)."
      displayName: 'Disable host-restart-triggering features (WOLF-8522)'

    # KNOWN GOTCHA (docs/Deploy-UAT-Redeploy-Spec.md §13): this app runs
    # WEBSITE_RUN_FROM_PACKAGE=1, so a config-zip deploy uploads a new package and
    # updates packagename.txt, but the running worker does NOT pick it up until
    # restarted - Kudu VFS was confirmed still showing the OLD dll immediately after a
    # "Succeeded" deploy without this step. Deploy-WwExecutionEngine.ps1 does not do this
    # itself yet (flagged there as a follow-up for the orchestrator) - do this explicitly
    # until it does.
    #
    # WOLF-8510: 'az functionapp restart' is NOT sufficient here - docs/KB-Deploying-
    # Encrypted-Sources.md §3 documents that on a Consumption (Y1) plan, 'restart' can
    # reuse an already-warm worker that still holds a previously-loaded WFAES/DPAPI source
    # decrypted in memory, so a newly-deployed, corrected source silently doesn't take
    # effect on that instance. This exact symptom was reproduced by a 1000-message load
    # test run where SOME executions still hit the pre-migration 'WarewolfEntraTestDb'
    # name (docs/ShovelBridge-Architecture.md's 2026-08-19 entry) while others hit the
    # current 'WarewolfDevOpsTestDb' - proof that stale and fresh workers were serving the
    # same burst side-by-side. A full stop THEN start forces every instance to cold-start
    # and re-decrypt the resources, same as the KB doc's Step 3 for the other engine.
    #
    # 2026-08-19 correction: that same load-test symptom kept recurring across repeated
    # redeploys for a second, independent reason - a 'WorkflowsDirectory' app setting on
    # WarewolfServer-UAT had been pointed at a persistent path (D:\home\data\Warewolf\...)
    # OUTSIDE the deployed package, so no zip-deploy (this job included) was ever reaching
    # the files the engine actually read. That app setting has been removed (see
    # docs/ShovelBridge-Architecture.md's 2026-08-19 correction entry and
    # docs/Deploy-UAT-Redeploy-Spec.md §5.4) so this job's existing package deploy above is
    # now the sole source of truth again - no additional Kudu-sync step needed here. If a
    # future redeploy "doesn't take" again, check that app setting before anything else.
    - pwsh: |
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        az functionapp stop --name WarewolfServer-UAT --resource-group DEV2
        az functionapp start --name WarewolfServer-UAT --resource-group DEV2
        Write-Host "Stopped and started WarewolfServer-UAT (full cold start) so the newly-deployed package AND resources take effect on every instance."
      displayName: 'Stop/Start WarewolfServer-UAT (apply package + resources)'

    # Same pattern as pipeline-CLOUD.yml's post-deploy smoke tests: retries with
    # backoff, since a Consumption-plan cold start after a restart can outlast a single
    # fixed wait. continueOnError is deliberately NOT set here (unlike pipeline-CLOUD.yml's
    # warewolfserver smoke tests) - this app is the actual target Load_Test polls next, so
    # a deploy that doesn't come back up must fail this stage and block Load_Test rather
    # than silently proceeding against a broken engine.
    - powershell: |
        $ErrorActionPreference = 'Continue'
        $uri         = 'https://warewolfserver-uat.azurewebsites.net/apis.json'
        $maxAttempts = 6
        $baseDelay   = 15
        Write-Host "Waiting 30 seconds for the Azure Functions app to restart..."
        Start-Sleep -Seconds 30

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          try {
            $r = Invoke-WebRequest -Uri $uri -Method GET -UseBasicParsing -TimeoutSec 60
            Write-Host "STATUS: $($r.StatusCode)"
            break
          } catch {
            $resp = $_.Exception.Response
            if ($resp) {
              Write-Host "##[warning]Attempt $attempt/$maxAttempts STATUS: $([int]$resp.StatusCode) $($resp.StatusDescription)"
            } else {
              Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)"
            }
            if ($attempt -ge $maxAttempts) {
              Write-Host "##[error]WarewolfServer-UAT did not come back up after $maxAttempts attempts."
              throw
            }
            $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
            Write-Host "Retrying in $delaySeconds s (likely still cold-starting)..."
            Start-Sleep -Seconds $delaySeconds
          }
        }
      displayName: 'Smoke Test /apis.json'

- stage: Load_Test
  # Explicit (it is also the implicit previous stage): ProfilerLoadTest_QueueProcessor reads
  # Deploy_UAT's ResolveRelease output variables through stageDependencies, which only resolves
  # for a stage this one depends on.
  dependsOn: Deploy_UAT
  jobs:

  - job: Load_Tests
    displayName: 'Load Tests'

    steps:
    - checkout: none

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        ArtifactName: 'LoadTestBinaries'
        targetPath: '$(Agent.BuildDirectory)'

    # No server-under-test here (previously ran the Lightweight execution engine via
    # -ServerType LightweightExecution). Confirmed by reading every test tagged
    # TestCategory("Load Tests") (Dev2.IntegrationTests/Load Tests.cs): all are in-process
    # perf/timing tests (ResourceCatalog, ExecutionManager, tokenizer, PulseTracker,
    # DataListViewModel) that never make an HTTP call to a live engine, so there is
    # nothing here for a func.exe host to serve.
    #
    # No external dependencies either: the Redis TTL-expiry test that used to live in this
    # category needs a Redis server (Depends.AnonymousRedis -> localhost:6379), which this
    # job never provisions, so it hung on the client's 50s SyncTimeout and timed out every
    # run. It is now TestCategory("AnonymousRedis") and runs in pipeline.yml's
    # Anonymous_Redis_Tests job (-StartRedisServer).
    #
    # SqlParallelRunStressTests (2 tests in this category) is excluded from this run:
    # both drive the `.tests` workflow test-suite route, which
    # WorkflowHttpFunction.cs documents as unsupported in lightweight mode. They are
    # marked [Ignore] in source (see Dev2.IntegrationTests/SqlParallelRunStressTests.cs)
    # pending a decision to either add `.tests` support to the Lightweight engine or
    # restore a reliable full-server job for them specifically.
    - task: PowerShell@2
      displayName: 'Run Tests'
      inputs:
        filePath: '$(Agent.BuildDirectory)\TestRun.ps1'
        arguments: >-
          -RetryCount 6
          -Projects Dev2.Integration.Tests
          -Category "Load Tests"
          -TestResultsDir "$(Agent.BuildDirectory)\TestResults"
        workingDirectory: '$(Agent.BuildDirectory)'

    # Publish the whole TestResults folder (trx + diagnostic snapshot) rather than a
    # single hard-coded log path, and never fail the job on a missing file -
    # continueOnError + always() so a genuinely absent file doesn't hide the test results.
    - task: PublishBuildArtifacts@1
      continueOnError: true
      condition: always()
      inputs:
        PathtoPublish: '$(Agent.BuildDirectory)\TestResults'
        ArtifactName: 'Load_Tests_Server_Log_File'
        publishLocation: 'Container'
        StoreAsTar: false

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testRunner: VSTest
        testResultsFiles: '$(Agent.BuildDirectory)/TestResults/*.trx'
        failTaskOnFailedTests: true
        testRunTitle: 'Load Tests'

    - powershell: |
        $trx = Get-ChildItem "$(Agent.BuildDirectory)\TestResults" -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
        if (-not $trx) { Write-Host "ERROR: no .trx files found"; exit 1 }
      displayName: 'Verify test results exist'
      condition: always()

  # Load-test variant of the 'ShovelBridgeE2ETest_ExternalServiceBus' job in
  # pipeline-CLOUD.yml: same RabbitMQ Shovel -> Service Bus bridge, against the same real,
  # already-provisioned Service Bus namespace (WarewolfShovelBridgeTesting, resource group
  # DEV2) and the same UAT-deployed Lightweight engine (VerifyEngineBaseUrl) that job's own
  # -VerifyWorkflowExecution leg targets - but instead of proving a SINGLE message crosses
  # the bridge and executes, this publishes 20,000 distinct workflow-trigger messages and
  # requires ALL 20,000 to report a Succeeded execution result. This is a fully end-to-end
  # load test: it proves both that the shovel bridge sustains that volume AND that every one
  # of the 20,000 messages actually drove a correct workflow execution on the target engine,
  # not just bare message arrival at a Service Bus queue (see
  # docs/ServiceBusSecureTrigger-Architecture.md and Test-ShovelBridgeE2E.ps1's own
  # -VerifyWorkflowExecution / -MessageCount help). Uses its own dedicated queue/rule/shovel
  # names (suffixed '-loadtest') so a concurrent run of the ordinary E2E test never collides
  # with, or has its messages stolen by, this job's 20,000-message run on the same namespace
  # and engine. Runs independently of, and in parallel with, Load_Tests above (no shared
  # dependency) - see the ExternalServiceBus job's own header comment in pipeline-CLOUD.yml
  # for the full rationale behind most of the setup steps reused below (the amqp10_client
  # wildcard-hostname TLS fix and the disableLocalAuth self-heal). Unlike that job, this one
  # does NOT stand up a local choco RabbitMQ service - it targets the shared, already-
  # provisioned 'Warewolf DevOps RabbitMQ' CloudAMQP broker (see the 'Warewolf DevOps
  # RabbitMQ Source' resource also used by Warewolf.Execution.QueueProcessor) via
  # -RabbitMqMode External, so no RabbitMQ install/plugin-enable/teardown steps are needed
  # on the agent at all.
  - job: ShovelBridgeLoadTest_ExternalServiceBus
    displayName: 'RabbitMQ Shovel -> Service Bus Load Test (20000 messages, workflow execution, Azure)'
    pool:
      vmImage: 'windows-2022'
    # 2026-09-15 (20,000 messages): raised from 60 min. The drain is the dominant cost and it
    # scales with volume, not with setup - the engine is capped at 2 concurrent executions per
    # instance (see Deploy_UAT's -ServiceBusMaxConcurrentCalls/-DisableDynamicConcurrency
    # above) and at FunctionAppScaleLimit 30 instances that is 60 concurrent executions. The
    # closest measurement on file is the sibling wwuat3 app's 15,000-message run at ~66 min
    # (docs/ShovelBridge-Architecture.md), i.e. ~3.8 msg/s, which extrapolates to ~90 min for
    # 20,000 - so 240 leaves room for a slower-than-measured run plus the publish, drain-quiet
    # window, poll and Phase 4c reconciliation either side of it, without sitting at ADO's own
    # 360-minute hosted-agent ceiling. NOTE the extrapolation is from a DIFFERENT app and
    # harness; this pipeline's own throughput at this volume is not yet measured, so treat the
    # first 20,000-message run as the measurement that either confirms or corrects this.
    timeoutInMinutes: 240
    variables:
      # 2026-09-15: raised 1000 -> 20000. Everything below that mentions a volume was retuned
      # with it; the two that are NOT merely cosmetic are DrainTimeoutSeconds (the drain is
      # what actually takes the time) and the Deploy_UAT job's -FunctionAppScaleLimit (without
      # a scale-out cap this volume exhausts the result broker's connection budget - see that
      # flag's own comment).
      MessageCount: 20000
      # Sequential HTTP-per-message publishing to RabbitMQ's Management API (one blocking
      # round-trip per message) is the dominant cost at this volume, not the Shovel's own
      # bridging throughput — bounded-concurrency publishing (see Program.cs's
      # PublishManyBoundedAsync) cuts the publish phase materially. ShovelPrefetchCount raises
      # the Shovel's own 'src-prefetch-count' (default 5) as a secondary tune once publishing
      # is no longer the bottleneck — see docs/ShovelBridge-Architecture.md.
      PublishConcurrency: 20
      ShovelPrefetchCount: 50
      # DELIBERATELY NOT $(PublishConcurrency), which is what the pre-warm step used to inherit.
      # Those two knobs measure different things: PublishConcurrency bounds HTTP publishes to
      # RabbitMQ (a throughput tune on the agent side), while the pre-warm drives real workflow
      # EXECUTIONS on an engine whose deployed cap is maxConcurrentExecutions 2. Warming above
      # that cap does not warm faster, it just queues executions against a cold host - a warm at
      # concurrency 6 has been observed to OOM the engine outright, and 20 is further past the
      # cap still. Match the deployed cap.
      PreWarmConcurrency: 2
      # How long the trigger queue's active+scheduled depth must sit at zero before the run is
      # treated as drained. MUST stay >= ~360: a locked (in-flight) message is not counted as
      # active, and the queue's PT5M lock duration means a redelivery arrives ~5 minutes later -
      # a shorter window ends the wait in that gap and reports redelivered messages as
      # permanently missing (the artefact behind an earlier 5,000-message run's 878 false
      # losses). See Test-ShovelBridgeE2E.ps1 -DrainQuietSeconds.
      DrainQuietSeconds: 360
      # Hard ceiling on the drain wait: ~90 min projected drain + the quiet window + slack,
      # kept under the 240-minute job timeout so a stalled run fails with the last observed
      # queue depths (active/scheduled/deadLetter) instead of being killed by ADO with no
      # diagnostics at all.
      DrainTimeoutSeconds: 9000
      ServiceBusNamespace: 'WarewolfShovelBridgeTesting'
      ServiceBusResourceGroup: 'DEV2'
      SourceQueueName: 'wwexecution-shovel-source-verify-e2e-loadtest'
      ShovelName: 'wwexecution-shovel-verify-e2e-loadtest'
      # Shared, already-provisioned RabbitMQ broker ('rabbitmq.warewolf.online', tunnelled to
      # a self-hosted container) - used instead of standing up a local choco RabbitMQ service
      # on the agent. Its shovel/shovel_management plugins are already enabled, so this job
      # never installs/enables RabbitMQ plugins itself. The password is deliberately NOT
      # stored here - it's read from the secure pipeline variable 'ExternalRabbitMqPassword'
      # (see the 'Run ShovelBridge load test' step below), which is set (as secret) on this
      # pipeline in Azure DevOps.
      #
      # NOTE: this previously pointed at CloudAMQP ('ostrich-01.lmq.cloudamqp.com',
      # vhost 'bmkzdabu'). That shared/free-tier instance was silently migrated by CloudAMQP
      # from RabbitMQ to LavinMQ at some point after this job last succeeded - LavinMQ's
      # Shovel only supports AMQP 0-9-1 destinations (dest-queue/dest-exchange), not the
      # dest-protocol: amqp10 + dest-address this job's Service Bus bridge requires, so every
      # run started failing Phase 3 with "Shovel destination requires queue and/or exchange"
      # (confirmed via that broker's own /api/nodes -> applications: [{name: lavinmq, ...}]).
      # Switched to this broker (confirmed via /api/overview: product_name RabbitMQ,
      # rabbitmq_version 3.13.7, rabbitmq_shovel/rabbitmq_shovel_management enabled) - same
      # broker pipeline-CLOUD.yml's own self-hosted-tunnel history references. Uses the
      # default '/' vhost, so -ExternalRabbitMqVHost is omitted (script default).
      ExternalRabbitMqManagementUri: 'https://rabbitmq.warewolf.online'
      ExternalRabbitMqUsername: 'testuser'

      # ── Full end-to-end "workflow execution" leg (this job's only leg) ───────────────
      # Proves RabbitMQ -> Shovel -> Service Bus -> the UAT-deployed Lightweight engine's
      # in-process secure Service Bus trigger -> actual workflow EXECUTION for all 20,000
      # messages, not just message arrival (see docs/ServiceBusSecureTrigger-Architecture.md,
      # Test-ShovelBridgeE2E.ps1 -VerifyWorkflowExecution). VerifyServiceBusQueueName is
      # DELIBERATELY the SAME queue pipeline-CLOUD.yml's own -VerifyWorkflowExecution leg
      # uses (not suffixed '-loadtest' like this job's other names): it must exactly match
      # the single, already-configured WAREWOLF_SERVICEBUS_TRIGGER_QUEUE app setting on
      # VerifyEngineBaseUrl (see Enable-ServiceBusSecureTrigger.ps1) - the engine's
      # ServiceBusTrigger listens on one fixed queue name, so a differently-named queue here
      # would never be consumed and every one of the 20,000 messages would time out. Running
      # this job concurrently with pipeline-CLOUD.yml's own E2E test is safe even though they
      # share this queue/rule: both only ever SEND (via their own distinct shovel/RabbitMQ
      # source objects), and the engine's single Managed Identity subscription is the only
      # consumer of either job's messages - correlationIds keep each job's own results
      # distinct.
      VerifyServiceBusQueueName: $(WwExecutionServiceBusTriggerQueueName)
      VerifyServiceBusSendRuleName: 'shovel-e2e-verify-send'
      VerifyEngineBaseUrl: 'https://warewolfserver-uat.azurewebsites.net'
      # Switched from RabbitProcess (Resources/rabbit/RabbitProcess.bite) to ProfilerMain
      # (Resources/ProfilerServices/Profiler/V2/API/ProfilerMain.bite), the Profiler business-logic
      # workflow, per the 2026-09-07 decision to load-test that workflow instead. ProfilerMain's DB
      # source (ProfilerDBSource.bite) was repointed to the same WFAES-encrypted WarewolfDevOpsTestDb
      # credentials NewSqlServerSource.bite uses, ResourceID unchanged.
      #
      # 2026-09-14: switched again, this time to RequestForProfiling
      # (Resources/ProfilerServices/ProfilerWrapper/RequestForProfiling.bite) - the real production
      # entry point (confirmed live at https://wwuat3.azurewebsites.net/secure/ProfilerServices/
      # ProfilerWrapper/RequestForProfiling.json), rather than calling ProfilerMain directly.
      # RequestForProfiling internally nests a call to ProfilerMain (2026-09-23: the load-test-only
      # RabbitProcess call and dbo.jobs2 logging were removed to match production) - see the "Stage ProfilerServices/* Load-Test Workflows
      # (full unpruned set)" step above for the full dependency-closure and SourceId-fix writeup.
      # Its declared Inputs are the same 16 fields ProfilerMain already used, so
      # VerifyWorkflowInputsJson below is unchanged.
      # -DbVerificationMode deliberately stays 'ProfilerRecommendation' (not 'Jobs1'): that table is
      # written by the nested ProfilerMain call and is the direct proof the scoring logic ran (the
      # wrapper no longer writes job-tracking rows at all).
      # Folder-qualified: WorkflowIndex.Resolve() (Warewolf.Execution.Lightweight
      # /Infrastructure/WorkflowIndex.cs) does an exact key match against
      # workflow-index.json, which keys entries by full relative path (e.g.
      # 'profilerservices/profiler/v2/api/profilermain') - and the legacy on-disk fallback in
      # WorkflowFunctionHelper.cs is also non-recursive. A bare 'ProfilerMain'
      # cannot resolve once the .bite lives under Resources/ProfilerServices/, which is how
      # VerifyEngineBaseUrl's Resources folder is staged (see
      # docs/Deploy-UAT-Redeploy-Spec.md §5.4) - confirmed live via
      # Test-ShovelBridgeE2E.ps1 during WOLF-8510 for the equivalent rabbit/ case.
      # WOLF-8517 (corrected): still needed here for Invoke-WwEnginePreWarm.ps1's
      # -WorkflowRoute below (an ordinary HTTP warm-up call, unrelated to the Service Bus
      # message contract) - but no longer passed to Test-ShovelBridgeE2E.ps1 (-WorkflowName
      # removed there: the message body no longer names a workflow). VerifyEngineBaseUrl's
      # deployed trigger config, Settings/servicebustrigger.bite, is now baked in at deploy
      # time by the Deploy_UAT stage's Deploy-WwExecutionEngine.ps1 call above
      # (-ServiceBusTriggerWorkflowName '$(WwExecutionServiceBusTriggerWorkflowName)') rather
      # than written post-deploy - see that script and Enable-ServiceBusSecureTrigger.ps1 for
      # why the post-deploy write (the original WOLF-8517 design) could never work.
      VerifyWorkflowName: $(WwExecutionServiceBusTriggerWorkflowName)
      # Field values taken from a known-working sample invocation of the equivalent, already-
      # deployed workflow (https://wwprofilerlw.azurewebsites.net/Public/Profiler/V2/API/
      # ProfilerMain.json?...). Only the 16 fields ProfilerMain.bite's own DataList actually
      # declares as Input/Both are included (IdentityNo/IdentityType from that sample are not
      # declared in this copy's DataList and would be ignored as unknown keys - see the "Stage
      # ProfilerServices/* Load-Test Workflows (full unpruned set)" step's comment for that gap).
      #
      # MandateId uses {correlationGuid} so all 20,000 messages carry DISTINCT bodies. This
      # supersedes the earlier note here that {correlationId} was deliberately not interpolated
      # "until the Profiler schema is confirmed" - the schema is now provisioned and
      # source-controlled (Resources/ProfilerServices/Provision-ProfilerSchema.sql), so the correct
      # field and format are known.
      #
      # {correlationGuid} (WorkflowInputTemplate.cs) emits the message's own correlationId
      # reformatted as a valid uniqueidentifier - 26 hex of the run prefix + the 6-digit message
      # sequence. Plain {correlationId} cannot be used here: it is 39 characters and will not
      # parse as a GUID, which is exactly why this field was left constant before.
      #
      # Two reasons the value must vary, both load-bearing:
      #   1. Per-MESSAGE uniqueness restores Phase 4c's 1:1 reconciliation. With identical bodies
      #      there is no per-message key reaching the database, so a run where only 3 of 20,000
      #      messages executed is indistinguishable from a clean one.
      #   2. Per-RUN uniqueness is required for correctness, not just tidiness.
      #      Profiler.usp_InsertProfilerRecommendation is an upsert keyed on
      #      (MandateId, ForPaymentCycle); reusing MandateIds would return AlreadyExists=1 on
      #      every subsequent run, insert nothing, and make a healthy run look like 20,000 losses.
      # It also removes the single-hot-row contention this comment previously warned about: the
      # run now exercises 20,000 independent mandates instead of serialising on one.
      #
      # RelatedMandates stays constant on purpose - it is the ALGN "related mandate" input, and
      # pointing every message at one shared related-mandate is the realistic shape. ForPaymentCycle
      # 202402 / ResultPaymentCycle 202401 and MandateDRI 22 are all covered by the seeded
      # reference data (Profiler.ProfileDates has 63 rows for 202402, including DebitRunId 22).
      VerifyWorkflowInputsJson: '{"ForPaymentCycle":"202402","MandateCanTrack":"false","MandateDRI":"22","MandateId":"{correlationGuid}","RelatedMandates":"5B9800B6-2183-EB11-A812-000D3ABE1AD1","ResultDate":"2024-01-27","ResultDebitRunId":"22","ResultMethod":"DebiCheck","ResultPaymentCycle":"202401","ResultPresentedOnDate":"2024-01-22","ResultType":"Success","ScoreThisResult":"true","IsFixedExtract":"false","SourcePaymentId":"1234","RequestType":"","FASGroup":""}'
      # Reuses the SAME dedicated Entra app registration (and its already-minted client
      # secret pipeline variable) as pipeline-CLOUD.yml's own -VerifyWorkflowExecution leg -
      # see that job's identical variables for the full rationale. No new Entra app
      # registration or pipeline secret is needed for this job.
      ShovelE2EEntraTenantId: 'ca0cc53b-9af4-4067-bcdf-be9c648450d1'
      ShovelE2EDaemonClientId: 'dc1182bc-ffc1-4a1d-a414-ab672998eb9a'
      ShovelE2EResourceAppId: 'e200900a-2d5d-4356-94c0-cd7e33232ce0'

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    # Reuses the same service principal already used by the ExternalServiceBus job in
    # pipeline-CLOUD.yml (AzureClientId/AzureClientSecret/AzureTenantId) - no new pipeline
    # secrets needed.
    - pwsh: |
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        Write-Host "Logging in to Azure CLI as service principal ..."
        az login --service-principal `
            -u $env:AzureClientIdValue `
            -p $env:AzureClientSecretValue `
            --tenant $env:AzureTenantIdValue | Out-Null
        $account = az account show | ConvertFrom-Json
        Write-Host "Logged in: $($account.name) ($($account.id))"
      displayName: 'Log in to Azure CLI'
      env:
        AzureClientIdValue: $(AzureClientId)
        AzureClientSecretValue: $(AzureClientSecret)
        AzureTenantIdValue: $(AzureTenantId)

    # Same disableLocalAuth self-heal as the ExternalServiceBus job in pipeline-CLOUD.yml
    # (see that job's comment for the full root-cause writeup): the Shovel's dest-uri only
    # ever authenticates via SASL PLAIN (policy-name:key), so if a security baseline flips
    # disableLocalAuth to true on this namespace, every SAS-signed call - including this
    # job's own queue provisioning below and the Shovel's destination connection - starts
    # failing with 401 Unauthorized.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        $ns = '$(ServiceBusNamespace)'
        $rg = '$(ServiceBusResourceGroup)'

        $disableLocalAuth = az servicebus namespace show --name $ns --resource-group $rg --query disableLocalAuth -o tsv
        if ($LASTEXITCODE -ne 0) { throw "Failed to read 'disableLocalAuth' for Service Bus namespace '$ns' (exit $LASTEXITCODE)." }

        if ($disableLocalAuth -eq 'true') {
          Write-Host "##[warning]Service Bus namespace '$ns' has local (SAS) authentication disabled (disableLocalAuth=true) - this breaks the Shovel's SASL PLAIN dest-uri connection and any SAS-signed management API call. Restoring disableLocalAuth=false ..."
          az servicebus namespace update --name $ns --resource-group $rg --disable-local-auth false | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to restore 'disableLocalAuth=false' on Service Bus namespace '$ns' (exit $LASTEXITCODE)." }
          Write-Host "Restored: local (SAS) authentication is now enabled on '$ns'."
        } else {
          Write-Host "Service Bus namespace '$ns' already has local (SAS) authentication enabled (disableLocalAuth=$disableLocalAuth) - no action needed."
        }
      displayName: 'Ensure Service Bus namespace allows local (SAS) auth for the Shovel'

    # Idempotent 'show, create-if-missing' provisioning for the workflow-execution leg's OWN
    # queue (VerifyServiceBusQueueName) - deliberately Send-only, no Listen rule: this queue is
    # consumed exclusively by VerifyEngineBaseUrl's own Managed Identity subscription, and a
    # second SAS-based Listen consumer on it would compete for messages with that engine (see
    # pipeline-CLOUD.yml's identical step and Test-ShovelBridgeE2E.ps1's
    # -VerifyWorkflowExecution help). This queue is expected to already exist (created when
    # the secure Service Bus trigger was provisioned on the target engine via
    # Enable-ServiceBusSecureTrigger.ps1) - the create-if-missing here is only a safety net,
    # not the source of truth for that provisioning. Nothing is deleted after the run: this
    # is a dedicated, disposable testing namespace, so the queue/rule are left in place and
    # reused by every run rather than provisioned/torn down per-run.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        $ns       = '$(ServiceBusNamespace)'
        $rg       = '$(ServiceBusResourceGroup)'
        $queue    = '$(VerifyServiceBusQueueName)'
        $sendRule = '$(VerifyServiceBusSendRuleName)'

        function Test-AzExists([string[]] $CliArgs) {
          # See the identical helper + comment in pipeline-CLOUD.yml's ExternalServiceBus
          # job for why $ErrorActionPreference must be scoped to 'Continue' here.
          $ErrorActionPreference = 'Continue'
          $null = & az @CliArgs -o json 2>&1
          return $LASTEXITCODE -eq 0
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'show', '--name', $queue, '--namespace-name', $ns, '--resource-group', $rg))) {
          Write-Host "Creating queue '$queue' on '$ns'..."
          az servicebus queue create --name $queue --namespace-name $ns --resource-group $rg | Out-Null
        } else {
          Write-Host "Queue '$queue' already exists."
        }

        if (-not (Test-AzExists @('servicebus', 'queue', 'authorization-rule', 'show', '--name', $sendRule, '--namespace-name', $ns, '--resource-group', $rg, '--queue-name', $queue))) {
          Write-Host "Creating Send-only SAS rule '$sendRule'..."
          az servicebus queue authorization-rule create --name $sendRule --namespace-name $ns --resource-group $rg --queue-name $queue --rights Send | Out-Null
        } else {
          Write-Host "Send rule '$sendRule' already exists."
        }

        $sendKey = (az servicebus queue authorization-rule keys list --name $sendRule --namespace-name $ns --resource-group $rg --queue-name $queue --query primaryKey -o tsv)
        if ([string]::IsNullOrWhiteSpace($sendKey)) { throw "Failed to retrieve primary key for '$sendRule'." }
        $policyEnc = [Uri]::EscapeDataString($sendRule)
        $keyEnc    = [Uri]::EscapeDataString($sendKey)
        # '&cacertfile=/etc/ssl/certs/ca-certificates.crt' is REQUIRED on Erlang/OTP 26+
        # brokers (including this pipeline's rabbitmq.warewolf.online target) - without it the
        # Shovel's amqp10_client TLS handshake against Service Bus crash-loops with
        # '{cacerts, undefined}' and the shovel never leaves the 'starting' state (see
        # Test-ShovelBridgeE2E.ps1's -ExternalShovelDestUri help and
        # Configure-RabbitMqShovel.ps1's Format-ServiceBusAmqp10Uri -CaCertFile, which this
        # manually-built URI mirrors).
        $destUri   = "amqps://${policyEnc}:${keyEnc}@${ns}.servicebus.windows.net:5671/?sasl=plain&cacertfile=/etc/ssl/certs/ca-certificates.crt"

        Write-Host "##vso[task.setvariable variable=VerifyShovelDestUri;issecret=true]$destUri"
        Write-Host "Provisioning complete. Queue '$queue' ready on '$ns' with rule '$sendRule' (Send-only)."
      displayName: 'Ensure ShovelBridge E2E verification queue + Send-only SAS rule exist'

    # Acquires a fresh Entra app-only (client-credentials) access token for the dedicated
    # 'Warewolf-ShovelBridgeE2E-Daemon' app registration (see
    # docs/ServiceBusSecureTrigger-Architecture.md "Already provisioned in the DEV2 tenant") -
    # the SAME app pipeline-CLOUD.yml's own -VerifyWorkflowExecution leg uses. Deliberately
    # does NOT rotate the secret here (see pipeline-CLOUD.yml's identical step for the full
    # root-cause writeup on why per-run rotation was abandoned). Per this codebase's own
    # Daemon-client convention (docs/KB-ClientApps-Configuration.md), a Daemon's client secret
    # is minted ONCE by an Application Administrator and reused directly for
    # client-credentials token requests thereafter - not rotated on every run. The secret
    # below is $(ShovelE2EDaemonClientSecret), the SAME secure pipeline variable
    # pipeline-CLOUD.yml already relies on; it is deliberately not stored in this file.
    - powershell: |
        $ErrorActionPreference = 'Stop'

        if ([string]::IsNullOrWhiteSpace($env:ShovelE2EDaemonClientSecretValue)) {
          throw "Pipeline variable 'ShovelE2EDaemonClientSecret' is not set. An Application Administrator must mint a client secret for app 'dc1182bc-ffc1-4a1d-a414-ab672998eb9a' (see docs/ServiceBusSecureTrigger-Architecture.md) and store it as a secure pipeline variable of this name."
        }

        $tokenResponse = Invoke-RestMethod -Method POST `
          -Uri "https://login.microsoftonline.com/$(ShovelE2EEntraTenantId)/oauth2/v2.0/token" `
          -ContentType 'application/x-www-form-urlencoded' `
          -Body @{
            grant_type    = 'client_credentials'
            client_id     = '$(ShovelE2EDaemonClientId)'
            client_secret = $env:ShovelE2EDaemonClientSecretValue
            scope         = 'api://$(ShovelE2EResourceAppId)/.default'
          }
        if ([string]::IsNullOrWhiteSpace($tokenResponse.access_token)) {
          throw 'Failed to acquire an Entra access token for the ShovelBridge E2E daemon app. Verify the ShovelE2EDaemonClientSecret pipeline variable is current and not expired.'
        }

        Write-Host "##vso[task.setvariable variable=ShovelE2EAccessToken;issecret=true]$($tokenResponse.access_token)"
        Write-Host 'Acquired Entra access token for the workflow-execution verification leg.'
      displayName: 'Acquire Entra token for ShovelBridge E2E daemon (stored secret)'
      env:
        # Secret pipeline variables are NOT expanded via '$(...)' macro syntax directly inside
        # a script body (ADO deliberately withholds that for secret variables) - they must be
        # mapped through 'env:' and read as an environment variable instead.
        ShovelE2EDaemonClientSecretValue: $(ShovelE2EDaemonClientSecret)

    # docs/ShovelBridge-Architecture.md's 2026-08-16 entry root-caused this run's residual
    # ~15.7% failure rate (Service Bus MessageLockLost + Roslyn cold-start
    # OutOfMemoryException + cascading token-validation cancellations) to Consumption-plan
    # (Y1) cold-start/scale-out under the 1000-message burst, NOT to either previously-fixed
    # defect (workflow-pool thread-safety, persistence). Invoke-WwEnginePreWarm.ps1 (measured
    # there: 64.7s cold vs ~3.1s warm; a 100-message burst going from 31/100 discarded
    # un-warmed to 0/100 warmed) - warms VerifyEngineBaseUrl sequentially then RAMPS to
    # $(PublishConcurrency) concurrency (a proxy for the execution-side concurrency the
    # Service Bus trigger will fan out to) immediately before the burst below, reusing the
    # SAME token just minted above via -AccessToken rather than minting its own (the script's
    # other caller, the queue-processor load test, instead passes -EngineAppName/-EngineAppId
    # so the script mints one itself via WwE2E.Common.psm1). Deliberately not fatal on an
    # incomplete warm-up (the script only warns, and always exits 0 once its parameters
    # validate) - a cold engine here is exactly the condition the load test step below is
    # already equipped to retry/measure, not a reason to abort the run. READ THE WARM-UP
    # VERDICT when interpreting the load-test result below: the burst is published even when
    # warming failed, so a poor result following '[!] the final round still had failures' is
    # an engine capacity problem, not necessarily a product defect.
    #
    # -TargetConcurrency is the FINAL round's concurrency, not every round's: Phase B ramps
    # towards it (see Get-WarmupConcurrencyLadder). The 2026-08-24 run of this job opened
    # straight at 20 and recorded OK=22/60 at a 41.7s median, then died on a per-call
    # -TimeoutSec expiry before the load test ever started - both defects are fixed in the
    # script and regression-tested in Tests/Invoke-WwEnginePreWarm.Tests.ps1. See
    # docs/ShovelBridge-Architecture.md's 2026-08-24 entry.
    #
    # 2026-09-15: this now passes $(PreWarmConcurrency), NOT $(PublishConcurrency). The two were
    # the same variable purely by accident of both meaning "concurrency", but they drive
    # different systems - see PreWarmConcurrency's own comment in this job's variables block.
    # Warming at 20 against an engine deployed with maxConcurrentExecutions 2 does not warm the
    # workflow pool any faster (WorkflowExecutor._workflowPool grows to the peak concurrency
    # SEEN, capped at DefaultWorkflowPoolMax 8 and static, i.e. per-process); it just piles
    # executions onto a cold host, and a warm at concurrency 6 has already been observed to OOM
    # the engine outright.
    #
    # 2026-09-16: this now passes -InputParameters. It previously passed none, so
    # Format-WarmupRequestBody fell through to its DEFAULT body - {"inputParameters":{"message":...}} -
    # and 'message' is RabbitProcess's only input, which RequestForProfiling does not declare as an
    # Input at all (ColumnIODirection="None"). Every warm call therefore executed against an EMPTY
    # datalist and failed on the workflow's own variables ("Scalar value { MandateDRI } is NULL:
    # { DebitRunID }", "ResultPaymentCycle is NULL") - build 30690's 14/14 Phase A and 0/3-per-round
    # Phase B failures. DebitRunID/ExtractScheduleId in those messages are INTERNAL (None) variables
    # that are null downstream of the null Inputs, not inputs that need adding here. The script has
    # documented -InputParameters as REQUIRED for any non-RabbitProcess route since the identical
    # 2026-09-14 incident (119/119 failures); the guard was never wired up when
    # WwExecutionServiceBusTriggerWorkflowName switched to RequestForProfiling that same day.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $warmupTokenSecure = ConvertTo-SecureString $env:ShovelE2EAccessTokenValue -AsPlainText -Force

        # Reuse the burst's OWN payload rather than a second hand-maintained copy of the 16 fields:
        # one source of truth means a change to VerifyWorkflowInputsJson can never leave the warm-up
        # binding a stale field set (which is the class of drift that caused this step to break).
        # ConvertFrom-Json yields a PSCustomObject; -InputParameters is [hashtable], hence the
        # explicit projection.
        $warmupInputs = @{}
        foreach ($property in (ConvertFrom-Json '$(VerifyWorkflowInputsJson)').PSObject.Properties) {
            $warmupInputs[$property.Name] = $property.Value
        }

        # '{correlationGuid}' is Test-ShovelBridgeE2E's message-template token
        # (WorkflowInputTemplate.cs), expanded by the BURST publisher - it means nothing to the
        # warm-up script and would reach the workflow as a literal, failing the uniqueidentifier
        # parse. '{guid}' is Format-WarmupRequestBody's own per-CALL token. Per-call uniqueness is
        # required, not cosmetic: Profiler.usp_InsertProfilerRecommendation upserts on
        # (MandateId, ForPaymentCycle), so a constant MandateId would make every call after the
        # first a no-op AlreadyExists=1 hit on one hot row - warming a shorter code path than the
        # burst exercises. Fresh GUIDs also keep warm-up rows out of Phase 4c's 1:1 reconciliation
        # instead of colliding with the burst's own MandateIds.
        $warmupInputs['MandateId'] = '{guid}'

        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Invoke-WwEnginePreWarm.ps1' `
            -EngineBaseUrl '$(VerifyEngineBaseUrl)' `
            -WorkflowRoute 'Secure/$(VerifyWorkflowName)' `
            -AccessToken $warmupTokenSecure `
            -TargetConcurrency $(PreWarmConcurrency) `
            -InputParameters $warmupInputs
      displayName: 'Warm up UAT engine before the load-test burst'
      condition: and(succeeded(), eq('${{ parameters.SkipPreWarm }}', 'False'))
      env:
        ShovelE2EAccessTokenValue: $(ShovelE2EAccessToken)

    # WOLF-8512 (docs/ShovelBridge-Architecture.md's "build 30638" and "build 30640" entries):
    # Resources/ProfilerServices/Provision-ProfilerSchema.sql defines the [Profiler] schema/procedures
    # ProfilerMain.bite's tree calls, but the 'Stage ProfilerServices/* Load-Test Workflows (full
    # unpruned set)' step above deliberately EXCLUDES it (it's a DBA artefact, not an engine resource)
    # and, until now,
    # nothing ever applied it - so each time the script gained new procedures (11 -> 14, see its
    # own header) a human had to remember to re-run it by hand against the live database. That
    # was missed before build 30640: 996/1000 messages failed with SQL error 15009
    # ('Profiler.usp_GetProfilerRecommendation'/'usp_GetMandateProfilesDatesForDRIsInitials' does
    # not exist), even though both procedures were already committed in the script - proof the
    # database was simply behind it, not periodically reset (WarewolfDevOpsTestDb is a paid,
    # non-free-limit database; see ShovelBridge-Architecture.md's 2026-08-19 entry). Applying it
    # here, every run, closes that gap for good: the script is explicitly IDEMPOTENT
    # (CREATE OR ALTER procedures, existence-guarded tables, MERGE seeds - see its own header), so
    # a no-op re-run when nothing changed is safe and cheap. Reuses the SAME 'devops_warewolf'
    # plain-SQL login/secret Phase 4c below already relies on (env: DBPasswordValue).
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        if (-not (Get-Module -ListAvailable -Name SqlServer)) {
          Write-Host 'SqlServer PowerShell module not found - installing...'
          Install-Module -Name SqlServer -Scope CurrentUser -Force -AllowClobber -Repository PSGallery | Out-Null
        }
        Import-Module SqlServer -ErrorAction Stop

        Invoke-Sqlcmd `
            -ServerInstance 'warewolf-dev2-mcgeaj.database.windows.net' `
            -Database 'WarewolfDevOpsTestDb' `
            -Username 'devops_warewolf' `
            -Password $env:DBPasswordValue `
            -InputFile '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Resources\ProfilerServices\Provision-ProfilerSchema.sql' `
            -ConnectionTimeout 30 `
            -QueryTimeout 120 `
            -ErrorAction Stop

        Write-Host 'Profiler schema/procedures provisioned (idempotent) on WarewolfDevOpsTestDb.'
      displayName: 'Provision Profiler schema on WarewolfDevOpsTestDb (idempotent)'
      env:
        DBPasswordValue: $(DBPassword)

    # #Requires -Version 7.0 in Test-ShovelBridgeE2E.ps1 means this step MUST run under
    # PowerShell 7 (pwsh), not Windows PowerShell. Secrets are passed via env: (masked in
    # logs by ADO because they were marked issecret=true above, or declared secret in the
    # pipeline itself), never inlined into a command-line arguments string.
    # -VerifyWorkflowExecution -MessageCount $(MessageCount) drives the fully end-to-end load
    # test: 20,000 distinct workflow-trigger messages are published to RabbitMQ and ALL 20,000
    # must report a Succeeded execution result from VerifyEngineBaseUrl - proving both the
    # shovel bridge's throughput AND that every message actually drove a correct workflow
    # execution, not just message arrival.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $rabbitPasswordSecure = ConvertTo-SecureString $env:RabbitMqPasswordValue -AsPlainText -Force

        # 2026-09-15 - WHY THIS NO LONGER PASSES -ResultPollAuthToken. The Service Bus trigger
        # does not validate a per-message caller token (trust is the configured queue's
        # transport boundary - see docs/ServiceBusSecureTrigger-Architecture.md), which is why
        # -MessageAuthToken is absent. But the RESULT POLL is a different path: GET
        # /Secure/servicebus-result/{correlationId} is an ordinary Entra-protected HTTP route
        # (Functions/ServiceBusResultFunction.cs carries [RequireWorkflowPermission(View)], and
        # Auth/Middleware/WorkflowAuthorizationMiddleware.cs rejects an unauthenticated
        # /Secure/* request BEFORE policy evaluation - so the WAREWOLF_SECURITY_FLAGS
        # bypassSecureConfig=true set earlier in this pipeline does NOT make it anonymous; that
        # flag skips authorization, not authentication).
        #
        # An Entra access token lives 60-90 minutes. A 20,000-message drain takes longer than
        # that (~90 min projected), and the harness treats 401 as terminal rather than transient
        # (WOLF-8418 - a 500/401 from this engine is a real denial), so a token minted HERE and
        # polled with throughout the drain expires mid-run and marks every still-pending
        # correlationId as a spurious HttpError, indistinguishable at a glance from mass message
        # loss. That is a guaranteed failure at this volume, not a risk.
        #
        # So the credentials are handed over instead of a token: Test-ShovelBridgeE2E.ps1
        # publishes (needing no token at all), waits for the trigger queue to drain, mints a
        # FRESH token, and only then polls - against results that are already durably recorded,
        # which is why -ResultTimeoutSeconds stays at 1800 despite the 20x volume increase. This
        # depends on -EnablePersistence being set on the target engine (it is - see Deploy_UAT
        # above); with persistence off, a deferred poll would 404 on most ids because
        # ServiceBusReplayAndResultStore falls back to a process-local dictionary.
        #
        # ShovelE2EAccessToken (minted above) is still used, unchanged, by the pre-warm step -
        # that one runs immediately after minting and is nowhere near the token's lifetime.
        $resultPollClientSecretSecure = ConvertTo-SecureString $env:ShovelE2EDaemonClientSecretValue -AsPlainText -Force

        # WOLF-8512: opt-in database verification (Phase 4c), independent of the harness's own
        # /secure/servicebus-result poll - it proves the WORKFLOW BODY ran, not just that the
        # trigger recorded a result. -DbVerificationMode ProfilerRecommendation reconciles
        # Profiler.ProfilerRecommendation per message on MandateId (templated as
        # {correlationGuid} above, so each message carries a distinct run-scoped GUID).
        # The default 'Jobs1' mode is for RabbitProcess and would report
        # "usp_jobs1_Summary returned no rows" here, because ProfilerMain never writes
        # to dbo.jobs1. Schema + reference data:
        # Resources/ProfilerServices/Provision-ProfilerSchema.sql. 'devops_warewolf' is a plain SQL_USER
        # (authentication_type_desc = INSTANCE), NOT an Entra/AAD identity - confirmed directly
        # via 'SELECT ... FROM sys.database_principals' on 2026-08-31, which also DISPROVED the
        # 'Authentication=Active Directory Password' claim in an earlier entry of
        # docs/ShovelBridge-Architecture.md (that connection string's Authentication keyword was
        # simply wrong - see the correction entry there). Plain SQL authentication only; no
        # Authentication keyword. Server/database/login here are the same non-secret values
        # already used throughout this file's comments; only the password itself is a secret
        # (pipeline variable 'DBPassword').
        $jobsDbConnStringSecure = ConvertTo-SecureString (
            "Data Source=warewolf-dev2-mcgeaj.database.windows.net;Initial Catalog=WarewolfDevOpsTestDb;" +
            "User ID=devops_warewolf;Password=$($env:DBPasswordValue);Connection Timeout=30"
        ) -AsPlainText -Force

        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Tests\Integration\Test-ShovelBridgeE2E.ps1' `
            -DestinationMode ExternalServiceBus `
            -DestinationQueueName '$(VerifyServiceBusQueueName)' `
            -SourceQueueName '$(SourceQueueName)' `
            -ShovelName '$(ShovelName)' `
            -ExternalShovelDestUri $env:VerifyShovelDestUriValue `
            -RabbitMqMode External `
            -ExternalRabbitMqManagementUri '$(ExternalRabbitMqManagementUri)' `
            -ExternalRabbitMqUsername '$(ExternalRabbitMqUsername)' `
            -ExternalRabbitMqPassword $rabbitPasswordSecure `
            -VerifyWorkflowExecution `
            -WorkflowInputsJson '$(VerifyWorkflowInputsJson)' `
            -EngineBaseUrl '$(VerifyEngineBaseUrl)' `
            -ResultPollTenantId '$(ShovelE2EEntraTenantId)' `
            -ResultPollClientId '$(ShovelE2EDaemonClientId)' `
            -ResultPollResourceAppId '$(ShovelE2EResourceAppId)' `
            -ResultPollClientSecret $resultPollClientSecretSecure `
            -DrainQuietSeconds $(DrainQuietSeconds) `
            -DrainTimeoutSeconds $(DrainTimeoutSeconds) `
            -MessageCount $(MessageCount) `
            -PublishConcurrency $(PublishConcurrency) `
            -ShovelPrefetchCount $(ShovelPrefetchCount) `
            -JobsDbConnectionString $jobsDbConnStringSecure `
            -DbVerificationMode ProfilerRecommendation `
            -ServiceBusNamespaceName '$(ServiceBusNamespace)' `
            -ServiceBusResourceGroup '$(ServiceBusResourceGroup)' `
            -ResultTimeoutSeconds 1800
      displayName: 'Run ShovelBridge load test (20000 messages, VerifyWorkflowExecution mode, UAT engine)'
      env:
        VerifyShovelDestUriValue: $(VerifyShovelDestUri)
        # The daemon app's client secret, mapped through env: for the same reason the token
        # step above does it - ADO does not expand secret variables via '$(...)' inside a
        # script body. Test-ShovelBridgeE2E.ps1 uses it to mint the result-poll token itself,
        # after the drain (see the comment block at the top of this step).
        ShovelE2EDaemonClientSecretValue: $(ShovelE2EDaemonClientSecret)
        # ExternalRabbitMqPassword is a secret pipeline variable set directly in this
        # pipeline's Azure DevOps variable configuration (marked "keep this value secret").
        # Secret variables aren't expanded via '$(...)' inside a script body, so it's mapped
        # through env: here, same as ShovelE2EDaemonClientSecret above.
        RabbitMqPasswordValue: $(ExternalRabbitMqPassword)
        # 'devops_warewolf''s Entra password (WOLF-8512, dbo.jobs1 verification) - same
        # secret-variable convention as the two above.
        DBPasswordValue: $(DBPassword)

  # Load-test of the OTHER trigger mechanism into the same WarewolfServer-UAT engine:
  # Warewolf.Execution.QueueProcessor, the reworked QueueWorker.exe that now runs as its own
  # RabbitMQ-triggered Azure Container App (ACA + KEDA) instead of an in-process engine trigger.
  # Publishes the same 20,000-message volume against the same RequestForProfiling workflow the
  # ShovelBridgeLoadTest_ExternalServiceBus job above already load-tests over Service Bus, so the
  # two trigger mechanisms have comparable proof under CI.
  #
  # dependsOn ShovelBridgeLoadTest_ExternalServiceBus DELIBERATELY, rather than running alongside
  # it the way Load_Tests and ShovelBridgeLoadTest_ExternalServiceBus do: WarewolfServer-UAT's
  # concurrency budget (-FunctionAppScaleLimit 30, -ServiceBusMaxConcurrentCalls 2 in Deploy_UAT
  # above) and WarewolfDevOpsTestDb's SQL budget were both tuned for ONE 20,000-message burst at a
  # time. A second burst arriving through a different trigger mechanism while the first is still
  # draining would compete for the same engine instances and the same database, and neither run's
  # numbers could be trusted. Revisit once both are individually proven.
  #
  # Verification is worker+engine LOG reconciliation (Get-WwQueueRunReport.ps1), not a database
  # check: RequestForProfiling stopped writing to dbo.jobs1 when the load-test-only RabbitProcess
  # nesting was removed (see the "Stage ProfilerServices/*" step's 2026-09-23 note above), so the
  # generic dbo.jobs1-based reconciliation this repo's other load-test scripts use does not apply
  # here, and a new Profiler.ProfilerRecommendation-shaped SQL check is out of scope for this job.
  #
  # Optional, off by default: runs only when the RunQueueProcessorLoadTest parameter is ticked at
  # queue time. A runtime condition (not a ${{ if }} wrapper) so a run with it off still shows the
  # job as Skipped rather than silently absent. succeeded() preserves the implicit dependsOn gate.
  - job: ProfilerLoadTest_QueueProcessor
    displayName: 'RabbitMQ QueueProcessor Load Test (20000 messages, RequestForProfiling, Azure)'
    dependsOn: ShovelBridgeLoadTest_ExternalServiceBus
    condition: and(succeeded(), eq('${{ parameters.RunQueueProcessorLoadTest }}', 'True'))
    pool:
      vmImage: 'windows-2022'
    # Unmeasured for this path - see the header comment above. Same budget as
    # ShovelBridgeLoadTest_ExternalServiceBus's own 20,000-message run; treat the first real run
    # here as the calibration run, same as that job's own volume increase was treated.
    timeoutInMinutes: 240
    variables:
      MessageCount: 20000
      ResourceGroup: 'DEV2'
      # Same ACA environment/registry pipeline-CLOUD.yml's own live QueueProcessor CI test already
      # deploys to successfully - not the separate 'dev2-cae'/'tudev2containerregistry' pair the
      # manual E2E-verification harness's sandbox uses (see warewolf-e2e-verify skill notes).
      AcaEnvironment: 'aca-warewolf'
      AcrName: 'acrwarewolf'
      # Fixed, dedicated prefix - distinct from pipeline-CLOUD.yml's 'wwqpci-' CI smoke-test app,
      # so the two are never confused and never compete for the same Container App name. Redeployed
      # fresh every run (same "redeploy the same app every run" convention already used for
      # WarewolfServer-UAT itself above), so a stale image can never silently keep serving.
      WorkerAppNamePrefix: 'wwqp-loadtest-'
      QueueName: 'wwexecution-profiler-loadtest'
      DeadLetterQueue: 'wwexecution-profiler-loadtest-errors'
      # Same proven-safe ceiling as the trigger's own Concurrency (Dev/.azure/
      # ProfilerLoadTest.trigger.bite) - maxReplicas is DERIVED from Concurrency by
      # Deploy-WwQueueProcessor.ps1, not a separate deploy flag; the two must agree, which is why
      # this is a comment rather than a parameter passed here.
      DrainQuietSeconds: 360
      DrainTimeoutSeconds: 9000
      VerifyEngineBaseUrl: 'https://warewolfserver-uat.azurewebsites.net'
      VerifyWorkflowName: 'ProfilerServices/ProfilerWrapper/RequestForProfiling'
      # IDENTICAL to ShovelBridgeLoadTest_ExternalServiceBus's own VerifyWorkflowInputsJson above -
      # both jobs pre-warm and (functionally) invoke the SAME workflow, just over different trigger
      # mechanisms, so the same known-good input shape applies unchanged. MandateId here is a
      # literal placeholder value only used by the pre-warm call; the burst itself (Step: 'Publish
      # the burst' below) generates a fresh, unique MandateId per message via New-WwBurstBody
      # -Shape Profiler, independent of this JSON.
      VerifyWorkflowInputsJson: '{"ForPaymentCycle":"202402","MandateCanTrack":"false","MandateDRI":"22","MandateId":"109800B6-2183-EB11-A812-000D3ABE1AD1","RelatedMandates":"5B9800B6-2183-EB11-A812-000D3ABE1AD1","ResultDate":"2024-01-27","ResultDebitRunId":"22","ResultMethod":"DebiCheck","ResultPaymentCycle":"202401","ResultPresentedOnDate":"2024-01-22","ResultType":"Success","ScoreThisResult":"true","IsFixedExtract":"false","SourcePaymentId":"1234","RequestType":"","FASGroup":""}'
      PreWarmConcurrency: 2
      # Reuses the SAME dedicated Entra app registration ShovelBridgeLoadTest_ExternalServiceBus
      # already uses (WarewolfServer-UAT's own live audience, confirmed via
      # WAREWOLF_ENTRA_CONFIG - see that job's identical variables) - no new Entra app registration
      # or pipeline secret is needed for this job either.
      ProfilerLoadTestEntraTenantId: 'ca0cc53b-9af4-4067-bcdf-be9c648450d1'
      ProfilerLoadTestDaemonClientId: 'dc1182bc-ffc1-4a1d-a414-ab672998eb9a'
      ProfilerLoadTestResourceAppId: 'e200900a-2d5d-4356-94c0-cd7e33232ce0'
      # No broker variable here: the broker is whatever the downloaded "Warewolf DevOps RabbitMQ
      # Source" names (the CloudAMQP instance), and RabbitMqManagementUri is set from that source's
      # host by the "Resolve the broker management URI" step below. This job must NOT use the
      # self-hosted 'rabbitmq.warewolf.online' broker ShovelBridgeLoadTest_ExternalServiceBus
      # publishes to: that one exists only for its shovel plugin, and no shovel is involved here -
      # KEDA and the worker consume the queue directly. Hardcoding that URI here sent the CloudAMQP
      # credentials from the source to the self-hosted broker's management API.
      ReportDir: '$(Agent.BuildDirectory)\ProfilerLoadTestReport'
      QueueCountsPath: '$(Agent.BuildDirectory)\ProfilerLoadTestReport\queue-counts.json'
      # The worker and deployment-scripts release URLs Deploy_UAT resolved for the engine it just
      # deployed, so this job's worker and Deploy-WwQueueProcessor.ps1 come from the SAME release
      # (see that stage's 'Resolve Published Release URLs' step).
      ResolvedQueueWorkerZipUrl: $[ stageDependencies.Deploy_UAT.Deploy_UAT.outputs['ResolveRelease.ResolvedQueueWorkerZipUrl'] ]
      ResolvedScriptsZipUrl: $[ stageDependencies.Deploy_UAT.Deploy_UAT.outputs['ResolveRelease.ResolvedScriptsZipUrl'] ]

    steps:
    - checkout: self
      clean: false

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    # The PUBLISHED QueueProcessor worker and its deploy orchestrator, in place of the worker this
    # pipeline used to compile from the commit - same package and discovery as the Profiler Dev/UAT
    # pipelines' 'Download QueueProcessor Package' step. The published Warewolf-QueueProcessor-
    # <ver>.zip is the raw `dotnet publish` output (pipeline-CLOUD.yml zips 'QueueProcessorRelease',
    # which is that folder), so its extracted root is a drop-in -PublishPath for
    # Deploy-WwQueueProcessor.ps1, Initialize-E2ERabbitClient and Publish-WwQueueBurst.ps1 (the
    # last two only load its RabbitMQ.Client.dll). The Dockerfile and trigger file still come from
    # this checkout, as in the Profiler pipelines.
    #
    # The URLs were already trust-checked in Deploy_UAT; they are checked again here because an
    # output variable is just a string by the time it crosses a stage boundary.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $expectedHost = '$(WarewolfReleasesStorageAccount).blob.core.windows.net'
        foreach ($pair in @(@('$(ResolvedQueueWorkerZipUrl)', 'QueueProcessor package'), @('$(ResolvedScriptsZipUrl)', 'deployment scripts package'))) {
          $parsed = $null
          if (-not [uri]::TryCreate($pair[0], [UriKind]::Absolute, [ref]$parsed) -or $parsed.Scheme -ne 'https' -or $parsed.Host -ne $expectedHost) {
            throw "Refusing to fetch the $($pair[1]) from untrusted URL '$($pair[0])' (expected https://$expectedHost/...). Deploy_UAT's 'Resolve Published Release URLs' step publishes it."
          }
        }

        $zip = "$(Agent.BuildDirectory)\QueueProcessor.zip"
        $dir = "$(Agent.BuildDirectory)\QueueProcessorPublish"
        Invoke-WebRequest -Uri '$(ResolvedQueueWorkerZipUrl)' -OutFile $zip -UseBasicParsing -TimeoutSec 300 -MaximumRetryCount 3 -RetryIntervalSec 10
        if ((Get-Item $zip).Length -le 0) { throw "Downloaded QueueProcessor package is empty: $zip" }
        if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
        Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force

        # Flat today; tolerate a single wrapping folder the way the scripts-zip discovery does.
        $dll = Get-ChildItem -LiteralPath $dir -Recurse -Filter 'Warewolf.Execution.QueueProcessor.dll' | Select-Object -First 1
        if (-not $dll) { throw "Warewolf.Execution.QueueProcessor.dll not found under $dir - this is not a QueueProcessor publish package." }
        Write-Host "##vso[task.setvariable variable=QueueWorkerPublishPath]$($dll.DirectoryName)"
        Write-Host "QueueProcessor package : $(ResolvedQueueWorkerZipUrl)"
        Write-Host "Publish root           : $($dll.DirectoryName)"

        $scriptsZip = "$(Agent.BuildDirectory)\DeploymentScripts.zip"
        $scriptsDir = "$(Agent.BuildDirectory)\DeploymentScripts"
        Invoke-WebRequest -Uri '$(ResolvedScriptsZipUrl)' -OutFile $scriptsZip -UseBasicParsing -TimeoutSec 120 -MaximumRetryCount 3 -RetryIntervalSec 10
        if (Test-Path $scriptsDir) { Remove-Item $scriptsDir -Recurse -Force }
        Expand-Archive -LiteralPath $scriptsZip -DestinationPath $scriptsDir -Force
        $deployScript = Get-ChildItem -LiteralPath $scriptsDir -Recurse -Filter 'Deploy-WwQueueProcessor.ps1' | Select-Object -First 1
        if (-not $deployScript) { throw "Deploy-WwQueueProcessor.ps1 not found anywhere under $scriptsDir - the published scripts package layout has changed, or the release predates it. Pin WarewolfScriptsZipUrl to a build that carries it." }
        Write-Host "##vso[task.setvariable variable=QueueProcessorDeployScriptPath]$($deployScript.FullName)"
        Write-Host "Deploy-WwQueueProcessor.ps1: $($deployScript.FullName)"
      displayName: 'Download QueueProcessor Package + Deployment Scripts'

    # Reuses the same service principal already used by every other Azure step in this pipeline
    # (AzureClientId/AzureClientSecret/AzureTenantId) - no new pipeline secret needed.
    - pwsh: |
        # Every `az` call below retries a transient ARM/network failure (Scripts/WwAzCli.psm1, build 30844).
        Import-Module '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwAzCli.psm1' -Force
        Set-Alias -Name az -Value Invoke-WwAz -Scope Script
        Write-Host "Logging in to Azure CLI as service principal ..."
        az login --service-principal `
            -u $env:AzureClientIdValue `
            -p $env:AzureClientSecretValue `
            --tenant $env:AzureTenantIdValue | Out-Null
        $account = az account show | ConvertFrom-Json
        Write-Host "Logged in: $($account.name) ($($account.id))"
      displayName: 'Log in to Azure CLI'
      env:
        AzureClientIdValue: $(AzureClientId)
        AzureClientSecretValue: $(AzureClientSecret)
        AzureTenantIdValue: $(AzureTenantId)

    # "Warewolf DevOps RabbitMQ Source" (QueueSourceId 1a82a341-... in the trigger below) carries
    # the CloudAMQP broker's live credentials, so it cannot be committed as a static file (the
    # committed copies under Warewolf.Execution.QueueProcessor are blanked) - it must be fetched
    # fresh on every pipeline run, exactly as pipeline-CLOUD.yml's own
    # "Download Warewolf DevOps RabbitMQ Source.bite from DevOps Endpoint" step already does (same
    # endpoint, same CFAccessClientId/CFAccessClientSecret headers, same content-sniffing retry
    # logic - copied verbatim here rather than factored out, matching this file's existing
    # convention of each job owning its own steps).
    - powershell: |
        $uri         = 'https://devops.warewolf.online/warewolf-devops/api/download-bite/rabbitmq'
        $destDir     = "$(Agent.BuildDirectory)\ProfilerLoadTestSources"
        $targetPath  = Join-Path $destDir 'Warewolf DevOps RabbitMQ Source.bite'
        $tempPath    = "$(Agent.BuildDirectory)\WarewolfDevOpsRabbitMQSource.bite.download"
        $maxAttempts = 4
        $baseDelay   = 5
        if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }

        $headers = @{
            'CF-Access-Client-Id'     = $env:CFAccessClientIdValue
            'CF-Access-Client-Secret' = $env:CFAccessClientSecretValue
        }

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
                $r = Invoke-WebRequest -Uri $uri -Method GET -Headers $headers -UseBasicParsing -TimeoutSec 60 -OutFile $tempPath -PassThru

                $contentType = [string]$r.Headers['Content-Type']
                $body        = Get-Content -LiteralPath $tempPath -Raw
                Write-Host "Response StatusCode=$($r.StatusCode) Content-Type=$contentType Length=$($body.Length)"

                $looksLikeHtml   = $contentType -match 'text/html' -or $body -match '(?i)<html'
                $looksLikeSource = $body -match '<Source ' -and $body -match 'ID="1a82a341-b678-4992-a25a-39cdd57198d4"'

                if ($looksLikeHtml -or -not $looksLikeSource) {
                    throw "Downloaded content is not the expected Warewolf DevOps RabbitMQ Source .bite XML (Content-Type: $contentType). This usually means the Cloudflare Access Service Token headers (CFAccessClientId/CFAccessClientSecret) were rejected and an Azure AD SSO login page was returned instead."
                }

                Move-Item -LiteralPath $tempPath -Destination $targetPath -Force
                Write-Host "Wrote Warewolf DevOps RabbitMQ Source.bite ($((Get-Item $targetPath).Length) bytes) to $targetPath"
                break
            } catch {
                Remove-Item -LiteralPath $tempPath -Force -ErrorAction SilentlyContinue

                if ($attempt -ge $maxAttempts) {
                    Write-Host "##[error]Request to devops download endpoint failed after $maxAttempts attempts: $($_.Exception.Message)"
                    throw
                }

                $delaySeconds = $baseDelay * [math]::Pow(2, $attempt - 1)
                Write-Host "##[warning]Attempt $attempt/$maxAttempts failed: $($_.Exception.Message). Retrying in $delaySeconds s (likely a transient Cloudflare Tunnel/connector drop)..."
                Start-Sleep -Seconds $delaySeconds
            }
        }
      displayName: 'Download Warewolf DevOps RabbitMQ Source.bite from DevOps Endpoint'
      env:
        CFAccessClientIdValue: $(CFAccessClientId)
        CFAccessClientSecretValue: $(CFAccessClientSecret)

    # The management HTTP API is served over HTTPS on the AMQP host itself (CloudAMQP/LavinMQ), so
    # the URI is taken from the source just downloaded. The baseline, drain and after-drain steps
    # authenticate with that source's credentials, so they must reach that same broker.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Import-Module "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwE2E.Common.psm1" -Force
        $amqpUri = Resolve-E2EBrokerUri -SourceBitePath "$(Agent.BuildDirectory)\ProfilerLoadTestSources\Warewolf DevOps RabbitMQ Source.bite"
        if (-not $amqpUri) { throw 'Could not resolve a plaintext AMQP URI from the downloaded RabbitMQ source .bite.' }
        $brokerHost = ([uri]$amqpUri).Host
        if ([string]::IsNullOrWhiteSpace($brokerHost)) { throw 'The downloaded RabbitMQ source .bite names no broker host.' }
        $managementUri = "https://$brokerHost"
        Write-Host "##vso[task.setvariable variable=RabbitMqManagementUri]$managementUri"
        Write-Host "Broker management URI: $managementUri"
      displayName: 'Resolve the broker management URI from the downloaded source'

    # Deploys a fresh QueueProcessor Container App every run (Mode: redeploy, fixed name - see
    # this job's header comment), built from the RELEASED worker package by the RELEASED
    # Deploy-WwQueueProcessor.ps1 (both downloaded above). -EngineResourceAppId is WarewolfServer-UAT's own live Entra
    # audience (confirmed via WAREWOLF_ENTRA_CONFIG, same value as ShovelBridgeLoadTest_
    # ExternalServiceBus's ShovelE2EResourceAppId above) - the worker's managed identity mints its
    # own token against this audience at runtime, so no client secret is needed for this step.
    # -KeyVaultName/-KeyVaultSecretName is the SAME Key Vault key WarewolfServer-UAT's own deploy
    # (Deploy_UAT stage above) already uses, kept consistent within this file rather than reusing
    # pipeline-CLOUD.yml's unrelated 'wwaeskey' (that key belongs to a different app, warewolfserver).
    # -RabbitMqConnectionUri is resolved FRESH from the source .bite downloaded above, so the KEDA
    # rule always watches the same broker and credentials the worker and the burst publisher use.
    # Do NOT reuse pipeline-CLOUD.yml's QueueWorkerCiRabbitMqSecretUri: it is not defined on this
    # pipeline (build 30827 passed the unexpanded macro text and the deploy died mid-flight).
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Import-Module "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwE2E.Common.psm1" -Force
        $brokerUri = Resolve-E2EBrokerUri -SourceBitePath "$(Agent.BuildDirectory)\ProfilerLoadTestSources\Warewolf DevOps RabbitMQ Source.bite"
        if (-not $brokerUri) { throw 'Could not resolve a plaintext AMQP URI from the downloaded RabbitMQ source .bite - the KEDA rule would have no broker auth.' }

        & '$(QueueProcessorDeployScriptPath)' `
            -ResourceGroup       '$(ResourceGroup)' `
            -Location            'southafricanorth' `
            -AcaEnvironment      '$(AcaEnvironment)' `
            -AcrName             '$(AcrName)' `
            -AppNamePrefix       '$(WorkerAppNamePrefix)' `
            -PublishPath         '$(QueueWorkerPublishPath)' `
            -DockerfilePath      "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.QueueProcessor\Dockerfile" `
            -TriggerFilePath     "$(Build.SourcesDirectory)\Dev\.azure\ProfilerLoadTest.trigger.bite" `
            -QueueSourcePath     "$(Agent.BuildDirectory)\ProfilerLoadTestSources" `
            -EngineBaseUrl       '$(VerifyEngineBaseUrl)' `
            -EngineResourceAppId '$(ProfilerLoadTestResourceAppId)' `
            -KeyVaultName        'WWExecutionEngine' `
            -KeyVaultSecretName  'WWExecutionEngineTestSecret' `
            -RabbitMqConnectionUri $brokerUri `
            -EncryptStagedSettings `
            -LogDir              "$(Agent.BuildDirectory)\ProfilerLoadTestDeploy" `
            -NonInteractive

        $summary = Get-ChildItem "$(Agent.BuildDirectory)\ProfilerLoadTestDeploy\deploy-WwQueueProcessor-*.summary.json" -ErrorAction Stop |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
        $deployed = (Get-Content -LiteralPath $summary.FullName -Raw | ConvertFrom-Json).queueProcessorApps | Select-Object -First 1
        if (-not $deployed -or $deployed.status -ne 'deployed') {
            throw "QueueProcessor deploy did not succeed for trigger '$($deployed.trigger)': $($deployed.error)"
        }
        Write-Host "##vso[task.setvariable variable=ProfilerLoadTestAppName]$($deployed.app)"
        Write-Host "Deployed live QueueProcessor Container App: $($deployed.app)"
      displayName: 'Deploy QueueProcessor Container App (az acr build, DEV2/aca-warewolf)'

    # PublishRabbitMQActivity-style consumers cannot create their own exchange/queue/binding (a
    # failed passive declare closes the channel before the active declare can run - see
    # WwE2E.Common.psm1's Initialize-E2EQueueTopology for the full mechanics), so this declares the
    # load test's own queue topology explicitly up front - same helper and same pattern
    # pipeline-CLOUD.yml's own "Ensure QueueWorker CI test queue topology exists" step already
    # uses, just against this job's dedicated queue name.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Import-Module "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwE2E.Common.psm1" -Force
        Initialize-E2ERabbitClient -PublishPath '$(QueueWorkerPublishPath)'
        $amqpUri = Resolve-E2EBrokerUri -SourceBitePath "$(Agent.BuildDirectory)\ProfilerLoadTestSources\Warewolf DevOps RabbitMQ Source.bite"
        if (-not $amqpUri) { throw 'Could not resolve a plaintext AMQP URI from the downloaded RabbitMQ source .bite.' }
        $session = New-E2EBrokerSession -AmqpUri $amqpUri -ClientName 'wwqp-profilerloadtest-topology'
        try {
            Initialize-E2EQueueTopology -Session $session -QueueName '$(QueueName)' -Durable $false | Out-Null
        } finally {
            Close-E2EBrokerSession -Session $session
        }
      displayName: 'Ensure ProfilerLoadTest queue topology exists'

    # Acquires a fresh Entra app-only (client-credentials) access token for the pre-warm call,
    # reusing ShovelBridgeLoadTest_ExternalServiceBus's identical step against the same Daemon app
    # registration - see that step's own comment for the full rationale (Daemon secrets are minted
    # once and reused, never rotated per-run).
    - powershell: |
        $ErrorActionPreference = 'Stop'

        if ([string]::IsNullOrWhiteSpace($env:ProfilerLoadTestDaemonClientSecretValue)) {
          throw "Pipeline variable 'ShovelE2EDaemonClientSecret' is not set. An Application Administrator must mint a client secret for app 'dc1182bc-ffc1-4a1d-a414-ab672998eb9a' (see docs/ServiceBusSecureTrigger-Architecture.md) and store it as a secure pipeline variable of this name."
        }

        $tokenResponse = Invoke-RestMethod -Method POST `
          -Uri "https://login.microsoftonline.com/$(ProfilerLoadTestEntraTenantId)/oauth2/v2.0/token" `
          -ContentType 'application/x-www-form-urlencoded' `
          -Body @{
            grant_type    = 'client_credentials'
            client_id     = '$(ProfilerLoadTestDaemonClientId)'
            client_secret = $env:ProfilerLoadTestDaemonClientSecretValue
            scope         = 'api://$(ProfilerLoadTestResourceAppId)/.default'
          }
        if ([string]::IsNullOrWhiteSpace($tokenResponse.access_token)) {
          throw 'Failed to acquire an Entra access token for the ShovelBridge E2E daemon app. Verify the ShovelE2EDaemonClientSecret pipeline variable is current and not expired.'
        }

        Write-Host "##vso[task.setvariable variable=ProfilerLoadTestAccessToken;issecret=true]$($tokenResponse.access_token)"
        Write-Host 'Acquired Entra access token for the pre-warm call.'
      displayName: 'Acquire Entra token for pre-warm (stored secret)'
      env:
        ProfilerLoadTestDaemonClientSecretValue: $(ShovelE2EDaemonClientSecret)

    # Same pre-warm as ShovelBridgeLoadTest_ExternalServiceBus's own "Warm up UAT engine before the
    # load-test burst" step above, against the SAME workflow route - a cold Consumption (Y1)
    # instance measured 64.7s vs ~3.1s warm (see that step's own header comment for the full
    # measurement). -TargetConcurrency matches this trigger's own Concurrency (6) via
    # PreWarmConcurrency, not the publish-side concurrency - see WwLoadTest.Defaults.psd1's
    # PreWarmConcurrency field for why those two knobs must not be conflated.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $warmupTokenSecure = ConvertTo-SecureString $env:ProfilerLoadTestAccessTokenValue -AsPlainText -Force

        $warmupInputs = @{}
        foreach ($property in (ConvertFrom-Json '$(VerifyWorkflowInputsJson)').PSObject.Properties) {
            $warmupInputs[$property.Name] = $property.Value
        }
        $warmupInputs['MandateId'] = '{guid}'

        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Invoke-WwEnginePreWarm.ps1' `
            -EngineBaseUrl '$(VerifyEngineBaseUrl)' `
            -WorkflowRoute 'Secure/$(VerifyWorkflowName)' `
            -AccessToken $warmupTokenSecure `
            -TargetConcurrency $(PreWarmConcurrency) `
            -InputParameters $warmupInputs
      displayName: 'Warm up UAT engine before the QueueProcessor load-test burst'
      condition: and(succeeded(), eq('${{ parameters.SkipPreWarm }}', 'False'))
      env:
        ProfilerLoadTestAccessTokenValue: $(ProfilerLoadTestAccessToken)

    # A self-hosted agent keeps its build directory between runs, and the report artifact would
    # then carry the previous runs' run reports alongside this one's.
    - pwsh: |
        $dir = '$(ReportDir)'
        if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
      displayName: 'Clear the load test report folder'

    # The trigger and dead-letter queues' depth and counters before the burst; the same read after
    # the drain completes queue-counts.json. next_seq_id rises by one per enqueued message and is
    # the measure: the management API's publish counter undercounts under load. Read over the
    # management HTTP API, not AMQP, for the same .NET 10 teardown crash Get-E2EQueueDepthHttp avoids.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Import-Module "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwE2E.Common.psm1" -Force
        $amqpUri   = Resolve-E2EBrokerUri -SourceBitePath "$(Agent.BuildDirectory)\ProfilerLoadTestSources\Warewolf DevOps RabbitMQ Source.bite"
        $brokerCtx = Get-E2EBrokerContextFromUri -AmqpUri $amqpUri

        $counts = [ordered]@{}
        foreach ($role in @(@{ Key = 'trigger'; Name = '$(QueueName)' }, @{ Key = 'deadLetter'; Name = '$(DeadLetterQueue)' })) {
            $url = '{0}/api/queues/{1}/{2}' -f '$(RabbitMqManagementUri)'.TrimEnd('/'), [uri]::EscapeDataString($brokerCtx.VHost), [uri]::EscapeDataString($role.Name)
            $q = Invoke-RestMethod -Uri $url -Credential $brokerCtx.Credential -TimeoutSec 30
            $stats = if ($q.PSObject.Properties['message_stats']) { $q.message_stats } else { $null }
            $counts[$role.Key] = [ordered]@{
                queue  = $role.Name
                before = [ordered]@{
                    readUtc   = [DateTime]::UtcNow.ToString('o')
                    depth     = $q.messages
                    unacked   = $q.messages_unacknowledged
                    consumers = $q.consumers
                    published = if ($stats -and $stats.PSObject.Properties['publish']) { $stats.publish } else { $null }
                    acked     = if ($stats -and $stats.PSObject.Properties['ack']) { $stats.ack } else { $null }
                    nextSeqId = if ($q.PSObject.Properties['backing_queue_status'] -and $q.backing_queue_status.PSObject.Properties['next_seq_id']) { $q.backing_queue_status.next_seq_id } else { $null }
                }
            }
            Write-Host "Queue '$($role.Name)' before the burst: depth $($q.messages)"
        }
        $counts | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath '$(QueueCountsPath)' -Encoding utf8
      displayName: 'Capture trigger and dead-letter queue baseline'

    # Publishes 20,000 distinct messages using the FLAT 16-field body shape RequestForProfiling's
    # own DataList declares - REQUIRED to match the trigger's MapEntireMessage:false / 16-input
    # binding above (Dev/.azure/ProfilerLoadTest.trigger.bite): MessageToInputsMapper binds each
    # declared input by looking up a TOP-LEVEL property of the same name in the message, so the
    # message must be flat with matching names, not nested. See Publish-WwQueueBurst.ps1's own
    # header comment on '-BodyShape Profiler' for the prior incident (10/10 messages dead-lettered
    # on 'uat2-nowarm-profiler-1') this shape avoids. MandateId is generated fresh and unique per
    # message by the publisher itself; no manual templating is needed here.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        & '$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Publish-WwQueueBurst.ps1' `
            -QueueName      '$(QueueName)' `
            -SuccessCount   $(MessageCount) `
            -BodyShape      'Profiler' `
            -Label          'profloadtest' `
            -SourceBitePath "$(Agent.BuildDirectory)\ProfilerLoadTestSources\Warewolf DevOps RabbitMQ Source.bite" `
            -PublishPath    '$(QueueWorkerPublishPath)' `
            -ManifestPath   "$(Agent.BuildDirectory)\ProfilerLoadTestManifest.json"
      displayName: 'Publish the burst (20000 messages, RequestForProfiling shape)'

    # Polls the queue's own depth (over the Management HTTP API, not AMQP - an AMQP connection
    # teardown crashes this process on .NET 10, see WwE2E.Common.psm1's Get-E2EQueueDepthHttp) until
    # it has been empty for DrainQuietSeconds. An EMPTY QUEUE READING ALONE IS NOT THE SIGNAL: KEDA
    # and a passive declare both report only READY messages, so work already claimed by a replica is
    # invisible here - the quiet window is what protects against declaring victory mid-drain. Modeled
    # directly on Run-WwProfilerExactLoad.ps1's own drain loop, using only its queue-depth half (this
    # job has no dbo.jobs1-based row signal to cross-check against - see this job's header comment).
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Import-Module "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwE2E.Common.psm1" -Force
        $amqpUri   = Resolve-E2EBrokerUri -SourceBitePath "$(Agent.BuildDirectory)\ProfilerLoadTestSources\Warewolf DevOps RabbitMQ Source.bite"
        $brokerCtx = Get-E2EBrokerContextFromUri -AmqpUri $amqpUri

        $deadline   = (Get-Date).AddSeconds($(DrainTimeoutSeconds))
        $emptySince = $null
        while ((Get-Date) -lt $deadline) {
            $q = Get-E2EQueueDepthHttp -ManagementUri '$(RabbitMqManagementUri)' -QueueName '$(QueueName)' `
                    -VHost $brokerCtx.VHost -Credential $brokerCtx.Credential
            $d = Get-E2EQueueDepthHttp -ManagementUri '$(RabbitMqManagementUri)' -QueueName '$(DeadLetterQueue)' `
                    -VHost $brokerCtx.VHost -Credential $brokerCtx.Credential
            Write-Host ("{0}  queue={1,-6} consumers={2,-3} dlq={3,-6}" -f `
                (Get-Date).ToUniversalTime().ToString('HH:mm:ss'), $q.Messages, $q.Consumers, $d.Messages)

            if ($q.Messages -gt 0) { $emptySince = $null } elseif (-not $emptySince) { $emptySince = Get-Date }

            if ($emptySince -and ((Get-Date) - $emptySince).TotalSeconds -ge $(DrainQuietSeconds)) {
                Write-Host "Drained: queue empty for $(DrainQuietSeconds)s (dlq depth $($d.Messages))."
                break
            }
            Start-Sleep -Seconds 15
        }
        if (-not $emptySince -or ((Get-Date) - $emptySince).TotalSeconds -lt $(DrainQuietSeconds)) {
            Write-Host "##[warning]Drain wait exceeded $(DrainTimeoutSeconds)s without a $(DrainQuietSeconds)s quiet window - proceeding to the report anyway so the run's last observed state is captured rather than lost."
        }
      displayName: 'Wait for the queue to drain'

    # Completes queue-counts.json. It only records and warns: the run report below is what passes
    # or fails the burst. Expected is what the manifest says was published, not MessageCount.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Import-Module "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\WwE2E.Common.psm1" -Force
        $amqpUri   = Resolve-E2EBrokerUri -SourceBitePath "$(Agent.BuildDirectory)\ProfilerLoadTestSources\Warewolf DevOps RabbitMQ Source.bite"
        $brokerCtx = Get-E2EBrokerContextFromUri -AmqpUri $amqpUri

        $manifest = "$(Agent.BuildDirectory)\ProfilerLoadTestManifest.json"
        $expected = if (Test-Path -LiteralPath $manifest) { @(Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json).Count } else { [long]'$(MessageCount)' }
        $counts   = Get-Content -LiteralPath '$(QueueCountsPath)' -Raw | ConvertFrom-Json -AsHashtable
        function Get-Rise($Before, $After) { if ($null -ne $Before -and $null -ne $After) { [long]$After - [long]$Before } else { $null } }
        foreach ($key in @($counts.Keys)) {
            $entry = $counts[$key]
            $url = '{0}/api/queues/{1}/{2}' -f '$(RabbitMqManagementUri)'.TrimEnd('/'), [uri]::EscapeDataString($brokerCtx.VHost), [uri]::EscapeDataString($entry.queue)
            $q = Invoke-RestMethod -Uri $url -Credential $brokerCtx.Credential -TimeoutSec 30
            $stats = if ($q.PSObject.Properties['message_stats']) { $q.message_stats } else { $null }
            $after = [ordered]@{
                readUtc   = [DateTime]::UtcNow.ToString('o')
                depth     = $q.messages
                unacked   = $q.messages_unacknowledged
                consumers = $q.consumers
                published = if ($stats -and $stats.PSObject.Properties['publish']) { $stats.publish } else { $null }
                acked     = if ($stats -and $stats.PSObject.Properties['ack']) { $stats.ack } else { $null }
                nextSeqId = if ($q.PSObject.Properties['backing_queue_status'] -and $q.backing_queue_status.PSObject.Properties['next_seq_id']) { $q.backing_queue_status.next_seq_id } else { $null }
            }
            $b = $entry.before
            $entry['after'] = $after
            $entry['rise']  = [ordered]@{
                depth     = Get-Rise $b.depth $after.depth
                published = Get-Rise $b.published $after.published
                acked     = Get-Rise $b.acked $after.acked
                enqueued  = Get-Rise $b.nextSeqId $after.nextSeqId
            }
            Write-Host "Queue '$($entry.queue)' after the drain: depth $($after.depth), +$($entry.rise.enqueued) enqueued by next_seq_id"
        }
        $counts['expected'] = $expected
        $counts | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath '$(QueueCountsPath)' -Encoding utf8

        $trig = $counts['trigger'].rise.enqueued
        if ($null -ne $trig -and $trig -ne $expected) { Write-Host "##[warning]The trigger queue took $trig message(s) by next_seq_id; $expected were published (see queue-counts.json)." }
        $dlq = $counts['deadLetter'].rise.enqueued
        if ($dlq -gt 0) { Write-Host "##[warning]$dlq message(s) were dead-lettered (see queue-counts.json)." }
      displayName: 'Capture trigger and dead-letter queue counts after the drain'
      condition: succeededOrFailed()
      continueOnError: true

    # Log Analytics ingestion lags 2-5 minutes behind a live delivery (see docs/E2E-Harness-
    # README.md and Get-WwQueueRunReport.ps1's own guard on zero deliveries) - a report run
    # immediately after the drain reads as "nothing happened" even on a healthy run.
    - powershell: |
        Write-Host 'Waiting 4 minutes for Log Analytics ingestion...'
        Start-Sleep -Seconds 240
      displayName: 'Wait for Log Analytics ingestion'

    # Reconstructs each delivery from worker + engine logs and reconciles against the published
    # manifest - same primitive pipeline-CLOUD.yml's own "Verify the live QueueProcessor container
    # processed the test message" step already uses, just at 20,000 messages instead of 1 and a
    # -LastMinutes window sized for this run's full pre-warm + publish + drain + ingestion-wait
    # duration rather than a single-message smoke test's 15 minutes.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        if (-not $env:ProfilerLoadTestAppNameValue) {
            throw "ProfilerLoadTestAppName was not set - the 'Deploy QueueProcessor Container App' step above must have failed before it could record the deployed app name."
        }

        & "$(Build.SourcesDirectory)\Dev\Warewolf.Execution.Lightweight\Scripts\Get-WwQueueRunReport.ps1" `
            -ResourceGroup          '$(ResourceGroup)' `
            -AcaEnvironment         '$(AcaEnvironment)' `
            -AppName                $env:ProfilerLoadTestAppNameValue `
            -LastMinutes            300 `
            -ExpectedManifest       "$(Agent.BuildDirectory)\ProfilerLoadTestManifest.json" `
            -OutputDir              "$(Agent.BuildDirectory)\ProfilerLoadTestReport" `
            -IncludeEngine `
            -EngineAppInsightsName  'warewolfserver-uat-ai'

        $reportFile = Get-ChildItem "$(Agent.BuildDirectory)\ProfilerLoadTestReport\queue-run-report-*.json" -ErrorAction Stop |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
        $result = Get-Content -LiteralPath $reportFile.FullName -Raw | ConvertFrom-Json

        if ($result.totals.deliveries -eq 0) {
            throw "No deliveries observed for '$($env:ProfilerLoadTestAppNameValue)' - the QueueProcessor container did not process the burst."
        }
        if ($result.reconciliation.missing.Count -gt 0 -or $result.reconciliation.mismatched.Count -gt 0) {
            foreach ($mm in $result.reconciliation.mismatched) {
                $matches = @($result.messages | Where-Object { $_.Txn -eq $mm.Txn })
                foreach ($msg in $matches) {
                    $engine = if ($msg.EngineStatus) { "HTTP $($msg.EngineStatus) ($($msg.EngineClass))" }
                              elseif ($msg.EngineTransport) { "transport: $($msg.EngineTransport)" }
                              else { 'NOT RECORDED' }
                    Write-Host "##[warning]Txn '$($mm.Txn)' -> Outcome=$($msg.Outcome) Engine=$engine Url='$($msg.EngineUrl)' EngineLogLines=$($msg.EngineLogLines) EngineErrors=$($msg.EngineErrors) ExecutionId=$($msg.ExecutionId)"
                    if ($msg.EngineBody) { Write-Host "##[warning]  Engine body: $($msg.EngineBody)" }
                }
            }
            $codes = @($result.totals.engineStatusCounts.PSObject.Properties |
                       ForEach-Object { "$($_.Name) x$($_.Value)" }) -join ', '
            $why = if ($codes) { " Engine responses: $codes." }
                   elseif ($result.totals.engineTransportFailures -gt 0) { " Engine was unreachable ($($result.totals.engineTransportFailures) transport failure(s))." }
                   else { ' No engine response was recorded for these messages - check the published report artefact.' }
            throw "ProfilerLoadTest burst was not reconciled: $($result.reconciliation.missing.Count) missing, $($result.reconciliation.mismatched.Count) mismatched.$why"
        }
        Write-Host "QueueProcessor load test passed: $($result.totals.succeeded) succeeded, $($result.totals.deadLettered) dead-lettered."
      displayName: 'Verify the QueueProcessor burst was processed'
      env:
        ProfilerLoadTestAppNameValue: $(ProfilerLoadTestAppName)

    # always(): a failed or timed-out run is the one whose report and queue counts matter.
    - task: PublishPipelineArtifact@1
      displayName: 'Publish QueueProcessor load test report'
      condition: always()
      continueOnError: true
      inputs:
        targetPath: '$(ReportDir)'
        artifact: ProfilerLoadTestReport

# Runs regardless of whether Load_Test's jobs passed, failed, or were partially skipped
# (condition: always() at both the stage and the step level) so a slow/failing step is
# never hidden by an earlier failure. Queries this build's own Timeline REST API
# (https://learn.microsoft.com/rest/api/azure/devops/build/timeline) rather than parsing
# task-level output, so it reports every recorded step across the Load_Test stage's jobs
# (Load_Tests, ShovelBridgeLoadTest_ExternalServiceBus and ProfilerLoadTest_QueueProcessor -
# the latter two sequenced, not parallel, see ProfilerLoadTest_QueueProcessor's own header
# comment; the QueueProcessor job is opt-in via RunQueueProcessorLoadTest and shows as Skipped
# when off) in one place, sorted slowest-first.
# System.AccessToken is mapped through env: (not used directly via '$(...)' in the script
# body) because ADO does not expand OAuth tokens via macro syntax inside a script - it
# must be read as an environment variable, same convention already used for secret
# pipeline variables elsewhere in this file (e.g. ShovelE2EDaemonClientSecretValue above).
- stage: Report_Step_Timings
  displayName: 'Report Step Timings'
  dependsOn:
    - Load_Test
  condition: always()
  jobs:
  - job: Report_Step_Timings
    displayName: 'Report Step Timings'
    pool:
      vmImage: 'windows-2022'
    steps:
    - checkout: none

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $uri = "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/timeline?api-version=7.1"
        $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
        $timeline = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get

        # 'Task' records are individual steps (script/task blocks); 'Job'/'Stage'/'Phase'
        # records are containers and would double-count time already covered by their
        # children, so only 'Task' records are reported.
        $steps = $timeline.records | Where-Object { $_.type -eq 'Task' -and $_.startTime -and $_.finishTime }
        if (-not $steps) {
          Write-Host "##[warning]No completed step records found on this build's timeline yet - the REST API may not have caught up. Re-run this job or check the pipeline UI's own per-step timings."
          return
        }

        # Map each step back to its parent job name for a readable report, since the
        # Timeline API only gives each record's own name plus a parentId to walk.
        $byId = @{}
        foreach ($r in $timeline.records) { $byId[$r.id] = $r }
        function Get-JobName($record) {
          $current = $record
          while ($current -and $current.parentId -and $byId.ContainsKey($current.parentId)) {
            $current = $byId[$current.parentId]
            if ($current.type -eq 'Job') { return $current.name }
          }
          return '(unknown job)'
        }

        $rows = foreach ($s in $steps) {
          $start  = [datetime]$s.startTime
          $finish = [datetime]$s.finishTime
          [PSCustomObject]@{
            Job             = Get-JobName $s
            Step            = $s.name
            Result          = $s.result
            DurationSeconds = [math]::Round(($finish - $start).TotalSeconds, 1)
          }
        }

        Write-Host "Step timings for build $(Build.BuildId), slowest first:"
        $rows | Sort-Object DurationSeconds -Descending | Format-Table -Property Job, Step, Result, DurationSeconds -AutoSize | Out-String -Width 4096 | Write-Host

        $total = [math]::Round(($rows | Measure-Object -Property DurationSeconds -Sum).Sum, 1)
        Write-Host "Sum of all reported step durations: $total s (jobs ran in parallel, so this is NOT wall-clock build time)."
      displayName: 'Fetch and print per-step timings from the build Timeline API'
      condition: always()
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)